apiVersion: gitops.svc.plus/v1alpha1
kind: PersonalAIAggregator
metadata:
  name: ai-aggregator
  project: ai-workspace
  environment: uat
  mode: selfhost
spec:
  # Non-sensitive GitOps declaration: the aggregator is managed in UAT.
  # An empty allowlist keeps public traffic closed until stage/activate gates
  # are explicitly satisfied.
  enabled: true
  delivery:
    runtime: systemd
    playbook: deploy-ai-aggregator-v1.yml
    deployment_controller: platform-ops-toolkit
    rollback_upstream: litellm
    deployment_mode: embedded
  infrastructure:
    # Provider is selected declaratively per environment. The workflow only
    # dispatches to the matching adapter; it must not infer AWS as a default.
    provider: gcp
    provisioner: terraform
    resource_contract:
      repository: ai-workspace-infra/iac_modules
      path: terraform-hcl-standard/gcp-cloud/config/resources/ai-aggregator-vps-uat.yaml
      ref: main
      renderer: terraform-hcl-standard/gcp-cloud/scripts/generate_ai_aggregator.py
      workdir: terraform-hcl-standard/gcp-cloud/envs/ai-aggregator-uat
    lifecycle: ephemeral
    spot_instance: true
    max_runtime_minutes: 60
    state_strategy: pipeline-local
    outputs:
      cmdb: terraform-output:cmdb_runtime
      inventory: generated:inventory.ini
    destroy_policy: always_after_pipeline
  entrypoint:
    component: caddy
    domain: ai.onwalk.net
    direct_api_domain: direct.ai.onwalk.net
    tls: automatic
    public_port: 443
    basic_auth_enabled: true
    admin_basic_auth_ref: vault://kv/uat/ai-aggregator/gateway/caddy#admin_password_hash
    source_cidrs: []
    # An empty allowlist deliberately denies external access. Add only fixed
    # operator /32 or /128 addresses before stage/activate.
  testing_environment:
    provider: gcp
    instance_type: e2-medium
    architecture: amd64
    region: asia-east1
    os_name: "Debian 12 AMD64 (bookworm)"
    spot_instance: true
    max_runtime_minutes: 60
    auto_terminate: true
    # Spot instances terminate after 60 minutes via instance shutdown to eliminate idle costs.
  nodes:
    - id: gateway-01
      inventory_host: gateway-01
      resource_ref: gcp://ai-aggregator-uat/hosts/gateway-01
      role: gateway
      provider: gcp
      lifecycle: ephemeral
      spot_instance: true
      max_runtime_minutes: 60
      caddy_mode: reuse-existing
    - id: cpa-codex-01
      inventory_host: cpa-codex-01
      resource_ref: gcp://ai-aggregator-uat/hosts/cpa-codex-01
      role: cpa
      transport: private-network-required
      provider: gcp
      lifecycle: ephemeral
      spot_instance: true
      max_runtime_minutes: 60
    - id: cpa-claude-01
      inventory_host: cpa-claude-01
      resource_ref: gcp://ai-aggregator-uat/hosts/cpa-claude-01
      role: cpa
      transport: private-network-required
      provider: gcp
      lifecycle: ephemeral
      spot_instance: true
      max_runtime_minutes: 60
    - id: cpa-codex-02
      inventory_host: cpa-codex-02
      resource_ref: gcp://ai-aggregator-uat/hosts/cpa-codex-02
      role: cpa
      transport: private-network-required
      provider: gcp
      lifecycle: ephemeral
      spot_instance: true
      max_runtime_minutes: 60
    - id: cpa-grok-01
      inventory_host: cpa-grok-01
      resource_ref: gcp://ai-aggregator-uat/hosts/cpa-grok-01
      role: cpa
      transport: private-network-required
      provider: gcp
      lifecycle: ephemeral
      spot_instance: true
      max_runtime_minutes: 60
  resources:
    minimum_resources:
      cpu: 2
      memory: 4Gi
      disk: 40Gi
    recommended_resources:
      cpu: 4
      memory: 8Gi
      disk: 80Gi
  artifacts:
    # Immutable revisions and checksums are mandatory when enabled is true.
    # Binaries must be built for linux/amd64 for the GCP e2-medium profile.
    new_api:
      repository: ai-workspace-lab/new-api
      revision: ""
      sha256: ""
      arch: amd64
    cliproxyapi:
      repository: ai-workspace-lab/CLIProxyAPI
      revision: ""
      sha256: ""
      arch: amd64
  new_api:
    node: gateway-01
    bind_address: 127.0.0.1
    port: 3000
    # Fill only after testing the pinned New API revision and proving with ss
    # that it listens on loopback. The stage role refuses an empty command.
    start_command: /opt/ai-aggregator/new-api/new-api
    persistence:
      driver: postgresql
      database: new_api
      secret_ref: vault://kv/uat/ai-aggregator/database/new-api#dsn
    session_secret_ref: vault://kv/uat/ai-aggregator/gateway/new-api#session_secret
    crypto_secret_ref: vault://kv/uat/ai-aggregator/gateway/new-api#crypto_secret
    client_token:
      managed_by: new-api
      secret_ref: vault://kv/uat/ai-aggregator/gateway/new-api#api_client_token
  litellm:
    node: gateway-01
    bind_address: 127.0.0.1
    port: 4000
    direct_api_domain: direct.ai.onwalk.net
    persistence:
      driver: postgresql
      database: litellm
      secret_ref: vault://kv/uat/ai-aggregator/database/litellm#dsn
    master_key_ref: vault://kv/uat/ai-aggregator/gateway/litellm#master_key
    provider_secret_refs:
      openai: vault://kv/uat/ai-aggregator/litellm/providers/openai#api_key
      anthropic: vault://kv/uat/ai-aggregator/litellm/providers/anthropic#api_key
      xai: vault://kv/uat/ai-aggregator/litellm/providers/xai#api_key
    legacy_upstream: true
  client_profiles:
    - id: claude-code
      chain: new-api-cpa
      base_url: https://ai.onwalk.net
      protocol: anthropic-messages
      model_alias: claude-main
    - id: android-studio
      chain: litellm-direct
      base_url: https://direct.ai.onwalk.net/v1
      protocol: openai-chat
      model_alias: anthropic-api
    - id: openai-compatible
      chain: new-api-cpa
      base_url: https://ai.onwalk.net/v1
      protocol: openai-chat-or-responses
      model_alias: codex-main
  cpa_instances:
    - id: cpa-codex-01
      node: cpa-codex-01
      provider: openai
      cli: codex
      account_email: manbuzhe2009@qq.com
      account_alias: cpa-codex-01
      bind_address: 127.0.0.1
      port: 8317
      network_endpoint: cmdb://nodes/cpa-codex-01/private_ip:8317
      auth_secret_ref: vault://kv/uat/ai-aggregator/cpa/cpa-codex-01#oauth_bundle
      channel_token_ref: vault://kv/uat/ai-aggregator/cpa/cpa-codex-01#channel_token
      new_api_channel:
        name: cpa-codex-01
        protocol: openai-responses
        model_mapping:
          codex-main: gpt-5.x-codex
        enabled: false
    - id: cpa-codex-02
      node: cpa-codex-02
      provider: openai
      cli: codex
      account_email: manbuzhe2008@gmail.com
      account_alias: cpa-codex-02
      bind_address: 127.0.0.1
      port: 8320
      network_endpoint: cmdb://nodes/cpa-codex-02/private_ip:8320
      auth_secret_ref: vault://kv/uat/ai-aggregator/cpa/cpa-codex-02#oauth_bundle
      channel_token_ref: vault://kv/uat/ai-aggregator/cpa/cpa-codex-02#channel_token
      new_api_channel:
        name: cpa-codex-02
        protocol: openai-responses
        model_mapping:
          codex-main: gpt-5.x-codex
        enabled: false
    - id: cpa-claude-01
      node: cpa-claude-01
      provider: anthropic
      cli: claude-code
      account_email: haitaopanhq@gmail.com
      account_alias: cpa-claude-01
      bind_address: 127.0.0.1
      port: 8318
      network_endpoint: cmdb://nodes/cpa-claude-01/private_ip:8318
      auth_secret_ref: vault://kv/uat/ai-aggregator/cpa/cpa-claude-01#oauth_bundle
      channel_token_ref: vault://kv/uat/ai-aggregator/cpa/cpa-claude-01#channel_token
      new_api_channel:
        name: cpa-claude-01
        protocol: anthropic-messages
        model_mapping:
          claude-main: claude-3-7-sonnet
        enabled: false
    - id: cpa-grok-01
      node: cpa-grok-01
      provider: xai
      cli: grok
      account_email: haitaopanhq@gmail.com
      account_alias: cpa-grok-01
      bind_address: 127.0.0.1
      port: 8319
      network_endpoint: cmdb://nodes/cpa-grok-01/private_ip:8319
      auth_secret_ref: vault://kv/uat/ai-aggregator/cpa/cpa-grok-01#oauth_bundle
      channel_token_ref: vault://kv/uat/ai-aggregator/cpa/cpa-grok-01#channel_token
      new_api_channel:
        name: cpa-grok-01
        protocol: openai-chat
        model_mapping:
          grok-main: grok-3
        enabled: false
  observability:
    log_request_bodies: false
    log_authorization_headers: false
    health_paths:
      new_api: /api/status
      cpa: /health
  migration:
    phase: parallel
    default_upstream: litellm
    cutover_requires:
      - caddy_tls_healthy
      - new_api_local_only
      - every_cpa_local_only
      - token_validation
      - provider_smoke_tests
