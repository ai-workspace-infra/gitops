apiVersion: gitops.svc.plus/v1alpha1
kind: PersonalAIAggregator
metadata:
  name: ai-aggregator
  project: ai-workspace
  environment: uat
  mode: selfhost
spec:
  enabled: false
  delivery:
    runtime: systemd
    playbook: deploy-ai-aggregator-v1.yml
    cpa_desktop_playbook: deploy_ai_desktop.yml
    deployment_controller: platform-ops-toolkit
    rollback_upstream: litellm
    deployment_mode: embedded
  infrastructure:
    provider: akamai-cloud
    provisioner: terraform
    resource_contract:
      repository: ai-workspace-infra/iac_modules
      path: terraform-hcl-standard/akamai-cloud/resources/svc.plus/uat/akamai/ai-aggregator-gateway.yaml
      ref: main
      renderer: terraform-hcl-standard/akamai-cloud/scripts/generate.py
      workdir: terraform-hcl-standard/akamai-cloud/envs/uat/ai-aggregator-gateway
      account: manbuzhe2026
      manifests:
        - workspace: ai-aggregator-gateway
          node: gateway-01
          role: gateway
          path: resources/svc.plus/uat/akamai/ai-aggregator-gateway.yaml
        - workspace: ai-aggregator-cpa-codex-01
          node: cpa-codex-01
          role: cpa
          path: resources/svc.plus/uat/akamai/ai-aggregator-cpa-codex-01.yaml
        - workspace: ai-aggregator-cpa-codex-02
          node: cpa-codex-02
          role: cpa
          path: resources/svc.plus/uat/akamai/ai-aggregator-cpa-codex-02.yaml
        - workspace: ai-aggregator-cpa-claude-01
          node: cpa-claude-01
          role: cpa
          path: resources/svc.plus/uat/akamai/ai-aggregator-cpa-claude-01.yaml
        - workspace: ai-aggregator-cpa-grok-01
          node: cpa-grok-01
          role: cpa
          path: resources/svc.plus/uat/akamai/ai-aggregator-cpa-grok-01.yaml
    lifecycle: ephemeral
    spot_instance: false
    max_runtime_minutes: 60
    state_strategy: pipeline-local
    outputs:
      cmdb: terraform-output:cmdb_runtime
      inventory: generated:inventory.ini
    destroy_policy: always_after_pipeline
  entrypoint:
    component: caddy
    domain: ai.onwalk.net
    direct_api_domain: direct.ai.onwalk.net
    tls: automatic
    public_port: 443
    source_cidrs:
      - 35.79.83.48/32
    # Fixed operator egress allowlist. Keep enabled: false until artifact
    # pins, Vault access, and CPA OAuth validation are complete.
  kong:
    node: gateway-01
    mode: traditional
    bind_address: 127.0.0.1
    proxy_port: 8000
    admin_bind_address: 127.0.0.1
    admin_port: 8001
    persistence:
      driver: postgresql
      database: kong
      secret_ref: vault://kv/uat/ai-aggregator/gateway/kong#database_dsn
    auth:
      mode: jwt
      issuer: ai-aggregator
      audience: ai-gateway
      public_key_file: /etc/ai-aggregator/kong/jwt-public.pem
    plugins:
      - jwt
      - acl
      - rate-limiting
      - request-size-limiting
      - correlation-id
      - prometheus
    ai_proxy:
      enabled: false
      reason: liteLLM-remains-the-official-provider-aggregator-in-v1
  testing_environment:
    provider: akamai-cloud
    instance_type: g6-standard-1
    architecture: amd64
    os_name: "Debian 12 AMD64 (bookworm)"
    spot_instance: false
    max_runtime_minutes: 60
    auto_terminate: false
    # Akamai UAT has no Spot contract; workflow_dispatch controls destroy.
  nodes:
    - id: gateway-01
      inventory_host: gateway-01
      resource_ref: akamai://ai-aggregator-uat/hosts/gateway-01
      role: gateway
      xconnect:
        enabled: true
        overlay_ip: 10.77.0.10
      provider: akamai-cloud
      lifecycle: ephemeral
      spot_instance: false
      max_runtime_minutes: 60
      caddy_mode: reuse-existing
    - id: cpa-codex-01
      inventory_host: cpa-codex-01
      resource_ref: akamai://ai-aggregator-uat/hosts/cpa-codex-01
      role: cpa
      xconnect:
        enabled: true
        overlay_ip: 10.77.0.11
      transport: private-network-required
      desktop_role: ai_desktop
      provider: akamai-cloud
      lifecycle: ephemeral
      spot_instance: false
      max_runtime_minutes: 60
    - id: cpa-claude-01
      inventory_host: cpa-claude-01
      resource_ref: akamai://ai-aggregator-uat/hosts/cpa-claude-01
      role: cpa
      xconnect:
        enabled: true
        overlay_ip: 10.77.0.12
      transport: private-network-required
      desktop_role: ai_desktop
      provider: akamai-cloud
      lifecycle: ephemeral
      spot_instance: false
      max_runtime_minutes: 60
    - id: cpa-codex-02
      inventory_host: cpa-codex-02
      resource_ref: akamai://ai-aggregator-uat/hosts/cpa-codex-02
      role: cpa
      xconnect:
        enabled: true
        overlay_ip: 10.77.0.13
      transport: private-network-required
      desktop_role: ai_desktop
      provider: akamai-cloud
      lifecycle: ephemeral
      spot_instance: false
      max_runtime_minutes: 60
    - id: cpa-grok-01
      inventory_host: cpa-grok-01
      resource_ref: akamai://ai-aggregator-uat/hosts/cpa-grok-01
      role: cpa
      xconnect:
        enabled: true
        overlay_ip: 10.77.0.14
      transport: private-network-required
      desktop_role: ai_desktop
      provider: akamai-cloud
      lifecycle: ephemeral
      spot_instance: false
      max_runtime_minutes: 60
  resources:
    minimum_resources:
      cpu: 2
      memory: 4Gi
      disk: 40Gi
    recommended_resources:
      cpu: 4
      memory: 8Gi
      disk: 80Gi
  artifacts:
    # Immutable revisions and checksums are mandatory when enabled is true.
    # Binaries must be built for linux/arm64.
    new_api:
      repository: ai-workspace-lab/new-api
      revision: ""
      sha256: ""
      arch: arm64
    cliproxyapi:
      repository: ai-workspace-lab/CLIProxyAPI
      revision: ""
      sha256: ""
      arch: arm64
  new_api:
    node: gateway-01
    bind_address: 127.0.0.1
    port: 3000
    # Fill only after testing the pinned New API revision and proving with ss
    # that it listens on loopback. The stage role refuses an empty command.
    start_command: /opt/ai-aggregator/new-api/new-api
    persistence:
      driver: postgresql
      database: new_api
      secret_ref: vault://kv/uat/ai-aggregator/database/new-api#dsn
    session_secret_ref: vault://kv/uat/ai-aggregator/gateway/new-api#session_secret
    crypto_secret_ref: vault://kv/uat/ai-aggregator/gateway/new-api#crypto_secret
    jwt_private_key_ref: vault://kv/uat/ai-aggregator/gateway/new-api#jwt_private_key
    jwt_issuer_ref: vault://kv/uat/ai-aggregator/gateway/new-api#jwt_issuer
    jwt_audience: ai-aggregator-cpa
  litellm:
    node: gateway-01
    bind_address: 127.0.0.1
    port: 4000
    direct_api_domain: direct.ai.onwalk.net
    persistence:
      driver: postgresql
      database: litellm
      secret_ref: vault://kv/uat/ai-aggregator/database/litellm#dsn
    master_key_ref: vault://kv/uat/ai-aggregator/gateway/litellm#master_key
    provider_secret_refs:
      openai:
        endpoint: vault://kv/uat/ai-aggregator/litellm/providers/openai#endpoint
        api_key: vault://kv/uat/ai-aggregator/litellm/providers/openai#api_key
      anthropic:
        endpoint: vault://kv/uat/ai-aggregator/litellm/providers/anthropic#endpoint
        api_key: vault://kv/uat/ai-aggregator/litellm/providers/anthropic#api_key
      xai:
        endpoint: vault://kv/uat/ai-aggregator/litellm/providers/xai#endpoint
        api_key: vault://kv/uat/ai-aggregator/litellm/providers/xai#api_key
    legacy_upstream: true
  client_profiles:
    - id: claude-code
      chain: new-api-cpa
      base_url: https://ai.onwalk.net
      protocol: anthropic-messages
      model_alias: claude-main
      token_source: kong
    - id: android-studio
      chain: litellm-direct
      base_url: https://direct.ai.onwalk.net/v1
      protocol: openai-chat
      model_alias: anthropic-api
      token_source: kong
    - id: openai-compatible
      chain: new-api-cpa
      base_url: https://ai.onwalk.net/v1
      protocol: openai-chat-or-responses
      model_alias: codex-main
      token_source: kong
  tenants:
    - id: personal
      status: disabled
      applications: [claude-code, android-studio, openai-compatible]
      allowed_entrypoints: [new-api, litellm]
      rate_limit_per_minute: 60
  cpa_instances:
    - id: cpa-codex-01
      node: cpa-codex-01
      provider: openai
      cli: codex
      account_email: manbuzhe2009@qq.com
      account_alias: cpa-codex-01
      bind_address: private_ip
      port: 8317
      network_endpoint: cmdb://nodes/cpa-codex-01/private_ip:8317
      local_auth_dir: /var/lib/ai-aggregator/cpa/cpa-codex-01/auth
      codeagent:
        enabled: true
        runtime_role: ai_agent_runtime
        cli: codex
        workspace_dir: /var/lib/ai-aggregator/cpa/cpa-codex-01/workspace
      jwt:
        issuer: ai-aggregator
        audience: cpa:cpa-codex-01
        public_key_file: /etc/ai-aggregator/cpa/cpa-codex-01/jwt-public.pem
        ttl_seconds: 300
      new_api_channel:
        name: cpa-codex-01
        protocol: openai-responses
        model_mapping:
          codex-main: gpt-5.x-codex
        enabled: false
    - id: cpa-codex-02
      node: cpa-codex-02
      provider: openai
      cli: codex
      account_email: manbuzhe2008@gmail.com
      account_alias: cpa-codex-02
      bind_address: private_ip
      port: 8320
      network_endpoint: cmdb://nodes/cpa-codex-02/private_ip:8320
      local_auth_dir: /var/lib/ai-aggregator/cpa/cpa-codex-02/auth
      codeagent:
        enabled: true
        runtime_role: ai_agent_runtime
        cli: codex
        workspace_dir: /var/lib/ai-aggregator/cpa/cpa-codex-02/workspace
      jwt:
        issuer: ai-aggregator
        audience: cpa:cpa-codex-02
        public_key_file: /etc/ai-aggregator/cpa/cpa-codex-02/jwt-public.pem
        ttl_seconds: 300
      new_api_channel:
        name: cpa-codex-02
        protocol: openai-responses
        model_mapping:
          codex-main: gpt-5.x-codex
        enabled: false
    - id: cpa-claude-01
      node: cpa-claude-01
      provider: anthropic
      cli: claude-code
      account_email: haitaopanhq@gmail.com
      account_alias: cpa-claude-01
      bind_address: private_ip
      port: 8318
      network_endpoint: cmdb://nodes/cpa-claude-01/private_ip:8318
      local_auth_dir: /var/lib/ai-aggregator/cpa/cpa-claude-01/auth
      codeagent:
        enabled: true
        runtime_role: ai_agent_runtime
        cli: claude-code
        workspace_dir: /var/lib/ai-aggregator/cpa/cpa-claude-01/workspace
      jwt:
        issuer: ai-aggregator
        audience: cpa:cpa-claude-01
        public_key_file: /etc/ai-aggregator/cpa/cpa-claude-01/jwt-public.pem
        ttl_seconds: 300
      new_api_channel:
        name: cpa-claude-01
        protocol: anthropic-messages
        model_mapping:
          claude-main: claude-3-7-sonnet
        enabled: false
    - id: cpa-grok-01
      node: cpa-grok-01
      provider: xai
      cli: grok
      account_email: haitaopanhq@gmail.com
      account_alias: cpa-grok-01
      bind_address: private_ip
      port: 8319
      network_endpoint: cmdb://nodes/cpa-grok-01/private_ip:8319
      local_auth_dir: /var/lib/ai-aggregator/cpa/cpa-grok-01/auth
      codeagent:
        enabled: true
        runtime_role: ai_agent_runtime
        cli: grok
        workspace_dir: /var/lib/ai-aggregator/cpa/cpa-grok-01/workspace
      jwt:
        issuer: ai-aggregator
        audience: cpa:cpa-grok-01
        public_key_file: /etc/ai-aggregator/cpa/cpa-grok-01/jwt-public.pem
        ttl_seconds: 300
      new_api_channel:
        name: cpa-grok-01
        protocol: openai-chat
        model_mapping:
          grok-main: grok-3
        enabled: false
  observability:
    log_request_bodies: false
    log_authorization_headers: false
    health_paths:
      new_api: /api/status
      cpa: /health
  migration:
    phase: parallel
    default_upstream: litellm
    cutover_requires:
      - caddy_tls_healthy
      - new_api_local_only
      - every_cpa_local_only
      - token_validation
      - provider_smoke_tests
