apiVersion: gitops.svc.plus/v1alpha1
kind: XConnectRegionalPool
metadata:
  name: xconnect
  project: svc.plus
  environment: uat
spec:
  node_maintenance:
    vector:
      internal_metrics_scrape_interval_secs: 30
      reverse_proxy_drop_substring: http.handlers.reverse_proxy
      log_message_max_bytes: 4096
      sink_batch_max_bytes: 1048576
      sink_batch_timeout_secs: 5
      sink_buffer_max_events: 250
      threads: 1
      memory_high: 96M
      memory_max: 160M
      tls_verify: true
    journald:
      compress: true
      system_max_use: 64M
      system_keep_free: 1G
      system_max_file_size: 8M
      max_file_sec: 1day
      max_retention: 3day
      runtime_max_use: 16M
      runtime_max_file_size: 4M
      rate_limit_interval: 30s
      rate_limit_burst: 500
      vacuum_on_calendar: daily
      service_memory_high: 24M
      service_memory_max: 48M
    rotated_logs:
      keep_days: 14
      patterns:
        - "*.gz"
        - "*.[0-9]"
        - "*.old"
    sysctl:
      tcp_slow_start_after_idle: 0
      tcp_notsent_lowat: 131072
      tcp_keepalive_time: 600
      tcp_keepalive_intvl: 30
      tcp_keepalive_probes: 5
      rmem_max: 33554432
      wmem_max: 33554432
      tcp_rmem: "4096 87380 33554432"
      tcp_wmem: "4096 65536 33554432"
    haproxy:
      bufsize: 65536
      h2_initial_window_size: 4194304
      pipesize: 262144
      timeout_tunnel: "3600s"
      timeout_http_keep_alive: "120s"
      clitcpka: true
      srvtcpka: true
      http_no_delay: true
    fluxgate:
      version: "0.2.1"
      h2_stream_window_size: 4194304
      h2_connection_window_size: 16777216
      h2_ping_interval_secs: 15
      max_h2_streams: 256
      read_timeout_secs: 3600
      idle_timeout_secs: 3600
    xray:
      buffer_size_kb: 128
      handshake_timeout_seconds: 30
      connection_idle_timeout_seconds: 3600
      uplink_only_timeout_seconds: 15
      downlink_only_timeout_seconds: 30
  # GitOps owns the public regional contract. Terraform only creates the
  # Akamai Cloud instances and emits CMDB facts; playbooks install the edge
  # agent. TW and PH remain existing Ulighthost nodes.
  lifecycle: hybrid
  provider: mixed
  scheduler:
    implementation:
      repository: git@github.com:ai-workspace-xstream/xconnect-edge-agent.git
      deploy_when: multi-node
    strategy: health-aware-weighted
    # Health only removes an unavailable node from its own declared pool.
    # Entitlement selection is issued by Accounts and applied at the regional
    # APISIX gateway; this scheduler must never merge free/plus/team pools.
    gateway_ref: topology/uat/selfhost/apisix-gateway.yaml#/spec/ingress
    entitlement_selector: accounts-issued-binding
    pool_merge_on_health_failure: false
    failover_scope: region
    health_check:
      path: /healthz
      interval_seconds: 30
      unhealthy_after: 3
      recover_after: 2
  pools:
    - name: jp
      region: jpn-tky
      entrypoint:
        fqdn: jp-xconnect.onwalk.net
        dns_record:
          type: A
          target_node: jp-01
          ttl: 1
          proxied: false
      nodes:
        - id: jp-01
          node_id: ap-uat-tky
          connection_source: terraform_cmdb
          enabled: true
          role: standalone
          weight: 100
    - name: sg
      region: sg
      entrypoint:
        fqdn: sg-xconnect.onwalk.net
        dns_record:
          type: A
          target_node: sg-01
          ttl: 1
          proxied: false
      nodes:
        - id: sg-01
          node_id: ap-uat-sg
          connection_source: terraform_cmdb
          enabled: true
          role: standalone
          weight: 100
    - name: us
      region: us-ca
      entrypoint:
        fqdn: us-xconnect.onwalk.net
        dns_record:
          type: A
          target_node: us-01
          ttl: 1
          proxied: false
      nodes:
        - id: us-01
          node_id: ap-uat-us
          connection_source: terraform_cmdb
          enabled: true
          role: standalone
          weight: 100
    - name: tw
      region: tw
      entrypoint:
        fqdn: tw-xconnect.onwalk.net
        dns_record:
          type: A
          target_node: tw-01
          ttl: 1
          proxied: false
      nodes:
        - id: tw-01
          connection_source: vault
          # Each existing node has its own KV v2 record.  This keeps UAT
          # credentials scoped to the node instead of using an environment-wide
          # aggregate secret.
          credentials_vault_path: uat/ulighthost-xconnect/tw-xconnect.svc.plus
          provider: external
          enabled: true
          role: standalone
          weight: 100
    - name: ph
      region: ph
      entrypoint:
        fqdn: ph-xconnect.onwalk.net
        dns_record:
          type: A
          target_node: ph-01
          ttl: 1
          proxied: false
      nodes:
        - id: ph-01
          connection_source: vault
          credentials_vault_path: uat/ulighthost-xconnect/ph-xconnect.svc.plus
          provider: external
          enabled: true
          role: standalone
          weight: 100
  connection_sources:
    terraform_cmdb:
      requires:
        - node_id
        - ip
        - ansible_user
        - instance_id
      credentials: deployment_key
    vault:
      requires:
        - ansible_host
        - ansible_user
        - SSH_PASSWORD
