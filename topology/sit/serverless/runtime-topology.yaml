apiVersion: gitops.svc.plus/v1alpha1
kind: EdgeRoutingConfig
metadata:
  name: web-saas
  project: svc.plus
  environment: sit
  mode: serverless
spec:
  runtime:
    mode: serverless
    routing:
      dns:
        control_plane: cloudflare-dns
        ttl_seconds: 60
        canonical_records:
          console-sit.onwalk.net: console-serverless-sit.onwalk.net
          accounts-sit.onwalk.net: accounts-serverless-sit.onwalk.net
      load-balancer:
        strategy: dns-only
      weight:
        selfhost: 0
        serverless: 100
    services:
      console:
        selfhost: vps-full-stack
        serverless: cloudflare-pages
      accounts:
        selfhost: vps-full-stack
        serverless: cloud-run
      content:
        selfhost: vps-full-stack
        serverless: cloud-run
      billing:
        selfhost: vps-full-stack
        serverless: cloud-run
    data:
      primary: serverless
      replica: selfhost
      providers:
        selfhost: self-managed-postgresql
        serverless: supabase
      migration:
        strategy: async
        single_writer: true
        max_lag_seconds: 60
        require_quiesce_for_cutover: true
        checkpoint_vault_ref: kv/sit/serverless/dts
        directions:
          selfhost_to_serverless:
            source: selfhost
            target: serverless
          serverless_to_selfhost:
            source: serverless
            target: selfhost
  domains:
    console-sit.onwalk.net:
      selfhost: console-selfhost-sit.onwalk.net
      serverless: console-serverless-sit.onwalk.net
    accounts-sit.onwalk.net:
      selfhost: accounts-selfhost-sit.onwalk.net
      serverless: accounts-serverless-sit.onwalk.net
  public_endpoints:
    console:
      host: console-serverless-sit.onwalk.net
      access: public
    accounts:
      host: accounts-serverless-sit.onwalk.net
      access: authenticated
    billing:
      host: billing-serverless-sit.onwalk.net
      access: authenticated
    postgresql:
      host: postgresql-serverless-sit.onwalk.net
      access: authenticated
    agent-proxy:
      host: agent-proxy-serverless-sit.onwalk.net
      access: public_uuid
  cloudflare:
    zone_name: onwalk.net
    pages_project: ai-workspace-portal-sit
    pages_branch: sit
    static_cdn_url: https://ai-workspace-portal-sit.pages.dev
  vps:
    stack: full-stack
    services:
      - console
      - accounts
      - content
      - billing
    database: self-managed-postgresql
  serverless:
    console_host: console-serverless-sit.onwalk.net
    accounts_host: accounts-serverless-sit.onwalk.net
    billing_host: billing-serverless-sit.onwalk.net
    frontend_router:
      worker_name: frontend-router-sit
      host: console-serverless-sit.onwalk.net
      pages_origin: https://ai-workspace-portal-sit.pages.dev
      api_origin: https://accounts-serverless-sit.onwalk.net
      static_cache_ttl: 604800
      public_cache_ttl: 3600
      static_prefixes:
        - /_next/*
        - /static/*
        - /assets/*
      # Content sections published as a prebuilt static site instead of by an
      # SSR boundary. A section is only redirected there when its origin is
      # declared here, so removing an entry is the rollback. Each section reads
      # its own origin, which is what allows one to be moved to a dedicated
      # Pages project and republished without touching the others or the main
      # site — `support` is reserved for exactly that and stays on its SSR
      # boundary until it is declared.
      static_sections:
        blogs: https://ai-workspace-portal-sit.pages.dev
        docs: https://ai-workspace-portal-sit.pages.dev
        products: https://ai-workspace-portal-sit.pages.dev
      bindings:
        api_auth: edge-gateway-auth-sit
        auth: frontend-ssr-auth-sit
        content: frontend-ssr-content-sit
        console: frontend-ssr-console-sit
        workspace: frontend-ssr-workspace-sit
        public: frontend-ssr-public-sit
    cloud_run:
      accounts: https://accounts-service-uc.a.run.app
      content_service: https://content-service-uc.a.run.app
      billing_service: https://billing-service-uc.a.run.app
    ssr:
      - id: public
        worker_name: frontend-ssr-public-sit
        route_suffixes:
          - /*
          - /_edge/public/*
      - id: content
        worker_name: frontend-ssr-content-sit
        route_suffixes:
          - /blogs*
          - /docs*
          - /download*
          - /_edge/content/*
      - id: auth
        worker_name: frontend-ssr-auth-sit
        route_suffixes:
          - /login*
          - /register*
          - /email-verification*
          - /logout*
          - /_edge/auth/*
      - id: console
        worker_name: frontend-ssr-console-sit
        route_suffixes:
          - /panel*
          - /dashboard*
          - /_edge/console/*
      - id: workspace
        worker_name: frontend-ssr-workspace-sit
        route_suffixes:
          - /ai-workspace*
          - /cloud_iac*
          - /editor*
          - /support*
          - /xworkmate*
          - /_edge/workspace/*
    edge_gateway:
      defaults:
        primary_upstream: https://accounts-selfhost-sit.onwalk.net
        fallback_upstream: https://accounts-service-uc.a.run.app
        jwt_issuer: https://accounts-serverless-sit.onwalk.net
        timeout_ms: '2500'
      boundaries:
        - id: auth
          worker_name: edge-gateway-auth-sit
          routes:
            - /api/auth/*
            - /api/v1/auth/*
        - id: admin
          worker_name: edge-gateway-admin-sit
          routes:
            - /api/admin/*
        - id: core
          display_name: Edge Gateway Router Core
          worker_name: edge-gateway-core-sit
          routes:
            - /api/*
