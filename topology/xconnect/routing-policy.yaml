# Canonical GitOps declaration for XConnect three-tier traffic split routing.
# Source of truth lives in this repository (ai-workspace-infra/gitops); it was
# previously kept under playbooks/config and has been moved here because it is a
# declarative target state, not execution code.
# Consumed by accounts control-plane (subscription & RoutingPolicy sync),
# Web Console GitOps editor (/panel/gateway), and xconnect-edge-agent / Playbooks.
# Pro-EC2-Pool is high-speed quota traffic: media_on_pro_action defaults to "allow"
# (no streaming or download restriction; Pro subscription accesses Media-Pool + Pro-EC2-Pool,
# while Plus/Free/Shared subscriptions only see Media-Pool).
version: 1
revision: "2026-11-19.1"

pools:
  Media-Pool:
    public_resource: true
    media_on_pro_action: "allow"
    fallback_default: true
    description: "公共 VPS 大流量池（Free/Shared/Plus）：流媒体优先 + 全网 MATCH 兜底，不做限制"
    pricing_groups:
      - free
      - shared
      - plus
    # Reserved for future multi-VPS fine-grained split inside Media-Pool (not active yet)
    sub_pool_tags_reserved:
      - "media:video"
      - "media:shopping"
      - "media:ai-app"
    url_test:
      url: "https://cp.cloudflare.com/generate_204"
      interval: 300
    nodes:
      - "jp-xconnect-01.svc.plus"
      - "ph-xconnect.svc.plus"
      - "jp-xconnect-free-01.svc.plus"

  Pro-EC2-Pool:
    public_resource: true
    media_on_pro_action: "allow"
    fallback_default: false
    description: "公共高速流量池（Pro-EC2-Pool，EC2 t4g.small / c8g 等）：定义为高速流量，不再限制流媒体与下载（默认 allow）；Pro 订阅可用 Media-Pool + Pro-EC2-Pool（如 50 元套餐：30GB 高速 + 50GB VPS），Plus 订阅仅可用 Media-Pool 且 Pro 节点不可见"
    pricing_groups:
      - pro
    url_test:
      url: "https://cp.cloudflare.com/generate_204"
      interval: 180
    nodes:
      - "jp-xconnect-pro-01.svc.plus"

  Custom-Dedicated:
    public_resource: false
    media_on_pro_action: "allow"
    fallback_default: false
    description: "非公共专属节点（Custom 白名单绑定机制）：绝不进入公共池，没有使用限制"
    pricing_groups:
      - custom
      - team
    nodes:
      - "us-xconnect-los-angeles-custom-01.svc.plus"
      - "us-xconnect.svc.plus"

tiers:
  direct_cn_private:
    priority: 1
    target: "DIRECT"
    server_outbound_tag: "direct-cn"
    private_outbound_tag: "blocked-private"
    clash_rules:
      - "GEOIP,private,DIRECT,no-resolve"
      - "GEOSITE,cn,DIRECT"
      - "GEOIP,cn,DIRECT,no-resolve"
    xray_domains:
      - "geosite:cn"
    xray_ips:
      - "geoip:cn"

  media_pool_priority:
    priority: 2
    target: "Media-Pool"
    server_outbound_tag_on_media_pool: "pool-media-stream"
    server_outbound_tag_on_pro_pool: "pool-pro-unclassified"
    clash_rules:
      - "GEOSITE,youtube,Media-Pool"
      - "GEOSITE,netflix,Media-Pool"
      - "GEOSITE,disney,Media-Pool"
      - "GEOSITE,tiktok,Media-Pool"
      - "GEOSITE,twitch,Media-Pool"
      - "GEOSITE,spotify,Media-Pool"
      - "GEOSITE,bilibili,Media-Pool"
      - "DOMAIN-SUFFIX,speedtest.net,Media-Pool"
      - "DOMAIN-SUFFIX,fast.com,Media-Pool"
      - "DOMAIN-SUFFIX,steamcontent.com,Media-Pool"
      - "DOMAIN-SUFFIX,icloud-content.com,Media-Pool"
      - "DOMAIN-SUFFIX,mega.nz,Media-Pool"
    xray_domains:
      - "geosite:youtube"
      - "geosite:netflix"
      - "geosite:disney"
      - "geosite:tiktok"
      - "geosite:twitch"
      - "geosite:spotify"
      - "geosite:bilibili"
      - "domain:speedtest.net"
      - "domain:fast.com"
      - "domain:steamcontent.com"
      - "domain:icloud-content.com"
      - "domain:mega.nz"

  pro_ec2_whitelist:
    priority: 3
    target: "Pro-EC2-Pool"
    server_outbound_tag: "pool-pro-ai-dev"
    clash_rules:
      - "GEOSITE,openai,Pro-EC2-Pool"
      - "GEOSITE,anthropic,Pro-EC2-Pool"
      - "DOMAIN-SUFFIX,claude.ai,Pro-EC2-Pool"
      - "DOMAIN-SUFFIX,cursor.sh,Pro-EC2-Pool"
      - "DOMAIN-SUFFIX,cursor.com,Pro-EC2-Pool"
      - "GEOSITE,github,Pro-EC2-Pool"
      - "GEOSITE,google,Pro-EC2-Pool"
      - "GEOSITE,cloudflare,Pro-EC2-Pool"
    xray_domains:
      - "geosite:openai"
      - "geosite:anthropic"
      - "domain:claude.ai"
      - "domain:cursor.sh"
      - "domain:cursor.com"
      - "geosite:github"
      - "geosite:google"
      - "geosite:cloudflare"

  global_fallback:
    priority: 4
    target: "Media-Pool"
    server_outbound_tag_on_media_pool: "pool-media-fallback"
    server_outbound_tag_on_pro_pool: "pool-pro-unclassified"
    clash_rules:
      - "MATCH,Media-Pool"
