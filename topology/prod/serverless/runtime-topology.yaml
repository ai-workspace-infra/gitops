apiVersion: gitops.svc.plus/v1alpha1
kind: EdgeRoutingConfig
metadata:
  name: web-saas
  project: svc.plus
  environment: prod
  mode: serverless
spec:
  runtime:
    mode: serverless
    routing:
      dns:
        control_plane: cloudflare-dns
        ttl_seconds: 60
        canonical_records:
          console.svc.plus: console-serverless-prod.svc.plus
          accounts.svc.plus: accounts-serverless-prod.svc.plus
      load-balancer:
        strategy: dns-only
      weight:
        selfhost: 0
        serverless: 100
    services:
      console:
        selfhost: vps-full-stack
        serverless: cloudflare-pages
      accounts:
        selfhost: vps-full-stack
        serverless: cloud-run
      content:
        selfhost: vps-full-stack
        serverless: cloud-run
      billing:
        selfhost: vps-full-stack
        serverless: cloud-run
    data:
      primary: serverless
      replica: selfhost
      providers:
        selfhost: self-managed-postgresql
        serverless: supabase
      migration:
        strategy: async
        single_writer: true
        max_lag_seconds: 60
        require_quiesce_for_cutover: true
        checkpoint_vault_ref: kv/prod/serverless/dts
        directions:
          selfhost_to_serverless:
            source: selfhost
            target: serverless
          serverless_to_selfhost:
            source: serverless
            target: selfhost
  domains:
    console.svc.plus:
      selfhost: console-selfhost-prod.svc.plus
      serverless: console-serverless-prod.svc.plus
    accounts.svc.plus:
      selfhost: accounts-selfhost-prod.svc.plus
      serverless: accounts-serverless-prod.svc.plus
  public_endpoints:
    console:
      host: console-serverless-prod.svc.plus
      access: public
    accounts:
      host: accounts-serverless-prod.svc.plus
      access: authenticated
    billing:
      host: billing-serverless-prod.svc.plus
      access: authenticated
    postgresql:
      host: postgresql-serverless-prod.svc.plus
      access: authenticated
    agent-proxy:
      host: agent-proxy-serverless-prod.svc.plus
      access: public_uuid
  cloudflare:
    zone_name: svc.plus
    pages_project: ai-workspace-portal-prod
    pages_branch: prod
    static_cdn_url: https://assets.svc.plus
  vps:
    stack: full-stack
    services:
      - console
      - accounts
      - content
      - billing
    database: self-managed-postgresql
  serverless:
    console_host: console-serverless-prod.svc.plus
    # Both production console hostnames are custom domains of the same
    # Frontend Router Worker. Pages remains the static asset origin.
    console_aliases:
      - console-serverless-prod.xworktech.com
    accounts_host: accounts-serverless-prod.svc.plus
    billing_host: billing-serverless-prod.svc.plus
    frontend_router:
      worker_name: frontend-router-prod
      host: console-serverless-prod.svc.plus
      pages_origin: https://ai-workspace-portal-prod.pages.dev
      api_origin: https://accounts-serverless-prod.svc.plus
      static_cache_ttl: 604800
      public_cache_ttl: 3600
      static_prefixes:
        - /_next/*
        - /static/*
        - /assets/*
      # Content sections published as a prebuilt static site instead of by an
      # SSR boundary. A section is only redirected there when its origin is
      # declared here, so removing an entry is the rollback. Each section reads
      # its own origin, which is what allows one to be moved to a dedicated
      # Pages project and republished without touching the others or the main
      # site — `support` is reserved for exactly that and stays on its SSR
      # boundary until it is declared.
      # Production stays on the SSR boundaries until the section has been
      # published and verified in UAT. Declare a section here to switch it.
      static_sections: {}
      bindings:
        api_auth: edge-gateway-auth-prod
        auth: frontend-ssr-auth-prod
        content: frontend-ssr-content-prod
        console: frontend-ssr-console-prod
        workspace: frontend-ssr-workspace-prod
        public: frontend-ssr-public-prod
    cloud_run:
      accounts: https://prod-accounts-1004637461064.asia-northeast1.run.app
      content_service: https://prod-content-service-1004637461064.asia-northeast1.run.app
      billing_service: https://prod-billing-service-1004637461064.asia-northeast1.run.app
    ssr:
      - id: public
        worker_name: frontend-ssr-public-prod
        route_suffixes:
          - /*
          - /_edge/public/*
      - id: content
        worker_name: frontend-ssr-content-prod
        route_suffixes:
          - /blogs*
          - /docs*
          - /download*
          - /_edge/content/*
      - id: auth
        worker_name: frontend-ssr-auth-prod
        route_suffixes:
          - /login*
          - /register*
          - /email-verification*
          - /logout*
          - /_edge/auth/*
      - id: console
        worker_name: frontend-ssr-console-prod
        route_suffixes:
          - /panel*
          - /dashboard*
          - /_edge/console/*
      - id: workspace
        worker_name: frontend-ssr-workspace-prod
        route_suffixes:
          - /ai-workspace*
          - /cloud_iac*
          - /editor*
          - /support*
          - /xworkmate*
          - /_edge/workspace/*
    edge_gateway:
      defaults:
        primary_upstream: https://accounts-selfhost-prod.svc.plus
        fallback_upstream: https://prod-accounts-1004637461064.asia-northeast1.run.app
        jwt_issuer: https://accounts-serverless-prod.svc.plus
        timeout_ms: '2500'
      boundaries:
        - id: auth
          worker_name: edge-gateway-auth-prod
          routes:
            - /api/auth/*
            - /api/v1/auth/*
        - id: admin
          worker_name: edge-gateway-admin-prod
          routes:
            - /api/admin/*
        - id: core
          display_name: Edge Gateway Router Core
          worker_name: edge-gateway-core-prod
          routes:
            - /api/*
