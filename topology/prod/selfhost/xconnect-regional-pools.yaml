apiVersion: gitops.svc.plus/v1alpha1
kind: XConnectRegionalPools
metadata:
  name: xconnect
  project: svc.plus
  environment: prod
spec:
  # AWS regions are declared in the IaC CMDB; PH remains a Vault-backed
  # manually supplied edge. The runtime contract is one pool per region.
  lifecycle: hybrid
  provisioning:
    managed_by: mixed
    iac_status: active_for_jp_hk_us
    external_nodes_allowed: true
  entrypoint_defaults:
    dns_record:
      zone: svc.plus
      type: A
      ttl: 1
      proxied: false
  scheduler:
    implementation:
      repository: git@github.com:ai-workspace-xstream/xconnect-edge-agent.git
      deploy_when: multi-node
    strategy: health-aware-weighted
    failover_scope: region
    health_check:
      path: /healthz
      interval_seconds: 30
      unhealthy_after: 3
      recover_after: 2
  pools:
    - name: jp
      region: jpn-tky
      entrypoint:
        fqdn: jp-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: jp-01
      legacy_entrypoints:
        - fqdn: tky-proxy.svc.plus
          type: CNAME
          target: jp-xconnect.svc.plus
      nodes:
        - id: jp-01
          node_id: ap-prod-tky
          connection_source: terraform_cmdb
          enabled: true
          role: standalone
          weight: 100
    - name: us
      region: us-ca
      entrypoint:
        fqdn: us-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: us-01
      nodes:
        - id: us-01
          node_id: ap-prod-us
          connection_source: terraform_cmdb
          enabled: true
          role: standalone
          weight: 100
    - name: hk
      region: hk
      entrypoint:
        fqdn: hk-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: hk-01
      nodes:
        - id: hk-01
          node_id: ap-prod-hk
          connection_source: terraform_cmdb
          enabled: true
          role: standalone
          weight: 100
    - name: ph
      region: ph-mnl
      entrypoint:
        fqdn: ph-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: ph-surfercloud-01
      nodes:
        - id: ph-surfercloud-01
          connection_source: vault
          credentials_vault_path: prod/XConnect/PH/PH-XConnect.svc.plus
          provider: external
          enabled: true
          role: standalone
          weight: 100
    - name: tw
      region: tw-tpe
      entrypoint:
        fqdn: tw-xconnect-gateway.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: tw-xconnect-gateway-01
        dns_record:
          type: A
          target_node: tw-xconnect-gateway-01
          ttl: 1
          proxied: false
      nodes:
        - id: tw-xconnect-gateway-01
          connection_source: vault
          credentials_vault_path: prod/ulighthost-xconnect/tw-xconnect-gateway.svc.plus
          provider: external
          enabled: true
          role: standalone
          service_roles:
            - xconnect-gateway
          weight: 100
  connection_sources:
    terraform_cmdb:
      requires:
        - node_id
        - ip
        - ansible_user
        - instance_id
      credentials: deployment_key
    vault:
      requires:
        - ansible_host
        - ansible_user
        - SSH_PASSWORD
