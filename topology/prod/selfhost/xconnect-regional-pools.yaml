apiVersion: gitops.svc.plus/v1alpha1
kind: XConnectRegionalPools
metadata:
  name: xconnect
  project: svc.plus
  environment: prod
spec:
  node_maintenance:
    vector:
      internal_metrics_scrape_interval_secs: 30
      reverse_proxy_drop_substring: http.handlers.reverse_proxy
      log_message_max_bytes: 4096
      system_logs_enabled: false
      billing_disk_buffer_max_bytes: 268435488
      prometheus_batch_max_events: 250
      prometheus_buffer_max_events: 500
      sink_batch_max_bytes: 262144
      sink_batch_timeout_secs: 5
      sink_buffer_max_events: 250
      threads: 1
      tokio_worker_threads: 1
      malloc_arena_max: 2
      malloc_conf: narenas:1,dirty_decay_ms:1000,muzzy_decay_ms:0,thp:never,retain:false
      memory_high: 72M
      memory_max: 128M
      tls_verify: true
    journald:
      compress: true
      system_max_use: 64M
      system_keep_free: 1G
      system_max_file_size: 8M
      max_file_sec: 1day
      max_retention: 3day
      runtime_max_use: 16M
      runtime_max_file_size: 4M
      rate_limit_interval: 30s
      rate_limit_burst: 500
      vacuum_on_calendar: daily
      service_memory_high: 24M
      service_memory_max: 48M
    rotated_logs:
      keep_days: 14
      patterns:
        - "*.gz"
        - "*.[0-9]"
        - "*.old"
    sysctl:
      tcp_slow_start_after_idle: 0
      tcp_notsent_lowat: 131072
      tcp_keepalive_time: 600
      tcp_keepalive_intvl: 30
      tcp_keepalive_probes: 5
      rmem_max: 33554432
      wmem_max: 33554432
      tcp_rmem: "4096 87380 33554432"
      tcp_wmem: "4096 65536 33554432"
    haproxy:
      bufsize: 65536
      h2_initial_window_size: 4194304
      pipesize: 262144
      timeout_tunnel: "3600s"
      timeout_http_keep_alive: "120s"
      clitcpka: true
      srvtcpka: true
      http_no_delay: true
    fluxgate:
      version: "0.2.1"
      h2_stream_window_size: 4194304
      h2_connection_window_size: 16777216
      h2_ping_interval_secs: 15
      max_h2_streams: 256
      read_timeout_secs: 3600
      idle_timeout_secs: 3600
    xray:
      buffer_size_kb: 128
      handshake_timeout_seconds: 30
      connection_idle_timeout_seconds: 3600
      uplink_only_timeout_seconds: 15
      downlink_only_timeout_seconds: 30
  # Akamai Cloud regions are declared in the IaC CMDB; PH and TW remain
  # Vault-backed manually supplied edges. The runtime contract is one pool per
  # region.
  lifecycle: hybrid
  provisioning:
    managed_by: mixed
    iac_status: active_for_jp_us
  entrypoint_defaults:
    dns_record:
      zone: svc.plus
      type: A
      ttl: 1
      proxied: false
  scheduler:
    implementation:
      repository: git@github.com:ai-workspace-xstream/xconnect-edge-agent.git
      deploy_when: multi-node
    strategy: health-aware-weighted
    failover_scope: region
    health_check:
      path: /healthz
      interval_seconds: 30
      unhealthy_after: 3
      recover_after: 2
  pools:
    - name: jp
      region: jpn-tky
      entrypoint:
        fqdn: jp-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: jp-01
      legacy_entrypoints:
        - fqdn: tky-proxy.svc.plus
          type: CNAME
          target: jp-xconnect.svc.plus
      nodes:
        - id: jp-01
          node_id: ap-prod-tky
          connection_source: terraform_cmdb
          enabled: true
          role: standalone
          weight: 100
    - name: us
      region: us-ca
      entrypoint:
        fqdn: us-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: us-01
      nodes:
        - id: us-01
          node_id: ap-prod-us
          connection_source: terraform_cmdb
          enabled: true
          role: standalone
          weight: 100
    - name: ph
      region: ph-mnl
      entrypoint:
        fqdn: ph-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: ph-surfercloud-01
      nodes:
        - id: ph-surfercloud-01
          connection_source: vault
          credentials_vault_path: prod/XConnect/PH/PH-XConnect.svc.plus
          provider: external
          enabled: true
          role: standalone
          weight: 100
          service_identities:
            xray_xhttp:
              user: operator
              group: operator
              account_managed: false
              previous_user: xray
    - name: tw
      region: tw
      entrypoint:
        fqdn: tw-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: tw-01
      nodes:
        - id: tw-01
          connection_source: vault
          credentials_vault_path: prod/ulighthost-xconnect/tw-xconnect.svc.plus
          provider: external
          enabled: true
          role: standalone
          weight: 100
  connection_sources:
    terraform_cmdb:
      requires:
        - node_id
        - ip
        - ansible_user
        - instance_id
      credentials: deployment_key
    vault:
      requires:
        - ansible_host
        - ansible_user
        - SSH_PASSWORD
