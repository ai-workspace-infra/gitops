apiVersion: gitops.svc.plus/v1alpha1
kind: XConnectRegionalPools
metadata:
  name: xconnect
  project: svc.plus
  environment: prod
spec:
  node_maintenance:
    vector:
      internal_metrics_scrape_interval_secs: 30
      reverse_proxy_drop_substring: http.handlers.reverse_proxy
      log_message_max_bytes: 4096
      sink_batch_max_bytes: 1048576
      sink_batch_timeout_secs: 5
      sink_buffer_max_events: 500
      threads: 1
      memory_high: 150M
      memory_max: 250M
      tls_verify: true
    journald:
      compress: true
      system_max_use: 300M
      system_keep_free: 1G
      system_max_file_size: 50M
      max_retention: 14day
      runtime_max_use: 64M
      rate_limit_interval: 30s
      rate_limit_burst: 2000
    rotated_logs:
      keep_days: 14
      patterns:
        - "*.gz"
        - "*.[0-9]"
        - "*.old"
  # Akamai Cloud regions are declared in the IaC CMDB; PH and TW remain
  # Vault-backed manually supplied edges. The runtime contract is one pool per
  # region.
  lifecycle: hybrid
  provisioning:
    managed_by: mixed
    iac_status: active_for_jp_sg_us
  entrypoint_defaults:
    dns_record:
      zone: svc.plus
      type: A
      ttl: 1
      proxied: false
  scheduler:
    implementation:
      repository: git@github.com:ai-workspace-xstream/xconnect-edge-agent.git
      deploy_when: multi-node
    strategy: health-aware-weighted
    failover_scope: region
    health_check:
      path: /healthz
      interval_seconds: 30
      unhealthy_after: 3
      recover_after: 2
  pools:
    - name: jp
      region: jpn-tky
      entrypoint:
        fqdn: jp-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: jp-01
      legacy_entrypoints:
        - fqdn: tky-proxy.svc.plus
          type: CNAME
          target: jp-xconnect.svc.plus
      nodes:
        - id: jp-01
          node_id: ap-prod-tky
          connection_source: terraform_cmdb
          enabled: true
          role: standalone
          weight: 100
    - name: us
      region: us-ca
      entrypoint:
        fqdn: us-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: us-01
      nodes:
        - id: us-01
          node_id: ap-prod-us
          connection_source: terraform_cmdb
          enabled: true
          role: standalone
          weight: 100
    - name: sg
      region: sg
      entrypoint:
        fqdn: sg-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: sg-01
      nodes:
        - id: sg-01
          node_id: ap-prod-sg
          connection_source: terraform_cmdb
          enabled: true
          role: standalone
          weight: 100
    - name: ph
      region: ph-mnl
      entrypoint:
        fqdn: ph-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: ph-surfercloud-01
      nodes:
        - id: ph-surfercloud-01
          connection_source: vault
          credentials_vault_path: prod/XConnect/PH/PH-XConnect.svc.plus
          provider: external
          enabled: true
          role: standalone
          weight: 100
    - name: tw
      region: tw
      entrypoint:
        fqdn: tw-xconnect.svc.plus
        mode: auto
        single_node_binding: direct
        multi_node_binding: scheduler
        scheduler_node: tw-01
      nodes:
        - id: tw-01
          connection_source: vault
          credentials_vault_path: prod/ulighthost-xconnect/tw-xconnect.svc.plus
          provider: external
          enabled: true
          role: standalone
          weight: 100
  connection_sources:
    terraform_cmdb:
      requires:
        - node_id
        - ip
        - ansible_user
        - instance_id
      credentials: deployment_key
    vault:
      requires:
        - ansible_host
        - ansible_user
        - SSH_PASSWORD
