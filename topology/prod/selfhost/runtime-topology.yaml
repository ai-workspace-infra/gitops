apiVersion: gitops.svc.plus/v1alpha1
kind: EdgeRoutingConfig
metadata:
  name: web-saas
  project: svc.plus
  environment: prod
  mode: selfhost
spec:
  runtime:
    mode: selfhost
    routing:
      dns:
        control_plane: cloudflare-dns
        ttl_seconds: 60
        canonical_records:
          console.svc.plus: console-selfhost-prod.svc.plus
          accounts.svc.plus: accounts-selfhost-prod.svc.plus
      load-balancer:
        strategy: dns-only
      weight:
        selfhost: 100
        serverless: 0
    services:
      console:
        selfhost: vps-full-stack
        serverless: cloudflare-pages
      accounts:
        selfhost: vps-full-stack
        serverless: cloud-run
      content:
        selfhost: vps-full-stack
        serverless: cloud-run
      billing:
        selfhost: vps-full-stack
        serverless: cloud-run
    data:
      primary: selfhost
      replica: serverless
      providers:
        selfhost: self-managed-postgresql
        serverless: supabase
      migration:
        strategy: async
        single_writer: true
        max_lag_seconds: 60
        require_quiesce_for_cutover: true
        checkpoint_vault_ref: kv/prod/serverless/dts
        directions:
          selfhost_to_serverless:
            source: selfhost
            target: serverless
          serverless_to_selfhost:
            source: serverless
            target: selfhost
  domains:
    console.svc.plus:
      selfhost: console-selfhost-prod.svc.plus
      serverless: console-serverless-prod.svc.plus
    accounts.svc.plus:
      selfhost: accounts-selfhost-prod.svc.plus
      serverless: accounts-serverless-prod.svc.plus
  public_endpoints:
    console:
      host: console-selfhost-prod.svc.plus
      access: public
    accounts:
      host: accounts-selfhost-prod.svc.plus
      access: authenticated
    billing:
      host: billing-selfhost-prod.svc.plus
      access: authenticated
    postgresql:
      host: postgresql-selfhost-prod.svc.plus
      access: authenticated
    agent-proxy:
      host: agent-proxy-selfhost-prod.svc.plus
      access: public_uuid
  cloudflare:
    zone_name: svc.plus
    pages_project: ai-workspace-portal-prod
    pages_branch: prod
  vps:
    stack: full-stack
    services:
      - console
      - accounts
      - content
      - billing
    database: self-managed-postgresql
  serverless:
    console_host: console-serverless-prod.svc.plus
    accounts_host: accounts-serverless-prod.svc.plus
    billing_host: billing-serverless-prod.svc.plus
    cloud_run:
      accounts: https://accounts-service-uc.a.run.app
      content_service: https://content-service-uc.a.run.app
      billing_service: https://billing-service-uc.a.run.app
    ssr:
      - id: public
        worker_name: frontend-ssr-public-prod
        route_suffixes:
          - /*
          - /_edge/public/*
      - id: content
        worker_name: frontend-ssr-content-prod
        route_suffixes:
          - /blogs*
          - /docs*
          - /download*
          - /_edge/content/*
      - id: auth
        worker_name: frontend-ssr-auth-prod
        route_suffixes:
          - /login*
          - /register*
          - /email-verification*
          - /logout*
          - /_edge/auth/*
      - id: console
        worker_name: frontend-ssr-console-prod
        route_suffixes:
          - /panel*
          - /dashboard*
          - /_edge/console/*
      - id: workspace
        worker_name: frontend-ssr-workspace-prod
        route_suffixes:
          - /ai-workspace*
          - /cloud_iac*
          - /editor*
          - /support*
          - /xworkmate*
          - /_edge/workspace/*
    edge_gateway:
      defaults:
        primary_upstream: https://accounts-selfhost-prod.svc.plus
        fallback_upstream: https://accounts-service-uc.a.run.app
        jwt_issuer: https://accounts-serverless-prod.svc.plus
        timeout_ms: '2500'
      boundaries:
        - id: auth
          worker_name: edge-gateway-auth-prod
          route: /api/auth/*
        - id: admin
          worker_name: edge-gateway-admin-prod
          route: /api/admin/*
        - id: core
          display_name: Edge Gateway Router Core
          worker_name: edge-gateway-core-prod
          route: /api/*
