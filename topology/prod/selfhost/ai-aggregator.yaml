apiVersion: gitops.svc.plus/v1alpha1
kind: PersonalAIAggregator
metadata:
  name: ai-aggregator
  project: ai-workspace
  environment: prod
  mode: selfhost
spec:
  enabled: false
  delivery:
    runtime: systemd
    playbook: deploy-ai-aggregator-v1.yml
    deployment_controller: platform-ops-toolkit
    rollback_upstream: litellm
    deployment_mode: embedded
  infrastructure:
    provider: existing
    provisioner: ansible
    resource_contract:
      repository: ai-workspace-infra/iac_modules
      path: terraform-hcl-standard/docs/ai-aggregator-vps-contract.md
      ref: main
      renderer: cmdb/inventory
    lifecycle: persistent
    terraform_manage_lifecycle: false
    node_source: existing-cmdb-and-inventory
    outputs:
      cmdb: inventory:ansible_host+private_ip
      inventory: existing:ai_aggregator_gateway+ai_aggregator_cpa
    destroy_policy: never
  entrypoint:
    component: caddy
    domain: ai.svc.plus
    direct_api_domain: direct.ai.svc.plus
    tls: automatic
    public_port: 443
    basic_auth_enabled: true
    admin_basic_auth_ref: vault://kv/prod/ai-aggregator/gateway/caddy#admin_password_hash
    source_cidrs: []
    # An empty allowlist deliberately denies external access. Add only fixed
    # operator /32 or /128 addresses before setting enabled: true.
  nodes:
    - id: gateway-01
      inventory_host: jp-xhttp-contabo.svc.plus
      resource_ref: cmdb://nodes/jp-xhttp-contabo.svc.plus
      role: gateway
      provider: existing
      lifecycle: persistent
      caddy_mode: reuse-existing
    - id: cpa-codex-01
      inventory_host: tky-proxy.svc.plus
      resource_ref: cmdb://nodes/tky-proxy.svc.plus
      role: cpa
      transport: private-network-required
      provider: existing
      lifecycle: persistent
    - id: cpa-claude-01
      inventory_host: tky-proxy.svc.plus
      resource_ref: cmdb://nodes/tky-proxy.svc.plus
      role: cpa
      transport: private-network-required
      provider: existing
      lifecycle: persistent
    - id: cpa-codex-02
      inventory_host: tky-proxy.svc.plus
      resource_ref: cmdb://nodes/tky-proxy.svc.plus
      role: cpa
      transport: private-network-required
      provider: existing
      lifecycle: persistent
    - id: cpa-grok-01
      inventory_host: tky-proxy.svc.plus
      resource_ref: cmdb://nodes/tky-proxy.svc.plus
      role: cpa
      transport: private-network-required
      provider: existing
      lifecycle: persistent
  resources:
    minimum_resources:
      cpu: 2
      memory: 4Gi
      disk: 40Gi
    recommended_resources:
      cpu: 4
      memory: 8Gi
      disk: 80Gi
  artifacts:
    # Immutable revisions and checksums are mandatory when enabled is true.
    new_api:
      repository: ai-workspace-lab/new-api
      revision: ""
      sha256: ""
      arch: arm64
    cliproxyapi:
      repository: ai-workspace-lab/CLIProxyAPI
      revision: ""
      sha256: ""
      arch: arm64
  new_api:
    node: gateway-01
    bind_address: 127.0.0.1
    port: 3000
    start_command: /opt/ai-aggregator/new-api/new-api
    persistence:
      driver: postgresql
      database: new_api
      secret_ref: vault://kv/prod/ai-aggregator/database/new-api#dsn
    session_secret_ref: vault://kv/prod/ai-aggregator/gateway/new-api#session_secret
    crypto_secret_ref: vault://kv/prod/ai-aggregator/gateway/new-api#crypto_secret
    client_token:
      managed_by: new-api
      secret_ref: vault://kv/prod/ai-aggregator/gateway/new-api#api_client_token
  litellm:
    node: gateway-01
    bind_address: 127.0.0.1
    port: 4000
    direct_api_domain: direct.ai.svc.plus
    persistence:
      driver: postgresql
      database: litellm
      secret_ref: vault://kv/prod/ai-aggregator/database/litellm#dsn
    master_key_ref: vault://kv/prod/ai-aggregator/gateway/litellm#master_key
    provider_secret_refs:
      openai: vault://kv/prod/ai-aggregator/litellm/providers/openai#api_key
      anthropic: vault://kv/prod/ai-aggregator/litellm/providers/anthropic#api_key
      xai: vault://kv/prod/ai-aggregator/litellm/providers/xai#api_key
    legacy_upstream: true
  client_profiles:
    - id: claude-code
      chain: new-api-cpa
      base_url: https://ai.svc.plus
      protocol: anthropic-messages
      model_alias: claude-main
      token_secret_ref: vault://kv/prod/ai-aggregator/clients/claude-code#client_token
    - id: android-studio
      chain: litellm-direct
      base_url: https://direct.ai.svc.plus/v1
      protocol: openai-chat
      model_alias: anthropic-api
      token_secret_ref: vault://kv/prod/ai-aggregator/clients/android-studio#client_token
    - id: openai-compatible
      chain: new-api-cpa
      base_url: https://ai.svc.plus/v1
      protocol: openai-chat-or-responses
      model_alias: codex-main
      token_secret_ref: vault://kv/prod/ai-aggregator/clients/openai-compatible#client_token
  cpa_instances:
    - id: cpa-codex-01
      node: cpa-codex-01
      provider: openai
      cli: codex
      account_email: manbuzhe2009@qq.com
      account_alias: cpa-codex-01
      bind_address: 127.0.0.1
      port: 8317
      network_endpoint: cmdb://nodes/cpa-codex-01/private_ip:8317
      auth_secret_ref: vault://kv/prod/ai-aggregator/cpa/cpa-codex-01#oauth_bundle
      channel_token_ref: vault://kv/prod/ai-aggregator/cpa/cpa-codex-01#channel_token
      new_api_channel:
        name: cpa-codex-01
        protocol: openai-responses
        model_mapping:
          codex-main: gpt-5.x-codex
        enabled: false
    - id: cpa-codex-02
      node: cpa-codex-02
      provider: openai
      cli: codex
      account_email: manbuzhe2008@gmail.com
      account_alias: cpa-codex-02
      bind_address: 127.0.0.1
      port: 8320
      network_endpoint: cmdb://nodes/cpa-codex-02/private_ip:8320
      auth_secret_ref: vault://kv/prod/ai-aggregator/cpa/cpa-codex-02#oauth_bundle
      channel_token_ref: vault://kv/prod/ai-aggregator/cpa/cpa-codex-02#channel_token
      new_api_channel:
        name: cpa-codex-02
        protocol: openai-responses
        model_mapping:
          codex-main: gpt-5.x-codex
        enabled: false
    - id: cpa-claude-01
      node: cpa-claude-01
      provider: anthropic
      cli: claude-code
      account_email: haitaopanhq@gmail.com
      account_alias: cpa-claude-01
      bind_address: 127.0.0.1
      port: 8318
      network_endpoint: cmdb://nodes/cpa-claude-01/private_ip:8318
      auth_secret_ref: vault://kv/prod/ai-aggregator/cpa/cpa-claude-01#oauth_bundle
      channel_token_ref: vault://kv/prod/ai-aggregator/cpa/cpa-claude-01#channel_token
      new_api_channel:
        name: cpa-claude-01
        protocol: anthropic-messages
        model_mapping:
          claude-main: claude-3-7-sonnet
        enabled: false
    - id: cpa-grok-01
      node: cpa-grok-01
      provider: xai
      cli: grok
      account_email: haitaopanhq@gmail.com
      account_alias: cpa-grok-01
      bind_address: 127.0.0.1
      port: 8319
      network_endpoint: cmdb://nodes/cpa-grok-01/private_ip:8319
      auth_secret_ref: vault://kv/prod/ai-aggregator/cpa/cpa-grok-01#oauth_bundle
      channel_token_ref: vault://kv/prod/ai-aggregator/cpa/cpa-grok-01#channel_token
      new_api_channel:
        name: cpa-grok-01
        protocol: openai-chat
        model_mapping:
          grok-main: grok-3
        enabled: false
  observability:
    log_request_bodies: false
    log_authorization_headers: false
    health_paths:
      new_api: /api/status
      cpa: /health
  migration:
    phase: parallel
    default_upstream: litellm
    cutover_requires:
      - caddy_tls_healthy
      - new_api_local_only
      - every_cpa_local_only
      - token_validation
      - provider_smoke_tests
