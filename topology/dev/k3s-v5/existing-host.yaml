  # (g6-standard-2, 2C4G; temporary SIT only). This record describes the manually created 2C4G host
  # until it is replaced and retired by a reviewed maintenance step.
  management_mode: existing
  fact_source: explicit-target
  existing_node: web-saas-dev-v5
  provider: akamai-cloud
  region: jp-tyo-3
  cluster_name: dev-k3s-v5
  inventory_host: dev-k3s-v5.svc.plus
