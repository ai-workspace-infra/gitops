# - PROD v5 entries keep their lifecycle until a reviewed maintenance change.
# Current environments: SIT-K3S-V6 (environments/clusters/sit-k3s-v6),
# PROD-K3S-V6 (environments/clusters/prod-k3s-v6). Hostnames only.
