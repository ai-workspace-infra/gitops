apiVersion: gitops.svc.plus/v1alpha1
kind: IaCPipelineTargets
targets:
- id: prod-gcp-web-saas
  environment: prod
  project: svc.plus
  provider: gcp-cloud
  account: xworktech
  workspace: web-saas
  auth:
    expected_identity: open-platform-prod
    vault_role: github-actions-platform-ops-toolkit-prod-gcp-oidc-xworktech
    record: kv/data/prod/platform/oidc/xworktech
  stages:
    bootstrap:
      mode: verify
      reason: Use the existing PROD runtime workload identity; application deployment does not rebuild identity.
    account:
      mode: verify
      manifest: resources/svc.plus/prod/gcp/web-saas.yaml
      checks:
      - kind: gcp-project
        name: open-platform-prod
      reason: The existing GCP project and network remain the owner of the persistent web-saas host.
    resources:
      mode: terraform
      manifest: resources/svc.plus/prod/gcp/web-saas.yaml
      state:
        key: terraform/prod/svc.plus/gcp-cloud/xworktech/web-saas/terraform.tfstate
        cli_workspace: default
      owners:
      - module.project
      - module.network
      - module.spot_web_saas_prod_v3
      - module.data_disk_web_saas_prod_v3
      - module.spot_web_saas_prod_v4
      - module.data_disk_web_saas_prod_v4
      - google_compute_firewall.spot_public_tcp_web_saas_prod_v4
      - google_compute_instance_iam_member.spot_os_admin_login_web_saas_prod_v4
      - google_compute_firewall.spot_public_tcp_web_saas_prod
      - google_compute_firewall.spot_ssh
      - google_compute_firewall.spot_ssh_iap
      - google_compute_firewall.spot_public_tcp_web_saas_prod_v3
      - google_compute_instance_iam_member.spot_os_admin_login_web_saas_prod_v3
      - google_org_policy_policy.vm_external_ip_access
      protected:
      - module.project
      - module.network
      - google_compute_firewall.spot_ssh
      - google_org_policy_policy.vm_external_ip_access
      - module.spot_web_saas_prod_v3.google_compute_instance.this
      - module.spot_web_saas_prod_v3.google_compute_address.public
      - module.data_disk_web_saas_prod_v3.google_compute_disk.this
      - module.spot_web_saas_prod_v4.google_compute_instance.this
      - module.spot_web_saas_prod_v4.google_compute_address.public
      - module.data_disk_web_saas_prod_v4.google_compute_disk.this
      ownership_reviewed: true
      requires_existing_state: true
      destroy_allowed: false
      reason: Manage the protected V3 host and retained ingress in the existing state; do not recreate the absent legacy host or adopt the separately managed V2 generation.
  namespace: web-saas
  lifecycle:
    status: active
    persistent: false
