# Reviewed target configuration consumed by the generic identity pipeline.
apiVersion: operations.svc.plus/v1alpha1
kind: VaultWorkloadIdentityOperation
metadata:
  name: vault-tls-reader-prod-k3s-v6
spec:
  environment: prod
  target:
    provider: akamai-cloud
    account: manbuzhe2026
    node: prod-k3s-v6
    runtime: k3s
    sshUser: root
    kubernetesVersion: v1.37.1+k3s1
    declaration: resources/svc.plus/prod/akamai/prod-k3s-v6.yaml
    iacTargetManifest: iac/targets/prod-akamai-k3s-v6.yaml
  vault:
    address: https://vault.svc.plus
    accessRole: github-actions-platform-ops-toolkit-prod-k3s-v6-vault-tls-access
    adminRole: github-actions-platform-ops-toolkit-prod-k3s-v6-vault-tls-admin
    adminPolicy: github-actions-platform-ops-toolkit-prod-k3s-v6-vault-tls-admin
    sshKeyPath: kv/data/prod/platform/prod-k3s-v6/ssh
    sshKeyField: SSH_PRIVATE_KEY
    providerTokenPath: kv/data/CICD/prod/akamai-cloud/manbuzhe2026
    providerTokenField: LINODE_TOKEN
  identity:
    mount: jwt-prod-k3s-v6
    role: prod-k3s-v6-vault-tls-reader
    policy: prod-k3s-v6-vault-tls-reader
    namespace: vault-prod
    serviceAccount: vault-tls-reader
    audience: vault-prod-k3s-v6-eso
    deniedAudience: vault-prod-k3s-v6-denied-probe
    probeServiceAccount: default
    allowedPath: kv/data/CICD/domains/svc.plus
    deniedPath: kv/data/CICD/domains/v6-authorization-denied-probe
    ttlSeconds: 600
  evidence:
    source: current-run
    workflow: .github/workflows/selfhost-orchestrator.yml
    # IaC receipt/checksum, instance ID and new bootstrap cluster/node UIDs are
    # supplied by this protected run, never copied from a previous cluster.
