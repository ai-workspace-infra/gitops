apiVersion: operations.svc.plus/v1alpha1
kind: VaultWorkloadIdentityOperation
metadata:
  name: prod-k3s-v6-postgresql-operator-reader
spec:
  environment: prod
  target:
    provider: akamai-cloud
    account: manbuzhe2026
    node: prod-k3s-v6
    runtime: k3s
    sshUser: root
    kubernetesVersion: v1.37.1+k3s1
    declaration: resources/svc.plus/prod/akamai/prod-k3s-v6.yaml
    iacTargetManifest: iac/targets/prod-akamai-k3s-v6.yaml
  vault:
    address: https://vault.svc.plus
    accessRole: github-actions-platform-ops-toolkit-prod-k3s-v6-vault-tls-access
    adminRole: github-actions-platform-ops-toolkit-prod-k3s-v6-service-secret-admin
    adminPolicy: github-actions-platform-ops-toolkit-prod-k3s-v6-service-secret-admin
    sshKeyPath: kv/data/prod/platform/prod-k3s-v6/ssh
    sshKeyField: SSH_PRIVATE_KEY
    providerTokenPath: kv/data/CICD/prod/akamai-cloud/manbuzhe2026
    providerTokenField: LINODE_TOKEN
  identity:
    mount: jwt-prod-k3s-v6
    role: prod-k3s-v6-postgresql-operator-reader
    policy: prod-k3s-v6-postgresql-operator-reader
    namespace: postgresql-prod
    serviceAccount: postgresql-operator-reader
    audience: vault-prod-k3s-v6-postgresql-operator-reader
    deniedAudience: denied-postgresql-operator-reader
    probeServiceAccount: default
    allowedPath: kv/data/prod/database/postgresql/operator
    deniedPath: kv/data/prod/database/postgresql/admin
    ttlSeconds: 600
  evidence:
    source: current-run
    workflow: .github/workflows/selfhost-orchestrator.yml
