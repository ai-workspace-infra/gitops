name: Validate Release PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  yaml-only-source:
    name: Reject tracked JSON sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce the repository YAML source rule
        run: |
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = sorted(path for path in paths if path.lower().endswith('.json'))
          if forbidden:
              raise SystemExit('GitOps tracks YAML sources only; convert: ' + ', '.join(forbidden))
          PY
  validate-zitadel-compose:
    name: Validate Shared IAM single-host GitOps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'pyyaml==6.0.2'
      - run: python3 -m unittest discover -s tests -p test_zitadel_compose.py
      - name: Validate Compose without loading host secrets
        run: python3 scripts/validate-zitadel-compose.py

  validate-shared-vault-xconnect:
    name: Validate shared Vault XConnect topology
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate dedicated shared network and SSH-only policy
        run: bash scripts/validate-shared-vault-xconnect.sh

  validate-open-platform-shared:
    name: Validate open-platform-shared migration target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate shared project and service host declaration
        run: bash scripts/validate-open-platform-shared.sh

  sec-qa-gate:
    name: Sec QA Gate (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks detect
        run: gitleaks detect -v --redact --exit-code 1

  validate-akamai-uat-six-namespaces:
    name: Validate Akamai UAT state namespaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate six isolated Akamai declarations
        run: scripts/validate-akamai-uat-six-namespaces.sh

  verify-images:
    name: Verify declared images exist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Load GHCR credentials
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-gitops-${{ github.event_name == 'pull_request' && 'sit' || 'uat' }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD GHCR_USERNAME | GHCR_USERNAME ;
            kv/data/CICD GHCR_TOKEN | GHCR_TOKEN

      # 镜像地址是 .env 里手写的, 没有任何东西保证它与构建方实际推送的路径
      # 一致。写错时 compose 依然合法、CI 依然全绿(CI 不拉镜像), 只有
      # Doco-CD 在主机上每 60s 失败一次, 而它自己的容器一直 healthy ——
      # docker ps 上看不出任何异常。这一步把那个错误提前到 PR 阶段。
      - name: Verify every declared image resolves
        run: scripts/verify-images.sh

      - name: Validate runtime topology declarations
        run: scripts/validate-runtime-topologies.sh
