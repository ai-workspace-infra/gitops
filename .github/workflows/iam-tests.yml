name: IAM declaration validation
on:
  pull_request:
    paths: ['resources/**/iam/**', 'schemas/iam-integration.schema.json', 'scripts/validate-iam-integrations.sh', 'tests/test_iam_integrations.rb', '.github/workflows/iam-tests.yml']
  push:
    branches: [main]
    paths: ['resources/**/iam/**', 'schemas/iam-integration.schema.json', 'scripts/validate-iam-integrations.sh', 'tests/test_iam_integrations.rb', '.github/workflows/iam-tests.yml']
permissions:
  contents: read
jobs:
  declaration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install minitest --no-document
      - run: ruby tests/test_iam_integrations.rb
      - name: Validate all environment manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            bash scripts/validate-iam-integrations.sh "$manifest"
          done < <(find resources -path '*/iam/identity-integrations.yaml' -type f)
