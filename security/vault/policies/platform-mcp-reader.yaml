---
apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: platform-mcp-reader
spec:
  # Secrets only; field list: services/sit-k3s-v6/platform-mcp-sit/SECRETS.md.
  paths:
    - path: kv/data/sit/platform/mcp
      capabilities: [read]
    - path: kv/data/sit/platform/observability
      capabilities: [read]
    - path: auth/token/renew-self
      capabilities: [update]
    - path: auth/token/lookup-self
      capabilities: [read]
