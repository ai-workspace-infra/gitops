---
apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: platform-mcp-reader
spec:
  # Secrets only (values never in Git):
  #   kv/sit/platform/mcp           mcp_service_token, ssh_private_key_b64, ssh_mcp_http_token
  #   kv/sit/platform/observability vmauth_password, grafana_admin_password (read by mcp-grafana)
  paths:
    - path: kv/data/sit/platform/mcp
      capabilities: [read]
    - path: kv/data/sit/platform/observability
      capabilities: [read]
    - path: auth/token/renew-self
      capabilities: [update]
    - path: auth/token/lookup-self
      capabilities: [read]
