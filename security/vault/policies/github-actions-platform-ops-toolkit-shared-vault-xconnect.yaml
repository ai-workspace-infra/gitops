---
apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: github-actions-platform-ops-toolkit-shared-vault-xconnect
  description: Shared Vault XConnect enrollment (vault-server.yml xconnect-* stages). Zero service credentials and the transport id for the shared network.
spec:
  paths:
  - path: kv/data/CICD/shared/xconnect
    capabilities:
    - read
  - path: kv/data/CICD/domains/svc.plus
    capabilities:
    - read
  - path: kv/data/CICD/github-app/daily-snapshot
    capabilities:
    - read
  - path: kv/data/CICD/shared/xconnect-operator-invite
    capabilities:
    - create
    - update
