---
apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: github-actions-platform-ops-toolkit-uat-compute-cleanup
  description: github-actions-platform-ops-toolkit-uat-compute-cleanup
spec:
  paths:
  - path: kv/data/uat/serverless/gcp
    capabilities:
    - read
  # Reviewed cross-env exception (org GitHub App key, read-only, data path only):
  # see security/vault-exceptions/cross-env-paths.yaml for compat window + exit criteria.
  - path: kv/data/CICD/github-app/daily-snapshot
    capabilities:
    - read
