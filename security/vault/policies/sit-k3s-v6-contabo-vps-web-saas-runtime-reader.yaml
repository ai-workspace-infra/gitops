apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: sit-k3s-v6-contabo-vps-web-saas-runtime-reader
  description: Read only SIT Web SaaS runtime signing secrets.
spec:
  paths:
    - path: kv/data/sit/web-saas/runtime
      capabilities: [read]
    - path: auth/token/lookup-self
      capabilities: [read]
