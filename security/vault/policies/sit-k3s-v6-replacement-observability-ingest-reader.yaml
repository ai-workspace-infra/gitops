apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: sit-k3s-v6-replacement-observability-ingest-reader
  description: SIT candidate observability ingest credential reader.
spec:
  paths:
    - path: kv/data/sit/services/k3s-v6-replacement/observability/ingest
      capabilities: [read]
    - path: auth/token/lookup-self
      capabilities: [read]
