apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: sit-k3s-v6-replacement-observability-ingest-reader
  description: Read only the replacement SIT observability-ingest record.
spec:
  paths:
    - path: kv/data/sit/k3s-v6-replacement/observability/ingest
      capabilities: [read]
    - path: auth/token/lookup-self
      capabilities: [read]
