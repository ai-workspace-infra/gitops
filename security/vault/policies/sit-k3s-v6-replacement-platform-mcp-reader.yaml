apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: sit-k3s-v6-replacement-platform-mcp-reader
  description: SIT candidate MCP gateway credential reader.
spec:
  paths:
    - path: kv/data/sit/services/k3s-v6-replacement/platform/mcp
      capabilities: [read]
    - path: auth/token/lookup-self
      capabilities: [read]
