apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: sit-k3s-v6-replacement-datakit-dataway-reader
  description: Read only the replacement SIT datakit-dataway record.
spec:
  paths:
    - path: kv/data/sit/k3s-v6-replacement/observability/datakit
      capabilities: [read]
    - path: auth/token/lookup-self
      capabilities: [read]
