apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: sit-k3s-v6-replacement-observability-domain-tls-reader
  description: Read only the replacement SIT observability-domain-tls record.
spec:
  paths:
    - path: kv/data/sit/k3s-v6-replacement/domains/svc.plus
      capabilities: [read]
    - path: auth/token/lookup-self
      capabilities: [read]
