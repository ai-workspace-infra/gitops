apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: sit-k3s-v6-replacement-postgresql-operator-reader
  description: Read only the replacement SIT postgresql-operator record.
spec:
  paths:
    - path: kv/data/sit/k3s-v6-replacement/database/postgresql/operator
      capabilities: [read]
    - path: auth/token/lookup-self
      capabilities: [read]
