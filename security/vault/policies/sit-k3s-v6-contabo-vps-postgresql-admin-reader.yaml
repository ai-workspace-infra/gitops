apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: sit-k3s-v6-contabo-vps-postgresql-admin-reader
  description: SIT Contabo PostgreSQL admin credential reader.
spec:
  paths:
    - path: kv/data/sit/database/postgresql/admin
      capabilities: [read]
    - path: auth/token/lookup-self
      capabilities: [read]
