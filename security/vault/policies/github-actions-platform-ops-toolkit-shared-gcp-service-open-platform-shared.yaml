---
apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: github-actions-platform-ops-toolkit-shared-gcp-service-open-platform-shared
  description: The shared Observability service stage only needs the GCP WIF identity for open-platform-shared. Terraform state, Vault application data, deployment keys, and DNS credentials remain unavailable to this role.
spec:
  paths:
  - path: kv/data/shared/platform/oidc/open-platform-shared
    capabilities:
    - read
  - path: kv/metadata/shared/platform/oidc/open-platform-shared
    capabilities:
    - read
