apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: sit-k3s-v6-replacement-grafana-admin-reader
  description: Read only the replacement SIT grafana-admin record.
spec:
  paths:
    - path: kv/data/sit/k3s-v6-replacement/observability/grafana
      capabilities: [read]
    - path: auth/token/lookup-self
      capabilities: [read]
