apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: github-actions-platform-ops-toolkit-prod-k3s-v6-service-secret-admin
  description: Configure only the declared service reader policies and roles in the
    selected cluster mount.
spec:
  paths:
  - path: sys/auth
    capabilities:
    - read
  - path: sys/auth/jwt-prod-k3s-v6
    capabilities:
    - create
    - update
    - sudo
  - path: sys/capabilities-self
    capabilities:
    - update
  - path: auth/jwt-prod-k3s-v6/config
    capabilities:
    - create
    - read
    - update
  - path: auth/token/lookup-self
    capabilities:
    - read
  - path: sys/policies/acl/prod-k3s-v6-postgresql-admin-reader
    capabilities:
    - read
    - create
    - update
  - path: auth/jwt-prod-k3s-v6/role/prod-k3s-v6-postgresql-admin-reader
    capabilities:
    - read
    - create
    - update
  - path: sys/policies/acl/prod-k3s-v6-postgresql-operator-reader
    capabilities:
    - read
    - create
    - update
  - path: auth/jwt-prod-k3s-v6/role/prod-k3s-v6-postgresql-operator-reader
    capabilities:
    - read
    - create
    - update
  - path: sys/policies/acl/prod-k3s-v6-postgresql-auditor-reader
    capabilities:
    - read
    - create
    - update
  - path: auth/jwt-prod-k3s-v6/role/prod-k3s-v6-postgresql-auditor-reader
    capabilities:
    - read
    - create
    - update
  - path: sys/policies/acl/prod-k3s-v6-web-saas-secrets-reader
    capabilities:
    - read
    - create
    - update
  - path: auth/jwt-prod-k3s-v6/role/prod-k3s-v6-web-saas-secrets-reader
    capabilities:
    - read
    - create
    - update
