apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: sit-k3s-v6-replacement-web-saas-runtime-reader
  description: SIT candidate Web SaaS runtime credential reader.
spec:
  paths:
    - path: kv/data/sit/services/k3s-v6-replacement/web-saas/runtime
      capabilities: [read]
    - path: auth/token/lookup-self
      capabilities: [read]
