---
apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: github-actions-platform-ops-toolkit-prod-k3s-v6-vault-tls-admin
  description: Only the dedicated identity, never the shared Vault auth mount or secret data.
spec:
  paths:
  - path: sys/auth
    capabilities:
    - read
  - path: sys/auth/jwt-prod-k3s-v6
    capabilities:
    - create
    - update
    - sudo
  - path: sys/capabilities-self
    capabilities:
    - update
  - path: sys/policies/acl/prod-k3s-v6-vault-tls-reader
    capabilities:
    - read
    - create
    - update
  - path: auth/jwt-prod-k3s-v6/config
    capabilities:
    - create
    - read
    - update
  - path: auth/jwt-prod-k3s-v6/role/prod-k3s-v6-vault-tls-reader
    capabilities:
    - create
    - read
    - update
  - path: auth/token/lookup-self
    capabilities:
    - read
