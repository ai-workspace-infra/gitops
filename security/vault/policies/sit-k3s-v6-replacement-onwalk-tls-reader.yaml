apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: sit-k3s-v6-replacement-onwalk-tls-reader
  description: Read only the replacement SIT onwalk-tls record.
spec:
  paths:
    - path: kv/data/sit/k3s-v6-replacement/domains/onwalk.net
      capabilities: [read]
    - path: auth/token/lookup-self
      capabilities: [read]
