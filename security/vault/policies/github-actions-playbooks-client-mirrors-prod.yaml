---
apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: github-actions-playbooks-client-mirrors-prod
  description: Least-privilege Vault policy for ai-workspace-infra/playbooks roles/saas/client_mirrors API reconciliation and smoke verification.
spec:
  paths:
  - path: kv/data/prod/serverless/cloudflare
    capabilities:
    - read
  - path: kv/metadata/prod/serverless/cloudflare
    capabilities:
    - read
  - path: kv/data/prod/platform/alicloud
    capabilities:
    - read
  - path: kv/metadata/prod/platform/alicloud
    capabilities:
    - read
  - path: kv/data/prod/platform/storage/cloudflare-r2
    capabilities:
    - create
    - update
    - read
  - path: kv/metadata/prod/platform/storage/cloudflare-r2
    capabilities:
    - read
    - list
  - path: kv/data/prod/platform/storage/aliyun-oss
    capabilities:
    - create
    - update
    - read
  - path: kv/metadata/prod/platform/storage/aliyun-oss
    capabilities:
    - read
    - list
  - path: kv/data/prod/platform/storage/cloudflare-r2-repo
    capabilities:
    - create
    - update
    - read
  - path: kv/metadata/prod/platform/storage/cloudflare-r2-repo
    capabilities:
