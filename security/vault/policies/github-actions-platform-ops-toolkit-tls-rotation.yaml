---
apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: github-actions-platform-ops-toolkit-tls-rotation
  description: github-actions-platform-ops-toolkit-tls-rotation
spec:
  paths:
  - path: kv/data/CICD
    capabilities:
    - read
  - path: kv/metadata/CICD
    capabilities:
    - list
    - read
  - path: kv/data/CICD/domains/*
    capabilities:
    - create
    - read
    - update
    - list
  - path: kv/metadata/CICD/domains/*
    capabilities:
    - list
    - read
