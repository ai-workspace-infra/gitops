---
apiVersion: security.gitops/v1alpha1
kind: VaultACLPolicy
metadata:
  name: github-actions-playbooks-feature-lane-sit
  description: Exact Dev target management binding and dedicated read-only registry credential.
spec:
  paths:
  - path: kv/data/CICD/dev/k3s-bootstrap
    capabilities:
    - read
  - path: kv/data/sit/platform/ghcr/feature-registry
    capabilities:
    - read
