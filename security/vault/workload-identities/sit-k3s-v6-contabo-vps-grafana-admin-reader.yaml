apiVersion: security.gitops/v1alpha1
kind: VaultKubernetesJWTAuthRole
metadata:
  name: sit-k3s-v6-contabo-vps-grafana-admin-reader
  description: SIT Contabo ESO identity for the Grafana admin credential.
spec:
  role_type: jwt
  user_claim: sub
  bound_subject: system:serviceaccount:observability-sit:grafana-admin-reader
  bound_audiences: [vault-sit-k3s-v6-contabo-vps-grafana-admin-reader]
  token_no_default_policy: true
  token_type: batch
  token_ttl: 10m
  token_max_ttl: 10m
  token_explicit_max_ttl: 10m
  token_policies: [sit-k3s-v6-contabo-vps-grafana-admin-reader]
