apiVersion: security.gitops/v1alpha1
kind: VaultKubernetesJWTAuthRole
metadata:
  name: sit-k3s-v6-contabo-vps-postgresql-operator-reader
  description: SIT Contabo PostgreSQL operator credential reader.
spec:
  role_type: jwt
  user_claim: sub
  bound_subject: system:serviceaccount:postgresql-sit:postgresql-operator-reader
  bound_audiences: [vault-sit-k3s-v6-contabo-vps-postgresql-operator-reader]
  token_no_default_policy: true
  token_type: batch
  token_ttl: 10m
  token_max_ttl: 10m
  token_explicit_max_ttl: 10m
  token_policies: [sit-k3s-v6-contabo-vps-postgresql-operator-reader]
