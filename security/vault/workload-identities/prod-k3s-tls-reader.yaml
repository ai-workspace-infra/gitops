apiVersion: security.gitops/v1alpha1
kind: VaultKubernetesJWTAuthRole
metadata:
  name: prod-k3s-tls-reader
spec:
  role_type: jwt
  user_claim: sub
  bound_subject: system:serviceaccount:vault-prod:vault-tls-reader
  bound_audiences: [vault-prod-k3s-tls]
  token_no_default_policy: true
  token_type: batch
  token_ttl: 10m
  token_max_ttl: 10m
  token_explicit_max_ttl: 10m
  token_policies: [prod-k3s-tls-reader]
