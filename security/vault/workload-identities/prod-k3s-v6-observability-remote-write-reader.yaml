---
apiVersion: security.gitops/v1alpha1
kind: VaultKubernetesJWTAuthRole
metadata:
  name: prod-k3s-v6-observability-remote-write-reader
  description: PROD agent ESO identity for shared observability remote-write credentials.
spec:
  role_type: jwt
  user_claim: sub
  bound_subject: system:serviceaccount:observability-prod:observability-remote-write-reader
  bound_audiences: [vault-prod-k3s-v6-observability-remote-write-reader]
  token_no_default_policy: true
  token_type: batch
  token_ttl: 10m
  token_max_ttl: 10m
  token_explicit_max_ttl: 10m
  token_policies: [observability-ingest-reader]
