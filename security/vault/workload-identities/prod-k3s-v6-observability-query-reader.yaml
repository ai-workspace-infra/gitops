---
apiVersion: security.gitops/v1alpha1
kind: VaultKubernetesJWTAuthRole
metadata:
  name: prod-k3s-v6-observability-query-reader
  description: PROD Flagger ESO identity for authenticated shared observability queries.
spec:
  role_type: jwt
  user_claim: sub
  bound_subject: system:serviceaccount:web-saas-prod:observability-query-reader
  bound_audiences: [vault-prod-k3s-v6-observability-query-reader]
  token_no_default_policy: true
  token_type: batch
  token_ttl: 10m
  token_max_ttl: 10m
  token_explicit_max_ttl: 10m
  token_policies: [observability-ingest-reader]
