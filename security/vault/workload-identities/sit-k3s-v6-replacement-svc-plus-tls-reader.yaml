apiVersion: security.gitops/v1alpha1
kind: VaultKubernetesJWTAuthRole
metadata:
  name: sit-k3s-v6-replacement-svc-plus-tls-reader
  description: SIT candidate ingress reader for the existing svc.plus TLS certificate.
spec:
  role_type: jwt
  user_claim: sub
  bound_subject: system:serviceaccount:ingress-sit:svc-plus-tls-reader
  bound_audiences: [vault-sit-k3s-v6-replacement-svc-plus-tls-reader]
  token_no_default_policy: true
  token_type: batch
  token_ttl: 10m
  token_max_ttl: 10m
  token_explicit_max_ttl: 10m
  token_policies: [sit-k3s-v6-replacement-svc-plus-tls-reader]
