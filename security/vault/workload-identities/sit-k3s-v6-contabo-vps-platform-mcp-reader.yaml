---
apiVersion: security.gitops/v1alpha1
kind: VaultKubernetesJWTAuthRole
metadata:
  name: sit-k3s-v6-contabo-vps-platform-mcp-reader
  description: SIT Contabo replacement cluster ESO identity for the platform MCP secret record.
spec:
  role_type: jwt
  user_claim: sub
  bound_subject: system:serviceaccount:platform-mcp-sit:platform-mcp-reader
  bound_audiences: [vault-sit-k3s-v6-contabo-vps-platform-mcp-reader]
  token_no_default_policy: true
  token_type: batch
  token_ttl: 10m
  token_max_ttl: 10m
  token_explicit_max_ttl: 10m
  token_policies: [platform-mcp-reader]
