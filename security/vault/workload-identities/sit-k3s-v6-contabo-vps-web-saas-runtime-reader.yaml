apiVersion: security.gitops/v1alpha1
kind: VaultKubernetesJWTAuthRole
metadata:
  name: sit-k3s-v6-contabo-vps-web-saas-runtime-reader
  description: SIT Contabo ESO identity for Web SaaS runtime signing secrets.
spec:
  role_type: jwt
  user_claim: sub
  bound_subject: system:serviceaccount:web-saas-sit:web-saas-runtime-reader
  bound_audiences: [vault-sit-k3s-v6-contabo-vps-web-saas-runtime-reader]
  token_no_default_policy: true
  token_type: batch
  token_ttl: 10m
  token_max_ttl: 10m
  token_explicit_max_ttl: 10m
  token_policies: [sit-k3s-v6-contabo-vps-web-saas-runtime-reader]
