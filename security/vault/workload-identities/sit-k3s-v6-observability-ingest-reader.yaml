---
apiVersion: security.gitops/v1alpha1
kind: VaultKubernetesJWTAuthRole
metadata:
  name: sit-k3s-v6-observability-ingest-reader
  description: SIT ESO identity for shared observability authentication.
spec:
  role_type: jwt
  user_claim: sub
  bound_subject: system:serviceaccount:observability-sit:observability-ingest-reader
  bound_audiences: [vault-sit-k3s-v6-observability-ingest-reader]
  token_no_default_policy: true
  token_type: batch
  token_ttl: 10m
  token_max_ttl: 10m
  token_explicit_max_ttl: 10m
  token_policies: [observability-ingest-reader]
