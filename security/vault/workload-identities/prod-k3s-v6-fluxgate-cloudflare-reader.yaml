---
apiVersion: security.gitops/v1alpha1
kind: VaultKubernetesJWTAuthRole
metadata:
  name: prod-k3s-v6-fluxgate-cloudflare-reader
  description: V6 ingress-prod Fluxgate ESO workload role on jwt-prod-k3s-prod-k3s-v6 reading only sensitive Cloudflare KV credentials.
spec:
  role_type: jwt
  user_claim: sub
  bound_subject: system:serviceaccount:ingress-prod:fluxgate-cloudflare-reader
  bound_audiences:
  - vault-prod-k3s-v6-fluxgate-cloudflare-reader
  token_no_default_policy: true
  token_type: batch
  token_ttl: 10m
  token_max_ttl: 10m
  token_explicit_max_ttl: 10m
  token_policies:
  - prod-k3s-v6-fluxgate-cloudflare-reader
