---
apiVersion: security.gitops/v1alpha1
kind: VaultJWTAuthRole
metadata:
  name: github-actions-xworkmate-app
  description: GitHub Actions OIDC JWT role for ai-workspace-lab/xworkmate-app release publishing, dual-mirror sync, and distribution dispatch.
spec:
  role_type: jwt
  user_claim: sub
  bound_audiences:
  - vault
  bound_claims_type: glob
  bound_claims:
    repository: ai-workspace-lab/xworkmate-app
    workflow_ref: ai-workspace-lab/xworkmate-app/.github/workflows/build-and-release.yml@*
    ref:
    - refs/heads/main
    - refs/heads/release/*
    - refs/tags/v*
  token_policies:
  - github-actions-xworkmate-app
  token_no_default_policy: true
  token_type: batch
  token_ttl: 15m
  token_max_ttl: 15m
