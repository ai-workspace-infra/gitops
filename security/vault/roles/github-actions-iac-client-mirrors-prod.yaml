---
apiVersion: security.gitops/v1alpha1
kind: VaultJWTAuthRole
metadata:
  name: github-actions-iac-client-mirrors-prod
  description: Protected prod GitHub Actions OIDC role for dual-mirror IaC reconcile and Vault KV auto-wiring.
spec:
  role_type: jwt
  user_claim: sub
  bound_audiences:
  - vault
  bound_claims_type: glob
  token_no_default_policy: true
  token_type: batch
  token_ttl: 20m
  token_max_ttl: 20m
  token_explicit_max_ttl: 20m
  bound_claims:
    repository: ai-workspace-infra/iac_modules
    environment: prod
    ref:
    - refs/heads/main
    workflow_ref: ai-workspace-infra/iac_modules/.github/workflows/client-mirrors-iac.yml@refs/heads/main
    ref_protected: 'true'
  token_policies:
  - github-actions-iac-client-mirrors-prod
