---
apiVersion: security.gitops/v1alpha1
kind: VaultJWTAuthRole
metadata:
  name: github-actions-platform-ops-toolkit-uat-compute-cleanup
  description: UAT daily compute cleanup; migrated from Platform-Orchestrator .github/config/uat-compute-cleanup-auth.yaml.
spec:
  role_type: jwt
  user_claim: sub
  bound_audiences:
  - vault
  bound_claims_type: string
  bound_claims:
    repository: ai-workspace-infra/platform-ops-toolkit
    job_workflow_ref: ai-workspace-infra/platform-ops-toolkit/.github/workflows/uat-daily-cleanup.yml@refs/heads/main
    ref: refs/heads/main
  token_policies:
  - github-actions-platform-ops-toolkit-uat-compute-cleanup
  token_no_default_policy: true
  token_type: batch
  token_ttl: 1h
  token_max_ttl: 1h
