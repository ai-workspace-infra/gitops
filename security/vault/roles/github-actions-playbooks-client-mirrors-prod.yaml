---
apiVersion: security.gitops/v1alpha1
kind: VaultJWTAuthRole
metadata:
  name: github-actions-playbooks-client-mirrors-prod
  description: Protected prod GitHub Actions OIDC role for ai-workspace-infra/playbooks roles/saas/client_mirrors.
spec:
  role_type: jwt
  user_claim: sub
  bound_audiences:
  - vault
  bound_claims_type: glob
  token_no_default_policy: true
  token_type: batch
  token_ttl: 20m
  token_max_ttl: 20m
  token_explicit_max_ttl: 20m
  bound_claims:
    repository: ai-workspace-infra/playbooks
    environment: prod
    ref:
    - refs/heads/main
    workflow_ref: ai-workspace-infra/playbooks/.github/workflows/client-mirrors-reconcile.yml@refs/heads/main
    ref_protected: 'true'
  token_policies:
  - github-actions-playbooks-client-mirrors-prod
