apiVersion: gitops.svc.plus/v1alpha1
kind: XConnectOneNodeSet
metadata:
  name: xconnect-vault-shared
  environment: shared
spec:
  # Dedicated shared-services overlay. This is distinct from the GCP VPC CIDR
  # (10.81.0.0/20) and the UAT/Prod XConnect overlays (10.77/10.78).
  network:
    id: net_shared_vault
    cidr: 10.79.0.0/24
    gateway_wireguard_address: 10.79.0.1/32
    gateway_ref: vault-prod-0
    transport: vless-xhttp
    transport_profile:
      kind: vless-xhttp
      port: 443
      path: /xconnect
      mode: auto
      # Dedicated Gateway hostname on vault-prod-0. vault.svc.plus keeps
      # pointing at the existing Vault node until migrate-cutover, and the
      # old node must reach this Gateway before then to join over overlay.
      host: vault-xconnect.svc.plus
      frontend: caddy-unix-h2c
      listen_socket: /run/xconnect-gateway/xray.sock
    public_wireguard_ingress: false
  control_plane:
    source_of_truth: accounts-api-and-portal
    accounts_api_url: https://accounts.svc.plus
    network_id: net_shared_vault
    runtime_config: signed-by-xconnect-zero
  # The Gateway also provides the lightweight overlay DNS service. Private
  # records are authoritative there; all other names recurse through the
  # declared public resolvers. This is data-plane configuration, not a public
  # Cloudflare record.
  dns:
    enabled: true
    interface: xconone0
    listen_address: 10.79.0.1
    zone: shared.internal
    domains:
      - shared.internal
      - svc.plus
    upstream_servers:
      - 1.1.1.1
      - 8.8.8.8
    records:
      - name: vault-prod-0.shared.internal
        address: 10.79.0.1
      - name: vault-prod-1.shared.internal
        address: 10.79.0.2
      - name: vault-prod-2.shared.internal
        address: 10.79.0.3
      - name: secops.shared.internal
        address: 10.79.0.7
      - name: internal-xworkmate-bridge.svc.plus
        address: 10.79.0.7
      - name: vault-xconnect.svc.plus
        address: 10.79.0.1
  access_policy:
    default_action: deny
    rules:
      - id: vault-prod-1-to-gateway-dns-udp
        source_device_id: vault-prod-1
        destination_node_ids: [vault-prod-0]
        protocol: udp
        ports: [53]
        action: allow
      - id: vault-prod-1-to-gateway-dns-tcp
        source_device_id: vault-prod-1
        destination_node_ids: [vault-prod-0]
        protocol: tcp
        ports: [53]
        action: allow
      - id: vault-prod-2-to-gateway-dns-udp
        source_device_id: vault-prod-2
        destination_node_ids: [vault-prod-0]
        protocol: udp
        ports: [53]
        action: allow
      - id: vault-prod-2-to-gateway-dns-tcp
        source_device_id: vault-prod-2
        destination_node_ids: [vault-prod-0]
        protocol: tcp
        ports: [53]
        action: allow
      - id: ops-macos-to-gateway-dns-udp
        source_device_id: xconnect-darwin-haitaodemacbook-pro-rejoin.local
        destination_node_ids: [vault-prod-0]
        protocol: udp
        ports: [53]
        action: allow
      - id: ops-macos-to-gateway-dns-tcp
        source_device_id: xconnect-darwin-haitaodemacbook-pro-rejoin.local
        destination_node_ids: [vault-prod-0]
        protocol: tcp
        ports: [53]
        action: allow
      - id: secops-one-to-gateway-dns-udp
        source_device_id: xconnect-linux-secops-shenlan-inspiron-5415-ops
        destination_node_ids: [vault-prod-0]
        protocol: udp
        ports: [53]
        action: allow
      - id: secops-one-to-gateway-dns-tcp
        source_device_id: xconnect-linux-secops-shenlan-inspiron-5415-ops
        destination_node_ids: [vault-prod-0]
        protocol: tcp
        ports: [53]
        action: allow
      - id: ops-macos-to-vault-ssh
        source_device_id: xconnect-darwin-haitaodemacbook-pro-rejoin.local
        destination_node_ids:
          - vault-prod-0
          - vault-prod-1
          - vault-prod-2
        protocol: tcp
        ports: [22]
        action: allow
  runtime:
    cli_release: v0.1.18
    gateway_release: v0.1.13
    # Xray-core for the Gateway data plane; the pipeline verifies the
    # release's published SHA2-256 digest before installing it.
    xray_release: v26.3.27
    wireguard_interface: xconone0
    xray_loopback_udp_port: 18080
    state_dir_prefix: /var/lib/xconnect-one
    gateway_state_dir: /var/lib/xconnect-gateway/shared
    sync_interval_seconds: 300
  gateway:
    id: vault-prod-0
    host_ref: vault-prod-0
    xconnect:
      overlay_ip: 10.79.0.1
      internal_dns: vault-prod-0.shared.internal
    role: gateway
    connection_source: terraform-cmdb
    deployment: enabled
    observability: required
  fixed_nodes:
    - id: vault-prod-1
      host_ref: vault-prod-1
      xconnect:
        overlay_ip: 10.79.0.2
        internal_dns: vault-prod-1.shared.internal
      role: one
      lifecycle: persistent
      deployment: enabled
      connection_source: terraform-cmdb
      observability: required
    - id: vault-prod-2
      host_ref: vault-prod-2
      xconnect:
        overlay_ip: 10.79.0.3
        internal_dns: vault-prod-2.shared.internal
      role: one
      lifecycle: persistent
      deployment: enabled
      connection_source: terraform-cmdb
      observability: required
  operator_devices:
    - id: xconnect-darwin-haitaodemacbook-pro-rejoin.local
      name: Haitao operations Mac (rejoin)
      role: one
      xconnect:
        overlay_ip: 10.79.0.9
        internal_dns: haitao-mac.shared.internal
      enrollment: short-lived-single-use-invite
      lifecycle: persistent
      deployment: operator-enrolled
      access_policy_ref: ops-macos-to-vault-ssh
  security:
    public_wireguard_ingress: false
    allowed_public_service:
      port: 443
      host: vault-xconnect.svc.plus
      path: /xconnect
    credential_source: vault
    credential_path: kv/data/CICD/shared/xconnect
    forbidden_in_git:
      - invitation_tokens
      - device_credentials
      - device_private_keys
      - wireguard_private_keys
      - vless_credentials
      - service_tokens
