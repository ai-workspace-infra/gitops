apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: web-saas-prod
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  prune: true
  wait: true
  timeout: 30m
  dependsOn:
    - name: platform-vault-prod
    - name: platform-postgresql-prod
    - name: platform-ingress-prod
    - name: platform-observability-prod
  sourceRef:
    kind: GitRepository
    name: platform-config-prod
  path: ./services/prod-k3s-v6/web-saas-prod
