apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: web-saas-sit-canary
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: web-saas-sit
  sourceRef:
    kind: GitRepository
    name: web-saas-sit-config
  path: ./services/sit-k3s-v6/web-saas-sit/canary
