apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../namespaces.yaml
  - ../../root.yaml
  - ../../source.yaml
  - ../../unit-sources.yaml
  - ../../postgresql-kustomization.yaml
  - ../../observability-kustomization.yaml
  - ../../vpa-kustomization.yaml
  - ../../platform-mcp-kustomization.yaml
  - ../../ingress-kustomization.yaml
  - ../../ingress-routes-kustomization.yaml
  - ../../external-dns-kustomization.yaml
  - ../../web-saas-kustomization.yaml
  - web-saas-canary-kustomization.yaml
  - external-secrets-kustomization.yaml
  # Cluster-scoped RBAC for the root/operator/auditor Kubernetes identities;
  # k3s_identity waits for this Kustomization before issuing credentials.
  - ../../cluster-identities-kustomization.yaml
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: sit-k3s
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/path
        value: ./environments/clusters/sit-k3s-v6/overlays/contabo-vps
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: postgresql-sit
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/path
        value: ./services/sit-k3s-v6/overlays/contabo-vps/postgresql-sit
      - op: replace
        path: /spec/suspend
        value: false
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: observability-sit
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/path
        value: ./services/sit-k3s-v6/overlays/contabo-vps/observability-sit
      - op: replace
        path: /spec/suspend
        value: false
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: vpa-sit
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/path
        value: ./services/sit-k3s-v6/overlays/contabo-vps/vpa-sit
      - op: replace
        path: /spec/suspend
        value: false
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: external-dns-sit
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/path
        value: ./services/sit-k3s-v6/overlays/contabo-vps/external-dns
      - op: replace
        path: /spec/suspend
        value: false
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: platform-mcp-sit
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/path
        value: ./services/sit-k3s-v6/overlays/contabo-vps/platform-mcp-sit
      - op: replace
        path: /spec/suspend
        value: false
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: ingress-sit
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/path
        value: ./services/sit-k3s-v6/overlays/contabo-vps/ingress-sit-controller
      - op: replace
        path: /spec/suspend
        value: false
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: ingress-sit-routes
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/path
        value: ./services/sit-k3s-v6/overlays/contabo-vps/ingress-sit-routes
      - op: replace
        path: /spec/suspend
        value: false
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: web-saas-sit
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/path
        value: ./services/sit-k3s-v6/overlays/contabo-vps/web-saas-sit
      - op: replace
        path: /spec/suspend
        value: false
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: web-saas-sit-canary
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/suspend
        value: false

  # Release model: the root source `config-sit` watches branch `main`; the
  # release tag below is configuration inside `main` and pins every child
  # source. To advance a release: merge a PR that bumps this tag, then create
  # the immutable tag on that merge commit (Flux picks it up from `main`).
  - target:
      group: source.toolkit.fluxcd.io
      version: v1
      kind: GitRepository
    patch: |-
      - op: replace
        path: /spec/ref
        value:
          tag: sit-k3s-v6-contabo-r21
  # Root source follows main (applied after the tag patch above).
  - target:
      group: source.toolkit.fluxcd.io
      version: v1
      kind: GitRepository
      name: config-sit
      namespace: flux-system
    patch: |-
      - op: replace
        path: /spec/ref
        value:
          branch: main
