apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-sit
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: observability-sit-config
  path: ./services/sit-k3s-v6/observability-sit
