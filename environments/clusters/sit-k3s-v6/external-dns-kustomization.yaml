apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-sit
  namespace: flux-system
spec:
  # 可选开关：suspend: false 为开启，suspend: true 为关闭
  suspend: false
  interval: 5m
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: external-dns-sit-config
  path: ./services/sit-k3s-v6/external-dns
