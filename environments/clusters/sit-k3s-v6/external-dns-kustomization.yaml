apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns-sit
  namespace: flux-system
spec:
  # ExternalDNS 自动更新由 GitOps 管理；要暂停 DNS 写入时显式 suspend。
  suspend: false
  interval: 5m
  prune: true
  wait: false
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: external-dns-sit-config
  path: ./services/sit-k3s-v6/external-dns
