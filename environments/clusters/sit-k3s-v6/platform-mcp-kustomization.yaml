apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-mcp-sit
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: vpa-sit
  sourceRef:
    kind: GitRepository
    name: platform-mcp-sit-config
  path: ./services/sit-k3s-v6/platform-mcp-sit
