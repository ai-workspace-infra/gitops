apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-sit
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: ingress-sit-config
  path: ./services/sit-k3s-v6/ingress-sit
