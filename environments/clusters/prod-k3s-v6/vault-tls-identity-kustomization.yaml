# Create only the identity and narrow TokenRequest grant. Vault access must be
# verified by the bootstrap owner; ESO retries TLS synchronization until allowed.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault-tls-identity
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  prune: false
  wait: true
  timeout: 15m
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: vault-prod-config
  path: ./services/prod-k3s-v6/vault-prod/tls-identity
