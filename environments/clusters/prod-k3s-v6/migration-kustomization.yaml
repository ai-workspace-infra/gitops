apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: accounts-migration
  namespace: flux-system
spec:
  interval: 1m
  prune: false
  wait: false
  sourceRef:
    kind: GitRepository
    name: web-saas-prod-config
  path: ./services/accounts-migration/target
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: accounts-migration-network
