# V6 management source. Its immutable release activates only the management root;
# every workload source, child Kustomization and HelmRelease remains independently paused.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: config-prod
  namespace: flux-system
spec:
  suspend: false
  interval: 1m
  url: https://github.com/ai-workspace-infra/gitops.git
  ref:
    tag: v2026.10.29.11
