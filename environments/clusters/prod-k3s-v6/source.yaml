# Separate Flux object on V6; same GitOps repository as V5, independent cluster state.
# This pin predates the V6 paths. Keep it suspended until a reviewed production tag
# containing this topology is selected in a release-pin change.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: config-prod
  namespace: flux-system
spec:
  suspend: true
  interval: 1m
  url: https://github.com/ai-workspace-infra/gitops.git
  ref:
    tag: v2026.10.29.4
