# Separate Flux object on V6; same GitOps repository as V5, independent cluster state.
# The V6 graph uses its own reviewed immutable release. Keep it suspended until
# the release-pin commit is published and bootstrap/identity gates pass.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: config-prod
  namespace: flux-system
spec:
  suspend: true
  interval: 1m
  url: https://github.com/ai-workspace-infra/gitops.git
  ref:
    tag: v2026.10.29.8
