# Stable PROD management source. The release tag must be published after merge
# before the production workflow selects this candidate.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: config-prod
  namespace: flux-system
spec:
  suspend: false
  interval: 1m
  url: https://github.com/ai-workspace-infra/gitops.git
  ref:
    tag: v2026.10.30.2
