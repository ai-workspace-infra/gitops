# Cluster prerequisite, separate from the five application release units.
# Reconcile after Flux handover; downstream TLS waits for ESO readiness.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  prune: false
  wait: true
  timeout: 15m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: external-secrets
  sourceRef:
    kind: GitRepository
    name: config-prod
  path: ./services/prod-k3s-v6/cluster-prerequisites/external-secrets
