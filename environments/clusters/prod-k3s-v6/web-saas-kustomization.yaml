apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: web-saas-prod
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  prune: true
  wait: true
  timeout: 30m
  dependsOn:
    - name: vault-prod
    - name: postgresql-prod
  sourceRef:
    kind: GitRepository
    name: web-saas-prod-config
  path: ./services/prod-k3s-v6/web-saas-prod
