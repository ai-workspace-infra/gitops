# Same repository, independent immutable configuration pins per release unit.
# Initially use the same reviewed V6 release; each unit can later advance its
# own source pin independently while its Kustomization remains separately gated.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vault-prod-config
  namespace: flux-system
spec:
  suspend: true
  interval: 1m
  url: https://github.com/ai-workspace-infra/gitops.git
  ref:
    tag: v2026.10.29.8
---
