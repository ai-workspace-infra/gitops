# Independent unit sources default to main; each may select a reviewed ref.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vault-prod-config
  namespace: flux-system
spec:
  suspend: false
  interval: 1m
  url: https://github.com/ai-workspace-infra/gitops.git
