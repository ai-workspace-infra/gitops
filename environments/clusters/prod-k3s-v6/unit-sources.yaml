# Same repository, independent immutable configuration pins per release unit.
# Cold bootstrap aligns the pins to one reviewed tag; later unit releases may
# advance one source and reconciliation gate without moving the other units.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vault-prod-config
  namespace: flux-system
spec:
  suspend: true
  interval: 1m
  url: https://github.com/ai-workspace-infra/gitops.git
  ref:
    tag: v2026.10.30.1
---
