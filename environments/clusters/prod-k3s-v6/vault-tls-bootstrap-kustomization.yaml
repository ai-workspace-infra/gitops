# Reads only the existing shared svc.plus certificate from the external Vault.
# This reconciles after ESO is healthy and before the V6 Vault release.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault-tls-bootstrap
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  prune: false
  wait: true
  timeout: 15m
  dependsOn:
    - name: external-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: vault-server-tls
      namespace: vault-prod
  sourceRef:
    kind: GitRepository
    name: vault-prod-config
  path: ./services/prod-k3s-v6/vault-prod/tls-bootstrap
