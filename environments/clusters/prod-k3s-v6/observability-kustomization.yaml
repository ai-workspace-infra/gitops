apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-prod
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  prune: false
  wait: true
  timeout: 20m
  dependsOn:
    - name: vault-prod
  sourceRef:
    kind: GitRepository
    name: observability-prod-config
  path: ./services/prod-k3s-v6/observability-prod
