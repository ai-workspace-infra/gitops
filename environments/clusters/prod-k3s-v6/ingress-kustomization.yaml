apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-prod
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik-crds
      namespace: ingress-prod
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik-ingress
      namespace: ingress-prod
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: console-tls
      namespace: ingress-prod
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: accounts-tls
      namespace: ingress-prod
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: billing-tls
      namespace: ingress-prod
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: brand-console-tls
      namespace: ingress-prod
  timeout: 15m
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: ingress-prod-config
  path: ./services/prod-k3s-v6/ingress-prod
