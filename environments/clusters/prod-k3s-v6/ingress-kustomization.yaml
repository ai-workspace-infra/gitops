apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-prod
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  prune: true
  wait: true
  timeout: 15m
  dependsOn:
    - name: vault-prod
    - name: observability-prod
    - name: web-saas-prod
  sourceRef:
    kind: GitRepository
    name: ingress-prod-config
  path: ./services/prod-k3s-v6/ingress-prod
