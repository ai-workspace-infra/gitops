apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgresql-prod
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  prune: false
  wait: true
  timeout: 15m
  dependsOn:
    - name: vault-prod
  sourceRef:
    kind: GitRepository
    name: postgresql-prod-config
  path: ./services/prod-k3s-v6/postgresql-prod
