# Management graph root. It applies only namespaces, sources and paused child gates;
# workload reconciliation is released separately by each declared child Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-k3s-v6
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  prune: false
  # The root applies the management graph only. Child Kustomizations intentionally
  # start suspended and report readiness independently, so the root must not wait on them.
  wait: false
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: config-prod
  path: ./environments/clusters/prod-k3s-v6
