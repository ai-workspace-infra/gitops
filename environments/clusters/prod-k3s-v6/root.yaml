# Initial cold bootstrap loads the complete graph paused. A reviewed release-root
# operation later enables this environment root and its bootstrap source only.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-k3s
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  prune: false
  # Once released, the root reconciles management objects only and does not wait
  # for independently gated child Kustomizations.
  wait: false
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: config-prod
  path: ./environments/clusters/prod-k3s-v6
