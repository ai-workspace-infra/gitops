apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: replacement-external-secrets
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  prune: false
  wait: true
  timeout: 15m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: external-secrets
  sourceRef:
    kind: GitRepository
    name: sit-replacement-config
  path: ./services/sit-k3s-v6-replacement/external-secrets
