apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: postgresql-admin-reader
  namespace: postgresql-sit
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-sit-k3s-v6-replacement
          role: postgresql-admin-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: postgresql-admin-reader
            audiences: [vault-sit-k3s-v6-replacement-postgresql-admin-reader]
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-admin
  namespace: postgresql-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: postgresql-admin-reader
  target:
    name: postgresql-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: sit/services/k3s-v6-replacement/postgresql/admin
        property: password
---
