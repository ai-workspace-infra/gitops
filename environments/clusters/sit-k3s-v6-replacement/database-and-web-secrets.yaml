apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-saas-secrets
  namespace: web-saas-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: web-saas-runtime-reader
  target:
    name: web-saas-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
