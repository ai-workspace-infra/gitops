# Extra vars for Playbooks k3s_platform_bootstrap_with_gitops.yml.
# Supply host attestation, free network allocations, credentials and the
# reviewed Git commit and checkout separately from the execution record.
k3s_platform_node_name: sit-k3s-v6-replacement
k3s_platform_cluster_name: sit-k3s-v6-replacement
k3s_platform_data_mode: directory
k3s_platform_require_data_mount: false
k3s_platform_local_storage_path: /data/k3s/storage
k3s_platform_disable_components:
  - traefik
  - servicelb
k3s_platform_write_kubeconfig_mode: '0600'
k3s_platform_flux_bootstrap_mode: declarative_active
k3s_platform_flux_namespace: flux-system
k3s_platform_flux_source_name: sit-replacement-config
k3s_platform_flux_root_name: sit-k3s-v6-replacement
k3s_platform_flux_root_path: environments/clusters/sit-k3s-v6-replacement
k3s_platform_git_url: https://github.com/ai-workspace-infra/gitops.git
ansible_pull_timer_enabled: false
k3s_identity_environment: sit
k3s_identity_cluster: sit-k3s-v6-replacement
k3s_identity_api_server: https://127.0.0.1:6443
k3s_identity_tls_dir: /opt/rancher/k3s/server/tls
# The runner supplies k3s_identity_rbac_revision as the selected 40-character
# GitOps commit and a distinct K3S_IDENTITY_VAULT_TOKEN at execution time.
k3s_identity_rbac_kustomizations:
  - name: cluster-identities-sit-replacement
    namespace: flux-system
k3s_identity_checks:
  root:
    - {verb: get, resource: nodes, namespace: flux-system, allowed: true}
    - {verb: impersonate, resource: users, namespace: flux-system, allowed: true}
  operator:
    - {verb: get, resource: pods, namespace: web-saas-sit, allowed: true}
    - {verb: update, resource: deployments/scale, namespace: web-saas-sit, allowed: true}
    - {verb: get, resource: secrets, namespace: web-saas-sit, allowed: false}
    - {verb: get, resource: pods/log, namespace: web-saas-sit, allowed: false}
    - {verb: patch, resource: deployments.apps, namespace: web-saas-sit, allowed: false}
    - {verb: get, resource: secrets, namespace: postgresql-sit, allowed: false}
  auditor:
    - {verb: get, resource: nodes, namespace: web-saas-sit, allowed: true}
    - {verb: list, resource: pods, namespace: web-saas-sit, allowed: true}
    - {verb: patch, resource: deployments.apps, namespace: web-saas-sit, allowed: false}
    - {verb: create, resource: pods/exec, namespace: web-saas-sit, allowed: false}
    - {verb: get, resource: secrets, namespace: web-saas-sit, allowed: false}
