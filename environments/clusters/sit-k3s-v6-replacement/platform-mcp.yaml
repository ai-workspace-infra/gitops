apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: replacement-platform-mcp
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  prune: true
  wait: true
  timeout: 20m
  dependsOn:
    - name: replacement-external-secrets
    - name: replacement-vpa
    - name: replacement-observability
  sourceRef:
    kind: GitRepository
    name: sit-replacement-config
  path: ./services/sit-k3s-v6-replacement/platform-mcp
