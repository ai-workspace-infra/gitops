metadata:
  name: postgresql-admin-reader
  namespace: postgresql-sit
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgresql-admin-reader
  namespace: postgresql-sit
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [postgresql-admin-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgresql-admin-reader
  namespace: postgresql-sit
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgresql-admin-reader
