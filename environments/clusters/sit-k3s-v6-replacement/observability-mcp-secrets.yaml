apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: observability-ingest-reader
  namespace: observability-sit
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-sit-k3s-v6-replacement
          role: observability-ingest-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: observability-ingest-reader
            audiences: [vault-sit-k3s-v6-replacement-observability-ingest-reader]
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-ingest-auth
  namespace: observability-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: observability-ingest-reader
  target:
    name: observability-ingest-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: user
      remoteRef:
        key: sit/services/k3s-v6-replacement/observability/ingest
        property: user
    - secretKey: password
      remoteRef:
        key: sit/services/k3s-v6-replacement/observability/ingest
        property: password
---
