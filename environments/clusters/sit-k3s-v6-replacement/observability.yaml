apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: replacement-observability
  namespace: flux-system
spec:
  suspend: true
  interval: 5m
  prune: true
  wait: true
  timeout: 20m
  dependsOn:
    - name: replacement-external-secrets
    - name: replacement-storage
  sourceRef:
    kind: GitRepository
    name: sit-replacement-config
  path: ./services/sit-k3s-v6-replacement/observability
