apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-saas-postgresql
  namespace: postgresql-sit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: postgresql
      app.kubernetes.io/component: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: web-saas-sit
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: web-saas
            matchExpressions:
              - key: websaas.io/workload
                operator: In
                values: [accounts, billing]
      ports:
        - port: 5432
          protocol: TCP
