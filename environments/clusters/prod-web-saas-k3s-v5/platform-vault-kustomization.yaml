apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-vault-prod
  namespace: flux-system
spec:
  interval: 5m0s
  prune: true
  wait: true
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: platform-config-prod
  path: ./services/platform-vault/prod
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-runtime
