# ==============================================================================
# XWorkmate Workspace All-in-One Full Stack (目标态 v2.1 架构规范)
#
# 架构拓扑：
#   [xworkmate-app] (Flutter UI 任务状态/审批)
#          │ HTTP / ACP :8787
#          ▼
#   [xworkmate-bridge] (:8787) ── 连接与事件转发层 (薄控制面)
#          │
#          ├─── 在线即时任务直通 ──► [DSH Harness (:3000)] (调度各类 Agent CLI / 执行体)
#          └─── 离线后台任务编排 ──► [DS-Bot (:3080/13080)] (角色规划与任务编排层)
#                                         │
#          ┌──────────────────────────────┴──────────────────────────────┐
#          ▼                                                             ▼
#   [AI Gateway 聚合接入平面]                                     [记忆与持久化平面]
#   New API (:3000) ── 统一入口/配额/分发                          X-Memory-Hub / PAXM 上下文
#       ├── LiteLLM (:4000) ── OpenAI 协议统一聚合路由              QMD Server (:8181) ── 语义检索/MCP
#       └── CPA (:8317-8319) ── CLIProxyAPI 订阅账号池适配器        PostgreSQL 17 + pgvector (:15432)
# ==============================================================================

services:
  postgresql:
    image: ${POSTGRESQL_IMAGE:-postgres-extensions:17}
    pull_policy: ${PULL_POLICY_POSTGRES:-if_not_present}
    container_name: workspace-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    ports:
      - "${LISTEN_IP:-127.0.0.1}:${PG_PORT:-15432}:5432"
    volumes:
      - ${DATA_DIR:-/var/lib/xworkmate/data}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - workspace_net

  qmd:
    image: ${QMD_IMAGE:-ghcr.io/ai-workspace-lab/qmd:v2.8.3}
    pull_policy: ${PULL_POLICY_QMD:-if_not_present}
    container_name: workspace-qmd
    restart: unless-stopped
    environment:
      NODE_ENV: production
      QMD_BACKEND: pg
      QMD_PG_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      QMD_MCP_HOST: "0.0.0.0"
      QMD_MCP_TOKEN: ${QMD_MCP_TOKEN:?QMD_MCP_TOKEN is required}
      QMD_INGEST_TOKEN: ${QMD_INGEST_TOKEN:?QMD_INGEST_TOKEN is required}
      QMD_CTX_COLLECT_INTERVAL: "0"
      QMD_MODEL_CACHE_DIR: /app/models
    expose:
      - "8181"
    ports:
      - "${LISTEN_IP:-127.0.0.1}:${QMD_PORT:-8181}:8181"
    volumes:
      - ${DATA_DIR:-/var/lib/xworkmate/data}/qmd_models:/app/models
      - ${DATA_DIR:-/var/lib/xworkmate/data}/qmd_storage:/app/storage
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8181/mcp', r => { process.exit(r.statusCode < 500 ? 0 : 1) })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - workspace_net

  # AI Gateway: New API (用户配额/模型分发)
  new-api:
    image: ${NEW_API_IMAGE:-calciumion/new-api:v0.4.10}
    pull_policy: ${PULL_POLICY_NEW_API:-if_not_present}
    container_name: workspace-new-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      SQL_DSN: /data/new-api.db
      GLOBAL_WEB_REDIRECT_URL: ""
      INITIAL_ROOT_TOKEN: ${NEW_API_ROOT_TOKEN:-root}
    volumes:
      - ${DATA_DIR:-/var/lib/xworkmate/data}/new-api:/data
    networks:
      - workspace_net
    ports:
      - "${LISTEN_IP:-127.0.0.1}:${NEW_API_PORT:-3000}:3000"

  # AI Gateway: LiteLLM Proxy (OpenAI 协议统一聚合路由)
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.51.0}
    pull_policy: ${PULL_POLICY_LITELLM:-if_not_present}
    container_name: workspace-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
    volumes:
      - ${DATA_DIR:-/var/lib/xworkmate/data}/litellm_config.yaml:/app/config.yaml:ro
    networks:
      - workspace_net
    ports:
      - "${LISTEN_IP:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"

  # AI Gateway: CPA (CLIProxyAPI 订阅账号池适配器，支持 Codex/Claude/Grok 账号会话直通)
  cpa:
    image: ${CPA_IMAGE:-ghcr.io/ai-workspace-infra/cliproxyapi:latest}
    pull_policy: ${PULL_POLICY_CPA:-if_not_present}
    container_name: workspace-cpa
    restart: unless-stopped
    environment:
      PORT: "8317"
      CPA_CONFIG_DIR: /etc/cpa
    volumes:
      - ${DATA_DIR:-/var/lib/xworkmate/data}/cpa:/etc/cpa:ro
    networks:
      - workspace_net
    ports:
      - "${LISTEN_IP:-127.0.0.1}:${CPA_PORT:-8317}:8317"

  # DSH Harness: DeepSeek-Harness 编排核心 (调度器 / stdio worker)
  dsh-harness:
    image: ${DSH_IMAGE:-ghcr.io/deepseek-ai/deepseek-harness:latest}
    pull_policy: ${PULL_POLICY_DSH:-if_not_present}
    container_name: workspace-dsh-harness
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DSH_HOME: /app/.dsh
      DSH_MCP_ENDPOINT: "http://qmd:8181/mcp"
      DSH_MCP_TOKEN: ${QMD_MCP_TOKEN}
      DEEPSEEK_BASE_URL: "http://litellm:4000/v1"
      DEEPSEEK_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
    volumes:
      - ${DATA_DIR:-/var/lib/xworkmate/data}/dsh_home:/app/.dsh
    depends_on:
      qmd:
        condition: service_healthy
      litellm:
        condition: service_started
    networks:
      - workspace_net

  # DS-Bot: DeepSeek-Bot 角色选择与任务编排插件
  ds-bot:
    image: ${DS_BOT_IMAGE:-ghcr.io/fei2411/deepseek-bot:latest}
    pull_policy: ${PULL_POLICY_DS_BOT:-if_not_present}
    container_name: workspace-ds-bot
    restart: unless-stopped
    environment:
      DSH_HOST: "0.0.0.0"
      DSH_LISTEN_PORT: "3080"
      DSH_TRUSTED_HOST: "localhost,127.0.0.1,xworkmate-bridge,dsh-harness"
      DEEPSEEK_BASE_URL: "http://litellm:4000/v1"
      DEEPSEEK_API_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
    volumes:
      - ${DATA_DIR:-/var/lib/xworkmate/data}/ds_bot_data:/data
      - ${DATA_DIR:-/var/lib/xworkmate/data}/ds_bot_workspace:/workspace
    ports:
      - "${LISTEN_IP:-127.0.0.1}:${DS_BOT_PORT:-13080}:3080"
    depends_on:
      - dsh-harness
    networks:
      - workspace_net

  # xworkmate-bridge: 连接与事件转发层 (替代原有 openclaw-gateway 依赖，直连 DSH + DS-Bot)
  xworkmate-bridge:
    image: ${BRIDGE_IMAGE:-ghcr.io/ai-workspace-lab/xworkmate-bridge:v1.0-beta2}
    pull_policy: ${PULL_POLICY_BRIDGE:-if_not_present}
    container_name: workspace-bridge
    restart: unless-stopped
    environment:
      AI_WORKSPACE_AUTH_TOKEN: ${AI_WORKSPACE_AUTH_TOKEN:?AI_WORKSPACE_AUTH_TOKEN is required}
      BRIDGE_AUTH_TOKEN: ${AI_WORKSPACE_AUTH_TOKEN}
      BRIDGE_ROUTER_TYPE: "dsh"
      BRIDGE_DSH_HARNESS_URL: "http://dsh-harness:3000"
      BRIDGE_DS_BOT_URL: "http://ds-bot:3080"
      BRIDGE_QMD_INGEST_API_URL: ${BRIDGE_QMD_INGEST_API_URL:-http://qmd:8181/api/v1/agent/ingest}
      BRIDGE_QMD_INGEST_TOKEN: ${QMD_INGEST_TOKEN}
      BRIDGE_QMD_MCP_TOKEN: ${QMD_MCP_TOKEN}
    expose:
      - "8787"
    ports:
      - "${LISTEN_IP:-127.0.0.1}:${BRIDGE_PORT:-8787}:8787"
    depends_on:
      qmd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"Authorization: Bearer ${AI_WORKSPACE_AUTH_TOKEN}\" http://127.0.0.1:8787/api/v1/agent/catalog || bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8787' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - workspace_net

networks:
  workspace_net:
    name: docker_workspace_net
    driver: bridge
