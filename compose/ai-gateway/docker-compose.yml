# ==============================================================================
# AI Gateway (New API + LiteLLM + Caddy TLS Reverse Proxy)
# GitOps 单一事实源编排声明 (Doco-CD / Docker Compose 标准拓扑)
# ==============================================================================

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.8.4-alpine}
    pull_policy: ${PULL_POLICY_CADDY:-if_not_present}
    container_name: ai-gateway-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      AI_GATEWAY_DOMAIN: ${AI_GATEWAY_DOMAIN:-ai.example.com}
      MCP_DOMAIN: ${MCP_DOMAIN:-mcp.example.com}
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:-}
    volumes:
      - ${CONFIG_DIR:-/opt/ai-gateway/config}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR:-/opt/ai-gateway/data}/caddy:/data
      - ${DATA_DIR:-/opt/ai-gateway/data}/caddy-config:/config
    networks:
      - ai-gateway-net
    depends_on:
      - new-api
      - litellm

  new-api:
    image: ${NEW_API_IMAGE:-calciumion/new-api:v0.4.10}
    pull_policy: ${PULL_POLICY_NEW_API:-if_not_present}
    container_name: ai-gateway-new-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      SQL_DSN: /data/new-api.db
      GLOBAL_WEB_REDIRECT_URL: ""
      INITIAL_ROOT_TOKEN: ${NEW_API_ROOT_TOKEN:?NEW_API_ROOT_TOKEN is required}
    volumes:
      - ${DATA_DIR:-/opt/ai-gateway/data}/new-api:/data
    networks:
      - ai-gateway-net
    ports:
      - "${LISTEN_IP:-127.0.0.1}:${NEW_API_PORT:-3000}:3000"

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.51.0}
    pull_policy: ${PULL_POLICY_LITELLM:-if_not_present}
    container_name: ai-gateway-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
    volumes:
      - ${CONFIG_DIR:-/opt/ai-gateway/config}/litellm_config.yaml:/app/config.yaml:ro
    networks:
      - ai-gateway-net
    ports:
      - "${LISTEN_IP:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"

networks:
  ai-gateway-net:
    name: docker_ai_gateway_net
    driver: bridge
