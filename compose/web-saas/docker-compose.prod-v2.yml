services:
  postgres:
    volumes:
      - type: bind
        source: /data/postgresql
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
  caddy:
    ports:
      - "443:443/udp"
  billing:
    environment:
      IMAGE: "${BILLING_IMAGE:?set in .env.prod-v2}"
      DEFAULT_REGION: jp
  console:
    environment:
      # The V2 host is deployed before the public DNS switch. Keep the public
      # aliases explicit in the release env so the browser, OAuth redirects,
      # and Accounts CORS contract move together when the old Serverless
      # records are pointed at this host. Do not derive these from the private
      # selfhost names: the public Host header is preserved by Caddy.
      RUNTIME_API_BASE_URL: https://${PUBLIC_ACCOUNTS_DOMAIN:?set in .env.prod-v2}/api
      RUNTIME_AUTH_URL: https://${PUBLIC_ACCOUNTS_DOMAIN:?set in .env.prod-v2}
      RUNTIME_DASHBOARD_URL: https://${PUBLIC_CONSOLE_DOMAIN:?set in .env.prod-v2}
      RUNTIME_DOCS_SERVICE_URL: http://content:8084
      RUNTIME_XCONNECT_ZERO_URL: http://accounts:8080
