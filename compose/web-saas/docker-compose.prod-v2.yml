services:
  postgres:
    volumes:
      - type: bind
        source: /data/postgresql
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
  caddy:
    ports:
      - "443:443/udp"
  billing:
    environment:
      IMAGE: "${BILLING_IMAGE:?set in .env.prod-v2}"
      DEFAULT_REGION: jp
