services:
  postgres:
    volumes:
      - type: bind
        source: /data/postgresql
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
  caddy:
    ports:
      - "443:443/udp"
  billing:
    environment:
      IMAGE: "${BILLING_IMAGE:?set in .env.prod-v2}"
      DEFAULT_REGION: jp
  console:
    environment:
      RUNTIME_API_BASE_URL: https://accounts-selfhost-prod-v2.svc.plus/api
      RUNTIME_AUTH_URL: https://accounts-selfhost-prod-v2.svc.plus
      RUNTIME_DASHBOARD_URL: https://console-selfhost-prod-v2.svc.plus
      RUNTIME_DOCS_SERVICE_URL: http://content:8084
      RUNTIME_XCONNECT_ZERO_URL: http://accounts:8080
