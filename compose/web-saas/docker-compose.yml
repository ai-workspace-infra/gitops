# web-saas 域的 Docker Compose 声明, 由 Doco-CD 从本仓库拉取部署。
#
# 所有 bind mount 都写绝对路径。Doco-CD 每次部署都把本仓库全新 clone 到一个
# 临时目录再运行 docker compose, 相对路径会解析到那个 clone 里 —— 证书和
# 配置并不在仓库里(也不该在), 相对路径会挂载出空目录而不是报错。
#
# 主机侧这些路径由 Ansible 从 Vault 渲染, 与本文件的镜像版本轴解耦:
#   /etc/xcontrol/web-saas/secrets.env      口令与 token
#   /etc/xcontrol/web-saas/config/          postgresql.conf / stunnel / account.yaml
#   /etc/xcontrol/web-saas/certs/           stunnel TLS 证书
#   /etc/xcontrol/web-saas/Caddyfile        反向代理站点定义

services:
  # PostgreSQL for web-saas.
  # PostgreSQL stays internal on 5432 only.
  # stunnel-server publishes the TLS entrypoint on 15433.
  # stunnel-client exposes the app-side local proxy on 15432 inside the
  # compose network, without any host port publication.
  postgres:
    image: ${POSTGRESQL_IMAGE:?set in .env.<env>}
    container_name: web-saas-postgresql
    restart: unless-stopped
    env_file:
      - /etc/xcontrol/web-saas/secrets.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5432}:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - /etc/xcontrol/web-saas/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - postgres_net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # TLS entrypoint for cross-node access.
  stunnel-server:
    image: ${STUNNEL_SERVER_IMAGE:?set in .env.<env>}
    container_name: web-saas-stunnel-server
    user: root
    restart: unless-stopped
    ports:
      - "15433:15433"
    volumes:
      - /etc/xcontrol/web-saas/config/stunnel-server.conf:/etc/stunnel/stunnel.conf:ro
      - /etc/xcontrol/web-saas/certs/server-cert.pem:/etc/stunnel/certs/server-cert.pem:ro
      - /etc/xcontrol/web-saas/certs/server-key.pem:/etc/stunnel/certs/server-key.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "pidof stunnel > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web_saas_network
      - postgres_net
    depends_on:
      postgres:
        condition: service_healthy

  # Local TLS client used by accounts / billing.
  stunnel-client:
    image: ${STUNNEL_CLIENT_IMAGE:?set in .env.<env>}
    container_name: web-saas-stunnel-client
    restart: unless-stopped
    environment:
      STUNNEL_SERVICE: "postgres-tls-server"
      STUNNEL_ACCEPT: "15432"
      STUNNEL_CONNECT: "stunnel-server:15433"
      STUNNEL_CRONTAB: ""
    volumes:
      - /etc/xcontrol/web-saas/config/stunnel-client.conf:/etc/stunnel/stunnel.conf:ro
      - /etc/xcontrol/web-saas/certs/ca-cert.pem:/etc/stunnel/certs/ca-cert.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "pidof stunnel > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web_saas_network
    depends_on:
      stunnel-server:
        condition: service_healthy

  accounts:
    image: ${ACCOUNTS_IMAGE:?set in .env.<env>}
    container_name: web-saas-accounts
    restart: unless-stopped
    env_file:
      - /etc/xcontrol/web-saas/secrets.env
    environment:
      PORT: "8080"
      CONFIG_PATH: "/tmp/account.yaml"
      CONFIG_TEMPLATE: "/app/config/account.yaml"
      DB_HOST: "stunnel-client"
      DB_PORT: "15432"
    volumes:
      - /etc/xcontrol/web-saas/config/account.yaml:/app/config/account.yaml:ro
    networks:
      - web_saas_network
    depends_on:
      stunnel-client:
        condition: service_healthy

  billing:
    image: ${BILLING_IMAGE:?set in .env.<env>}
    container_name: web-saas-billing
    restart: unless-stopped
    env_file:
      - /etc/xcontrol/web-saas/secrets.env
    environment:
      DB_HOST: "stunnel-client"
      DB_PORT: "15432"
      EXPORTER_BASE_URL: "http://127.0.0.1:8080"
      EXPORTER_SOURCES_JSON: >-
        [{"source_id":"xhttp-local","base_url":"http://127.0.0.1:8080"}]
      BILLING_SERVICE_LISTEN_ADDR: "0.0.0.0:8081"
    networks:
      - web_saas_network
    depends_on:
      stunnel-client:
        condition: service_healthy

  # console 镜像自带静态资源, 但 console 服务需要它们在一个共享卷里才能被
  # Caddy 直接提供。这个一次性容器负责把资源刷进卷, 每次部署都重跑一遍,
  # 否则换了镜像 tag 后静态资源还是上一版的。
  console-assets:
    image: ${CONSOLE_IMAGE:?set in .env.<env>}
    container_name: web-saas-console-assets
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        rm -rf /assets/_next /assets/chunks /assets/public
        mkdir -p /assets /assets/public
        cp -R /app/dashboard/static/. /assets/ || true
        cp -R /app/dashboard/public/. /assets/public || true
    volumes:
      - console_static:/assets

  console:
    image: ${CONSOLE_IMAGE:?set in .env.<env>}
    container_name: web-saas-console
    restart: unless-stopped
    env_file:
      - /etc/xcontrol/web-saas/secrets.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      RUNTIME_ENV: ${DEPLOY_ENV:?set in .env.<env>}
      ACCOUNT_SERVICE_URL: ${ACCOUNT_SERVICE_URL:-}
      NEXT_PUBLIC_ACCOUNT_SERVICE_URL: ${NEXT_PUBLIC_ACCOUNT_SERVICE_URL:-}
      SERVER_SERVICE_URL: ${SERVER_SERVICE_URL:-}
      NEXT_PUBLIC_SERVER_SERVICE_URL: ${NEXT_PUBLIC_SERVER_SERVICE_URL:-}
    volumes:
      - console_static:/app/dashboard/.next/static:ro
    networks:
      - web_saas_network
    depends_on:
      console-assets:
        condition: service_completed_successfully

  caddy:
    image: ${CADDY_IMAGE:?set in .env.<env>}
    container_name: web-saas-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # 只有 caddy 读这个文件, 里面是 ACME DNS-01 用的 CLOUDFLARE_DNS_API_TOKEN。
    # 刻意不并进 secrets.env —— 那个文件被 postgres / accounts / billing /
    # console 四个服务同时引用, 而这个 token 能改整个 zone 的解析记录。
    # 由 playbooks 的 web_saas_host_config 渲染成 0600。
    env_file:
      - /etc/xcontrol/web-saas/caddy.env
    volumes:
      - /etc/xcontrol/web-saas/Caddyfile:/etc/caddy/Caddyfile:ro
      # 平台侧从 Vault 恢复下来的泛域名证书。Caddyfile 在这些文件存在时会用
      # `tls <fullchain> <key>` 直接指过去, 完全不走 ACME —— 这是"证书在有效期
      # 内无限复用"真正生效的一环。容器内路径必须与主机侧一致, 因为 Caddyfile
      # 里写的是绝对路径, 由 playbooks 渲染时按主机路径生成。
      #
      # 目录整体挂载而不是逐文件: current 是个软链, 指向 versions/<指纹>/,
      # 证书轮换时整体原子替换。逐文件挂载会把 bind mount 钉死在旧 inode 上,
      # 主机换了证书容器里还是旧的。
      - /etc/xcontrol/tls:/etc/xcontrol/tls:ro
      # caddy_data 存 ACME 账户密钥与自行签发的证书。主机重建会连卷一起丢,
      # 走 ACME 时每次重建都要重新签发, 撞 Let's Encrypt "同一组域名 5 次/周" 的限流 ——
      # 平台侧会把它备份进 Vault 并在 bootstrap 时恢复, 让重建不再重签。
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web_saas_network
    depends_on:
      - accounts
      - billing
      - console

networks:
  web_saas_network:
    name: docker_shared_network
    external: true
  postgres_net:
    name: docker_web_saas_postgres_network
    driver: bridge
    external: true

volumes:
  postgresql_data:
  console_static:
  caddy_data:
  caddy_config:
