# web-saas 域的 Docker Compose 声明, 由 Doco-CD 从本仓库拉取部署。
#
# 所有 bind mount 都写绝对路径。Doco-CD 每次部署都把本仓库全新 clone 到一个
# 临时目录再运行 docker compose, 相对路径会解析到那个 clone 里 —— 证书和
# 配置并不在仓库里(也不该在), 相对路径会挂载出空目录而不是报错。
#
# 主机侧这些路径由 Ansible 从 Vault 渲染, 与本文件的镜像版本轴解耦:
#   /etc/xcontrol/web-saas/secrets.env      口令与 token
#   /etc/xcontrol/web-saas/config/          postgresql.conf / stunnel / account.yaml
#   /etc/xcontrol/web-saas/certs/           stunnel TLS 证书
#   /etc/xcontrol/web-saas/Caddyfile        反向代理站点定义

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  # web-saas 域专属 PostgreSQL 实例，承载 accounts、billing 等业务数据库。
  # 监听 localhost，通过 stunnel-server 提供 TLS 加密外部访问。
  # 服务名必须是 postgres(不是 postgresql): 主机上由 Ansible 渲染的
  # /etc/xcontrol/web-saas/config/stunnel-server.conf 里写死了
  # `connect = postgres:5432`, compose 服务名就是容器内的 DNS 名。
  postgres:
    image: ${POSTGRESQL_IMAGE:?set in .env.<env>}
    container_name: web-saas-postgresql
    restart: unless-stopped
    env_file:
      - /etc/xcontrol/web-saas/secrets.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - /etc/xcontrol/web-saas/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - postgres_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ── stunnel-server ──────────────────────────────────────────────────────────
  # 为跨主机访问本域 PostgreSQL 提供 TLS 隧道入口（即 postgresql-saas.onwalk.net）。
  # 监听公网端口 5433，接收来自其他主机 stunnel-client 的加密连接。
  stunnel-server:
    image: ${STUNNEL_SERVER_IMAGE:?set in .env.<env>}
    container_name: web-saas-stunnel-server
    user: root
    restart: unless-stopped
    # 15432 而非 5433: 端口由 Ansible 渲染进 stunnel-server.conf
    # (accept = 0.0.0.0:15432), compose 只负责把它暴露出去 —— 两处写不
    # 一致时容器会正常启动、健康检查也过(stunnel 进程确实在跑), 只是
    # 没有人能连上它。
    ports:
      - "15432:15432"
    volumes:
      - /etc/xcontrol/web-saas/config/stunnel-server.conf:/etc/stunnel/stunnel.conf:ro
      - /etc/xcontrol/web-saas/certs/server-cert.pem:/etc/stunnel/certs/server-cert.pem:ro
      - /etc/xcontrol/web-saas/certs/server-key.pem:/etc/stunnel/certs/server-key.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "pidof stunnel > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web_saas_network
      - postgres_net
    depends_on:
      postgres:
        condition: service_healthy

  # ── stunnel-client ──────────────────────────────────────────────────────────
  # accounts/billing 服务通过此 stunnel-client 连接 PostgreSQL。
  # 监听 127.0.0.1:15432 对容器内可见，服务通过 container_name 解析。
  stunnel-client:
    image: ${STUNNEL_CLIENT_IMAGE:?set in .env.<env>}
    container_name: web-saas-stunnel-client
    restart: unless-stopped
    environment:
      # 三个值都必须与 Ansible 渲染的 stunnel-client.conf 一致 ——
      # accept=0.0.0.0:5432 / connect=stunnel-server:15432 /
      # [postgres-tls-server]。secrets.env 里的 DATABASE_URL 指向
      # stunnel-client:5432, 改这里的 accept 会让所有 DB 连接失效。
      STUNNEL_SERVICE: "postgres-tls-server"
      STUNNEL_ACCEPT: "5432"
      STUNNEL_CONNECT: "stunnel-server:15432"
      STUNNEL_CRONTAB: ""
    volumes:
      - /etc/xcontrol/web-saas/config/stunnel-client.conf:/etc/stunnel/stunnel.conf:ro
      - /etc/xcontrol/web-saas/certs/ca-cert.pem:/etc/stunnel/certs/ca-cert.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "pidof stunnel > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web_saas_network
    depends_on:
      stunnel-server:
        condition: service_healthy

  accounts:
    image: ${ACCOUNTS_IMAGE:?set in .env.<env>}
    container_name: web-saas-accounts
    restart: unless-stopped
    env_file:
      - /etc/xcontrol/web-saas/secrets.env
    environment:
      PORT: "18081"
    volumes:
      - /etc/xcontrol/web-saas/config/account.yaml:/etc/xcontrol/account.template.yaml:ro
    networks:
      - web_saas_network
    depends_on:
      stunnel-client:
        condition: service_healthy

  billing:
    image: ${BILLING_IMAGE:?set in .env.<env>}
    container_name: web-saas-billing
    restart: unless-stopped
    env_file:
      - /etc/xcontrol/web-saas/secrets.env
    environment:
      BILLING_SERVICE_LISTEN_ADDR: "0.0.0.0:8081"
    networks:
      - web_saas_network
    depends_on:
      stunnel-client:
        condition: service_healthy

  # console 镜像自带静态资源, 但 console 服务需要它们在一个共享卷里才能被
  # Caddy 直接提供。这个一次性容器负责把资源刷进卷, 每次部署都重跑一遍,
  # 否则换了镜像 tag 后静态资源还是上一版的。
  console-assets:
    image: ${CONSOLE_IMAGE:?set in .env.<env>}
    container_name: web-saas-console-assets
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        rm -rf /assets/_next /assets/chunks /assets/public
        mkdir -p /assets /assets/public
        cp -R /app/dashboard/static/. /assets/ || true
        cp -R /app/dashboard/public/. /assets/public || true
    volumes:
      - console_static:/assets

  console:
    image: ${CONSOLE_IMAGE:?set in .env.<env>}
    container_name: web-saas-console
    restart: unless-stopped
    env_file:
      - /etc/xcontrol/web-saas/secrets.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # console 镜像不再自带 RUNTIME_ENV —— 它曾经在 Dockerfile 里被写死成
      # prod, 于是任何来源的镜像启动即以生产身份运行、连生产认证服务。
      # 环境是部署时的事实, 由这里注入; 不传时应用会落到它自己的安全默认值
      # (dev), 而不是 prod。
      RUNTIME_ENV: ${DEPLOY_ENV:?set in .env.<env>}
    volumes:
      - console_static:/app/dashboard/.next/static:ro
    networks:
      - web_saas_network
    depends_on:
      console-assets:
        condition: service_completed_successfully

  caddy:
    image: ${CADDY_IMAGE:?set in .env.<env>}
    container_name: web-saas-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/xcontrol/web-saas/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web_saas_network
    depends_on:
      - accounts
      - billing
      - console

networks:
  # external: true —— 这个网络的生命周期由 Ansible(web_saas_host_config
  # 角色)管理, 在 compose 第一次 up 之前就已经存在, 且要跨多个域共享。
  #
  # 不加 external 时, Doco-CD 每次轮询部署都报:
  #   network docker_shared_network was found but has incorrect label
  #   com.docker.compose.network set to "" (expected: "web_saas_network")
  # 因为 compose 期望自己创建的网络带着标准标签
  # (com.docker.compose.network=web_saas_network), 而 Ansible 用裸
  # `docker network create` 建的网络没有任何 compose 标签。compose 拒绝
  # "接管"一个它不认识是自己创建的网络 —— 这不是权限问题, 是 compose
  # 故意的安全检查, 防止悄悄劫持别的项目在用的网络。
  #
  # 结果是 Doco-CD 陷入每 60s 重试一次的失败循环: doco-cd 容器本身
  # healthy, 但 web-saas 的四个服务从未启动 —— 从 docker ps 完全看不出来,
  # 必须看 doco-cd 自己的日志。
  web_saas_network:
    name: docker_shared_network
    external: true
  postgres_net:
    name: docker_web_saas_postgres_network
    driver: bridge
    external: true

volumes:
  postgresql_data:
  console_static:
  caddy_data:
  caddy_config:
