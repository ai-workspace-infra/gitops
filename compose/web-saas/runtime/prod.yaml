# Stable across prod-vN generations; values remain runtime-only in Vault.
internal_service_token:
  vault_path: kv/prod/accounts/runtime
  key: INTERNAL_SERVICE_TOKEN
business_database:
  role: account_user
  database: account
  host: postgres
  port: 5432
  sslmode: disable
  backend_rls_bypass: true
  credential:
    vault_path: kv/prod/databases
    key: account_pg_password
