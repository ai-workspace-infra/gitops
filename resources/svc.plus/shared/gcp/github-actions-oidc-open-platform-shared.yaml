apiVersion: gitops.svc.plus/v1alpha1
kind: GitHubActionsOIDCConfig
metadata:
  environment: shared
  provider: gcp
spec:
  gcp_account_id: open-platform-shared
  project_id: open-platform-shared-510113
  organization_id: "744119519286"
  provider_url: https://token.actions.githubusercontent.com
  # Stable custom audience; the bootstrap Terraform provider and the runtime
  # auth action both use this exact value. It does not require knowing the
  # target project's numeric ID in GitOps.
  audience: https://github.com/ai-workspace-infra/platform-ops-toolkit/open-platform-shared
  pool_id: github-actions
  provider_id: github
  service_account_id: github-actions-shared
  repository: ai-workspace-infra/platform-ops-toolkit
  subjects:
    - repo:ai-workspace-infra/platform-ops-toolkit:environment:prod
    - repo:ai-workspace-infra/platform-ops-toolkit:ref:refs/heads/main
  state:
    bucket: xworktech-platform-terraform-state
    key: platform-ops-toolkit/shared/open-platform-shared/gcp-oidc-bootstrap/terraform.tfstate
