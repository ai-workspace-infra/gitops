apiVersion: gitops.svc.plus/v1alpha1
kind: VaultServerDeployment
metadata:
  name: vault-server
  environment: shared
spec:
  service_domain: vault.svc.plus
  automation:
    github_environment: prod
    vault_addr: https://vault.svc.plus
    runtime_identity_path: kv/data/shared/platform/oidc/open-platform-shared
    monitoring_secret_path: kv/data/CICD/observability
    xconnect_secret_path: kv/data/CICD/shared/xconnect
    node_role: github-actions-platform-ops-toolkit-shared-vault-node-oidc-open-platform-shared
    monitoring_role: github-actions-platform-ops-toolkit-shared-vault-monitoring
    xconnect_role: github-actions-platform-ops-toolkit-shared-vault-xconnect
    raft_operator_role: github-actions-platform-ops-toolkit-shared-vault-raft-operator
  migration:
    source:
      id: vault-prod-0
      provider: gcp-cloud
      provider_manifest: resources/xworktech.com/shared/gcp/vault-shared.yaml
      address: 35.221.167.104
      node_role: github-actions-platform-ops-toolkit-shared-vault-node-oidc-open-platform-prod
      runtime_identity_path: kv/data/shared/platform/oidc/open-platform-prod
      ssh_port: 22
      ssh_host_ed25519: AAAAC3NzaC1lZDI1NTE5AAAAIJcLDgstNjy7TC47bdXfLPZkVr/aF3Ck7wjtAmSbX1ir
      overlay_address: 10.79.0.4
    # Raft uses the reviewed shared XConnect overlay while the source remains
    # the active leader during the staged cross-project cutover.
    raft_network: overlay
    overlay_interface: xconone0
    observation:
      hours: 24
  storage:
    backend: raft
    address_scope: private
    members: 1
    leader: vault-shared-0
    peers: []
  nodes:
    - id: vault-shared-0
      xconnect_role: gateway
  stages:
    - node-preflight
    - vault-shared-leader
    - vault-shared-peers
    - node-process-metrics
    - xconnect-gateway
    - xconnect-one
  access:
    bootstrap: bootstrap-public
    steady_state: xconnect-zero
    xconnect_topology: vpn-overlay/shared/xconnect-vault-shared.yaml
