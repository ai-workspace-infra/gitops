# Kubernetes PROD Web SaaS on Akamai Cloud/Linode Tokyo 3 (jp-tyo-3)
# User-selected 2 shared vCPU / 4 GB, Debian 13 (linode/debian13)
# Fresh cold-start state is isolated from the retained previous V6 state.
# New isolated V6 validation cluster; canonical production DNS is not promoted.
global:
  provider: akamai-cloud
  environment: prod
  project: svc.plus
  account: manbuzhe2026
  workspace: prod-k3s-v6-cold-20261031
  state_namespace: prod-k3s-v6-cold-20261031
  region: jp-tyo-3
  image: linode/debian13
  type: g6-standard-2
  name_prefix: ""
  user_data_file: cloud-init.yaml
  prevent_destroy: true

ssh_keys:
  - name: vault-platform-ops-deploy
    public: "ssh-rsa  shenlan@shenlandeMacBook-Air-2.local"
  - name: github-actions-cloud-neutral-toolkit
    public: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPrlas7Hf97Llzj0enKLhkezOkxP+fjQr/AwPzNSS25w github-actions@cloud-neutral-toolkit"

  - name: operator-macos-ed25519
    public: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGeMGuRKEGtIOTb9BsXMP2rD9Fpv9f3rrrABjOW7EV7s shenlan@HaitaodeMacBook-Pro.local"

hosts:
  - name: prod-k3s-v6
    region: jp-tyo-3
    type: g6-standard-2
    image: linode/debian13
    private_ip: true
    ansible_user: root
    groups: [web_saas, prod, debian, akamai_cloud, k3s_server, k3s]
    tags: [svc-plus, prod, prod-k3s-v6, akamai-cloud]
    # Independent PROD data volume; capacity is a planning candidate in provider GB.
    # Mount/format and Kubernetes storage routing belong to Playbooks, not IaC.
    volume:
      label: prod-k3s-v6-cold-20261031-data
      size: 100
      filesystem: ext4
    firewall:
      label: prod-k3s-v6-cold-20261031-fw
      # Temporary user-approved bootstrap access; replace with operator CIDRs.
      ssh_cidrs: ["0.0.0.0/0"]
      ssh_ipv6_cidrs: []
      allow_http: true
      allow_https: true
      # K3s API is private; no public 6443 listener.
      additional_tcp_ports: []
    host_vars:
      role: primary
      cloud_provider: akamai-cloud
      cloud_region: jp-tyo-3
      service_variant: k3s-v6
      target_generation: prod-v6
      deployment_mode: kubernetes
      k8s_cluster_name: PROD-K3S-V6
      k3s_platform_flux_namespace: flux-system
      k3s_platform_cluster_name: PROD-K3S-V6
      k3s_platform_node_name: prod-k3s-v6
      k3s_platform_k3s_version: v1.37.1+k3s1
      k3s_platform_flux_version: "2.9.6"
      k3s_platform_helm_version: v3.22.1
      k3s_platform_local_storage_path: /data/k3s/storage
      k3s_platform_require_data_mount: true
      k3s_platform_write_kubeconfig_mode: "0600"
      k3s_platform_flux_bootstrap_mode: declarative_active
      k3s_platform_git_url: https://github.com/ai-workspace-infra/gitops.git
      k3s_platform_flux_source_name: config-prod
      k3s_platform_flux_root_name: prod-k3s
      k3s_platform_flux_root_path: ./environments/clusters/prod-k3s-v6
      # Identity verification waits until this Flux-owned RBAC graph has
      # reconciled the GitOps commit selected for the bootstrap run.
      # Credentials are generated on the master and delivered to OS users.
      # The API endpoint is node-local; remote use requires a separate endpoint.
      k3s_identity_environment: prod
      k3s_identity_vault_writer_role: github-actions-platform-ops-toolkit-prod-k3s-v6-identity-writer
      k3s_platform_acceptance_objects:
        - {kind: gitrepositories, namespace: flux-system, name: config-prod}
        - {kind: gitrepositories, namespace: flux-system, name: vault-prod-config}
        - {kind: gitrepositories, namespace: flux-system, name: postgresql-prod-config}
        - {kind: gitrepositories, namespace: flux-system, name: observability-prod-config}
        - {kind: gitrepositories, namespace: flux-system, name: web-saas-prod-config}
        - {kind: gitrepositories, namespace: flux-system, name: ingress-prod-config}
        - {kind: kustomizations, namespace: flux-system, name: external-secrets}
        - {kind: kustomizations, namespace: flux-system, name: vault-tls-bootstrap}
        - {kind: kustomizations, namespace: flux-system, name: vault-prod}
        - {kind: kustomizations, namespace: flux-system, name: postgresql-prod}
        - {kind: kustomizations, namespace: flux-system, name: observability-prod}
        - {kind: kustomizations, namespace: flux-system, name: web-saas-prod}
        - {kind: kustomizations, namespace: flux-system, name: ingress-prod}
        - {kind: helmreleases, namespace: vault-prod, name: vault}
        - {kind: helmreleases, namespace: external-secrets, name: external-secrets}
        - {kind: helmreleases, namespace: postgresql-prod, name: postgresql}
        - {kind: helmreleases, namespace: observability-prod, name: observability}
        - {kind: helmreleases, namespace: observability-prod, name: observability-agent}
        - {kind: helmreleases, namespace: observability-prod, name: datakit}
        - {kind: helmreleases, namespace: web-saas-prod, name: web-saas-prod}
        - {kind: helmreleases, namespace: ingress-prod, name: caddy-ingress}
      k3s_identity_cluster: prod-k3s-v6
      k3s_identity_api_server: https://127.0.0.1:6443
      k3s_identity_tls_dir: /opt/rancher/k3s/server/tls
      k3s_identity_checks:
        root:
          - {verb: get, resource: nodes, namespace: flux-system, allowed: true}
          - {verb: impersonate, resource: users, namespace: flux-system, allowed: false}
        operator:
          - {verb: update, resource: deployments/scale, namespace: web-saas-prod, allowed: true}
          - {verb: get, resource: secrets, namespace: web-saas-prod, allowed: false}
        auditor:
          - {verb: get, resource: nodes, namespace: web-saas-prod, allowed: true}
          - {verb: get, resource: secrets, namespace: web-saas-prod, allowed: false}
      k3s_identity_rbac_kustomizations:
        - name: cluster-identities
          namespace: flux-system
      service_domains:
        - console-selfhost-prod-v6.svc.plus
        - accounts-selfhost-prod-v6.svc.plus
        - billing-selfhost-prod-v6.svc.plus
        - postgresql-selfhost-prod-v6.svc.plus
        - vault-selfhost-prod-v6.svc.plus
        - observability-k3s-v6.svc.plus
      # Canonical alias targets consumed by the dedicated IaC/provider owner.
      # Bootstrap does not independently perform public DNS cutover.
      reserved_dns_aliases: {}
      public_dns_cutover: false
