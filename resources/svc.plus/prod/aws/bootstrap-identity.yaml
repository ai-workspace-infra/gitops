# Non-secret AWS production bootstrap declaration for iac_modules.
account_name: prod
account_id: "950604983695"
region: ap-northeast-1
environment: prod

github_actions_oidc:
  config_path: github-actions-oidc.json

# Adopt the pre-created GitHub OIDC integration only; do not create legacy
# Terraform AK/SK identities during that adoption.
iam:
  create_role: false
  create_user: false
  role_name: GithubAction_IAC_Deploy_Role
  terraform_user_name: terraform-bootstrap-prod

# Non-secret state key. Backend endpoint and credentials are injected at runtime
# from Vault kv/data/CICD/prod/iac_state.
terraform_state:
  key: platform-ops-toolkit/prod/aws-cloud/bootstrap/identity/terraform.tfstate
