apiVersion: gitops.svc.plus/v1alpha1
kind: GCPWorkloadNamespace
metadata:
  name: web-saas
  environment: prod
  provider: gcp
spec:
  gcp_account_id: xworktech
  bootstrap_project_id: crypto-will-508602-m0
  project_id: open-platform-prod
  state_project: svc.plus
  organization_id: "744119519286"
  region: asia-east1
  workspace: web-saas
  state_namespace: web-saas
  network_name: web-saas-prod-gcp
  # Reserved for this namespace. Check live VPC overlap before apply.
  subnet_cidr: 10.74.0.0/24
  enable_cloud_nat: false
  spot_ssh_source_ranges: [0.0.0.0/0]
  spot_network_tags: [web-saas-ssh]
  ssh_username: github-actions
  state:
    key: terraform/prod/svc.plus/gcp-cloud/xworktech/web-saas/terraform.tfstate
  resource:
    name: web-saas-prod
    type: workload_namespace
    lifecycle: persistent
  resources:
    service_vms:
      - name: web-saas-prod
        zone: asia-east1-a
        machine_type: e2-medium
        provisioning_model: STANDARD
        deletion_protection: true
        enable_oslogin: true
        image: projects/debian-cloud/global/images/family/debian-12
        public_ip: true
        network_tags: [web-saas-ssh]
        inventory_groups: [web_saas]
        data_disk:
          name: web-saas-prod-data
          size_gb: 100
          type: pd-balanced
          device_name: web-saas-data
          mount_path: /data
        labels:
          owner: platform-ops-toolkit
          workload: web-saas
          lifecycle: persistent
