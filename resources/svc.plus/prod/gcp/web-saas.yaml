# Canonical PROD Selfhost declaration consumed by selfhost-orchestrator.yml.
# Runtime addresses and database credentials are resolved by IaC and Vault.
apiVersion: gitops.svc.plus/v1alpha1
kind: GCPWorkloadNamespace
metadata:
  name: web-saas
  environment: prod
  provider: gcp
spec:
  gcp_account_id: xworktech
  bootstrap_project_id: crypto-will-508602-m0
  project_id: open-platform-prod
  organization_id: "744119519286"
  region: asia-east1
  workspace: web-saas
  state_namespace: web-saas
  state_project: svc.plus
  state:
    key: terraform/prod/svc.plus/gcp-cloud/xworktech/web-saas/terraform.tfstate
  network_name: web-saas-prod-gcp
  subnet_cidr: 10.73.0.0/24
  enable_cloud_nat: false
  enable_oslogin: true
  # This namespace owns the initially empty project's VM external-IP policy.
  external_ip_allowed_instances:
    - name: web-saas-prod
      zone: asia-east1-a
  spot_ssh_source_ranges: [0.0.0.0/0]
  spot_network_tags: [web-saas-ssh]
  ssh_username: github-actions
  resource:
    name: web-saas-prod
    type: workload_namespace
    lifecycle: persistent
  resources:
    service_vms:
      - name: web-saas-prod
        zone: asia-east1-a
        machine_type: e2-medium
        image: projects/debian-cloud/global/images/family/debian-12
        provisioning_model: STANDARD
        deletion_protection: true
        enable_oslogin: true
        public_ip: true
        network_tags: [web-saas-ssh]
        public_tcp_ports: [80, 443]
        inventory_groups: [web_saas]
        tags: [web-saas, prod, database]
        data_disk:
          name: web-saas-prod-data
          device_name: web-saas-prod-data
          size_gb: 50
          type: pd-balanced
          mount_path: /data
        labels:
          owner: platform-ops-toolkit
          workload: web-saas
          environment: prod
          lifecycle: persistent
