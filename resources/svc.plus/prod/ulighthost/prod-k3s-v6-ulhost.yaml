# Kubernetes PROD Web SaaS — same-generation host swap candidate (ULightHost, Hong Kong)
#
# The node keeps the canonical hostname prod-k3s-v6: after the swap it IS the
# production node. The file name carries the provider boundary so both the
# current Akamai node and this candidate can be recorded during the transition.
#
# Owner: Playbooks + GitOps. This declaration is INERT until a bootstrap run
# selects this host: nothing in the live prod-k3s-v6 cluster consumes this path.
# Facts below come from cloud-init instance-data.json and read-only host
# preflight on 2026-11-16; anything marked PENDING still needs an owner answer
# before P3 (bootstrap) may run.
#
# PENDING owner actions:
#   1. Vault: create the writer role/policy for
#      github-actions-platform-ops-toolkit-prod-k3s-v6-hk-identity-writer and the
#      bootstrap reader for kv/data/prod/platform/prod-k3s-v6-hk/ssh.
#   2. Vault: record OS key material under kv/prod/security/{root,operator,auditor}
#      for this host (shared keys are fine; the path is environment-level).
#   3. Inventory: publish the ULightHost facts to
#      inventory/prod/svc.plus/ulighthost/ucloud-ulighthost/prod-k3s-v6-hk.json.
#   4. Approve the target-only Flux entrypoint (see the migration plan §5/P2):
#      the live cluster consumes environments/clusters/prod-k3s-v6, so the
#      candidate must NOT be driven through that same path.

global:
  provider: ulighthost
  environment: prod
  project: svc.plus
  account: ucloud-ulighthost
  workspace: prod-k3s-v6-ulhost
  management_mode: existing
  provisioner: ansible
  lifecycle: external
  inventory_backend: s3
  inventory_key: inventory/prod/svc.plus/ulighthost/ucloud-ulighthost/prod-k3s-v6-ulhost.json
  vault_path: kv/data/prod/ulighthost/prod-k3s-v6-ulhost

# Existing ULightHost boundary: this node is created and owned outside Terraform.
# Do not add a terraform tree, state key, or provider-side resource creation here.
hosts:
  - name: prod-k3s-v6
    logical_region: hk
    provider_region: hk-02
    resource_ref: cmdb://nodes/prod-k3s-v6#ulighthost
    instance_id: ulhost-1xqu78soic3q
    public_ipv4: 103.14.33.60
    private_ipv4: 10.7.109.8
    machine_id: c500382886913147ee2a250d0c7930ee
    os_image: Rocky Linux 10.1 (Red Quartz)
    role: standalone
    groups: [web_saas, prod, rocky, ulighthost, k3s_server, k3s]
    tags: [svc-plus, prod, prod-k3s-v6, ulighthost, rocky10]
    host_vars:
      role: primary
      cloud_provider: ulighthost
      cloud_region: hk
      service_variant: k3s-v6
      target_generation: prod-v6
      deployment_mode: kubernetes
      k8s_cluster_name: PROD-K3S-V6
      k3s_platform_cluster_name: PROD-K3S-V6
      k3s_platform_node_name: prod-k3s-v6
      k3s_platform_k3s_version: v1.37.1+k3s1
      # New, non-overlapping networks: the source cluster owns 10.52.0.0/16 and
      # 10.53.0.0/16 while the swap keeps both hosts online.
      k3s_platform_cluster_cidr: 10.54.0.0/16
      k3s_platform_service_cidr: 10.55.0.0/16
      k3s_platform_cluster_dns: 10.55.0.10
      k3s_platform_disable_components:
        - traefik
      k3s_platform_flux_version: '2.9.6'
      k3s_platform_helm_version: v3.22.1
      k3s_platform_local_storage_path: /data/k3s/storage
      # Approved deviation: /data is a root-owned directory on the system disk;
      # there is no independent ULightHost data volume for this host.
      k3s_platform_data_mode: directory
      k3s_platform_require_data_mount: false
      k3s_platform_write_kubeconfig_mode: '0600'
      k3s_platform_flux_bootstrap_mode: declarative_active
      k3s_platform_git_url: https://github.com/ai-workspace-infra/gitops.git
      k3s_platform_flux_source_name: config-prod
      k3s_platform_flux_root_name: prod-k3s
      k3s_platform_flux_root_path: ./environments/clusters/prod-k3s-v6-ulhost
      k3s_identity_environment: prod
      # The node hostname is prod-k3s-v6, but the credential namespace stays
      # distinct so the current node's Vault keys survive for rollback.
      k3s_identity_cluster: prod-k3s-v6-ulhost
      k3s_identity_api_server: https://127.0.0.1:6443
      k3s_identity_tls_dir: /opt/rancher/k3s/server/tls
      k3s_identity_vault_writer_role: github-actions-platform-ops-toolkit-prod-k3s-v6-ulhost-identity-writer
      k3s_platform_vault_bootstrap_reader_role: github-actions-platform-ops-toolkit-prod-k3s-v6-ulhost-bootstrap-reader
      k3s_platform_vault_ssh_key_path: kv/data/prod/platform/prod-k3s-v6-ulhost/ssh
      k3s_platform_vault_ssh_key_field: SSH_PRIVATE_KEY
      k3s_identity_checks:
        root:
          - {verb: get, resource: nodes, namespace: flux-system, allowed: true}
          - {verb: impersonate, resource: users, namespace: flux-system, allowed: true}
        operator:
          - {verb: get, resource: pods, namespace: web-saas-prod, allowed: true}
          - {verb: get, resource: events, namespace: web-saas-prod, allowed: true}
          - {verb: list, resource: replicasets.apps, namespace: web-saas-prod, allowed: true}
          - {verb: update, resource: deployments/scale, namespace: web-saas-prod, allowed: true}
          - {verb: get, resource: secrets, namespace: web-saas-prod, allowed: false}
          - {verb: get, resource: pods/log, namespace: web-saas-prod, allowed: false}
          - {verb: patch, resource: deployments.apps, namespace: web-saas-prod, allowed: false}
          - {verb: get, resource: pods, namespace: postgresql-prod, allowed: false}
        auditor:
          - {verb: get, resource: nodes, namespace: web-saas-prod, allowed: true}
          - {verb: get, resource: secrets, namespace: web-saas-prod, allowed: true}
      k3s_identity_rbac_kustomizations:
        - name: cluster-identities
          namespace: flux-system
      # Empty-environment acceptance: every unit except the local observability
      # stack. The stack is replaced by the central observability endpoint.
      k3s_platform_acceptance_objects:
        - {kind: gitrepositories, namespace: flux-system, name: config-prod}
        - {kind: kustomizations, namespace: flux-system, name: external-secrets}
        - {kind: kustomizations, namespace: flux-system, name: vault-tls-bootstrap}
        - {kind: kustomizations, namespace: flux-system, name: vault-prod}
        - {kind: kustomizations, namespace: flux-system, name: postgresql-prod}
        - {kind: kustomizations, namespace: flux-system, name: observability-prod}
        - {kind: kustomizations, namespace: flux-system, name: web-saas-prod}
        - {kind: kustomizations, namespace: flux-system, name: ingress-prod}
        - {kind: helmreleases, namespace: vault-prod, name: vault}
        - {kind: helmreleases, namespace: external-secrets, name: external-secrets}
        - {kind: helmreleases, namespace: postgresql-prod, name: postgresql}
        - {kind: helmreleases, namespace: observability-prod, name: observability-agent}
        - {kind: helmreleases, namespace: observability-prod, name: datakit}
        - {kind: helmreleases, namespace: web-saas-prod, name: web-saas-prod}
        - {kind: helmreleases, namespace: ingress-prod, name: traefik-ingress}
      service_domains:
        - console-selfhost-prod-v6.svc.plus
        - accounts-selfhost-prod-v6.svc.plus
        - billing-selfhost-prod-v6.svc.plus
        - postgresql-selfhost-prod-v6.svc.plus
        - vault-selfhost-prod-v6.svc.plus
      # Canonical alias targets; the dedicated DNS owner performs the cutover.
      # Public DNS is NOT switched in this round.
      reserved_dns_aliases:
        console.svc.plus: console-selfhost-prod-v6.svc.plus
        accounts.svc.plus: accounts-selfhost-prod-v6.svc.plus
        billing.svc.plus: billing-selfhost-prod-v6.svc.plus
        postgresql.svc.plus: postgresql-selfhost-prod-v6.svc.plus
        vault.svc.plus: vault-selfhost-prod-v6.svc.plus
        xworktech.com: console-selfhost-prod-v6.svc.plus
      public_dns_cutover: false