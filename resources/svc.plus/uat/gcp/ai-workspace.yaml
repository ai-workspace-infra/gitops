# UAT hybrid matrix: GCP Spot, isolated from every other namespace.
apiVersion: gitops.svc.plus/v1alpha1
kind: GCPWorkloadNamespace
metadata:
  name: ai-workspace
  environment: uat
  provider: gcp
spec:
  gcp_account_id: xworktech
  bootstrap_project_id: crypto-will-508602-m0
  project_id: open-platform-uat
  organization_id: "744119519286"
  state_project: svc.plus
  region: asia-east1
  workspace: ai-workspace
  state_namespace: ai-workspace
  network_name: ai-workspace-uat-gcp
  subnet_cidr: 10.64.0.0/24
  enable_cloud_nat: false
  # Set to a narrower runner egress CIDR when a stable egress IP is available.
  spot_ssh_source_ranges: [0.0.0.0/0]
  spot_network_tags: [ai-workspace-ssh]
  ssh_username: github-actions
  state:
    key: terraform/uat/svc.plus/gcp-cloud/xworktech/ai-workspace/terraform.tfstate
  resource:
    name: ai-workspace-uat
    type: workload_namespace
    lifecycle: ephemeral
  resources:
    spot_vms:
      - name: ai-workspace-uat
        zone: asia-east1-a
        machine_type: e2-custom-4-8192
        image: projects/debian-cloud/global/images/family/debian-12
        enable_oslogin: true
        public_ip: true
        network_tags: [ai-workspace-ssh]
        inventory_groups: [ai_workspace]
        labels:
          owner: platform-ops-toolkit
          workload: ai-workspace
          capacity_type: spot
          lifecycle: ephemeral
