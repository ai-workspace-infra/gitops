# UAT hybrid matrix: AWS Agent Proxy JP in an isolated Terraform state.
# The account and state key are selected by the orchestrator; this declaration
# contains only non-sensitive resource facts.
global:
  provider: aws-cloud
  environment: uat
  project: svc.plus
  account: "081434641398"
  workspace: agent-proxy-jp
  state_namespace: agent-proxy-jp
  region: nrt
  aws_region: ap-northeast-1
  name_prefix: xconn-uat-aws
  user_data_file: cloud-init.yaml

ssh_keys:
  - name: ai-workspace-admin
    public: "ssh-rsa  shenlan@shenlandeMacBook-Air-2.local"

hosts:
  - name: jpn-tky
    os_name: "Debian 13 ARM64 (trixie)"
    plan: {{ env.get('AGENT_PROXY_PLAN_API', 't4g.small') }}
    billing_mode: on_demand
    elastic_ip: true
    deletion_protection: false
    backups: false
    enable_ipv6: true
    # Debian AMIs refuse root SSH ("Please login as the user admin"); the
    # deploy jobs log in as admin and use sudo.
    ansible_user: admin
    groups: [xconnect, agent_proxy, uat, aws_cloud]
    tags: [svc-plus, uat, xconnect, logical-jpn-tky, provider-ap-northeast-1]
    cloud_provider: aws-cloud
    cloud_region: ap-northeast-1
    location: jp
    node_label: agent-proxy-jp
    host_vars:
      role: xconnect
      logical_region: jpn-tky
      provider_region: ap-northeast-1
      service_domains:
        - jp-xconnect.svc.plus
