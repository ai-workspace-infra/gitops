global:
  provider: akamai-cloud
  environment: uat
  project: svc.plus
  account: manbuzhe2026
  workspace: ai-workspace
  region: us-east
  image: linode/debian12
  # UAT AI Workspace target: 2C8G.
  type: g6-highmem-2
  name_prefix: ai-workspace-uat-ak
  user_data_file: cloud-init.yaml

ssh_keys:
  - name: github-actions-cloud-neutral-toolkit
    public: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPrlas7Hf97Llzj0enKLhkezOkxP+fjQr/AwPzNSS25w github-actions@cloud-neutral-toolkit"

hosts:
  - name: node
    type: g6-highmem-2
    image: linode/debian12
    private_ip: true
    backups_enabled: false
    ansible_user: root
    groups: [ai_workspace, debian, akamai_cloud]
    tags: [svc-plus, uat, ai-workspace, akamai-cloud, 2c8g]
    firewall:
      # Explicitly authorized UAT bootstrap default. Restrict this before
      # exposing a service or promoting the workspace to production.
      ssh_cidrs: ["0.0.0.0/0"]
      ssh_ipv6_cidrs: ["::/0"]
      allow_http: false
      allow_https: false
    host_vars:
      role: primary
      cloud_provider: akamai-cloud
      service_domains: []
