# Kubernetes UAT Web SaaS on Akamai Cloud/Linode Tokyo 3 (jp-tyo-3)
# 2 vCPU / 4 GB, Debian 13 (linode/debian13)
# Isolated state namespace: web-saas-k3s-v5
# Existing V5 host, business data, and DNS remain unchanged.
global:
  provider: akamai-cloud
  environment: uat
  project: svc.plus
  account: manbuzhe2026
  workspace: web-saas-k3s-v5
  state_namespace: web-saas-k3s-v5
  region: jp-tyo-3
  image: linode/debian13
  type: g6-standard-2
  name_prefix: ""
  user_data_file: cloud-init.yaml
  prevent_destroy: true

ssh_keys:
  - name: vault-platform-ops-deploy
    public: "ssh-rsa  shenlan@shenlandeMacBook-Air-2.local"
  - name: github-actions-cloud-neutral-toolkit
    public: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPrlas7Hf97Llzj0enKLhkezOkxP+fjQr/AwPzNSS25w github-actions@cloud-neutral-toolkit"

hosts:
  - name: web-saas-k3s-v5
    region: jp-tyo-3
    type: g6-standard-2
    image: linode/debian13
    private_ip: true
    ansible_user: root
    groups: [web_saas, uat, debian, akamai_cloud, k3s_server]
    tags: [svc-plus, uat, web-saas-k3s-v5, akamai-cloud]
    firewall:
      ssh_cidrs: ["0.0.0.0/0"]
      ssh_ipv6_cidrs: ["::/0"]
      allow_http: true
      allow_https: true
      additional_tcp_ports: [6443]
    host_vars:
      role: primary
      cloud_provider: akamai-cloud
      cloud_region: jp-tyo-3
      service_variant: k3s-v5
      deployment_mode: kubernetes
      k8s_cluster_name: web-saas-k3s-v5
      k8s_namespace: web-saas-k3s-v5
      service_domains:
        - console-k3s-v5.svc.plus
        - accounts-k3s-v5.svc.plus
        - billing-k3s-v5.svc.plus
        - content-k3s-v5.svc.plus
        - gateway-k3s-v5.svc.plus
        - postgresql-k3s-v5.svc.plus
        - k3s-v5.svc.plus
      public_dns_cutover: false
