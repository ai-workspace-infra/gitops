# UAT SG Agent Proxy is an independent Terraform namespace/state.
global:
  provider: akamai-cloud
  environment: uat
  project: svc.plus
  account: manbuzhe2026
  workspace: agent-proxy-sg
  region: sg-sin-2
  image: linode/debian12
  type: g6-standard-1
  name_prefix: ap-uat-ak-sg
  user_data_file: cloud-init.yaml

ssh_keys:
  - name: github-actions-cloud-neutral-toolkit
    public: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPrlas7Hf97Llzj0enKLhkezOkxP+fjQr/AwPzNSS25w github-actions@cloud-neutral-toolkit"

hosts:
  - name: sg
    type: g6-standard-1
    image: linode/debian12
    region: sg-sin-2
    private_ip: true
    ansible_user: root
    groups: [xconnect, agent_proxy, uat, akamai_cloud]
    tags: [svc-plus, uat, xconnect, logical-sg, provider-sg-sin-2]
    firewall:
      ssh_cidrs: ["0.0.0.0/0"]
      ssh_ipv6_cidrs: ["::/0"]
      allow_http: false
      allow_https: false
    host_vars:
      role: xconnect
      logical_region: sg
      provider_region: sg-sin-2
      service_domains: [sg-xconnect.svc.plus]
