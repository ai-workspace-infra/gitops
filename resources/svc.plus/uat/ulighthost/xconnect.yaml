global:
  provider: ulighthost
  environment: uat
  project: svc.plus
  account: ucloud-ulighthost
  workspace: xconnect
  management_mode: existing
  provisioner: ansible
  lifecycle: external
  inventory_backend: s3
  inventory_key: inventory/uat/svc.plus/ulighthost/ucloud-ulighthost/xconnect.json
  vault_path: kv/data/uat/ulighthost-xconnect

# Taiwan and Philippines reuse the existing Ulighthost nodes. This declaration
# records ownership and connection facts only; it must never trigger Terraform
# apply, destroy, or provider-side resource creation.
hosts:
  - name: tw-01
    logical_region: tw
    provider_region: tw
    inventory_host: tw-xconnect.svc.plus
    resource_ref: cmdb://nodes/tw-xconnect.svc.plus
    vault_key: tw-01
    role: standalone
    groups: [xconnect, uat, ulighthost]
    service_domains: [tw-xconnect.svc.plus]

  - name: ph-01
    logical_region: ph
    provider_region: ph-mnl
    inventory_host: ph-xconnect.svc.plus
    resource_ref: cmdb://nodes/ph-xconnect.svc.plus
    vault_key: ph-surfercloud-01
    role: standalone
    # UAT's stable PH node is the shared Agent Proxy + XConnect Gateway host.
    # The two runtimes keep separate processes and state; only Caddy :443 is
    # shared and routes /split and /xconnect independently.
    groups: [xconnect, agent_proxy, uat, ulighthost]
    host_vars:
      xconnect_gateway_caddy_enabled: true
      xconnect_gateway_caddy_path: /xconnect
      xconnect_gateway_caddy_socket: /run/xconnect-gateway/xray.sock
    service_domains: [ph-xconnect.svc.plus]
