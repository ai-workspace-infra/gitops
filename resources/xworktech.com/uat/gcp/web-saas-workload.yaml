# Declaration-only namespace contract for the UAT GCP workload set.
apiVersion: gitops.svc.plus/v1alpha1
kind: GCPWorkloadNamespace
metadata:
  name: web-saas
  environment: uat
  provider: gcp
spec:
  gcp_account_id: xworktech
  project_id: xwork-open-platform-uat
  organization_id: "744119519286"
  region: asia-east1
  workspace: web-saas
  state_namespace: web-saas
  state:
    key: terraform/uat/xwork-open-platform-uat/gcp-cloud/xworktech/web-saas/terraform.tfstate
  resource:
    name: web-saas-uat
    type: workload_namespace
    lifecycle: ephemeral
