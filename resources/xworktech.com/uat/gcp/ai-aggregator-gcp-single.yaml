# GCP UAT all-in-one resource contract for the AI Aggregator profile.
# The platform workflow renders this file with the GCP Terraform standard,
# creates one Spot VM, and destroys it after the selected UAT operation.
global:
  environment: uat
  bootstrap_project_id: crypto-will-508602-m0
  project_id: open-platform-uat
  project_name: XWork Open Platform UAT - AI Aggregator
  organization_id: "744119519286"
  region: asia-east1
  network_name: open-platform-uat
  subnet_cidr: 10.60.0.0/20
  enable_cloud_nat: true
  spot_ssh_source_ranges:
    - 35.79.83.48/32
  spot_network_tags:
    - ai-aggregator-gcp-spot
  ssh_username: github-actions

spot_vms:
  - name: ai-aggregator-gcp-single-01
    zone: asia-east1-a
    machine_type: e2-standard-4
    public_ip: true
    network_tags:
      - ai-aggregator-gcp-spot
    inventory_groups:
      - ai_aggregator_gateway
      - ai_aggregator_cpa
    max_run_duration_seconds: 3600
