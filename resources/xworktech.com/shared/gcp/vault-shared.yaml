apiVersion: gitops.svc.plus/v1alpha1
kind: GCPWorkloadNamespace
metadata:
  name: vault-shared
  environment: shared
  provider: gcp
spec:
  gcp_account_id: open-platform-prod
  project_id: open-platform-prod
  project_name: Shared Vault and Observability
  organization_id: "744119519286"
  region: asia-east1
  workspace: vault-shared
  state_namespace: vault-shared
  network_name: vault-shared
  subnet_cidr: 10.81.0.0/20
  enable_cloud_nat: false
  enable_iap_ssh: false
  enable_oslogin: true
  ssh_access_mode: bootstrap-public
  ssh_source_ranges:
    - 35.79.83.48/32
    # Remove this public /32 only after the shared XConnect network, Mac One,
    # node overlay IPs, internal DNS, and SSH policy have been verified.
  state:
    key: terraform/shared/open-platform-prod/gcp-cloud/open-platform-prod/vault-shared/terraform.tfstate
  resource:
    name: vault-shared
    type: workload_namespace
    lifecycle: persistent
  resources:
    vault_nodes:
      - name: vault-prod-0
        zone: asia-east1-a
        ssh_host_ed25519: AAAAC3NzaC1lZDI1NTE5AAAAIJcLDgstNjy7TC47bdXfLPZkVr/aF3Ck7wjtAmSbX1ir
        machine_type: e2-highcpu-2
        image: projects/debian-cloud/global/images/family/debian-12
        xconnect_role: gateway
        public_ip: true
      - name: vault-prod-1
        zone: asia-east1-b
        ssh_host_ed25519: AAAAC3NzaC1lZDI1NTE5AAAAICrc2apTWLq2GL6g4W/SX6mxiz8jPTKLDU2NBeYeiCnn
        machine_type: e2-highcpu-2
        image: projects/debian-cloud/global/images/family/debian-12
        xconnect_role: one
        public_ip: true
      - name: vault-prod-2
        zone: asia-east1-c
        ssh_host_ed25519: AAAAC3NzaC1lZDI1NTE5AAAAIIyBYb/UtFNOuWjBxpp8TK6FRXihiJ+y4b1JRnpZteYO
        machine_type: e2-highcpu-2
        image: projects/debian-cloud/global/images/family/debian-12
        xconnect_role: one
        public_ip: true
