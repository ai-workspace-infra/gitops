global:
  environment: uat
  bootstrap_project_id: crypto-will-508602-m0
  # UAT compute is isolated in open-platform-uat. It may join the production
  # Vault cluster over XConnect, but it must never be colocated in the PROD
  # project or use the protected vault-prod-0 host.
  project_id: open-platform-uat
  project_name: XWork Open Platform UAT
  organization_id: "744119519286"
  region: asia-east1
  github_owner: ai-workspace-infra
  github_repository: platform-ops-toolkit
  network_name: open-platform-uat
  subnet_cidr: 10.60.0.0/20
  artifact_registry_location: asia-east1
  artifact_registry_id: xwork-services
  cloud_run_service_name: open-platform-uat
  cloud_run_image: us-docker.pkg.dev/cloudrun/container/hello
  vault_machine_type: e2-medium
  vault_image: projects/debian-cloud/global/images/family/debian-12
  # The UAT public-SSH CIDR is an explicit deployment input. Narrow this to
  # the runner egress /32 when a stable egress address is available.
  ssh_source_ranges: [0.0.0.0/0]
  # This policy is owned by the open-platform state and is the single
  # allowlist consumed by all UAT public-IP VM namespaces.
  external_ip_allowed_instances:
    - name: open-platform-uat
      zone: asia-east1-a
    - name: web-saas-uat
      zone: asia-east1-a
    - name: ai-workspace-uat
      zone: asia-east1-a
    - name: agent-proxy-us-uat
      zone: us-central1-a

vault_nodes:
  - name: open-platform-uat
    zone: asia-east1-a
    machine_type: e2-medium
    public_ip: true
