apiVersion: gitops.svc.plus/v1alpha1
kind: GCPWorkloadNamespace
metadata:
  name: web-saas
  environment: uat
  provider: gcp
spec:
  gcp_account_id: xworktech
  bootstrap_project_id: crypto-will-508602-m0
  project_id: open-platform-uat
  organization_id: "744119519286"
  region: asia-east1
  workspace: web-saas
  state_namespace: web-saas
  network_name: web-saas-uat-gcp
  subnet_cidr: 10.63.0.0/24
  enable_cloud_nat: false
  # See open-platform.yaml for the project-level external-IP allowlist.
  spot_ssh_source_ranges: [0.0.0.0/0]
  spot_network_tags: [web-saas-ssh]
  ssh_username: github-actions
  state:
    key: terraform/uat/open-platform-uat/gcp-cloud/xworktech/web-saas/terraform.tfstate
  resource:
    name: web-saas-uat
    type: workload_namespace
    lifecycle: ephemeral
  resources:
    # Retained backup storage is separate from the Spot VM's system disk.
    # IaC must show only creation/attachment before this is applied.
    persistent_data_disks:
      - name: web-saas-uat-upgrade-data
        instance: web-saas-uat
        zone: asia-east1-a
        size_gb: 50
        type: pd-balanced
        device_name: web-saas-uat-upgrade-data
        mount_path: /data
    spot_vms:
      - name: web-saas-uat
        zone: asia-east1-a
        machine_type: e2-medium
        # The project enforces requireOsLogin; deploy jobs log in through OS Login.
        enable_oslogin: true
        image: projects/debian-cloud/global/images/family/debian-12
        enable_oslogin: true
        public_ip: true
        network_tags: [web-saas-ssh]
        # Caddy terminates the declared public Web SaaS HTTPS endpoints.
        public_tcp_ports: [80, 443]
        inventory_groups: [web_saas]
        host_vars:
          web_saas_data_device_path: /dev/disk/by-id/google-web-saas-data
        labels:
          owner: platform-ops-toolkit
          workload: web-saas
          lifecycle: ephemeral
    persistent_data_disks:
      - name: web-saas-uat-data
        zone: asia-east1-a
        size_gb: 100
        type: pd-balanced
        instance: web-saas-uat
        device_name: web-saas-data
        mount_path: /data
