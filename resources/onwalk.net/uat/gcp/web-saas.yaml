# Desired UAT lifecycle; apply requires a reviewed plan with no disk deletion/replacement.
# Preserve existing VM identity, state key and independently managed retained disks.
apiVersion: gitops.svc.plus/v1alpha1
kind: GCPWorkloadNamespace
metadata:
  name: web-saas
  environment: uat
  provider: gcp
spec:
  gcp_account_id: xworktech
  bootstrap_project_id: crypto-will-508602-m0
  project_id: open-platform-uat
  organization_id: '744119519286'
  region: asia-east1
  workspace: web-saas
  state_namespace: web-saas
  network_name: web-saas-uat-gcp
  subnet_cidr: 10.63.0.0/24
  enable_cloud_nat: false
  spot_ssh_source_ranges:
  - 0.0.0.0/0
  spot_network_tags:
  - web-saas-ssh
  ssh_username: github-actions
  state:
    key: terraform/uat/open-platform-uat/gcp-cloud/xworktech/web-saas/terraform.tfstate
  resource:
    name: web-saas-uat
    type: workload_namespace
    lifecycle: persistent
  imports:
  - to: module.network.google_compute_network.this
    id: projects/open-platform-uat/global/networks/web-saas-uat-gcp
  - to: module.network.google_compute_subnetwork.this
    id: projects/open-platform-uat/regions/asia-east1/subnetworks/web-saas-uat-gcp-subnet
  - to: module.spot_web_saas_uat.google_compute_instance.this
    id: projects/open-platform-uat/zones/asia-east1-a/instances/web-saas-uat
  - to: module.retained_data_disk_web_saas_uat_upgrade_data.google_compute_disk.this
    id: projects/open-platform-uat/zones/asia-east1-a/disks/web-saas-uat-upgrade-data
  - to: module.retained_data_disk_web_saas_uat_data.google_compute_disk.this
    id: projects/open-platform-uat/zones/asia-east1-a/disks/web-saas-uat-data
  - to: google_compute_attached_disk.retained_data_disk_web_saas_uat_upgrade_data
    id: projects/open-platform-uat/zones/asia-east1-a/instances/web-saas-uat/web-saas-uat-upgrade-data
  - to: google_compute_firewall.spot_ssh
    id: projects/open-platform-uat/global/firewalls/web-saas-uat-gcp-spot-ssh
  - to: google_compute_firewall.spot_public_tcp_web_saas_uat
    id: projects/open-platform-uat/global/firewalls/web-saas-uat-public-tcp
  resources:
    persistent_data_disks:
    - name: web-saas-uat-upgrade-data
      instance: web-saas-uat
      zone: asia-east1-a
      size_gb: 50
      type: pd-balanced
      device_name: web-saas-uat-upgrade-data
      mount_path: /data
    - name: web-saas-uat-data
      zone: asia-east1-a
      size_gb: 100
      type: pd-balanced
      instance: web-saas-uat
      device_name: web-saas-data
      mount_path: /data
    service_vms:
    - name: web-saas-uat
      zone: asia-east1-a
      machine_type: e2-medium
      enable_oslogin: true
      image: projects/debian-cloud/global/images/family/debian-12
      public_ip: true
      network_tags:
      - web-saas-ssh
      public_tcp_ports:
      - 80
      - 443
      inventory_groups:
      - web_saas
      host_vars:
        web_saas_data_device_path: /dev/disk/by-id/google-web-saas-data
      labels:
        owner: platform-ops-toolkit
        workload: web-saas
        lifecycle: persistent
      provisioning_model: STANDARD
      deletion_protection: true
