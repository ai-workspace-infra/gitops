apiVersion: gitops.svc.plus/v1alpha1
kind: GCPWorkloadNamespace
metadata:
  name: web-saas-prod-v2
  environment: prod
  provider: gcp
spec:
  gcp_account_id: xworktech
  bootstrap_project_id: crypto-will-508602-m0
  project_id: open-platform-prod
  organization_id: "744119519286"
  region: asia-east1
  workspace: web-saas-prod-v2
  state_namespace: web-saas-prod-v2
  state_project: prod-v2.svc.plus
  network_name: web-saas-prod-v2
  subnet_name: web-saas-prod-v2
  subnet_cidr: 10.74.0.0/24
  private_ip_google_access: false
  enable_cloud_nat: false
  enable_oslogin: true
  manage_external_ip_policy: false
  state:
    bucket: ai-workspace-tfstate
    endpoint: https://s3.us-east-1.amazonaws.com
    region: us-east-1
    key: terraform/prod/prod-v2.svc.plus/gcp-cloud/xworktech/web-saas-prod-v2/terraform.tfstate
  spot_ssh_source_ranges:
    - 54.199.179.163/32
    - 54.178.56.237/32
    - 35.235.240.0/20
  spot_ssh_firewall_name: web-saas-prod-v2-ssh
  spot_network_tags:
    - prod-v2
  ssh_username: github-actions
  resource:
    name: web-saas-prod-v2
    type: workload_namespace
    lifecycle: persistent
  resources:
    persistent_data_disks:
      - name: web-saas-prod-v2-data
        instance: web-saas-prod-v2
        zone: asia-east1-a
        size_gb: 100
        type: pd-balanced
        device_name: web-saas-prod-v2-data
        mount_path: /data
    service_vms:
      - name: web-saas-prod-v2
        zone: asia-east1-a
        machine_type: e2-medium
        image: projects/debian-cloud/global/images/debian-12-bookworm-v20261014
        provisioning_model: STANDARD
        deletion_protection: true
        enable_oslogin: true
        public_ip: true
        static_ip_name: web-saas-prod-v2-ip
        boot_disk_size_gb: 30
        boot_disk_auto_delete: true
        network_tags:
          - prod-v2
        public_tcp_ports:
          - 80
          - 443
        public_udp_ports:
          - 443
        public_firewall_name: web-saas-prod-v2-https
        private_tcp_ports:
          - 15433
        private_source_ranges:
          - 10.74.0.0/24
        private_firewall_name: web-saas-prod-v2-private-db
        inventory_groups:
          - control_plane
          - web_saas
          - prod_v2
        host_vars:
          node_id: control-plane
          role: control
          service_domains:
            - console-selfhost-prod-v2.svc.plus
        labels:
          environment: prod
          stack: prod-v2
          role: control
