apiVersion: gitops.svc.plus/v1alpha1
kind: GCPWorkloadNamespace
metadata:
  name: agent-proxy-jp-team
  environment: prod
  provider: gcp
spec:
  gcp_account_id: xworktech
  bootstrap_project_id: crypto-will-508602-m0
  project_id: open-platform-prod
  organization_id: "744119519286"
  state_project: prod-v2.svc.plus
  region: asia-northeast1
  workspace: agent-proxy-jp-team
  state_namespace: agent-proxy-jp-team
  network_name: web-saas-prod-v2
  subnet_name: agent-proxy-jp-team-subnet
  subnet_cidr: 10.75.0.0/24
  create_network: false
  enable_iap_ssh: false
  enable_cloud_nat: false
  enable_oslogin: true
  manage_external_ip_policy: false
  state:
    bucket: ai-workspace-tfstate
    endpoint: https://s3.us-east-1.amazonaws.com
    region: us-east-1
    key: terraform/prod/prod-v2.svc.plus/gcp-cloud/xworktech/agent-proxy-jp-team/terraform.tfstate
  spot_ssh_source_ranges:
    - 54.199.179.163/32
    - 54.178.56.237/32
    - 35.235.240.0/20
  spot_ssh_firewall_name: agent-proxy-jp-team-ssh
  spot_network_tags:
    - prod-v2-team
  ssh_username: github-actions
  resource:
    name: agent-proxy-jp-team
    type: workload_namespace
    lifecycle: persistent
  resources:
    service_vms:
      - name: agent-proxy-jp-team
        zone: asia-northeast1-a
        machine_type: n2-custom-2-2048
        image: projects/debian-cloud/global/images/family/debian-12
        provisioning_model: STANDARD
        deletion_protection: true
        require_data_disk: false
        enable_oslogin: true
        public_ip: true
        static_ip_name: agent-team-prod-v2-ip
        boot_disk_size_gb: 20
        boot_disk_auto_delete: true
        network_tags:
          - prod-v2-team
        public_tcp_ports:
          - 80
          - 443
          - 1443
        public_udp_ports:
          - 443
        inventory_groups:
          - edges
          - team
          - gcp_cloud
          - prod_v2
        pool: team
        arch: amd64
        resource_class: standard-n2-custom
        location: jp
        node_label: jp-team
        host_vars:
          node_id: jp-team
          role: edge
          pool: team
          arch: amd64
          resource_class: standard-n2-custom
          logical_region: jp
          provider_region: asia-northeast1
          service_domains:
            - agent-team-selfhost-prod-v2.svc.plus
        labels:
          environment: prod
          stack: prod-v2
          role: team
          pool: team
