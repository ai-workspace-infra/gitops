service:
  replicaCount: 2
  global:
    imagePullPolicy: IfNotPresent
    # Production consumes the current immutable Portal release tag.
    tag: daily-build-2026.10.06-r6
    env:
      APP_ENV: production
      ACCOUNTS_BASE_URL: https://accounts.svc.plus
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 768Mi
  pdb:
    minAvailable: 1
