service:
  nameOverride: console
  containerPort: 3000
  service:
    port: 80
  global:
    existingSecretName: console-env
    repository: ghcr.io/ai-workspace-services/console
    # Keep the selfhost/serverless Console on the immutable Portal release image.
    tag: daily-build-2026.10.06-r6
    env:
      PORT: "3000"
      SERVICE_NAME: console
      HEALTHCHECK_PATH: /
      DOCS_SERVICE_URL: https://docs.svc.plus
      NEXT_PUBLIC_DOCS_BASE_URL: https://docs.svc.plus
    external-service:
      - docs.svc.plus
      - xworkmate.svc.plus
      - openclaw-gateway.svc.plus
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 20
