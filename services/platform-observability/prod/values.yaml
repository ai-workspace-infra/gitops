victoriaMetrics:
  image:
    tag: v1.101.0@sha256:91d0456cc064e195869175074ced2a6849d72531613b320492698e5fe935d10a
victoriaLogs:
  image:
    tag: v1.52.0@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e
victoriaTraces:
  image:
    tag: v0.1.0@sha256:b3204fd598b023b4726f38689791c707803b9f34733822dd053f22d64721b3d2
otelCollector:
  image:
    tag: 0.114.0@sha256:37fa87091cfaaec7234a27e4e395a40c31c2bfaea97a349a4afef6d9e9681197
grafana:
  image:
    tag: 13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
  existingSecret: grafana-admin
  adminPasswordKey: password
  rootUrl: https://observability-k3s-v5.svc.plus/
  plugins:
  - victoriametrics-logs-datasource@0.33.1
  - marcusolsson-treemap-panel@2.1.1
  runtimeSecret: grafana-runtime
  unsignedPlugins:
  - aiworkspace-xconnectuserdiagnostics-app
  pluginArchives:
  - id: aiworkspace-xconnectuserdiagnostics-app
    version: 0.1.0
    url: https://github.com/ai-workspace-infra/observability/releases/download/xconnect-user-diagnostics-v0.1.0/aiworkspace-xconnectuserdiagnostics-app-0.1.0.zip
    sha256: e7486697858edf02929f57e068b2971ab23c2f183727d1c28004bfba4c42c2eb
  dashboardsConfigMap: platform-observability-dashboards
blackboxExporter:
  enabled: true
serviceAccountName: observability-collector
# External collector-identity is the sole RBAC owner for this target.
rbac:
  create: false
persistence:
  enabled: true
  size: 20Gi
  storageClass: local-path
telemetry:
  cluster: web-saas-k3s-v5
  environment: prod
  kubernetes:
    enabled: true
    metricGroups:
    - node
    - pod
    - volume
  extraScrapeConfigs:
  - job_name: caddy
    scrape_interval: 30s
    static_configs:
    - targets:
      - web-saas-caddy-metrics.web-saas-k3s-v5.svc:9180
      labels:
        cluster: web-saas-k3s-v5
        environment: prod
        service: web-saas-caddy
  - job_name: node-exporter
    scrape_interval: 15s
    kubernetes_sd_configs:
    - role: pod
      namespaces:
        names:
        - platform-observability
    relabel_configs:
    - source_labels:
      - __meta_kubernetes_pod_label_app_kubernetes_io_name
      regex: observability-agent
      action: keep
    - source_labels:
      - __meta_kubernetes_pod_label_app_kubernetes_io_instance
      regex: platform-observability-agent
      action: keep
    - source_labels:
      - __meta_kubernetes_pod_container_port_name
      regex: metrics
      action: keep
    - source_labels:
      - __meta_kubernetes_pod_phase
      regex: Running
      action: keep
    - source_labels:
      - __meta_kubernetes_pod_node_name
      target_label: node
    - source_labels:
      - __meta_kubernetes_pod_node_name
      target_label: instance
    - target_label: cluster
      replacement: web-saas-k3s-v5
    - target_label: environment
      replacement: prod
    metric_relabel_configs:
    - source_labels:
      - node
      target_label: nodename
  - job_name: process-exporter
    scrape_interval: 15s
    kubernetes_sd_configs:
    - role: pod
      namespaces:
        names:
        - platform-observability
    relabel_configs:
    - source_labels:
      - __meta_kubernetes_pod_label_app_kubernetes_io_name
      regex: process-exporter
      action: keep
    - source_labels:
      - __meta_kubernetes_pod_label_app_kubernetes_io_instance
      regex: platform-observability-agent
      action: keep
    - source_labels:
      - __meta_kubernetes_pod_container_port_name
      regex: metrics
      action: keep
    - source_labels:
      - __meta_kubernetes_pod_phase
      regex: Running
      action: keep
    - source_labels:
      - __meta_kubernetes_pod_node_name
      target_label: node
    - source_labels:
      - __meta_kubernetes_pod_node_name
      target_label: instance
    - target_label: cluster
      replacement: web-saas-k3s-v5
    - target_label: environment
      replacement: prod
    metric_relabel_configs:
    - source_labels:
      - __name__
      regex: namedprocess_namegroup_(read_bytes_total|write_bytes_total|open_filedesc|worst_fd_ratio)
      action: drop
  - job_name: kube-state-metrics
    scrape_interval: 15s
    static_configs:
    - targets:
      - platform-observability-agent-state.platform-observability.svc:8080
      labels:
        cluster: web-saas-k3s-v5
        environment: prod
  - job_name: kubelet
    scrape_interval: 15s
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: false
    kubernetes_sd_configs:
    - role: node
    relabel_configs:
    - source_labels:
      - __meta_kubernetes_node_name
      target_label: node
    - source_labels:
      - __meta_kubernetes_node_name
      target_label: instance
    - source_labels:
      - __address__
      regex: (.+):[0-9]+
      replacement: $1:10250
      target_label: __address__
    - target_label: cluster
      replacement: web-saas-k3s-v5
    - target_label: environment
      replacement: prod
  - job_name: cadvisor
    scrape_interval: 15s
    scheme: https
    metrics_path: /metrics/cadvisor
    authorization:
      type: Bearer
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: false
    kubernetes_sd_configs:
    - role: node
    relabel_configs:
    - source_labels:
      - __meta_kubernetes_node_name
      target_label: node
    - source_labels:
      - __meta_kubernetes_node_name
      target_label: instance
    - source_labels:
      - __address__
      regex: (.+):[0-9]+
      replacement: $1:10250
      target_label: __address__
    - target_label: cluster
      replacement: web-saas-k3s-v5
    - target_label: environment
      replacement: prod
  # Blackbox exporter probes are kept in the existing VictoriaMetrics scrape
  # pipeline so the Grafana dashboard layout and datasource remain unchanged.
  - job_name: blackbox-core-http
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module:
      - http_2xx
    static_configs:
    - targets:
      - https://xworktech.com/
      - https://console.svc.plus/
      labels:
        environment: prod
        probe_group: core-http
    relabel_configs:
    - source_labels:
      - __address__
      target_label: __param_target
    - source_labels:
      - __param_target
      target_label: target
    - source_labels:
      - __param_target
      regex: https://([^/]+)/.*
      target_label: name
    - target_label: __address__
      replacement: platform-observability-blackbox.platform-observability.svc.cluster.local:9115
  - job_name: blackbox-api-http
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module:
      - http_2xx
    static_configs:
    - targets:
      - https://accounts.svc.plus/
      - https://billing.svc.plus/
      labels:
        environment: prod
        probe_group: api-http
    relabel_configs:
    - source_labels:
      - __address__
      target_label: __param_target
    - source_labels:
      - __param_target
      target_label: target
    - source_labels:
      - __param_target
      regex: https://([^/]+)/.*
      target_label: name
    - target_label: __address__
      replacement: platform-observability-blackbox.platform-observability.svc.cluster.local:9115
  - job_name: blackbox-postgresql-tls-tunnel
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module:
      - tcp_tls
    static_configs:
    - targets:
      - postgresql.svc.plus:15432
      labels:
        environment: prod
        probe_group: db-tls-tunnel
        name: postgresql-tls-tunnel
    relabel_configs:
    - source_labels:
      - __address__
      target_label: __param_target
    - source_labels:
      - __param_target
      target_label: target
    - target_label: __address__
      replacement: platform-observability-blackbox.platform-observability.svc.cluster.local:9115
  spanMetrics: true
mcp:
  enabled: false
  victoriametrics:
    enabled: false
    replicaCount: 0
  grafana:
    enabled: false
    replicaCount: 0
  victorialogs:
    enabled: false
    replicaCount: 0
  victoriatraces:
    enabled: false
    replicaCount: 0
