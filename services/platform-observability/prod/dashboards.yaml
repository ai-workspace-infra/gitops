    : 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n  \
    \      \"uid\": \"${DS_METRICS}\"\n      },\n      \"targets\": [\n        {\n\
    \          \"refId\": \"A\",\n          \"expr\": \"sum(k8s_node_memory_working_set_bytes{cluster=\\\
    \"web-saas-k3s-v5\\\",environment=\\\"prod\\\"})\",\n          \"legendFormat\"\
