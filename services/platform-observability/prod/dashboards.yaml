    \"}[5m])))\",\n          \"legendFormat\": \"{{service_name}} {{k8s_pod_name}}\"\
    \n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n   \
    \       \"unit\": \"ms\"\n        },\n        \"overrides\": []\n      }\n   \
    \ },\n    {\n      \"id\": 6,\n      \"type\": \"timeseries\",\n      \"title\"\
