    ,\n        \"refresh\": 1\n      }\n    ]\n  },\n  \"panels\": [\n    {\n    \
    \  \"id\": 1,\n      \"type\": \"timeseries\",\n      \"title\": \"Node CPU %\"\
    ,\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\":\
    \ 12,\n        \"h\": 8\n      },\n      \"datasource\": {\n        \"type\":\
    \ \"prometheus\",\n        \"uid\": \"${DS_METRICS}\"\n      },\n      \"targets\"\
    : [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"100 * avg(k8s_node_cpu_utilization_ratio{cluster=\\\
    \"web-saas-k3s-v5\\\",environment=\\\"prod\\\"})\",\n          \"legendFormat\"\
    : \"{{service_name}} {{k8s_pod_name}}\"\n        }\n      ],\n      \"fieldConfig\"\
