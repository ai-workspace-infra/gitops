    \ 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n  \
    \      \"uid\": \"${DS_METRICS}\"\n      },\n      \"targets\": [\n        {\n\
    \          \"refId\": \"A\",\n          \"expr\": \"sum by (k8s_pod_name) (container_memory_working_set_bytes{cluster=\\\
