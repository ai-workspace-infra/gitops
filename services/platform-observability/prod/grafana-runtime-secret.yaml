apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-runtime
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: grafana-runtime
    creationPolicy: Owner
  data:
  - secretKey: GRAFANA_XCONNECT_IDENTITY_TOKEN
    remoteRef:
      key: prod/services/web-saas-k3s-v5/observability
      property: identity_lookup_token
