      branch: bugfix/471-obs-cmdb-serverless
      scope: "Reconcile multi-cloud & serverless CMDB facts (GCP/Akamai/AWS/UCloud/Cloudflare/Supabase), retire deleted observability-shared-0, prevent partial API failures from marking deletions, and align cmdb_postgres datasource & Serverless telemetry producers."
    OBS-02:
      issue: https://github.com/ai-workspace-infra/playbooks/issues/766
      repository: ai-workspace-infra/playbooks
      branch: bugfix/766-obs-host-agent
      scope: "Verify and align host agents (node_exporter, process_exporter, postgres_exporter, xray, caddy, vector, blackbox) across active CMDB hosts to write to the target observability endpoint with canonical environment/instance labels without altering billing pipelines."
    OBS-03:
      issue: https://github.com/ai-workspace-infra/artifacts/issues/221
      repository: ai-workspace-infra/artifacts
      branch: bugfix/221-obs-k3s-agent
      scope: "Fix K3s/containerd collector chart & RBAC (remove localhost-only node stats restriction in collector-identity.yaml, align kubelet/cAdvisor node & container metrics, add containerd Pod/journald log collection and K8s resource attributes)."
    OBS-04:
      issue: https://github.com/ai-workspace-infra/gitops/issues/559
