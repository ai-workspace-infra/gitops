  unified_resource_identity_contract:
    canonical_resource_key_format: "{provider}:{account_or_project}:{region}:{resource_id}"
    cmdb_canonical_uri_format: "cmdb://{provider}/{account_ref}/{project_ref}/{resource_kind}/{native_resource_id}"
    examples:
      k3s_cluster_node: "akamai-cloud:manbuzhe2026:jp-tyo-3:web-saas-k3s-v5"
      gcp_compute_vm: "gcp-cloud:open-platform-prod:asia-east1-a:projects/open-platform-prod/zones/asia-east1-a/instances/web-saas-prod-v4"
      gcp_cloud_run: "gcp-cloud:open-platform-prod:asia-east1:projects/open-platform-prod/locations/asia-east1/services/prod-accounts"
      cloudflare_worker: "cloudflare:svc.plus:global:frontend-router-prod"
      supabase_database: "supabase:svc.plus:ap-northeast-1:iqkxspmhcfqmhkbjdoms"
    required_dimensions:
      provider: "Normalized provider identifier (gcp-cloud | akamai-cloud | aws-cloud | ucloud-ulighthost | surfercloud-ulighthost | cloudflare | supabase)"
      account_or_project: "Cloud account alias/ID or GCP project_id (e.g. open-platform-prod, open-platform-shared-510113, open-platform-uat, manbuzhe2026, 081434641398)"
      region: "Provider region or zone (e.g. asia-east1, jp-tyo-3, ap-northeast-1, sg-sin-2, us-lax, global)"
      resource_id: "Immutable provider native resource ID or canonical workload name when native ID is resolved at runtime"
      environment: "Canonical environment value: prod | uat | sit | shared (canonical label name is 'environment'; 'env' is legacy and must be mapped/aligned)"
      service: "Logical service or workload name (e.g. web-saas-accounts, web-saas-console, web-saas-billing, xconnect, ai-aggregator)"
      cluster: "Cluster or deployment pool identifier (e.g. web-saas-k3s-v5, selfhost, xconnect-jp)"
      namespace: "Kubernetes namespace or GitOps state_namespace (e.g. platform-observability, web-saas-k3s-v5)"
      node: "Host nodename, inventory hostname, or Kubernetes node name (e.g. web-saas-k3s-v5, jp-xconnect.svc.plus)"

  schema_and_field_mappings:
    iac_deploy_cmdb:
      schema_version: cmdb.v1
      implementation: iac_modules/terraform-hcl-standard/scripts/cmdb_v1.py
      consumer: playbooks/inventory/terraform_cmdb.py
      fields:
        environment: "document.environment (dev | sit | uat | prod | shared)"
        provider: "document.cloud_provider"
        account_or_project: "document.project_id"
        source_resources: "document.source_resources[]"
        resource_id: "document.hosts.<host>.resource_id"
        public_ip: "document.hosts.<host>.ip"
        private_ip: "document.hosts.<host>.private_ip"
      invariants:
        - "Serverless resources without SSH/IP must not fabricate dummy host entries in hosts."
        - "Secret-bearing keys (password, token, secret, private_key, credential) are strictly rejected."

    cloud_observations_envelope:
      schema_version: cmdb.observations.v1
      implementation: iac_modules/terraform-hcl-standard/scripts/cmdb_observations_v1.py
      collectors:
        - iac_modules/terraform-hcl-standard/scripts/cmdb_collect_scope.py
        - iac_modules/terraform-hcl-standard/scripts/cmdb_collect_gcp.py
      run_fields:
        run_id: "Unique collection execution identifier"
        collector: "Collector adapter name (e.g. gcp-compute, gcp-cloudrun)"
        owner_sha: "Immutable Git commit SHA of collector contract"
        scope: "shared | sit | uat | prod | unknown"
        account_ref: "Provider account reference"
        project_ref: "Provider project reference"
        region_ref: "Region scope when regional"
        started_at: "ISO-8601 UTC timestamp with timezone"
        completed_at: "ISO-8601 UTC timestamp with timezone"
        outcome: "success | partial | failed"
        scope_complete: "boolean (true only when entire declared scope succeeded)"
      observation_fields:
        canonical_id: "cmdb://{provider}/{account_ref}/{project_ref}/{resource_kind}/{native_resource_id}"
        provider: "Normalized provider string"
        resource_kind: "compute | serverless_service | serverless_revision | managed_database"
        native_resource_id: "Provider native immutable ID"
        region: "Provider region/zone"
        scope: "Environment scope"
        name: "Display/resource name"
        provider_state: "Normalized state (running | stopped | ready | unknown)"
        provider_state_raw: "Raw provider status string"
        source: "provider_api | external_inventory"
        observed_at: "ISO-8601 UTC timestamp"
      invariants:
        - "Partial or failed runs (scope_complete=false) must never mark absent resources as deleted."
        - "External inventory (e.g. ULightHost manual edges) must use source=external_inventory, never provider_api."

    cmdb_postgresql_persistence:
      schema_version: cmdb-postgresql-v1 (migrations 001, 002)
      implementation: playbooks/contracts/cmdb-postgresql-v1/
      views_consumed_by_grafana:
        - cmdb.v_resource_current
        - cmdb.v_provider_summary
        - cmdb.v_collection_health
        - cmdb.v_monitoring_coverage
        - cmdb.v_serverless_current
        - cmdb.v_resource_history
      timestamps:
        collection_runs: [started_at, completed_at]
        resources: [first_seen_at, last_seen_at]
        resource_observations: [observed_at, received_at]
        monitoring_status: [last_metrics_at, last_logs_at, last_verified_at, updated_at]

    telemetry_signals:
      metrics_victoriametrics:
        datasource_uid: victoriametrics
        endpoint_internal: http://127.0.0.1:8428
        canonical_labels:
          environment: "prod | uat | sit | shared (canonical; legacy 'env' must be migrated/relabeled)"
          cluster: "web-saas-k3s-v5 | selfhost | pool name"
          job: "Exporter/scrape job (e.g. node_exporter, victoriametrics, xhttp-caddy, postgres_exporter)"
          instance: "Target host:port or canonical node identifier"
          nodename: "OS hostname / node_uname_info nodename"
          service_name: "OTel service.name promoted to Prometheus label"
          k8s_node_name: "Kubernetes node name"
          k8s_namespace_name: "Kubernetes namespace name"
          k8s_pod_name: "Kubernetes pod name"
      logs_victorialogs:
        datasource_uid: victorialogs
        endpoint_internal: http://127.0.0.1:9428
        ingestion_paths:
          otlp_http: /insert/opentelemetry/v1/logs
          vector_elasticsearch: /insert/elasticsearch/
        canonical_fields:
          _time: "Log event timestamp"
          _msg: "Log message body"
          environment: "prod | uat | sit | shared"
          cluster: "Cluster identifier (e.g. web-saas-k3s-v5)"
          host: "Originating hostname or node name"
          source_type: "system_logs | docker_logs | k8s_pod_logs | cloud_run | cloudflare | supabase"
          service_name: "Application/service identifier"
          container_name: "Container or unit name"
          k8s_namespace_name: "Kubernetes namespace (when source_type=k8s_pod_logs)"
          k8s_pod_name: "Kubernetes pod name (when source_type=k8s_pod_logs)"
          stream: "stdout | stderr"
          level: "debug | info | warn | warning | err | error | crit | alert | emerg"
          trace_id: "Hex trace identifier (16-32 chars) linked to victoriatraces"
      traces_victoriatraces:
        datasource_uid: victoriatraces
        endpoint_internal: http://127.0.0.1:10428/select/jaeger
        ingestion_paths:
          otlp_http: http://127.0.0.1:10428/insert/opentelemetry/v1/traces
          otel_collector_grpc: 0.0.0.0:4317
          otel_collector_http: 0.0.0.0:4318
        canonical_resource_attributes:
          - service.name
          - environment
          - cluster
          - instance
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.node.name

  freshness_and_quality_gates:
    metrics_freshness_limit: "<= 3 scrape intervals (<= 45s for 15s scrape, <= 60s for 20s kubeletstats, <= 90s for 30s host scrape)"
    logs_freshness_limit: "<= 5 minutes (300 seconds)"
    cmdb_freshness_limit: "<= 1 configured sync/freshness cycle (interval_seconds=300, freshness_seconds=900 / 15 minutes in cmdb.v_resource_current)"
    prohibited_masking_patterns:
      - "or vector(0)"
      - "or vector(3)"
      - "or vector(12.5)"
      - "clamp_min(sum(rate(probe_duration_seconds...)) * 10, 1.2)"
      - "Static constant PromQL queries (e.g. '1') used to fake healthy status"
    on_demand_workload_policy: "Stress test (k6) and batch panels must display explicit Idle / N/A state and last execution timestamp when no test is active, never synthetic 0/100% values."
    unauthenticated_or_unverified_policy: "Any panel or resource that cannot be verified due to missing credentials or unapproved target access must be marked NOT_RUN, never PASS."

