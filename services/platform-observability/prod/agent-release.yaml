# Published agent 1.1.1; activation requires promotion of the exact GitOps source ref.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: observability-agent-chart
spec:
  interval: 5m
  suspend: false
  url: oci://ghcr.io/ai-workspace-infra/observability-agent
  ref:
    digest: sha256:4095ed924194c7a91aaa2ad00dd21cec3ccfdcd4c342951ac95aec56fe041f12
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform-observability-agent
spec:
  suspend: false
  interval: 5m
  releaseName: platform-observability-agent
  targetNamespace: platform-observability
  chartRef:
    kind: OCIRepository
    name: observability-agent-chart
  valuesFrom:
  - kind: ConfigMap
    name: platform-observability-agent-values
    valuesKey: values.yaml
