apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: observability-stack-chart
spec:
  interval: 5m
  url: oci://ghcr.io/ai-workspace-infra/observability-stack
  ref:
    digest: sha256:cbc00eaa3798542b6445a785a24556d24f828c9949a4fb7359778de2932ee871
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform-observability
spec:
  interval: 5m
  releaseName: platform-observability
  targetNamespace: platform-observability
  chartRef:
    kind: OCIRepository
    name: observability-stack-chart
  valuesFrom:
    - kind: ConfigMap
      name: platform-observability-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: source-grafana-values
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: platform-observability-observability-stack
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: platform-observability-observability-stack
              spec:
                strategy:
                  type: Recreate
                  rollingUpdate: null
                template:
                  spec:
                    securityContext:
                      fsGroup: 472
