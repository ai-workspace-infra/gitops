apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: observability-stack-chart
spec:
  interval: 5m
  url: oci://ghcr.io/ai-workspace-infra/observability-stack
  ref:
    digest: sha256:6cf607b36fa0c92fd14f06d4db5186242dba85b7171757257242c0c6f90162a0
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform-observability
spec:
  interval: 5m
  releaseName: platform-observability
  targetNamespace: platform-observability
  chartRef:
    kind: OCIRepository
    name: observability-stack-chart
  valuesFrom:
    - kind: ConfigMap
      name: platform-observability-values
      valuesKey: values.yaml
    - kind: ConfigMap
      name: source-grafana-values
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: platform-observability-observability-stack
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: platform-observability-observability-stack
              spec:
                strategy:
                  type: Recreate
                  rollingUpdate: null
                template:
                  spec:
                    securityContext:
                      fsGroup: 472
                    # Published stack 1.1.5 has no per-container resources values.
                    # Pin this target-only post-render patch until that contract exists.
                    initContainers:
                      - name: verified-grafana-plugins
                        resources:
                          requests: {cpu: 10m, memory: 64Mi}
                          limits: {cpu: 200m, memory: 384Mi}
                    containers:
                      - name: victoria-metrics
                        resources:
                          requests: {cpu: 50m, memory: 384Mi}
                          limits: {cpu: 400m, memory: 768Mi}
                      - name: victoria-logs
                        resources:
                          requests: {cpu: 10m, memory: 32Mi}
                          limits: {cpu: 50m, memory: 128Mi}
                      - name: victoria-traces
                        resources:
                          requests: {cpu: 25m, memory: 192Mi}
                          limits: {cpu: 100m, memory: 384Mi}
                      - name: otel-collector
                        resources:
                          requests: {cpu: 25m, memory: 128Mi}
                          limits: {cpu: 200m, memory: 256Mi}
                      - name: grafana
                        resources:
                          requests: {cpu: 50m, memory: 512Mi}
                          limits: {cpu: 400m, memory: 1Gi}
