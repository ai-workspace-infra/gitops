apiVersion: v1
kind: ConfigMap
metadata:
  name: source-grafana-datasources
  namespace: platform-observability
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n- access: proxy\n  basicAuth: false\n  database: ''\n  isDefault:\
    \ false\n  jsonData:\n    derivedFields:\n    - datasourceUid: victoriatraces\n      matcherRegex: (?:trace[_-]?id|traceID)[=:\\\
    \\s\"]+([0-9a-fA-F]{16,32})\n      name: Trace ID\n      url: $${__value.raw}\n  name: VictoriaLogs\n  type:\
    \ victoriametrics-logs-datasource\n  uid: victorialogs\n  url: http://127.0.0.1:9428\n  user: ''\n- access:\
    \ proxy\n  basicAuth: false\n  database: ''\n  isDefault: true\n  jsonData: {}\n  name: VictoriaMetrics\n  type:\
    \ prometheus\n  uid: victoriametrics\n  url: http://127.0.0.1:8428\n  user: ''\n- access: proxy\n  basicAuth:\
    \ false\n  database: ''\n  isDefault: false\n  jsonData:\n    tracesToLogs:\n      datasourceUid: victorialogs\n\
    \      filterBySpanID: false\n      filterByTraceID: true\n      spanEndTimeShift: 1h\n      spanStartTimeShift:\
    \ -1h\n      tags:\n      - service.name\n      - environment\n      - instance\n    tracesToMetrics:\n    \
    \  datasourceUid: victoriametrics\n      spanEndTimeShift: 1h\n      spanStartTimeShift: -1h\n      tags:\n\
    \      - key: service.name\n        value: job\n      - key: instance\n        value: instance\n  name: VictoriaTraces\n\
    \  type: jaeger\n  uid: victoriatraces\n  url: http://127.0.0.1:10428/select/jaeger\n  user: ''\n"
