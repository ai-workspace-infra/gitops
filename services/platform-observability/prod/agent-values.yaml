# Independent reusable agent release. Exporters only; the existing server scrapes once.
fullnameOverride: platform-observability-agent
nodeExporter:
  enabled: true
  hostMetrics: true
  hostNetwork: true
  listenOnNodeIP: true
  image:
    repository: quay.io/prometheus/node-exporter
    tag: v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
kubeStateMetrics:
  enabled: true
processExporter:
  enabled: true
  networkPolicy:
    enabled: true
    podSelector:
      matchLabels:
        app.kubernetes.io/name: observability-stack
vector:
  enabled: false
