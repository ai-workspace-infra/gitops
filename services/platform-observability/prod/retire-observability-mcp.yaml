# Explicit decommission and scale-to-zero declarations for observability-mcp workloads in prod-k3s-v5
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-observability-mcp-victoriametrics
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: observability-mcp-victoriametrics
    app.kubernetes.io/part-of: platform-observability
    environment: prod
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: observability-mcp-victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability-mcp-victoriametrics
        app.kubernetes.io/part-of: platform-observability
        environment: prod
    spec:
      containers:
      - name: mcp-victoriametrics
        image: ghcr.io/victoriametrics/mcp-victoriametrics:latest
        imagePullPolicy: IfNotPresent
---
