workload:
  kind: DaemonSet
datakit:
  dataway_secret_create: false
  dataway_secret_enabled: true
  dataway_secret_key: ENV_DATAWAY
  dataway_secret_name: datakit-dataway-secret
  default_enabled_inputs: statsd,dk,cpu,disk,diskio,mem,swap,system,hostobject,net,host_processes,container,kubernetesprometheus,opentelemetry,prom
  global_tags: host=prod-k3s-v5,cluster=web-saas-k3s-v5-prod,env=prod
  log: info
extraEnvs:
- name: ENV_GLOBAL_HOST_TAGS
  value: host=prod-k3s-v5
- name: ENV_INPUT_OTEL_GRPC
  value: '{"addr": "0.0.0.0:4317", "max_payload": 16777216}'
- name: ENV_INPUT_OTEL_HTTP
  value: '{"enable": true, "http_status_ok": 200, "trace_api": "/otel/v1/traces",
    "metric_api": "/otel/v1/metrics", "logs_api": "/otel/v1/logs"}'
- name: ENV_INPUT_OTEL_CUSTOMER_TAGS_ALL
  value: 'true'
- name: ENV_INPUT_OTEL_METRIC_ENABLE_AGGREGATE
  value: 'true'
- name: ENV_INPUT_CONTAINER_ENDPOINTS
  value: unix:///var/run/k3s/containerd/containerd.sock
- name: ENV_INPUT_CONTAINER_CONTAINER_INCLUDE_LOG
  value: namespace:web-saas-k3s-v5
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
dkconfig:
- name: caddy-metrics.conf
  path: /usr/local/datakit/conf.d/prom/caddy-metrics.conf
  value: "[[inputs.prom]]\n  urls = [\"http://web-saas-caddy-metrics.web-saas-k3s-v5:9180/metrics\"\
    ]\n  source = \"caddy\"\n  interval = \"30s\"\n  measurement_name = \"caddy\"\n\
    \  keep_exist_metric_name = true\n  election = false\n  [inputs.prom.tags]\n \
    \   cluster = \"web-saas-k3s-v5-prod\"\n    env = \"prod\"\n    service = \"web-saas-caddy\"\
    \n"
- name: postgresql-exporter.conf
  path: /usr/local/datakit/conf.d/prom/postgresql-exporter.conf
  value: "[[inputs.prom]]\n  urls = [\"http://postgresql-metrics.database.svc.cluster.local:9187/metrics\"]\n  source = \"postgresql\"\n  interval = \"15s\"\n  measurement_name = \"postgresql\"\n  keep_exist_metric_name = true\n  election = false\n  [inputs.prom.tags]\n    cluster = \"web-saas-k3s-v5-prod\"\n    env = \"prod\"\n    db_instance = \"postgresql\"\n    host = \"prod-k3s-v5\"\n"
