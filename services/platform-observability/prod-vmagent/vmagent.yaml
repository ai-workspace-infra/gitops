apiVersion: v1
kind: ServiceAccount
metadata:
  name: prod-vmagent
  namespace: platform-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-vmagent
  namespace: platform-observability
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: prod-vmagent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prod-vmagent}
    spec:
      serviceAccountName: prod-vmagent
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.101.0
          args:
            - -promscrape.config=/config/scrape.yml
            - -remoteWrite.url=http://platform-observability-observability-stack.platform-observability.svc:8428/api/v1/write
            - -remoteWrite.tmpDataPath=/buffer
            - -remoteWrite.maxDiskUsagePerURL=1GB
          ports: [{name: http, containerPort: 8429}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {cpu: 300m, memory: 256Mi}}
          volumeMounts: [{name: config, mountPath: /config, readOnly: true}, {name: buffer, mountPath: /buffer}]
      volumes:
        - name: config
          configMap: {name: prod-vmagent-config}
        - name: buffer
          emptyDir: {sizeLimit: 1Gi}
