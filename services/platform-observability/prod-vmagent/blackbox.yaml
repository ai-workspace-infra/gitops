apiVersion: v1
kind: ConfigMap
metadata: {name: prod-blackbox-config, namespace: platform-observability}
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http: {preferred_ip_protocol: ip4}
      tcp_tls:
        prober: tcp
        timeout: 10s
        tcp: {tls: true, preferred_ip_protocol: ip4}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prod-blackbox, namespace: platform-observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: prod-blackbox}}
  template:
    metadata: {labels: {app: prod-blackbox}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: blackbox
        image: prom/blackbox-exporter:v0.25.0
        args: ['--config.file=/etc/blackbox/blackbox.yml']
        ports: [{name: http, containerPort: 9115}]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
        volumeMounts: [{name: config, mountPath: /etc/blackbox, readOnly: true}]
      volumes: [{name: config, configMap: {name: prod-blackbox-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: prod-blackbox, namespace: platform-observability}
spec: {type: ClusterIP, selector: {app: prod-blackbox}, ports: [{name: http, port: 9115, targetPort: 9115}]}
