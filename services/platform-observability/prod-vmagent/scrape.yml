global:
  scrape_interval: 30s
  external_labels: {environment: prod, cluster: prod-k3s-v5}
scrape_configs:
- job_name: prod-vmagent
  static_configs:
  - targets: ['localhost:8429']
- job_name: blackbox-core-http
  metrics_path: /probe
  params: {module: [http_2xx]}
  static_configs:
  - targets: ['https://xworktech.com/', 'https://console.svc.plus/', 'https://accounts.svc.plus/healthz', 'https://billing.svc.plus/readyz', 'https://observability.svc.plus/']
  relabel_configs:
  - {source_labels: [__address__], target_label: __param_target}
  - {source_labels: [__param_target], target_label: target}
  - {source_labels: [__param_target], target_label: instance}
  - {target_label: __address__, replacement: 'prod-blackbox.platform-observability.svc:9115'}
- job_name: blackbox-postgresql-tls-tunnel
  metrics_path: /probe
  params: {module: [tcp_tls]}
  static_configs:
  - targets: ['postgresql.svc.plus:15432']
  relabel_configs:
  - {source_labels: [__address__], target_label: __param_target}
  - {source_labels: [__param_target], target_label: target}
  - {source_labels: [__param_target], target_label: instance}
  - {target_label: __address__, replacement: 'prod-blackbox.platform-observability.svc:9115'}
- job_name: postgres-exporter
  static_configs:
  - targets: ['prod-postgres-exporter.web-saas-k3s-v5.svc:9187']
    labels: {service: postgresql}
