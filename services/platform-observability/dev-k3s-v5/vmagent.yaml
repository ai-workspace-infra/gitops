apiVersion: v1
kind: ServiceAccount
metadata: {name: vmagent, namespace: monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: dev-vmagent}
rules:
- apiGroups: [""]
  resources: [nodes, nodes/metrics, pods, namespaces]
  verbs: [get, list, watch]
- nonResourceURLs: [/metrics, /metrics/cadvisor]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: dev-vmagent}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: dev-vmagent}
subjects: [{kind: ServiceAccount, name: vmagent, namespace: monitoring}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: vmagent-config, namespace: monitoring}
data:
  scrape.yml: |
    global:
      scrape_interval: 15s
      external_labels:
        cluster: dev-k3s-v5
    # environment: default dev; namespaces named *-sit / *-uat (which must also carry
    # label environment=sit|uat) map to sit / uat.
    scrape_configs:
    - job_name: node-exporter
      kubernetes_sd_configs: [{role: pod, namespaces: {names: [monitoring]}}]
      relabel_configs:
      - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], regex: observability-agent, action: keep}
      - {source_labels: [__meta_kubernetes_pod_container_port_name], regex: metrics, action: keep}
      - {source_labels: [__meta_kubernetes_pod_node_name], target_label: node}
      - {source_labels: [__meta_kubernetes_pod_node_name], target_label: instance}
      - {target_label: environment, replacement: dev}
      metric_relabel_configs:
      - {source_labels: [node], target_label: nodename}
    - job_name: process-exporter
      kubernetes_sd_configs: [{role: pod, namespaces: {names: [monitoring]}}]
      relabel_configs:
      - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], regex: process-exporter, action: keep}
      - {source_labels: [__meta_kubernetes_pod_container_port_name], regex: metrics, action: keep}
      - {source_labels: [__meta_kubernetes_pod_node_name], target_label: node}
      - {source_labels: [__meta_kubernetes_pod_node_name], target_label: instance}
      - {target_label: environment, replacement: dev}
      metric_relabel_configs:
      - {source_labels: [__name__], regex: 'namedprocess_namegroup_(read_bytes_total|write_bytes_total|open_filedesc|worst_fd_ratio)', action: drop}
    - job_name: kube-state-metrics
      static_configs: [{targets: [dev-observability-agent-state.monitoring.svc:8080], labels: {environment: dev}}]
      metric_relabel_configs: &envmap
      - {target_label: environment, replacement: dev}
      - {source_labels: [namespace], regex: 'feature-xconnect-referral-sit', target_label: environment, replacement: 'sit'}
      - {source_labels: [namespace], regex: 'feature-xconnect-referral-sit', target_label: feature_id, replacement: 'xconnect-referral'}
      - {source_labels: [namespace], regex: 'feature-xconnect-referral-sit', target_label: candidate, replacement: 'mock-r1-bc4f53b49f8a'}
    - job_name: kubelet
      scheme: https
      authorization: {type: Bearer, credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token}
      tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt, insecure_skip_verify: true}
      kubernetes_sd_configs: [{role: node}]
      relabel_configs: &noderl
      - {source_labels: [__meta_kubernetes_node_name], target_label: node}
      - {source_labels: [__meta_kubernetes_node_name], target_label: instance}
      - {source_labels: [__address__], regex: '(.+):[0-9]+', replacement: '$1:10250', target_label: __address__}
      - {target_label: environment, replacement: dev}
      metric_relabel_configs: *envmap
    - job_name: cadvisor
      scheme: https
      metrics_path: /metrics/cadvisor
      authorization: {type: Bearer, credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token}
      tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt, insecure_skip_verify: true}
      kubernetes_sd_configs: [{role: node}]
      relabel_configs: *noderl
      metric_relabel_configs: *envmap
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vmsink, namespace: monitoring, labels: {app.kubernetes.io/name: vmsink}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: vmsink}}
  template:
    metadata: {labels: {app.kubernetes.io/name: vmsink}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: vm
        image: victoriametrics/victoria-metrics:v1.101.0
        args: [-storageDataPath=/data, -retentionPeriod=2d, -httpListenAddr=:8428]
        ports: [{containerPort: 8428, name: http}]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {cpu: 300m, memory: 384Mi}}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {sizeLimit: 2Gi}}]
---
apiVersion: v1
kind: Service
metadata: {name: vmsink, namespace: monitoring}
spec: {selector: {app.kubernetes.io/name: vmsink}, ports: [{port: 8428, name: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: vmagent, namespace: monitoring, labels: {app.kubernetes.io/name: vmagent}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: vmagent}}
  template:
    metadata: {labels: {app.kubernetes.io/name: vmagent}}
    spec:
      serviceAccountName: vmagent
      securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: vmagent
        image: victoriametrics/vmagent:v1.101.0
        args:
        - -promscrape.config=/config/scrape.yml
        - -remoteWrite.url=http://vmsink.monitoring.svc:8428/api/v1/write
        - -remoteWrite.tmpDataPath=/buffer
        - -remoteWrite.maxDiskUsagePerURL=1GB
        ports: [{containerPort: 8429, name: http}]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {cpu: 300m, memory: 256Mi}}
        volumeMounts: [{name: config, mountPath: /config}, {name: buffer, mountPath: /buffer}]
      volumes:
      - {name: config, configMap: {name: vmagent-config}}
      - {name: buffer, emptyDir: {sizeLimit: 1Gi}}
