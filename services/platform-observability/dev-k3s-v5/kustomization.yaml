apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - agent-release.yaml
  - vmagent.yaml
  - datakit
configMapGenerator:
  - name: platform-observability-agent-values
    namespace: platform-observability
    files:
      - values.yaml=agent-values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
