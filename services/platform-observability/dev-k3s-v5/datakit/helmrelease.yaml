apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: datakit
  namespace: datakit
spec:
  interval: 10m0s
  releaseName: datakit
  targetNamespace: datakit
  timeout: 5m0s
  chart:
    spec:
      chart: datakit
      version: 2.16.1
      sourceRef:
        kind: HelmRepository
        name: datakit
        namespace: datakit
  valuesFrom:
    - kind: ConfigMap
      name: datakit-values
      valuesKey: values.yaml
