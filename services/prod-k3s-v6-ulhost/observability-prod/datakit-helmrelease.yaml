# ==============================================================================
# GitOps 商业可观测性服务控制契约 (Guance Cloud 香港商业版)
# ==============================================================================
# 1. 配置 DataKit 凭据映射 (Configure DataKit credential mapping):
#    - spec.suspend: false
#    - kustomization.yaml 正常纳管 datakit-helmrelease.yaml
#    - PROD datakit-vault-secret.yaml 绑定 key: observability/datakit/hk-commercial
#
# 2. 停用商业服务 / 截断商业计费 (Stop / Cut-off Commercial Telemetry):
#    - 方式 A (物理卸载，彻底停止上报): 在 kustomization.yaml 中注释 datakit-helmrelease.yaml，Flux 自动裁剪 DaemonSet
#    - SIT 与 PROD 统一使用 observability/datakit/hk-commercial (cn6-openway.guance.com)。
#    - 方式 C (就地静默缩容): 在 values.workload 中将 kind 设为 Deployment 并指定 replicas: 0，Pod 缩容为 0
# ==============================================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: datakit
  namespace: observability-prod
spec:
  suspend: false
  interval: 10m
  releaseName: datakit
  targetNamespace: observability-prod
  timeout: 5m
  chart:
    spec:
      chart: datakit
      version: 2.16.1
      sourceRef:
        kind: HelmRepository
        name: datakit
        namespace: observability-prod
  values:
    image:
      repository: pubrepo.guance.com/datakit/datakit
      tag: "2.16.1@sha256:1cd545f7f14dc08935ec6557936b1e6422a3d7d9728b57d6e1d6b57ea1703fc6"
    workload:
      kind: Deployment
      replicas: 1
    datakit:
      dataway_secret_create: false
      dataway_secret_enabled: true
      dataway_secret_key: ENV_DATAWAY
      dataway_secret_name: datakit-dataway-secret
      global_tags: host=prod-k3s-v6,cluster=prod-k3s-v6,environment=prod,env=prod
      log: info
      default_enabled_inputs: dk,cpu,disk,diskio,mem,swap,system,hostobject,net,host_processes,prom,ddtrace
    dkconfig:
      - name: host-processes.conf
        path: /usr/local/datakit/conf.d/host/host_processes.conf
        value: |-
          [[inputs.host_processes]]
            min_run_time = "10m"
            open_metric = true
            object_interval = "5m"
            metric_interval = "60s"
            enable_listen_ports = false
            enable_open_files = false
            only_container_processes = false
      - name: ddtrace.conf
        path: /usr/local/datakit/conf.d/ddtrace/ddtrace.conf
        value: |-
          [[inputs.ddtrace]]
            endpoints = ["/v0.3/traces", "/v0.4/traces", "/v0.5/traces"]
      - name: progressive-release-probes.conf
        path: /usr/local/datakit/conf.d/prom/progressive-release-probes.conf
        value: |-
          [[inputs.prom]]
            urls = ["http://observability-agent-blackbox.observability-prod.svc:9115/probe?target=https%3A%2F%2Fconsole.svc.plus%2Fhealthz&module=release_http_ok"]
            source = "progressive-release-probes"
            interval = "30s"
            measurement_name = "progressive_release_probes"
            keep_exist_metric_name = true
            election = false
            [inputs.prom.tags]
              job = "progressive-release-probes"
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              service = "console"
              route = "/healthz"
              probe_module = "release_http_ok"
              expected_status = "200"
              instance = "https://console.svc.plus/healthz"
          [[inputs.prom]]
            urls = ["http://observability-agent-blackbox.observability-prod.svc:9115/probe?target=https%3A%2F%2Fconsole.svc.plus%2Flogin&module=release_http_ok"]
            source = "progressive-release-probes"
            interval = "30s"
            measurement_name = "progressive_release_probes"
            keep_exist_metric_name = true
            election = false
            [inputs.prom.tags]
              job = "progressive-release-probes"
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              service = "console"
              route = "/login"
              probe_module = "release_http_ok"
              expected_status = "200"
              instance = "https://console.svc.plus/login"
          [[inputs.prom]]
            urls = ["http://observability-agent-blackbox.observability-prod.svc:9115/probe?target=https%3A%2F%2Fconsole.svc.plus%2Fpanel%2Fagent&module=release_login_redirect"]
            source = "progressive-release-probes"
            interval = "30s"
            measurement_name = "progressive_release_probes"
            keep_exist_metric_name = true
            election = false
            [inputs.prom.tags]
              job = "progressive-release-probes"
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              service = "console"
              route = "/panel/agent"
              probe_module = "release_login_redirect"
              expected_status = "307"
              instance = "https://console.svc.plus/panel/agent"
          [[inputs.prom]]
            urls = ["http://observability-agent-blackbox.observability-prod.svc:9115/probe?target=https%3A%2F%2Faccounts.svc.plus%2Fhealthz&module=release_http_ok"]
            source = "progressive-release-probes"
            interval = "30s"
            measurement_name = "progressive_release_probes"
            keep_exist_metric_name = true
            election = false
            [inputs.prom.tags]
              job = "progressive-release-probes"
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              service = "accounts"
              route = "/healthz"
              probe_module = "release_http_ok"
              expected_status = "200"
              instance = "https://accounts.svc.plus/healthz"
          [[inputs.prom]]
            urls = ["http://observability-agent-blackbox.observability-prod.svc:9115/probe?target=https%3A%2F%2Faccounts.svc.plus%2Freadyz&module=release_http_ok"]
            source = "progressive-release-probes"
            interval = "30s"
            measurement_name = "progressive_release_probes"
            keep_exist_metric_name = true
            election = false
            [inputs.prom.tags]
              job = "progressive-release-probes"
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              service = "accounts"
              route = "/readyz"
              probe_module = "release_http_ok"
              expected_status = "200"
              instance = "https://accounts.svc.plus/readyz"
          [[inputs.prom]]
            urls = ["http://observability-agent-blackbox.observability-prod.svc:9115/probe?target=https%3A%2F%2Faccounts.svc.plus%2Fapi%2Fping&module=release_http_ok"]
            source = "progressive-release-probes"
            interval = "30s"
            measurement_name = "progressive_release_probes"
            keep_exist_metric_name = true
            election = false
            [inputs.prom.tags]
              job = "progressive-release-probes"
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              service = "accounts"
              route = "/api/ping"
              probe_module = "release_http_ok"
              expected_status = "200"
              instance = "https://accounts.svc.plus/api/ping"
          [[inputs.prom]]
            urls = ["http://observability-agent-blackbox.observability-prod.svc:9115/probe?target=https%3A%2F%2Faccounts.svc.plus%2Fapi%2Fbilling%2Fplans&module=release_http_ok"]
            source = "progressive-release-probes"
            interval = "30s"
            measurement_name = "progressive_release_probes"
            keep_exist_metric_name = true
            election = false
            [inputs.prom.tags]
              job = "progressive-release-probes"
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              service = "accounts"
              route = "/api/billing/plans"
              probe_module = "release_http_ok"
              expected_status = "200"
              instance = "https://accounts.svc.plus/api/billing/plans"
          [[inputs.prom]]
            urls = ["http://observability-agent-blackbox.observability-prod.svc:9115/probe?target=https%3A%2F%2Fbilling.svc.plus%2Fhealthz&module=release_http_ok"]
            source = "progressive-release-probes"
            interval = "30s"
            measurement_name = "progressive_release_probes"
            keep_exist_metric_name = true
            election = false
            [inputs.prom.tags]
              job = "progressive-release-probes"
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              service = "billing"
              route = "/healthz"
              probe_module = "release_http_ok"
              expected_status = "200"
              instance = "https://billing.svc.plus/healthz"
          [[inputs.prom]]
            urls = ["http://observability-agent-blackbox.observability-prod.svc:9115/probe?target=https%3A%2F%2Fbilling.svc.plus%2Freadyz&module=release_http_ok"]
            source = "progressive-release-probes"
            interval = "30s"
            measurement_name = "progressive_release_probes"
            keep_exist_metric_name = true
            election = false
            [inputs.prom.tags]
              job = "progressive-release-probes"
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              service = "billing"
              route = "/readyz"
              probe_module = "release_http_ok"
              expected_status = "200"
              instance = "https://billing.svc.plus/readyz"
          [[inputs.prom]]
            urls = ["http://observability-agent-blackbox.observability-prod.svc:9115/probe?target=https%3A%2F%2Fbilling.svc.plus%2Fapi%2Fping&module=release_http_ok"]
            source = "progressive-release-probes"
            interval = "30s"
            measurement_name = "progressive_release_probes"
            keep_exist_metric_name = true
            election = false
            [inputs.prom.tags]
              job = "progressive-release-probes"
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              service = "billing"
              route = "/api/ping"
              probe_module = "release_http_ok"
              expected_status = "200"
              instance = "https://billing.svc.plus/api/ping"
      - name: flagger-metrics.conf
        path: /usr/local/datakit/conf.d/prom/flagger-metrics.conf
        value: |-
          [[inputs.prom]]
            urls = ["http://web-saas-flagger-metrics.web-saas-prod.svc:8080/metrics"]
            source = "flagger"
            interval = "30s"
            measurement_name = "flagger"
            keep_exist_metric_name = true
            election = false
            [inputs.prom.tags]
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              namespace = "web-saas-prod"
              service = "flagger"
              job = "flagger"
              host = "prod-k3s-v6"
      - name: traefik-canary.conf
        path: /usr/local/datakit/conf.d/prom/traefik-canary.conf
        value: |-
          [[inputs.prom]]
            urls = ["http://traefik-metrics.ingress-prod.svc:9100/metrics"]
            source = "traefik"
            interval = "30s"
            measurement_name = "traefik"
            keep_exist_metric_name = true
            metric_name_filter = ["traefik_service_requests_total"]
            election = false
            [inputs.prom.tags]
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              service = "traefik-ingress"
              job = "traefik"
              host = "prod-k3s-v6"
      # 默认关闭高基数采集 (cadvisor / kubelet / kube-state-metrics / container / kubernetesprometheus)
      # 仅保留低基数核心指标且拉长抓取周期为 60s
      - name: postgresql-exporter.conf
        path: /usr/local/datakit/conf.d/prom/postgresql-exporter.conf
        value: |-
          [[inputs.prom]]
            urls = ["http://postgresql-postgresql-exporter.postgresql-prod:9187/metrics"]
            source = "postgresql"
            interval = "60s"
            measurement_name = "postgresql"
            keep_exist_metric_name = true
            election = false
            [inputs.prom.tags]
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              service = "postgresql"
              instance = "prod-postgresql-0"
              db_instance = "postgresql"
              host = "prod-k3s-v6"
      - name: node-exporter.conf
        path: /usr/local/datakit/conf.d/prom/node-exporter.conf
        value: |-
          [[inputs.prom]]
            urls = ["http://observability-agent.observability-prod:9100/metrics"]
            source = "node-exporter"
            interval = "60s"
            measurement_name = "node-exporter"
            keep_exist_metric_name = true
            election = false
            [inputs.prom.tags]
              cluster = "prod-k3s-v6"
              environment = "prod"
              env = "prod"
              service = "node-exporter"
              job = "node-exporter"
              node = "prod-k3s-v6"
              nodename = "prod-k3s-v6"
              instance = "prod-k3s-v6"
              host = "prod-k3s-v6"
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 800m, memory: 768Mi}
