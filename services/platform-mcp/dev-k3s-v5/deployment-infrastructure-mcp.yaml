apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrastructure-mcp-server
  namespace: platform-mcp
  labels:
    app.kubernetes.io/name: infrastructure-mcp-server
    app.kubernetes.io/part-of: platform-mcp
    environment: dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: infrastructure-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrastructure-mcp-server
        app.kubernetes.io/part-of: platform-mcp
        environment: dev
    spec:
      nodeSelector:
        kubernetes.io/hostname: dev-k3s-v5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: infrastructure-mcp-server
        image: ghcr.io/ai-workspace-infra/infrastructure-mcp-server:latest
        imagePullPolicy: IfNotPresent
        args:
        - "-config"
        - "/etc/infrastructure-mcp-server/config.json"
        - "-listen"
        - ":8080"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config-volume
          mountPath: /etc/infrastructure-mcp-server
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: infrastructure-mcp-config
