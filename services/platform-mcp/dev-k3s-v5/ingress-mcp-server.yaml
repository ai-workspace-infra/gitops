apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-server-ingress
  namespace: platform-mcp
  labels:
    app.kubernetes.io/name: infrastructure-mcp-server
    app.kubernetes.io/part-of: platform-mcp
  annotations:
    external-dns.alpha.kubernetes.io/hostname: mcp-server.svc.plus
spec:
  ingressClassName: caddy
  rules:
  - host: mcp-server.svc.plus
    http:
      paths:
      - path: /v1/grafana
        pathType: Prefix
        backend:
          service:
            name: mcp-grafana
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: infrastructure-mcp-server
            port:
              number: 8080
  tls:
  - hosts:
    - mcp-server.svc.plus
    secretName: mcp-server-tls
