apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: obs-agent-secret
  namespace: obs-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: obs-agent-secret
    creationPolicy: Owner
  data:
    - secretKey: AGENT_ID
      remoteRef:
        key: obs-agent/clusters/prod
        property: AGENT_ID
    - secretKey: AGENT_API_KEY
      remoteRef:
        key: obs-agent/clusters/prod
        property: AGENT_API_KEY
