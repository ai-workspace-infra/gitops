apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obs-agent
  namespace: obs-agent
spec:
  interval: 10m0s
  releaseName: obs-agent
  chart:
    spec:
      chart: obs-agent
      version: ">=0.15.0"
      sourceRef:
        kind: HelmRepository
        name: obs-agent
        namespace: obs-agent
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: pubrepo.guance.com/guance/obs-agent
      tag: v0.15.2
    secret:
      existingSecret: obs-agent-secret
    automountServiceAccountToken: false
    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
    persistence:
      work:
        size: 20Gi
      profileCache:
        size: 5Gi
      owl:
        size: 5Gi
