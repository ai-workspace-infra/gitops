global:
  environment: uat
  expectedNamespace: web-saas-k3s-v5

caddy:
  enabled: true
  image: "ghcr.io/ai-workspace-infra/caddy-cloudflare:959d6c8@sha256:9895385033fea2bdb445841b45f37e6cd58b9e071a16e4c147e483abb74a0acf"
  frontendService: console
  gatewayEnabled: false
  httpOnly: false
  service:
    type: LoadBalancer
  routes:
    consoleHost: console-k3s-v5.svc.plus
    accountsHost: accounts-k3s-v5.svc.plus
    billingHost: billing-k3s-v5.svc.plus
  tls:
    consoleSecret: web-saas-tls
    accountsSecret: web-saas-tls
    billingSecret: web-saas-tls

postgresql:
  enabled: true
  image: "ghcr.io/ai-workspace-services/postgresql:daily-build-2026.10.24-r1@sha256:288285427b2c004d3e80c11bf364cd03f2e038bb03e2343da4f5db09b56a2e96"
  username: app
  database: account
  existingSecret: web-saas-secrets
  secretKey: password
  storage:
    className: local-path
    size: 5Gi

console:
  enabled: true
  deploymentProfile: single-container
  singleContainer:
    image: "ghcr.io/ai-workspace-services/console:daily-build-2026.10.24-r1@sha256:29f5701661d9bd5e985b04f3f1b4974c9f98b2e71500adfc60a19cbb87a90744"
    port: 8080
    command: ["/bin/bash", "-c"]
    args: ["export PORT=3000; exec /usr/local/bin/start-all-in-one"]
    replicas: 1
    securityContext:
      allowPrivilegeEscalation: true
      capabilities:
        add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
    probes:
      readinessProbe:
        httpGet:
          path: /
          port: primary
      livenessProbe:
        httpGet:
          path: /
          port: primary
        initialDelaySeconds: 20

accounts:
  enabled: true
  workload:
    image: "ghcr.io/ai-workspace-services/accounts:daily-build-2026.10.24-r1@sha256:fd6a95d82fe49aeb9f220a49f0e76176e01a5bb3963560f16639eef6bdb3ef63"
    port: 8080
    replicas: 1
    env:
      CONFIG_TEMPLATE: "/app/config/account.cloudrun.yaml"
      DB_HOST: "RELEASE_NAME-postgresql"
      DB_PORT: "5432"
      POSTGRES_USER: "app"
      DB_NAME: "account"
      ROOT_BOOTSTRAP_EMAIL: "admin@svc.plus"
      XWORKMATE_SHARED_TENANT_DOMAIN: "svc.plus"
      XWORKMATE_SHARED_TENANT_DOMAINS: "svc.plus"
    secretRefs:
      - web-saas-secrets

billing:
  enabled: true
  workload:
    image: "ghcr.io/ai-workspace-services/billing-service:daily-build-2026.10.24-r1@sha256:60e309d87716d88a969ce88f2141d17d0565a7e54ef91d5289f66b27fde99382"
    port: 8080
    replicas: 1
    secretRefs:
      - web-saas-secrets
    probes:
      readinessProbe:
        httpGet:
          path: /readyz
          port: primary
      livenessProbe:
        httpGet:
          path: /readyz
          port: primary
        initialDelaySeconds: 20

content:
  enabled: true
  workload:
    image: "ghcr.io/ai-workspace-services/docs:daily-build-2026.10.24-r1@sha256:768594e9a6491d005333c53e9d08202f9120acd20fa0b211f1bc3d831fb4bf1f"
    port: 8080
    replicas: 1
    env:
      KNOWLEDGE_REPO_PATH: "/tmp/knowledge"
      KNOWLEDGE_REPO_URL: "https://github.com/ai-workspace-services/knowledge.git"

edgeGateway:
  enabled: false

stunnelClient:
  enabled: false

stunnelServer:
  enabled: false
