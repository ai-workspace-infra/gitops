apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: web-saas-k3s-v5
resources:
  - oci-repository.yaml
  - secret-store.yaml
  - external-secret.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: web-saas-fullstack-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
