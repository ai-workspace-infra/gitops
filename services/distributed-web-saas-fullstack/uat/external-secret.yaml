apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-saas-secrets
  namespace: web-saas-k3s-v5
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: web-saas-secrets
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kv/data/WEB_SAAS/uat/database
        property: password
    - secretKey: jwt-secret
      remoteRef:
        key: kv/data/WEB_SAAS/uat/jwt
        property: secret
