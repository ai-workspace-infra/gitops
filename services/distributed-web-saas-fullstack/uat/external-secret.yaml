apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-saas-secrets
  namespace: web-saas-k3s-v5
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: web-saas-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        # Database selection belongs to this UAT declaration, not the credential.
        DATABASE_URL: '{{ regexReplaceAll "/[^/?]+([?].*)?$" .DATABASE_URL "/account${1}" }}'
  data:
    - secretKey: password
      remoteRef:
        key: kv/data/WEB_SAAS/uat/database
        property: password
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: kv/data/WEB_SAAS/uat/database
        property: POSTGRES_PASSWORD
    - secretKey: DATABASE_URL
      remoteRef:
        key: kv/data/WEB_SAAS/uat/database
        property: database_url
    - secretKey: INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: kv/data/WEB_SAAS/uat/database
        property: INTERNAL_SERVICE_TOKEN
    - secretKey: ROOT_BOOTSTRAP_PASSWORD
      remoteRef:
        key: kv/data/WEB_SAAS/uat/database
        property: ROOT_BOOTSTRAP_PASSWORD
    - secretKey: ROOT_BOOTSTRAP_EMAIL
      remoteRef:
        key: kv/data/WEB_SAAS/uat/database
        property: ROOT_BOOTSTRAP_EMAIL
    - secretKey: jwt-secret
      remoteRef:
        key: kv/data/WEB_SAAS/uat/jwt
        property: secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-saas-tls
  namespace: web-saas-k3s-v5
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: web-saas-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: "{{ .tls_cert }}"
        tls.key: "{{ .tls_key }}"
  data:
    - secretKey: tls_cert
      remoteRef:
        key: kv/data/WEB_SAAS/uat/tls
        property: tls_fullchain_pem
    - secretKey: tls_key
      remoteRef:
        key: kv/data/WEB_SAAS/uat/tls
        property: tls_key_pem
