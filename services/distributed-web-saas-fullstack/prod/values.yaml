global:
  environment: prod
  expectedNamespace: web-saas-k3s-v5
caddy:
  enabled: true
  image: ghcr.io/ai-workspace-infra/caddy-cloudflare:959d6c8@sha256:9895385033fea2bdb445841b45f37e6cd58b9e071a16e4c147e483abb74a0acf
  frontendService: console
  resources:
    requests: {cpu: 15m, memory: 48Mi}
    limits: {cpu: 100m, memory: 128Mi}
  gatewayEnabled: false
  httpOnly: false
  service:
    type: LoadBalancer
  routes:
    consoleHost: console-k3s-v5.svc.plus
    consoleAliases:
    - console.svc.plus
    accountsHost: accounts-k3s-v5.svc.plus
    accountsAliases:
    - accounts.svc.plus
    billingHost: billing-k3s-v5.svc.plus
    billingAliases:
    - billing.svc.plus
  tls:
    consoleSecret: web-saas-tls
    accountsSecret: web-saas-tls
    billingSecret: web-saas-tls
  additionalHosts:
  - name: brand-console
    host: xworktech.com
    serviceRole: console
    tlsSecret: web-saas-brand-tls
  - name: vault
    host: vault-k3s-v5.svc.plus
    aliases:
    - vault.svc.plus
    upstream: https://vault-raft.platform-vault.svc.cluster.local:8200
    tlsSecret: web-saas-tls
    upstreamCAConfigMap: vault-raft-ca
  - name: observability
    host: observability-k3s-v5.svc.plus
    aliases:
    - observability.svc.plus
    upstream: http://platform-observability-observability-stack.platform-observability.svc.cluster.local:3000
    tlsSecret: web-saas-tls
postgresql:
  enabled: true
  image: ghcr.io/ai-workspace-services/postgresql@sha256:56f4179bafafa52061ac21003dc80c1a0b7ceb63fffb2c7bd05f29237b62b85e
  username: app
  database: account
  existingSecret: web-saas-secrets
  secretKey: password
  storage:
    className: local-path
    size: 5Gi
console:
  enabled: true
  deploymentProfile: single-container
  singleContainer:
    image: ghcr.io/ai-workspace-services/console:v2026.10.29.2@sha256:3ae076cac3cb79a38a7739f1a726087f8900b8964a7f5ef7833e7cd8e3623ed3
    port: 8080
    command:
    - /bin/bash
    - -c
    args:
    - export PORT=3000; exec /usr/local/bin/start-all-in-one
    replicas: 1
    resources:
      requests: {cpu: 50m, memory: 192Mi}
      limits: {cpu: 300m, memory: 384Mi}
    securityContext:
      allowPrivilegeEscalation: true
      capabilities:
        add:
        - CHOWN
        - SETUID
        - SETGID
        - DAC_OVERRIDE
    probes:
      readinessProbe:
        httpGet:
          path: /
          port: primary
      livenessProbe:
        httpGet:
          path: /
          port: primary
        initialDelaySeconds: 20
accounts:
  enabled: true
  workload:
    image: ghcr.io/ai-workspace-services/accounts:sha-3ef09c82f46152096bfc16edc9ba767f128a197f@sha256:b5bf111a64ca2f2ed5e74d2ab1f87e0e164d09869a32832368fb43e577fdf37b
    port: 8080
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 200m, memory: 256Mi}
    env:
      CONFIG_TEMPLATE: /app/config/account.cloudrun.yaml
      DB_HOST: RELEASE_NAME-postgresql
      DB_PORT: '5432'
      POSTGRES_USER: app
      DB_NAME: account
      ROOT_BOOTSTRAP_EMAIL: admin@svc.plus
      XWORKMATE_SHARED_TENANT_DOMAIN: svc.plus
      XWORKMATE_SHARED_TENANT_DOMAINS: svc.plus
      IMAGE: ghcr.io/ai-workspace-services/accounts:sha-3ef09c82f46152096bfc16edc9ba767f128a197f@sha256:b5bf111a64ca2f2ed5e74d2ab1f87e0e164d09869a32832368fb43e577fdf37b
      DATABASE_RUNTIME_ROLE: primary
      DATABASE_BACKGROUND_WRITERS: 'false'
      DATABASE_IDENTITY_SHA256: b6618223acd5f8a50897c7adb203e5e491a60f9c8f5cb1702977592f442ab758
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://platform-observability-observability-stack.platform-observability.svc.cluster.local:4318/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_ENVIRONMENT: prod
      OTEL_SERVICE_NAME: accounts
      OTEL_TRACES_SAMPLER_ARG: '1'
    secretRefs:
    - web-saas-secrets
  podAnnotations:
    platform.svc.plus/observability-identity-version: '1'
billing:
  enabled: true
  workload:
    image: ghcr.io/ai-workspace-services/billing-service@sha256:14bbaee5ba37d85ddf243272ee2c3bed25603ee26ffd5c0b8d685cfe0e7a85a0
    port: 8080
    replicas: 1
    resources:
      requests: {cpu: 15m, memory: 48Mi}
      limits: {cpu: 100m, memory: 192Mi}
    secretRefs:
    - web-saas-secrets
    probes:
      readinessProbe:
        httpGet:
          path: /readyz
          port: primary
      livenessProbe:
        httpGet:
          path: /readyz
          port: primary
        initialDelaySeconds: 20
    env:
      IMAGE: ghcr.io/ai-workspace-services/billing-service@sha256:14bbaee5ba37d85ddf243272ee2c3bed25603ee26ffd5c0b8d685cfe0e7a85a0
      BILLING_INGEST_MODE: push
      DEFAULT_REGION: jp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://platform-observability-observability-stack.platform-observability.svc.cluster.local:4318/v1/traces
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_ENVIRONMENT: prod
      OTEL_SERVICE_NAME: billing
content:
  enabled: true
  workload:
    secretRefs:
    - content-runtime
    image: ghcr.io/ai-workspace-services/docs@sha256:e6e791437bd3b57a4dec0bc9dc2527b681dd52960b6f692be6ff16322018788e
    port: 8080
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 150m, memory: 256Mi}
    env:
      KNOWLEDGE_REPO_PATH: /tmp/knowledge
      KNOWLEDGE_REPO_URL: https://github.com/ai-workspace-services/knowledge.git
edgeGateway:
  enabled: false
stunnelClient:
  enabled: false
stunnelServer:
  enabled: false
