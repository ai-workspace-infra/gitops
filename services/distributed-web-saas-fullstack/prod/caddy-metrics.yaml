apiVersion: v1
kind: Service
metadata:
  name: web-saas-caddy-metrics
  namespace: web-saas-k3s-v5
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: web-saas
    websaas.io/workload: caddy
  ports:
    - name: metrics
      port: 9180
      targetPort: 9180
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-saas-caddy-metrics
  namespace: web-saas-k3s-v5
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: web-saas
      websaas.io/workload: caddy
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: datakit
          podSelector:
            matchLabels:
              app: datakit
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: platform-observability
      ports:
        - protocol: TCP
          port: 9180
