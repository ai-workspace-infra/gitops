apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: distributed-web-saas-fullstack
  namespace: web-saas-k3s-v5
spec:
  interval: 5m0s
  releaseName: web-saas
  targetNamespace: web-saas-k3s-v5
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  valuesFrom:
  - kind: ConfigMap
    name: web-saas-fullstack-values
    valuesKey: values.yaml
  suspend: false
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: ConfigMap
          name: web-saas-caddy-config
        patch: |-
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: web-saas-caddy-config
          data:
            Caddyfile: |
              {
                admin off
                auto_https off
                http_port 8080
                https_port 8443
                metrics
              }
              :9180 {
                metrics
              }
              :8080 {
                handle /healthz {
                  respond "ok" 200
                }

                @api path /api /api/*
                handle @api {
                  reverse_proxy web-saas-accounts:80
                }
                handle {
                  respond "not found" 404
                }
              }
              https://accounts-k3s-v5.svc.plus:8443 {
                tls /tls/accounts/tls.crt /tls/accounts/tls.key

                @migration path /api/migrations/v1 /api/migrations/v1/*
                handle @migration {
                  @migration_allowed remote_ip {$source_ip}/32 {$destination_ip}/32
                  handle @migration_allowed {
                    reverse_proxy https://accounts-migration-listener.accounts-migration.svc.cluster.local:9097 {
                      transport http {
                        tls_server_name accounts.svc.plus
                      }
                    }
                  }
                  handle {
                    respond "forbidden" 403
                  }
                }

                @api path /api /api/*
                handle @api {
                  reverse_proxy web-saas-accounts:80
                }
                handle {
                  reverse_proxy web-saas-accounts:80
                }
              }
              https://accounts.svc.plus:8443 {
                tls /tls/accounts/tls.crt /tls/accounts/tls.key

                @migration path /api/migrations/v1 /api/migrations/v1/*
                handle @migration {
                  @migration_allowed remote_ip {$source_ip}/32 {$destination_ip}/32
                  handle @migration_allowed {
                    reverse_proxy https://accounts-migration-listener.accounts-migration.svc.cluster.local:9097 {
                      transport http {
                        tls_server_name accounts.svc.plus
                      }
                    }
                  }
                  handle {
                    respond "forbidden" 403
                  }
                }

                @api path /api /api/*
                handle @api {
                  reverse_proxy web-saas-accounts:80
                }
                handle {
                  reverse_proxy web-saas-accounts:80
                }
              }
              https://billing-k3s-v5.svc.plus:8443 {
                tls /tls/billing/tls.crt /tls/billing/tls.key
                reverse_proxy web-saas-billing:80
              }
              https://billing.svc.plus:8443 {
                tls /tls/billing/tls.crt /tls/billing/tls.key
                reverse_proxy web-saas-billing:80
              }
              https://console-k3s-v5.svc.plus:8443 {
                tls /tls/console/tls.crt /tls/console/tls.key

                @api path /api /api/*
                handle @api {
                  reverse_proxy web-saas-accounts:80
                }
                handle {
                  reverse_proxy web-saas-console:80
                }
              }
              https://console.svc.plus:8443 {
                tls /tls/console/tls.crt /tls/console/tls.key

                @api path /api /api/*
                handle @api {
                  reverse_proxy web-saas-accounts:80
                }
                handle {
                  reverse_proxy web-saas-console:80
                }
              }
              https://xworktech.com:8443 {
                tls /tls/extra-brand-console/tls.crt /tls/extra-brand-console/tls.key

                @api path /api /api/*
                handle @api {
                  reverse_proxy web-saas-accounts:80
                }
                handle {
                  reverse_proxy web-saas-console:80
                }
              }
              https://vault-k3s-v5.svc.plus:8443 {
                tls /tls/extra-vault/tls.crt /tls/extra-vault/tls.key
                reverse_proxy https://vault-raft.platform-vault.svc.cluster.local:8200 {
                  transport http {
                    tls_trust_pool file /trust/vault/ca.crt
                  }
                }
              }
              https://vault.svc.plus:8443 {
                tls /tls/extra-vault/tls.crt /tls/extra-vault/tls.key
                reverse_proxy https://vault-raft.platform-vault.svc.cluster.local:8200 {
                  transport http {
                    tls_trust_pool file /trust/vault/ca.crt
                  }
                }
              }
              https://observability-k3s-v5.svc.plus:8443 {
                tls /tls/extra-observability/tls.crt /tls/extra-observability/tls.key
                reverse_proxy http://platform-observability-observability-stack.platform-observability.svc.cluster.local:3000 {
                }
              }
              https://observability.svc.plus:8443 {
                tls /tls/extra-observability/tls.crt /tls/extra-observability/tls.key
                @metrics_write path /ingest/metrics/api/v1/write
                handle @metrics_write {
                  uri strip_prefix /ingest/metrics
                  reverse_proxy observability-ingest-auth.web-saas-k3s-v5.svc.cluster.local:8427
                }
                handle {
                  reverse_proxy http://platform-observability-observability-stack.platform-observability.svc.cluster.local:3000
                }
              }
      - target:
          kind: Deployment
          name: web-saas-caddy
        patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: web-saas-caddy
          spec:
            template:
              metadata:
                annotations:
                  checksum/caddy-metrics: d4768204cc3a7cc17a1e3e6d69c85f49ae2fd529c6813a2d68ac1221c7cac935
                  checksum/observability-ingest: 023ff736aa943f152c5b340495ff6de725b9eb612e5f4de057f4ec4b392dfb04
              spec:
                containers:
                - name: caddy
                  env:
                  - name: source_ip
                    valueFrom:
                      secretKeyRef:
                        name: migration-network
                        key: source_ip
                  - name: destination_ip
                    valueFrom:
                      secretKeyRef:
                        name: migration-network
                        key: destination_ip
      - target:
          kind: Service
          name: web-saas-caddy-ingress
        patch: |-
          apiVersion: v1
          kind: Service
          metadata:
            name: web-saas-caddy-ingress
          spec:
            externalTrafficPolicy: Local
