apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-saas-secrets
  namespace: web-saas-k3s-v5
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: web-saas-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DATABASE_URL: '{{ regexReplaceAll "/[^/?]+([?].*)?$" .DATABASE_URL "/account${1}"
          }}'
  data:
  - secretKey: password
    remoteRef:
      key: prod/services/web-saas-k3s-v5/database
      property: password
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: prod/services/web-saas-k3s-v5/database
      property: POSTGRES_PASSWORD
  - secretKey: DATABASE_URL
    remoteRef:
      key: prod/services/web-saas-k3s-v5/database
      property: database_url
  - secretKey: INTERNAL_SERVICE_TOKEN
    remoteRef:
      key: prod/services/web-saas-k3s-v5/database
      property: INTERNAL_SERVICE_TOKEN
  - secretKey: ROOT_BOOTSTRAP_PASSWORD
    remoteRef:
      key: prod/services/web-saas-k3s-v5/database
      property: ROOT_BOOTSTRAP_PASSWORD
  - secretKey: ROOT_BOOTSTRAP_EMAIL
    remoteRef:
      key: prod/services/web-saas-k3s-v5/database
      property: ROOT_BOOTSTRAP_EMAIL
  - secretKey: jwt-secret
    remoteRef:
      key: prod/services/web-saas-k3s-v5/jwt
      property: secret
  - secretKey: XCONNECT_OBSERVABILITY_SEARCH_TOKEN
    remoteRef:
      key: prod/services/web-saas-k3s-v5/database
      property: observability_identity_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-saas-tls
  namespace: web-saas-k3s-v5
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: web-saas-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: '{{ .tls_cert }}'
        tls.key: '{{ .tls_key }}'
  data:
  - secretKey: tls_cert
    remoteRef:
      key: prod/services/web-saas-k3s-v5/tls
      property: tls_fullchain_pem
  - secretKey: tls_key
    remoteRef:
      key: prod/services/web-saas-k3s-v5/tls
      property: tls_key_pem
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: content-runtime
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: content-runtime
    creationPolicy: Owner
  data:
  - secretKey: INTERNAL_SERVICE_TOKEN
    remoteRef:
      key: prod/services/web-saas-k3s-v5/database
      property: INTERNAL_SERVICE_TOKEN
