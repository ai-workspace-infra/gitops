apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: web-saas-k3s-v5
spec:
  provider:
    vault:
      server: https://vault-raft.platform-vault.svc.cluster.local:8200
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: vault-raft-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes-web-saas-k3s-v5
          role: web-saas-k3s-v5-prod
          serviceAccountRef:
            name: web-saas-vault-reader
            audiences: [vault-web-saas-k3s-v5-prod]
