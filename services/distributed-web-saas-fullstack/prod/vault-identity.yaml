apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-saas-vault-reader
  namespace: web-saas-k3s-v5
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-vault-login
  namespace: web-saas-k3s-v5
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [web-saas-vault-reader]
    verbs: [get]
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [web-saas-vault-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-vault-login
  namespace: web-saas-k3s-v5
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-vault-login
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: platform
