apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: distributed-web-saas-fullstack
  namespace: feature-xconnect-referral-sit
spec:
  interval: 5m0s
  releaseName: web-saas
  targetNamespace: feature-xconnect-referral-sit
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  valuesFrom:
  - kind: ConfigMap
    name: web-saas-fullstack-values
    valuesKey: values.yaml
  suspend: false
