# Lane isolation: pods may only reach peers in this namespace and cluster DNS.
# No egress to production services, Stripe, Vault or the public internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lane-egress-isolation
  namespace: feature-xconnect-referral-sit
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
