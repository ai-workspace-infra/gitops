mode: server-agent
log:
  level: info
auth:
  enable: true
  token:
    publicToken: ${AUTH_TOKEN_PUBLIC_TOKEN}
    refreshSecret: ${AUTH_TOKEN_REFRESH_SECRET}
    accessSecret: ${AUTH_TOKEN_ACCESS_SECRET}
    accessExpiry: 1h
    refreshExpiry: 168h
  oauth:
    frontendUrl: https://smoke-sit-test-1483-sit.onwalk.net
    github:
      clientId: ${GITHUB_CLIENT_ID}
      clientSecret: ${GITHUB_CLIENT_SECRET}
      redirectUrl: https://accounts-smoke-sit-test-1483-sit.onwalk.net/api/auth/github/callback
    google:
      clientId: ${GOOGLE_CLIENT_ID}
      clientSecret: ${GOOGLE_CLIENT_SECRET}
      redirectUrl: https://accounts-smoke-sit-test-1483-sit.onwalk.net/api/auth/google/callback
server:
  addr: :8080
  readTimeout: 15s
  writeTimeout: 15s
  publicUrl: https://accounts-smoke-sit-test-1483-sit.onwalk.net
  allowedOrigins:
  - https://smoke-sit-test-1483-sit.onwalk.net
  - https://accounts-smoke-sit-test-1483-sit.onwalk.net
  - https://billing-smoke-sit-test-1483-sit.onwalk.net
  tls:
    enabled: false
store:
  driver: postgres
  dsn: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable
  maxOpenConns: 10
  maxIdleConns: 2
session:
  ttl: 24h
  cache: memory
smtp:
  host: smtp.gmail.com
  port: 587
  username: ${SMTP_USERNAME}
  password: ${SMTP_PASSWORD}
  from: ${SMTP_USERNAME}
  timeout: 10s
  tls:
    mode: starttls
    insecureSkipVerify: false
reviewAccount:
  enabled: false
xray:
  sync:
    enabled: false
agent:
  id: accounts-sit
  controllerUrl: http://web-saas-accounts.feature-sit-test-1483-sit.svc.cluster.local
  apiToken: ${AGENT_API_TOKEN}
  httpTimeout: 15s
  statusInterval: 1m
  syncInterval: 5m
