apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-saas-http
  namespace: feature-xconnect-referral-sit
  annotations:
    kubernetes.io/ingress.class: dev-web-saas
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
