    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-saas-caddy-ingress
            port:
              number: 80
  - host: accounts-xconnect-referral-sit.onwalk.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-saas-caddy-ingress
            port:
              number: 80
  - host: billing-xconnect-referral-sit.onwalk.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-saas-caddy-ingress
            port:
              number: 80
