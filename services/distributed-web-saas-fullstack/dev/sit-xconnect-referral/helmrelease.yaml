apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: distributed-web-saas-fullstack
  namespace: feature-xconnect-referral-sit
spec:
  interval: 2m
  releaseName: web-saas
  targetNamespace: feature-xconnect-referral-sit
  serviceAccountName: lane-reconciler
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  valuesFrom:
  - kind: ConfigMap
    name: web-saas-fullstack-values
    valuesKey: values.yaml
  - kind: ConfigMap
    name: web-saas-fullstack-release
    valuesKey: release.yaml
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: StatefulSet
          name: web-saas-postgresql
        patch: "apiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n  name: web-saas-postgresql\n\
          spec:\n  template:\n    spec:\n      securityContext:\n        seccompProfile:\n\
          \          type: RuntimeDefault\n      containers:\n      - name: postgresql\n\
          \        securityContext:\n          allowPrivilegeEscalation: false\n \
          \         capabilities:\n            drop:\n            - ALL\n"
      - target:
          kind: Deployment
          name: web-saas-caddy
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web-saas-caddy\n\
          spec:\n  template:\n    spec:\n      securityContext:\n        seccompProfile:\n\
          \          type: RuntimeDefault\n      containers:\n      - name: caddy\n\
          \        securityContext:\n          allowPrivilegeEscalation: false\n \
          \         capabilities:\n            drop:\n            - ALL\n"
      - target:
          kind: Deployment
          name: web-saas-console
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web-saas-console\n\
          spec:\n  template:\n    spec:\n      containers:\n      - name: console\n\
          \        env:\n        - name: PORT\n          value: '3000'\n"
      - target:
          kind: ConfigMap
          name: web-saas-caddy-config
        patch: |-
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: web-saas-caddy-config
          data:
            Caddyfile: |
              {
                admin off
                auto_https off
                http_port 8080
                metrics
                servers {
                  trusted_proxies static private_ranges
                }
              }
              :9180 {
                metrics
              }
              :8080 {
                respond /healthz "ok" 200
                respond "not found" 404
              }
              http://xconnect-referral-sit.onwalk.net:8080 {
                reverse_proxy web-saas-console:80
              }
              http://accounts-xconnect-referral-sit.onwalk.net:8080 {
                reverse_proxy web-saas-accounts:80
              }
              http://billing-xconnect-referral-sit.onwalk.net:8080 {
                reverse_proxy web-saas-billing:80
              }
      - target:
          kind: NetworkPolicy
          name: web-saas-caddy
        patch: "- op: replace\n  path: /spec/ingress\n  value:\n  - from:\n    - namespaceSelector:\n\
          \        matchLabels:\n          kubernetes.io/metadata.name: platform-ingress\n\
          \      podSelector:\n        matchLabels:\n          app.kubernetes.io/name:\
          \ caddy-ingress-controller\n    - podSelector: {}\n    ports:\n    - protocol: TCP\n    \
          \  port: 8080\n"
      - target:
          kind: NetworkPolicy
          name: web-saas-caddy
        patch: |-
          - op: add
            path: /spec/ingress/-
            value:
              from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: datakit
                podSelector:
                  matchLabels:
                    app: datakit
              ports:
              - protocol: TCP
                port: 9180
      - target:
          kind: Deployment
          name: web-saas-caddy
        patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web-saas-caddy\n\
          spec:\n  template:\n    metadata:\n      annotations:\n        checksum/caddyfile:\
          \ 319943327429b381e2ad2adb320447bc2b87d7a6988649ebc57c25259106e223\n"
