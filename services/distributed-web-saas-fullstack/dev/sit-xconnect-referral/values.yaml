global:
  environment: sit
  expectedNamespace: feature-xconnect-referral-sit
  imagePullSecrets:
  - name: web-saas-registry
edgeGateway:
  enabled: false
stunnelClient:
  enabled: false
stunnelServer:
  enabled: false
caddy:
  enabled: true
  frontendService: console
  gatewayEnabled: false
  httpOnly: true
  service:
    type: ClusterIP
  routes:
    consoleHost: xconnect-referral-sit.onwalk.net
    accountsHost: accounts-xconnect-referral-sit.onwalk.net
    billingHost: billing-xconnect-referral-sit.onwalk.net
  resources:
    requests:
      cpu: 15m
      memory: 48Mi
    limits:
      cpu: 200m
      memory: 128Mi
postgresql:
  enabled: true
  username: lane_admin
  database: account
  existingSecret: web-saas-db-admin
  secretKey: password
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 999
  storage:
    className: local-path
    size: 3Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi
accounts:
  enabled: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  volumes:
  - name: accounts-template
    configMap:
      name: web-saas-accounts-template
  workload:
    port: 8080
    replicas: 1
    env:
      CONFIG_TEMPLATE: /etc/web-saas/account.yaml
      CONFIG_PATH: /tmp/xcontrol/account.yaml
      DB_HOST: web-saas-postgresql.feature-xconnect-referral-sit.svc.cluster.local
      DB_PORT: '5432'
      DB_NAME: account
      POSTGRES_USER: xc_accounts_rw
      DATABASE_RUNTIME_ROLE: primary
      DATABASE_BACKGROUND_WRITERS: 'false'
      ROOT_BOOTSTRAP_EMAIL: root@xconnect-referral-sit.onwalk.net
      XWORKMATE_SHARED_TENANT_DOMAIN: xconnect-referral-sit.onwalk.net
      XWORKMATE_SHARED_TENANT_DOMAINS: xconnect-referral-sit.onwalk.net
      STRIPE_MODE: test
      OAUTH_FRONTEND_URL: https://xconnect-referral-sit.onwalk.net
      OAUTH_GITHUB_REDIRECT_URL: https://accounts-xconnect-referral-sit.onwalk.net/api/auth/github/callback
      OAUTH_GOOGLE_REDIRECT_URL: https://accounts-xconnect-referral-sit.onwalk.net/api/auth/google/callback
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '587'
      SMTP_TLS_MODE: starttls
    secretRefs:
    - web-saas-accounts-runtime
    volumeMounts:
    - name: accounts-template
      mountPath: /etc/web-saas
      readOnly: true
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 500m
        memory: 384Mi
  podAnnotations:
    checksum/account-template: 6fc3a11c3e1ac80a3726b3a84d39733fa37adb0a290acca48d66f572ec95f391
console:
  enabled: true
  deploymentProfile: single-container
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 1000
  volumes:
  - name: nginx-config
    configMap:
      name: web-saas-console-nginx
  singleContainer:
    port: 8080
    replicas: 1
    env:
      HOSTNAME: 0.0.0.0
      RUNTIME_ENV: sit
      NEXT_PUBLIC_RUNTIME_ENVIRONMENT: sit
      ACCOUNT_SERVICE_URL: http://web-saas-accounts.feature-xconnect-referral-sit.svc.cluster.local
      NEXT_PUBLIC_ACCOUNT_SERVICE_URL: https://accounts-xconnect-referral-sit.onwalk.net
      RUNTIME_AUTH_URL: https://accounts-xconnect-referral-sit.onwalk.net
      SERVER_SERVICE_URL: http://web-saas-accounts.feature-xconnect-referral-sit.svc.cluster.local
      SERVER_SERVICE_INTERNAL_URL: http://web-saas-accounts.feature-xconnect-referral-sit.svc.cluster.local
      DOCS_SERVICE_URL: http://web-saas-content.feature-xconnect-referral-sit.svc.cluster.local
      DOCS_SERVICE_INTERNAL_URL: http://web-saas-content.feature-xconnect-referral-sit.svc.cluster.local
      BILLING_SERVICE_URL: http://web-saas-billing.feature-xconnect-referral-sit.svc.cluster.local
      BRIDGE_SERVER_URL: http://bridge-disabled.invalid
      APP_BASE_URL: https://xconnect-referral-sit.onwalk.net
      NEXT_PUBLIC_APP_BASE_URL: https://xconnect-referral-sit.onwalk.net
      NEXT_PUBLIC_SITE_URL: https://xconnect-referral-sit.onwalk.net
      SESSION_COOKIE_SECURE: 'true'
      NEXT_PUBLIC_SESSION_COOKIE_SECURE: 'true'
    secretRefs:
    - web-saas-console-runtime
    volumeMounts:
    - name: nginx-config
      mountPath: /etc/nginx/nginx.conf
      subPath: nginx.conf
      readOnly: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 768Mi
    probes:
      readinessProbe:
        httpGet:
          path: /
          port: primary
      livenessProbe:
        httpGet:
          path: /
          port: primary
        initialDelaySeconds: 30
  podAnnotations:
    checksum/nginx: 8be5c0e358bc82c558a7f8c5bec2d05a5668aabbae39799dfa91fc8149e7d09d
billing:
  enabled: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  workload:
    port: 8080
    replicas: 1
    env:
      APP_ENV: sit
      LISTEN_ADDR: :8080
      DOCS_SERVICE_PORT: '8080'
      BILLING_INGEST_MODE: push
      PULL_ENABLED: 'false'
      DEFAULT_REGION: jp
      DB_MAX_OPEN_CONNS: '5'
    secretRefs:
    - web-saas-billing-runtime
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi
    probes:
      readinessProbe:
        httpGet:
          path: /readyz
          port: primary
      livenessProbe:
        httpGet:
          path: /healthz
          port: primary
        initialDelaySeconds: 30
content:
  enabled: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  workload:
    port: 8080
    replicas: 1
    env:
      APP_ENV: sit
      LISTEN_ADDR: :8080
      DOCS_SERVICE_PORT: '8080'
      KNOWLEDGE_REPO_PATH: /tmp/knowledge
      KNOWLEDGE_REPO_URL: https://github.com/ai-workspace-services/knowledge.git
      KNOWLEDGE_REPO_REF: db624471d944926adb5e96443195aa3e37dffecb
    secretRefs:
    - web-saas-content-runtime
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi
    probes:
      readinessProbe:
        httpGet:
          path: /readyz
          port: primary
      livenessProbe:
        httpGet:
          path: /healthz
          port: primary
        initialDelaySeconds: 30
