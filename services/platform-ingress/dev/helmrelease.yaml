apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dev-ingress
  namespace: platform-ingress
spec:
  interval: 5m
  releaseName: caddy-ingress
  targetNamespace: platform-ingress
  chart:
    spec:
      chart: caddy-ingress-controller
      version: "1.3.0"
      sourceRef:
        kind: HelmRepository
        name: caddyserver
        namespace: platform-ingress
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
  - kind: ConfigMap
    name: dev-ingress-values
    valuesKey: values.yaml
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: caddy-ingress-caddy-ingress-controller
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: caddy-ingress-caddy-ingress-controller
          spec:
            strategy:
              type: Recreate
            template:
              spec:
                nodeSelector:
                  kubernetes.io/hostname: dev-k3s-v5
                containers:
                - name: caddy-ingress-controller
                  ports:
                  - name: http
                    containerPort: 80
                    hostPort: 80
                    protocol: TCP
                  - name: https
                    containerPort: 443
                    hostPort: 443
                    protocol: TCP
