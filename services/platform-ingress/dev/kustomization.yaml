apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- oci-repository.yaml
- helmrelease.yaml
configMapGenerator:
- name: dev-ingress-values
  namespace: platform-ingress
  files:
  - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
