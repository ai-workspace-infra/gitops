apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: accounts-migration-listener-postgres
  namespace: postgresql-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgresql
      app.kubernetes.io/instance: postgresql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: accounts-migration
      podSelector:
        matchLabels:
          app: accounts-migration-listener
    ports:
    - protocol: TCP
      port: 5432
