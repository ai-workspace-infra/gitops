apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: candidate-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  namespace: accounts-migration
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: migration-candidate
  namespace: accounts-migration
spec:
  selector:
    app: migration-candidate
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: migration-candidate
  namespace: accounts-migration
spec:
  serviceName: migration-candidate
  replicas: 1
  selector:
    matchLabels:
      app: migration-candidate
  template:
    metadata:
      labels:
        app: migration-candidate
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
        - name: POSTGRES_DB
          value: account
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: migration-candidate-admin
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 300m
            memory: 384Mi
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - account
          initialDelaySeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: candidate-data
