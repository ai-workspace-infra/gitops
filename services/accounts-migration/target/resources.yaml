apiVersion: v1
kind: Namespace
metadata:
  name: accounts-migration
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: migration-stage
  namespace: accounts-migration
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: candidate-data
  namespace: accounts-migration
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-migration-listener
  namespace: accounts-migration
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: accounts-migration-listener
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
      - name: stage-permissions
        image: ghcr.io/ai-workspace-services/accounts:sha-67f5649ac335f9d3eda737dcd8ccdeb38fdcfbc3@sha256:c7786e2ca360e9b69e521f503213f1c65dff9b06221e520429080aeaf9d255fa
        command:
        - sh
        - -c
        - chmod 700 /private/stage && chown 10001:10001 /private/stage && find /private/stage -maxdepth 1 -type f \( -name '*.gcm' -o -name '.lock' \) -exec chmod 600 {} +
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE
        volumeMounts:
        - name: stage
          mountPath: /private/stage
      containers:
      - name: listener
        image: ghcr.io/ai-workspace-services/accounts:sha-67f5649ac335f9d3eda737dcd8ccdeb38fdcfbc3@sha256:c7786e2ca360e9b69e521f503213f1c65dff9b06221e520429080aeaf9d255fa
        command:
        - /usr/local/bin/migratectl
        args:
        - serve
        - --role
        - target
        - --audience
        - accounts-migration-target
        - --source-audience
        - accounts-migration-source
        - --target-audience
        - accounts-migration-target
        - --job-id
        - 6b70db94-e6de-4cee-902e-92ec1ccede20
        - --dsn-env
        - MIGRATION_DSN
        - --accounts-auth-url
        - https://accounts-selfhost-prod-v6.svc.plus
        - --staging-key-env
        - STAGING_KEY
        - --staging-dir
        - /private/stage
        - --listen
        - 0.0.0.0:9097
        - --tls-cert
        - /tls/tls.crt
        - --tls-key
        - /tls/tls.key
        - --allowed-source-url
        - https://accounts.svc.plus
        - --allowed-peer-cidr
        - $(source_ip)/32
        env:
        - name: source_ip
          valueFrom:
            secretKeyRef:
              name: migration-network
              key: source_ip
        envFrom:
        - secretRef:
            name: migration-listener
        ports:
        - containerPort: 9097
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          tcpSocket:
            port: 9097
          initialDelaySeconds: 5
        volumeMounts:
        - name: stage
          mountPath: /private/stage
        - name: tls
          mountPath: /tls
          readOnly: true
      volumes:
      - name: stage
        persistentVolumeClaim:
          claimName: migration-stage
      - name: tls
        secret:
          secretName: migration-tls
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-migration-listener
  namespace: accounts-migration
spec:
  selector:
    app: accounts-migration-listener
  ports:
  - port: 9097
    targetPort: 9097
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migration-ingress
  namespace: accounts-migration
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-prod
    ports:
    - protocol: TCP
      port: 9097
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: migration-candidate
  namespace: accounts-migration
spec:
  selector:
    app: migration-candidate
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: migration-candidate
  namespace: accounts-migration
spec:
  serviceName: migration-candidate
  replicas: 1
  selector:
    matchLabels:
      app: migration-candidate
  template:
    metadata:
      labels:
        app: migration-candidate
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
        - name: POSTGRES_DB
          value: account
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: migration-candidate-admin
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            cpu: 300m
            memory: 384Mi
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - account
          initialDelaySeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: candidate-data
