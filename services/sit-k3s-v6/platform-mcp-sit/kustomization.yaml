apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-mcp-sit
resources:
- namespace.yaml
- configmap-infrastructure-mcp.yaml
- deployment-infrastructure-mcp.yaml
- service-infrastructure-mcp.yaml
- deployment-observability-mcp.yaml
- service-observability-mcp.yaml
- deployment-mcp-victoria.yaml
- service-mcp-victoria.yaml
- ingress-mcp-server.yaml
- business-networkpolicy.yaml
- vault-secrets.yaml
- vpa.yaml
labels:
- includeSelectors: false
  pairs:
    platform.svc.plus/environment: dev
    platform.svc.plus/cluster: sit-k3s-v6
# Pin a real tag/digest here once the infrastructure-mcp-server image is published.
images:
- name: ghcr.io/ai-workspace-infra/infrastructure-mcp-server
  newTag: v0.4.0-sit
# Shared VPA policy, defined once for every VerticalPodAutoscaler in this unit.
# controlledValues is the API default RequestsAndLimits (limit/request ratio preserved).
patches:
- target:
    kind: VerticalPodAutoscaler
  patch: |-
    - op: add
      path: /spec/updatePolicy
      value:
        updateMode: InPlaceOrRecreate
        minReplicas: 1
