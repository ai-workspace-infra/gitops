apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrastructure-mcp-server
  namespace: platform-mcp-sit
  labels:
    app.kubernetes.io/name: infrastructure-mcp-server
    app.kubernetes.io/part-of: platform-mcp
spec:
  replicas: 1
  # RollingUpdate with no unavailability: a new pod that cannot start (e.g. the
  # platform-mcp Secret has not synced from Vault yet) leaves the old pod serving.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: infrastructure-mcp-server
  template:
    metadata:
      # Bump when configmap-infrastructure-mcp.yaml changes so the gateway reloads its backends.
      annotations:
        platform.svc.plus/config-rev: "2026-11-11-grafana-mcp-server"
      labels:
        app.kubernetes.io/name: infrastructure-mcp-server
        app.kubernetes.io/part-of: platform-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # This pod is the OPS-role executor (CMDB host role "ops"; today sit-k3s-v6,
      # temporarily). Other agents reach SSH tools only via mcp.svc.plus + Bearer.
      initContainers:
      # Render the ssh-mcp-server config from CMDB host resources (GitOps-declared
      # hostnames/FQDNs + auditor; no addresses from Vault).
      - name: render-ssh-config
        image: ghcr.io/ai-workspace-infra/infrastructure-mcp-server:v0.4.0-sit
        imagePullPolicy: IfNotPresent
        args:
        - "-render-ssh-config"
        - "/run/ssh-mcp/ssh-config.json"
        - "-ssh-env"
        - "sit,prod"
        env:
        - name: SSH_MCP_PRIVATE_KEY_PATH
          value: /var/run/secrets/ssh-mcp/ssh-private-key
        - name: INFRA_CMDB_BASE_DIR
          value: /etc/infrastructure-mcp-server/cmdb
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: ssh-mcp-config
          mountPath: /run/ssh-mcp
      containers:
      # classfang/ssh-mcp-server, HTTP transport bound to 127.0.0.1 (not exposed by
      # the Service). Read-only command whitelist comes from the rendered config;
      # file tools are hidden by the gateway (allowed_tools/disabled_tools).
      - name: ssh-mcp-server
        image: node:22.23.4-alpine3.24@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202
        imagePullPolicy: IfNotPresent
        command:
        - npx
        - "-y"
        - "@fangjunjie/ssh-mcp-server@1.11.0"
        - "--config-file"
        - "/run/ssh-mcp/ssh-config.json"
        - "--mcp-transport"
        - "http"
        - "--http-host"
        - "127.0.0.1"
        - "--http-port"
        - "3000"
        - "--pty"
        - "false"
        env:
        - name: HOME
          value: /tmp/home
        - name: npm_config_cache
          value: /tmp/npm-cache
        - name: npm_config_update_notifier
          value: "false"
        # Same token as the gateway's inbound MCP_SERVICE_TOKEN (one Vault field).
        - name: SSH_MCP_HTTP_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-mcp
              key: mcp-service-token
        resources:
          requests:
            cpu: 20m
            memory: 96Mi
          limits:
            cpu: 300m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: ssh-mcp-config
          mountPath: /run/ssh-mcp
          readOnly: true
        - name: ssh-mcp-key
          mountPath: /var/run/secrets/ssh-mcp
          readOnly: true
        - name: ssh-mcp-tmp
          mountPath: /tmp
      - name: infrastructure-mcp-server
        # IMAGE PLACEHOLDER: the Infrastructure-MCP-Server repo has a Dockerfile but no
        # publish workflow, and ghcr.io/ai-workspace-infra/infrastructure-mcp-server is not
        # anonymously pullable. Pin a real tag/digest via the `images:` block in
        # kustomization.yaml once an image is published (or import a locally built one).
        # A tag-triggered GHCR publish workflow is proposed in Infrastructure-MCP-Server#17;
        # the package must then be made public or an imagePullSecret added (G7).
        image: ghcr.io/ai-workspace-infra/infrastructure-mcp-server:v0.4.0-sit
        imagePullPolicy: IfNotPresent
        args:
        - "-config"
        - "/etc/infrastructure-mcp-server/config.json"
        - "-listen"
        - ":8080"
        env:
        - name: VICTORIAMETRICS_URL
          value: "http://observability-observability-stack-victoria-metrics.observability-sit.svc:8428"
        - name: VICTORIALOGS_URL
          value: "http://observability-observability-stack-victoria-logs.observability-sit.svc:9428"
        - name: VICTORIATRACES_URL
          value: "http://observability-observability-stack-victoria-traces.observability-sit.svc:10428"
        - name: GRAFANA_URL
          value: "http://observability-observability-stack-grafana.observability-sit.svc:3000"
        - name: OBSERVABILITY_BASE_URL
          value: "https://observability.svc.plus"
        # Created by the bootstrap playbook (see SECRETS.md). Optional so the pod can
        # start before the Secret exists. Enforced as inbound Bearer auth by images built
        # from Infrastructure-MCP-Server#17 or later; when unset the server logs a warning
        # and stays unauthenticated.
        - name: MCP_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              # Also used as bearer_token_env for the localhost ssh backend.
              name: platform-mcp
              key: mcp-service-token
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config-volume
          mountPath: /etc/infrastructure-mcp-server
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: infrastructure-mcp-config
      - name: ssh-mcp-config
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: ssh-mcp-tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: ssh-mcp-key
        secret:
          secretName: platform-mcp
          # 0600; with pod fsGroup 65532 kubelet adds group-read (effective 0640 root:65532).
          defaultMode: 0600
          items:
          - key: ssh-private-key
            path: ssh-private-key
            mode: 0600
