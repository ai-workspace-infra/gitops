apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-victoriametrics
  namespace: platform-mcp-sit
  labels:
    app.kubernetes.io/name: mcp-victoriametrics
    app.kubernetes.io/part-of: platform-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-victoriametrics
        app.kubernetes.io/part-of: platform-mcp
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mcp-victoriametrics
        image: ghcr.io/victoriametrics/mcp-victoriametrics:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: VM_INSTANCE_ENTRYPOINT
          value: http://observability-observability-stack-victoria-metrics.observability-sit.svc:8428
        - name: VM_INSTANCE_TYPE
          value: single
        - name: MCP_SERVER_MODE
          value: http
        - name: MCP_LISTEN_ADDR
          value: "0.0.0.0:8088"
        ports:
        - containerPort: 8088
          name: mcp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-victorialogs
  namespace: platform-mcp-sit
  labels:
    app.kubernetes.io/name: mcp-victorialogs
    app.kubernetes.io/part-of: platform-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-victorialogs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-victorialogs
        app.kubernetes.io/part-of: platform-mcp
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mcp-victorialogs
        image: ghcr.io/victoriametrics/mcp-victorialogs:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: VL_INSTANCE_ENTRYPOINT
          value: http://observability-observability-stack-victoria-logs.observability-sit.svc:9428
        - name: MCP_SERVER_MODE
          value: http
        - name: MCP_LISTEN_ADDR
          value: "0.0.0.0:8083"
        # PORT / READ_ONLY removed: not read by mcp-victorialogs (not in its README env
        # table). The server only exposes query tools; use MCP_DISABLED_TOOLS to restrict.
        ports:
        - containerPort: 8083
          name: mcp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
