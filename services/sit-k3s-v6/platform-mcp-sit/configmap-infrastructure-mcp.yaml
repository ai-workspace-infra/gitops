apiVersion: v1
kind: ConfigMap
metadata:
  name: infrastructure-mcp-config
  namespace: platform-mcp-sit
  labels:
    app.kubernetes.io/name: infrastructure-mcp-server
    app.kubernetes.io/part-of: platform-mcp
data:
  # Downstream MCP servers aggregated by Infrastructure MCP Server.
  # Grafana MCP + VictoriaMetrics MCP + VictoriaLogs MCP + VictoriaTraces MCP.
  config.json: |
    {
      "server": {
        "name": "infrastructure-mcp-server",
        "version": "0.3.0"
      },
      "backends": [
        {
          "name": "observability-grafana",
          "capability": "observability",
          "transport": "sse",
          "url": "http://mcp-grafana.platform-mcp-sit.svc.cluster.local:8000/v1/grafana/sse",
          "enabled": true
        },
        {
          "name": "observability-metrics",
          "capability": "observability",
          "transport": "streamable-http",
          "url": "http://mcp-victoriametrics.platform-mcp-sit.svc.cluster.local:8088/mcp",
          "enabled": true
        },
        {
          "name": "observability-logs",
          "capability": "observability",
          "transport": "streamable-http",
          "url": "http://mcp-victorialogs.platform-mcp-sit.svc.cluster.local:8083/mcp",
          "enabled": true
        },
        {
          "name": "observability-traces",
          "capability": "observability",
          "transport": "streamable-http",
          "url": "http://mcp-victoriatraces.platform-mcp-sit.svc.cluster.local:8082/mcp",
          "enabled": true
        }
      ]
    }
