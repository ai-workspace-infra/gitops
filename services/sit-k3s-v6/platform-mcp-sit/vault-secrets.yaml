# Secrets for the MCP stack, synced by External Secrets (identity:
# security/vault/workload-identities/sit-k3s-v6-platform-mcp-reader.yaml, policy
# platform-mcp-reader). Vault holds secrets only; field list: SECRETS.md.
# Usernames, URLs, hostnames and the auditor user are declared in Git, not Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-mcp-reader
  namespace: platform-mcp-sit
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-mcp-reader
  namespace: platform-mcp-sit
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [platform-mcp-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-mcp-reader
  namespace: platform-mcp-sit
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-mcp-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform-mcp-reader
  namespace: platform-mcp-sit
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-sit-k3s-sit-k3s-v6
          role: sit-k3s-v6-platform-mcp-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: platform-mcp-reader
            audiences: [vault-sit-k3s-v6-platform-mcp-reader]
            expirationSeconds: 600
---
# The single Secret for the MCP stack. Each Vault field is referenced exactly once
# here; Deployments only reference Secret "platform-mcp" keys (see SECRETS.md).
#   mcp-service-token: gateway inbound Bearer AND the localhost ssh-mcp-server token
#   ssh-private-key:   auditor key, stored base64 in Vault, decoded to the raw key
#   grafana-password:  shared observability credential, referenced not copied
#                      (SIT Grafana has only admin; read-only via mcp-grafana flags +
#                      gateway filter until a viewer SA token field exists)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-mcp
  namespace: platform-mcp-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: platform-mcp-reader
  target:
    name: platform-mcp
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: mcp-service-token
      remoteRef:
        key: sit/platform/mcp
        property: mcp_service_token
    - secretKey: ssh-private-key
      remoteRef:
        key: sit/platform/mcp
        property: ssh_private_key_b64
        decodingStrategy: Base64
    - secretKey: grafana-password
      remoteRef:
        key: sit/platform/observability
        property: grafana_admin_password
