# Secrets for the MCP gateway pod, synced by External Secrets from Vault KV
# kv/data/CICD/infrastructure-mcp (identity: security/vault/workload-identities/
# sit-k3s-v6-platform-mcp-reader.yaml, policy: platform-mcp-reader). No values in Git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-mcp-reader
  namespace: platform-mcp-sit
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-mcp-reader
  namespace: platform-mcp-sit
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [platform-mcp-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-mcp-reader
  namespace: platform-mcp-sit
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-mcp-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform-mcp-reader
  namespace: platform-mcp-sit
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-sit-k3s-sit-k3s-v6
          role: sit-k3s-v6-platform-mcp-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: platform-mcp-reader
            audiences: [vault-sit-k3s-v6-platform-mcp-reader]
            expirationSeconds: 600
---
# auditor SSH key + localhost bearer token for the ssh-mcp-server sidecar.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-mcp-ssh
  namespace: platform-mcp-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: platform-mcp-reader
  target:
    name: infra-mcp-ssh
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ssh-private-key
      remoteRef:
        key: CICD/infrastructure-mcp
        property: ssh_private_key
    - secretKey: ssh-mcp-http-token
      remoteRef:
        key: CICD/infrastructure-mcp
        property: ssh_mcp_http_token
---
# Optional {hostname: address} map for names that do not resolve in-cluster
# (e.g. sit-k3s-v6 / prod-k3s-v6). Separate so a missing field does not block the key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-mcp-ssh-host-map
  namespace: platform-mcp-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: platform-mcp-reader
  target:
    name: infra-mcp-ssh-host-map
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ssh-host-map
      remoteRef:
        key: CICD/infrastructure-mcp
        property: ssh_host_map
---
# Grafana Viewer service-account token for mcp-grafana.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana-token
  namespace: platform-mcp-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: platform-mcp-reader
  target:
    name: mcp-grafana-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: grafana-service-account-token
      remoteRef:
        key: CICD/infrastructure-mcp
        property: grafana_service_account_token
