# Secrets for the MCP stack, synced by External Secrets (identity:
# security/vault/workload-identities/sit-k3s-v6-platform-mcp-reader.yaml, policy
# platform-mcp-reader). Vault holds secrets only:
#   kv/sit/platform/mcp           -> mcp_service_token, ssh_private_key_b64, ssh_mcp_http_token
#   kv/sit/platform/observability -> grafana_admin_password (shared, referenced not copied)
# Usernames, URLs, hostnames and the auditor user are declared in Git, not Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-mcp-reader
  namespace: platform-mcp-sit
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-mcp-reader
  namespace: platform-mcp-sit
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [platform-mcp-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-mcp-reader
  namespace: platform-mcp-sit
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-mcp-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform-mcp-reader
  namespace: platform-mcp-sit
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-sit-k3s-sit-k3s-v6
          role: sit-k3s-v6-platform-mcp-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: platform-mcp-reader
            audiences: [vault-sit-k3s-v6-platform-mcp-reader]
            expirationSeconds: 600
---
# auditor SSH key + localhost bearer token for the ssh-mcp-server sidecar.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-mcp-ssh
  namespace: platform-mcp-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: platform-mcp-reader
  target:
    name: infra-mcp-ssh
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Vault stores the key as a single-line base64 string; ESO decodes it so the
    # k8s Secret (and the mounted file) holds the raw OpenSSH/PEM private key.
    - secretKey: ssh-private-key
      remoteRef:
        key: sit/platform/mcp
        property: ssh_private_key_b64
        decodingStrategy: Base64
    - secretKey: ssh-mcp-http-token
      remoteRef:
        key: sit/platform/mcp
        property: ssh_mcp_http_token
---
# Gateway inbound Bearer token (MCP_SERVICE_TOKEN). New Secret name so it does not
# collide with the bootstrap-created infra-mcp-auth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infra-mcp-service-token
  namespace: platform-mcp-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: platform-mcp-reader
  target:
    name: infra-mcp-service-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: mcp-service-token
      remoteRef:
        key: sit/platform/mcp
        property: mcp_service_token
---
# Grafana credential for mcp-grafana, referenced from the observability path.
# SIT Grafana only has the admin account (no viewer SA yet): mcp-grafana runs with
# --disable-write --disable-admin and the gateway filters write-style tools.
# Switch to a viewer SA token field (grafana_mcp_sa_token) once it exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana-auth
  namespace: platform-mcp-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: platform-mcp-reader
  target:
    name: mcp-grafana-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: sit/platform/observability
        property: grafana_admin_password
