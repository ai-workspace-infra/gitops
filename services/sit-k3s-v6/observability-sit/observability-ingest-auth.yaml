apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-ingest-reader
  namespace: observability-sit
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observability-ingest-reader
  namespace: observability-sit
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [observability-ingest-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-ingest-reader
  namespace: observability-sit
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observability-ingest-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: observability-ingest-reader
  namespace: observability-sit
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-sit-k3s-sit-k3s-v6
          role: sit-k3s-v6-observability-ingest-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: observability-ingest-reader
            audiences: [vault-sit-k3s-v6-observability-ingest-reader]
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-ingest-auth
  namespace: observability-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: observability-ingest-reader
  target:
    name: observability-ingest-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        username: "{{ .user }}"
        password: "{{ .password }}"
        auth.yaml: |
          users:
            - username: "{{ .user }}"
              password: "{{ .password }}"
              url_map:
                - src_paths: ["/api/v1/write"]
                  url_prefix: "http://observability-observability-stack-victoria-metrics.observability-sit.svc:8428"
                - src_paths: ["/api/v1/query", "/api/v1/query_range"]
                  url_prefix: "http://observability-observability-stack-victoria-metrics.observability-sit.svc:8428"
                - src_paths: ["/insert/jsonline", "/insert/jsonline.*"]
                  url_prefix: "http://observability-observability-stack-victoria-logs.observability-sit.svc:9428"
                - src_paths: ["/v1/traces", "/insert/opentelemetry/v1/traces"]
                  url_prefix: "http://observability-observability-stack-victoria-traces.observability-sit.svc:10428"
  data:
    - secretKey: user
      remoteRef:
        key: CICD/observability
        property: user
    - secretKey: password
      remoteRef:
        key: CICD/observability
        property: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-ingest-auth
  namespace: observability-sit
  labels:
    app.kubernetes.io/name: observability-ingest-auth
    app.kubernetes.io/part-of: platform-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observability-ingest-auth
  template:
    metadata:
      labels:
        app: observability-ingest-auth
        app.kubernetes.io/name: observability-ingest-auth
        app.kubernetes.io/part-of: platform-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: vmauth
          image: victoriametrics/vmauth:v1.101.0@sha256:2b56af142a4a5549a333a3882b10cfb01de7807979ffec46f081152ad238d666
          args: ["-auth.config=/etc/vmauth/auth.yaml", "-configCheckInterval=30s"]
          ports:
            - name: http
              containerPort: 8427
          readinessProbe:
            tcpSocket: {port: http}
          livenessProbe:
            tcpSocket: {port: http}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: auth
              mountPath: /etc/vmauth
              readOnly: true
      volumes:
        - name: auth
          secret:
            secretName: observability-ingest-auth
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: observability-ingest-auth
  namespace: observability-sit
  labels:
    app.kubernetes.io/name: observability-ingest-auth
spec:
  type: ClusterIP
  selector:
    app: observability-ingest-auth
  ports:
    - name: http
      port: 8427
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-ingest-auth
  namespace: observability-sit
spec:
  podSelector:
    matchLabels:
      app: observability-ingest-auth
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-sit
      ports:
        - protocol: TCP
          port: 8427
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: vmagent
      ports:
        - protocol: TCP
          port: 8427
