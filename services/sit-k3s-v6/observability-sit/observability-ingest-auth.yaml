apiVersion: v1
kind: Secret
metadata:
  name: observability-ingest-auth
  namespace: observability-sit
type: Opaque
stringData:
  auth.yaml: |
    users:
      - username: "sit-ingest"
        password: "sit-ingest-password"
        url_map:
          - src_paths:
              - "/api/v1/write"
            url_prefix: "http://observability-observability-stack.observability-sit.svc:8428"
          - src_paths:
              - "/insert/jsonline"
              - "/insert/jsonline.*"
            url_prefix: "http://observability-observability-stack.observability-sit.svc:9428"
          - src_paths:
              - "/v1/traces"
              - "/insert/opentelemetry/v1/traces"
            url_prefix: "http://observability-observability-stack.observability-sit.svc:10428"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-ingest-auth
  namespace: observability-sit
  labels:
    app.kubernetes.io/name: observability-ingest-auth
    app.kubernetes.io/part-of: platform-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observability-ingest-auth
  template:
    metadata:
      labels:
        app: observability-ingest-auth
        app.kubernetes.io/name: observability-ingest-auth
        app.kubernetes.io/part-of: platform-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: vmauth
          image: victoriametrics/vmauth:v1.101.0@sha256:2b56af142a4a5549a333a3882b10cfb01de7807979ffec46f081152ad238d666
          args: ["-auth.config=/etc/vmauth/auth.yaml", "-configCheckInterval=30s"]
          ports:
            - name: http
              containerPort: 8427
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: auth
              mountPath: /etc/vmauth
              readOnly: true
      volumes:
        - name: auth
          secret:
            secretName: observability-ingest-auth
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: observability-ingest-auth
  namespace: observability-sit
  labels:
    app.kubernetes.io/name: observability-ingest-auth
spec:
  type: ClusterIP
  selector:
    app: observability-ingest-auth
  ports:
    - name: http
      port: 8427
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-ingest-auth
  namespace: observability-sit
spec:
  podSelector:
    matchLabels:
      app: observability-ingest-auth
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-sit
      ports:
        - protocol: TCP
          port: 8427
