---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: business-namespaces-ingress
  namespace: observability-sit-sit
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - web-saas-sit
          - postgresql-sit
          - ingress-prod
          - observability-sit
          - vault-prod
