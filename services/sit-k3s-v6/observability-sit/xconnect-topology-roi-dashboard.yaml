apiVersion: v1
kind: ConfigMap
metadata:
  name: xconnect-topology-roi-dashboard
data:
  xconnect-topology-roi-dashboard.json: |
    {
      "uid": "xconnect-topology-dynamic-roi",
      "title": "XConnect 边缘节点核心拓扑与 2C1G Lightsail 动态 ROI 面板",
      "description": "Dynamic XConnect 5-Service Core Topology (xconnect-edge-agent, fluxgate, xconnect-proxy-xray, xconnect-gateway-xray, vector), k6 40VU vs 500VU (30m) Timeseries, Little's Law Knee & 939 MiB Memory Scaling, and P95 SLO + AWS Lightsail 2C1G ($7/$10/$12) ROI Panel.",
      "tags": [
        "xconnect",
        "fluxgate",
        "xray",
        "vector",
        "k6",
        "roi",
        "lightsail",
        "capacity"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_METRICS",
            "label": "Metrics Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "selected": true,
              "text": "VictoriaMetrics",
              "value": "P4169E866C3094E38"
            }
          },
          {
            "name": "environment",
            "label": "Environment",
            "type": "custom",
            "query": "prod,sit,uat",
            "current": {
              "selected": true,
              "text": "sit",
              "value": "sit"
            }
          },
          {
            "name": "instance",
            "label": "Target Edge Node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_METRICS}"
            },
            "definition": "label_values(xray_up, instance)",
            "query": "label_values(xray_up, instance)",
            "refresh": 2,
            "includeAll": false,
            "current": {
              "selected": true,
              "text": "jp-xconnect-02.svc.plus",
              "value": "jp-xconnect-02.svc.plus"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "",
          "type": "xconnect-topology-roi-panel",
          "gridPos": {
            "h": 42,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_METRICS}"
          },
          "targets": [
            {
              "refId": "VU",
              "expr": "max(fluxgate_active_connections{instance=~\"$instance.*\"}) or max(k6_vus)",
              "legendFormat": "Active VUs / Connections",
              "instant": true
            },
            {
              "refId": "QPS",
              "expr": "sum(rate(fluxgate_http_requests_total{instance=~\"$instance.*\"}[1m])) or sum(rate(k6_http_reqs_total[1m]))",
              "legendFormat": "Live QPS",
              "instant": true
            },
            {
              "refId": "P95",
              "expr": "max(k6_http_req_duration_p95) or (histogram_quantile(0.95, sum by (le) (rate(fluxgate_http_request_duration_seconds_bucket{instance=~\"$instance.*\"}[5m]))) * 1000)",
              "legendFormat": "Live P95 Latency (ms)",
              "instant": true
            },
            {
              "refId": "MEM_TOTAL",
              "expr": "max(node_memory_MemTotal_bytes{instance=~\"$instance.*\"})",
              "legendFormat": "Node Total Memory",
              "instant": true
            },
            {
              "refId": "MEM_AVAIL",
              "expr": "min(node_memory_MemAvailable_bytes{instance=~\"$instance.*\"})",
              "legendFormat": "Node Available Memory",
              "instant": true
            },
            {
              "refId": "PROC_RSS",
              "expr": "max by (groupname) (namedprocess_namegroup_memory_bytes{memtype=\"resident\",instance=~\"$instance.*\",groupname=~\"fluxgate|xray|xconnect-edge-agent|vector|systemd-journal.*\"})",
              "legendFormat": "{{groupname}}",
              "instant": true
            },
            {
              "refId": "XRAY_UP",
              "expr": "max(xray_up{instance=~\"$instance.*\"})",
              "legendFormat": "xray_up",
              "instant": true
            }
          ],
          "options": {
            "viewMode": "all",
            "defaultLayer": "all",
            "defaultTargetVu": 120,
            "defaultUserMultiplier": 4,
            "defaultTierPrice": 7,
            "cleanTmpfs": true,
            "vectorOptimized": true,
            "followLiveVu": false,
            "nodeHostname": "$instance",
            "totalRamMib": 939
          }
        }
      ]
    }
