apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: observability-agent-chart
  namespace: observability-sit
spec:
  interval: 5m
  url: oci://ghcr.io/ai-workspace-infra/observability-agent
  ref:
    digest: sha256:5c4fb411cffad6b3ef03f4d899687c271649144f3ff5d311ca027b9121157893
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability-agent
  namespace: observability-sit
spec:
  suspend: false
  interval: 5m
  releaseName: observability-agent
  targetNamespace: observability-sit
  chartRef:
    kind: OCIRepository
    name: observability-agent-chart
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: observability-agent-vmagent
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: observability-agent-vmagent
              spec:
                template:
                  spec:
                    containers:
                      - name: vmagent
                        args:
                          - -httpListenAddr=:8429
                          - -promscrape.config=/etc/vmagent/scrape.yml
                          - -remoteWrite.url=https://traefik-ingress.ingress-sit.svc.cluster.local/api/v1/write
                          - -remoteWrite.tlsServerName=observability.svc.plus
                          - -remoteWrite.basicAuth.username=$(REMOTE_WRITE_USERNAME)
                          - -remoteWrite.basicAuth.passwordFile=/etc/vmagent/auth/password
                          - -remoteWrite.tmpDataPath=/var/lib/vmagent
                          - -remoteWrite.maxDiskUsagePerURL=256MiB
                        env:
                          - name: REMOTE_WRITE_USERNAME
                            valueFrom:
                              secretKeyRef:
                                name: observability-ingest-auth
                                key: username
          - target:
              kind: DaemonSet
              name: observability-agent
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: observability-agent
              spec:
                template:
                  spec:
                    containers:
                      - name: node-exporter
                        livenessProbe:
                          timeoutSeconds: 5
                        readinessProbe:
                          timeoutSeconds: 5
          - target:
              kind: DaemonSet
              name: observability-agent-process
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: observability-agent-process
              spec:
                template:
                  spec:
                    containers:
                      - name: process-exporter
                        startupProbe:
                          timeoutSeconds: 5
                        livenessProbe:
                          timeoutSeconds: 5
                        readinessProbe:
                          timeoutSeconds: 5
          - target:
              kind: Deployment
              name: observability-agent-state
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: observability-agent-state
              spec:
                template:
                  spec:
                    containers:
                      - name: kube-state-metrics
                        livenessProbe:
                          timeoutSeconds: 5
                        readinessProbe:
                          timeoutSeconds: 5
  values:
    fullnameOverride: observability-agent
    nodeExporter:
      enabled: true
      hostMetrics: true
      hostNetwork: true
      listenOnNodeIP: true
      image:
        repository: quay.io/prometheus/node-exporter
        tag: v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    kubeStateMetrics:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 25m
          memory: 48Mi
    processExporter:
      enabled: true
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 150m
          memory: 64Mi
    vector:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
    blackboxExporter:
      enabled: true
      modules:
        # 全局边缘入口的可用性与证书到期探测。
        # 这组探测原先由每台边缘主机上的 blackbox_exporter + Vector 用
        # scrape_interval_secs=15 各自执行: 4 台机器 × 9 个域名 × 每天 5760 轮
        # ≈ 21 万次外部 HTTPS 请求/天, 只为得到一个"证书若干天后过期"的天级信号。
        # 收到中心集群每小时探测一次即可, 边缘主机不再承担对外探活。
        https_ssl:
          prober: http
          timeout: 5s
          http:
            method: GET
            preferred_ip_protocol: ip4
            # TLS 握手失败仍然会让 probe_success 归 0; 3xx/401/403/404 依旧是
            # 有效的证书到期观测目标, 不能当成 probe 失败。
            valid_status_codes:
            - 200
            - 301
            - 302
            - 307
            - 308
            - 401
            - 403
            - 404
        release_http_ok:
          prober: http
          timeout: 5s
          http:
            preferred_ip_protocol: ip4
            valid_status_codes:
            - 200
            follow_redirects: false
        release_login_redirect:
          prober: http
          timeout: 5s
          http:
            preferred_ip_protocol: ip4
            valid_status_codes:
            - 302
            - 307
            - 308
            follow_redirects: false
            fail_if_header_not_matches:
            - header: Location
              regexp: ^(/login|https?://[^/]+/login)([?].*)?$
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    vmagent:
      enabled: true
      externalLabels:
        cluster: sit-k3s-v6
        environment: sit
      scrapeInterval: 30s
      scrapeTimeout: 10s
      scrapeConfigs:
      # 全局边缘入口探测: 由中心集群统一执行, 取代每台边缘主机各自的 15s 探活。
      # 证书过期是天级信号, 1h 一次足够; 30s 会在边缘侧放大成每天二十余万次外部请求。
      # 命中目标是生产域名, 因此显式打 target_environment=prod 与
      # probe_source=center, 避免看板把"从 SIT 探测到的生产可用性"误读成 SIT 自身状态。
      - job_name: global-edge-https-probes
        metrics_path: /probe
        scrape_interval: 1h
        scrape_timeout: 30s
        # 模块用 job 级 params 选择, 与 services/platform-observability/
        # prod-vmagent/scrape.yml 的 blackbox-* job 写法保持一致; 不用
        # relabel 从标签推导, 避免依赖 static_configs.labels 在 relabel 阶段的可见性。
        params:
          module:
          - https_ssl
        static_configs:
        - targets:
          - https://jp-xhttp.svc.plus
          - https://tky-proxy.svc.plus
          - https://www.svc.plus
          - https://jp-xconnect.svc.plus
          - https://us-xconnect.svc.plus
          - https://hk-xconnect.svc.plus
          - https://ph-xconnect.svc.plus
          - https://console.svc.plus
          - https://accounts.svc.plus
          labels:
            service: edge-entry
            probe_source: center
            target_environment: prod
            target_project: svc.plus
        relabel_configs:
        - source_labels:
          - __address__
          target_label: __param_target
        - source_labels:
          - __param_target
          target_label: instance
        - source_labels:
          - __param_target
          target_label: target
        - target_label: __address__
          replacement: observability-agent-blackbox.observability-sit.svc:9115
      - job_name: progressive-release-probes
        metrics_path: /probe
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
        - targets:
          - http://web-saas-console.web-saas-sit.svc/healthz
          labels:
            service: console
            route: /healthz
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - http://web-saas-console.web-saas-sit.svc/login
          labels:
            service: console
            route: /login
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - http://web-saas-console.web-saas-sit.svc/panel/agent
          labels:
            service: console
            route: /panel/agent
            probe_module: release_login_redirect
            expected_status: '307'
        - targets:
          - http://web-saas-accounts.web-saas-sit.svc/healthz
          labels:
            service: accounts
            route: /healthz
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - http://web-saas-accounts.web-saas-sit.svc/readyz
          labels:
            service: accounts
            route: /readyz
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - http://web-saas-accounts.web-saas-sit.svc/api/ping
          labels:
            service: accounts
            route: /api/ping
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - http://web-saas-accounts.web-saas-sit.svc/api/billing/plans
          labels:
            service: accounts
            route: /api/billing/plans
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - http://web-saas-billing.web-saas-sit.svc/healthz
          labels:
            service: billing
            route: /healthz
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - http://web-saas-billing.web-saas-sit.svc/readyz
          labels:
            service: billing
            route: /readyz
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - http://web-saas-billing.web-saas-sit.svc/api/ping
          labels:
            service: billing
            route: /api/ping
            probe_module: release_http_ok
            expected_status: '200'
        relabel_configs:
        - source_labels:
          - __address__
          target_label: __param_target
        - source_labels:
          - probe_module
          target_label: __param_module
        - source_labels:
          - __param_target
          target_label: instance
        - target_label: __address__
          replacement: observability-agent-blackbox.observability-sit.svc:9115
      remoteWrite:
        url: https://traefik-ingress.ingress-sit.svc.cluster.local/api/v1/write
        secretName: observability-ingest-auth
        usernameKey: username
        passwordKey: password
        maxDiskUsagePerURL: 256Mi
      bufferSizeLimit: 256Mi
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
