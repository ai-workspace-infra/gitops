dashboardExtend:
  groupUnfoldStatus:
    Detailed metrics: true
    Heatmaps: true
    Summary: true
description: Caddy HTTP server monitoring.
main:
  charts:
  - extend:
      settings:
        changeWorkspace: false
        chartType: line
        direction: auto
        extend:
          appearance:
            colorMode: value
            fieldColorMode: fixed
            graphMode: none
            justifyMode: auto
            reduceCalcs:
            - lastNotNull
            reduceValues: false
            textMode: auto
            thresholdsMode: absolute
        fixedTime: ''
        isSampling: true
        isTimeInterval: false
        legendPostion: none
        lineType: linear
        mainMeasurementQueryCode: A
        openThousandsSeparator: true
        precision: '2'
        showFieldMapping: false
        showLineAxis: false
        showTitle: true
        stackType: time
        timeInterval: auto
        titleDesc: The number of requests currently being handled by the server.
    group:
      name: Summary
    name: Requests in flight
    pos:
      h: 9.6
      w: 4
      x: 0
      y: 2.4
    queries:
    - datasource: dataflux
      disabled: false
      extend:
        datasource:
          type: prometheus
          uid: ${datasource}
        editorMode: code
        refId: A
      qtype: promql
      query:
        code: A
        promqlCode: 1
        q: sum(caddy_http_requests_in_flight{environment=~"#{environment}",cluster=~"#{cluster}",service=~"#{service}",instance=~"#{instance}"})
        type: promql
