apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-domain-tls-reader
  namespace: ingress-sit
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observability-domain-tls-reader
  namespace: ingress-sit
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [observability-domain-tls-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-domain-tls-reader
  namespace: ingress-sit
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observability-domain-tls-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: observability-domain-tls-reader
  namespace: ingress-sit
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-sit-k3s-sit-k3s-v6
          role: sit-k3s-v6-observability-domain-tls-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: observability-domain-tls-reader
            audiences: [vault-sit-k3s-v6-observability-domain-tls-reader]
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shared-observability-tls
  namespace: ingress-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: observability-domain-tls-reader
  target:
    name: shared-observability-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .tls_fullchain }}"
        tls.key: "{{ .tls_key }}"
  data:
    - secretKey: tls_fullchain
      remoteRef:
        key: sit/platform/domains/svc.plus
        property: tls_fullchain_pem_b64
        decodingStrategy: Base64
    - secretKey: tls_key
      remoteRef:
        key: sit/platform/domains/svc.plus
        property: tls_key_pem_b64
        decodingStrategy: Base64
