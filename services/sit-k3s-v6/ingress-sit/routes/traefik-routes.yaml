apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sit-platform-routes
  namespace: ingress-sit
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Console (Frontend)
    - match: Host(`console-sit.onwalk.net`) || Host(`app-sit.onwalk.net`) || Host(`console.sit.onwalk.net`) || Host(`app.sit.onwalk.net`)
      kind: Rule
      services:
        - kind: TraefikService
          name: web-saas-console
          namespace: web-saas-sit
    # Accounts (Auth / Sessions / API)
    - match: Host(`accounts-sit.onwalk.net`) || Host(`accounts.sit.onwalk.net`)
      kind: Rule
      services:
        - kind: TraefikService
          name: web-saas-accounts
          namespace: web-saas-sit
    # Billing
    - match: Host(`billing-sit.onwalk.net`) || Host(`billing.sit.onwalk.net`)
      kind: Rule
      services:
        - kind: TraefikService
          name: web-saas-billing
          namespace: web-saas-sit
    # Observability (Grafana)
    - match: Host(`grafana-sit.onwalk.net`) || Host(`grafana.sit.onwalk.net`)
      kind: Rule
      services:
        - name: observability-observability-stack
          namespace: observability-sit
          port: 3000
    # AI Infrastructure MCP Server (Legacy onwalk.net aliases)
    - match: Host(`mcp-sit.onwalk.net`) || Host(`mcp.sit.onwalk.net`)
      kind: Rule
      services:
        - name: infrastructure-mcp-server
          namespace: platform-mcp-sit
          port: 8080
  tls:
    secretName: console-tls
---
# SIT AI Infrastructure MCP Server alias (https://mcp-sit.svc.plus)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sit-mcp-svc-plus-routes
  namespace: ingress-sit
  labels:
    kustomize.toolkit.fluxcd.io/name: ingress-sit
    kustomize.toolkit.fluxcd.io/namespace: flux-system
    platform.svc.plus/cluster: sit-k3s-v6
    platform.svc.plus/environment: sit
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`mcp-sit.svc.plus`)
      kind: Rule
      services:
        - name: infrastructure-mcp-server
          namespace: platform-mcp-sit
          port: 8080
  tls:
    secretName: shared-observability-tls
---
# Shared AI Infrastructure MCP Server alias stays with its existing DNS owner.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: shared-mcp-svc-plus-route
  namespace: ingress-sit
  labels:
    kustomize.toolkit.fluxcd.io/name: ingress-sit
    kustomize.toolkit.fluxcd.io/namespace: flux-system
    platform.svc.plus/cluster: sit-k3s-v6
    platform.svc.plus/environment: sit
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`mcp.svc.plus`)
      kind: Rule
      services:
        - name: infrastructure-mcp-server
          namespace: platform-mcp-sit
          port: 8080
  tls:
    secretName: shared-observability-tls
