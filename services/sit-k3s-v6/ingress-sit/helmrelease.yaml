apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: caddy-ingress
  namespace: ingress-sit
spec:
  suspend: false
  interval: 5m
  releaseName: caddy-ingress
  targetNamespace: ingress-sit
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: caddy-ingress-caddy
            patch: |-
              apiVersion: v1
              kind: Service
              metadata:
                name: caddy-ingress-caddy
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "80"
                  prometheus.io/path: "/metrics"
          - target:
              kind: Service
              name: caddy-ingress-caddy-ingress
            patch: |-
              apiVersion: v1
              kind: Service
              metadata:
                name: caddy-ingress-caddy-ingress
              spec:
                ports:
                - name: http
                  port: 80
                  protocol: TCP
                  targetPort: 8080
                - name: https
                  port: 443
                  protocol: TCP
                  targetPort: 8443
          - target:
              kind: ConfigMap
              name: caddy-ingress-caddy-config
            patch: |-
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: caddy-ingress-caddy-config
              data:
                Caddyfile: |
                  {
                    admin off
                    auto_https off
                    http_port 8080
                    https_port 8443
                  }

                  http://grafana.sit.onwalk.net:8080, http://grafana-sit.onwalk.net:8080 {
                    reverse_proxy observability-observability-stack.observability-sit.svc.cluster.local:3000
                  }

                  https://grafana.sit.onwalk.net:8443, https://grafana-sit.onwalk.net:8443 {
                    tls /tls/console/tls.crt /tls/console/tls.key
                    reverse_proxy observability-observability-stack.observability-sit.svc.cluster.local:3000
                  }

                  http://mcp.svc.plus:8080, http://mcp.sit.onwalk.net:8080, http://mcp-sit.onwalk.net:8080 {
                    reverse_proxy infrastructure-mcp-server.platform-mcp-sit.svc.cluster.local:8080
                  }

                  https://mcp.svc.plus:8443, https://mcp.sit.onwalk.net:8443, https://mcp-sit.onwalk.net:8443 {
                    tls /tls/console/tls.crt /tls/console/tls.key
                    reverse_proxy infrastructure-mcp-server.platform-mcp-sit.svc.cluster.local:8080
                  }

                  http://console-sit.onwalk.net:8080, http://app-sit.onwalk.net:8080, http://console.sit.onwalk.net:8080, http://app.sit.onwalk.net:8080 {
                    handle /api/* {
                      reverse_proxy web-saas-accounts.web-saas-sit.svc.cluster.local:80
                    }
                    handle {
                      reverse_proxy web-saas-console.web-saas-sit.svc.cluster.local:80
                    }
                  }

                  https://console-sit.onwalk.net:8443, https://app-sit.onwalk.net:8443, https://console.sit.onwalk.net:8443, https://app.sit.onwalk.net:8443 {
                    tls /tls/console/tls.crt /tls/console/tls.key
                    handle /api/* {
                      reverse_proxy web-saas-accounts.web-saas-sit.svc.cluster.local:80
                    }
                    handle {
                      reverse_proxy web-saas-console.web-saas-sit.svc.cluster.local:80
                    }
                  }

                  http://accounts.sit.onwalk.net:8080, http://accounts-sit.onwalk.net:8080 {
                    reverse_proxy web-saas-accounts.web-saas-sit.svc.cluster.local:80
                  }

                  https://accounts.sit.onwalk.net:8443, https://accounts-sit.onwalk.net:8443 {
                    tls /tls/accounts/tls.crt /tls/accounts/tls.key
                    reverse_proxy web-saas-accounts.web-saas-sit.svc.cluster.local:80
                  }

                  http://billing.sit.onwalk.net:8080, http://billing-sit.onwalk.net:8080 {
                    reverse_proxy web-saas-billing.web-saas-sit.svc.cluster.local:80
                  }

                  https://billing.sit.onwalk.net:8443, https://billing-sit.onwalk.net:8443 {
                    tls /tls/billing/tls.crt /tls/billing/tls.key
                    reverse_proxy web-saas-billing.web-saas-sit.svc.cluster.local:80
                  }

                  :8080 {
                    handle /metrics {
                      metrics
                    }
                    handle /healthz {
                      respond "ok" 200
                    }
                    handle {
                      respond "SIT Platform Gateway Ready" 200
                    }
                  }

                  :8443 {
                    tls /tls/console/tls.crt /tls/console/tls.key
                    handle /healthz {
                      respond "ok" 200
                    }
                    handle {
                      respond "SIT Platform Gateway TLS Ready" 200
                    }
                  }
  values:
    console: {enabled: false}
    accounts: {enabled: false}
    billing: {enabled: false}
    content: {enabled: false}
    edgeGateway: {enabled: false}
    postgresql: {enabled: false}
    caddy:
      enabled: true
      httpOnly: false
      image: ghcr.io/ai-workspace-infra/caddy-cloudflare:959d6c8@sha256:9895385033fea2bdb445841b45f37e6cd58b9e071a16e4c147e483abb74a0acf
      externalBackends:
        enabled: true
        accounts: web-saas-accounts.web-saas-sit.svc.cluster.local:80
        frontend: web-saas-console.web-saas-sit.svc.cluster.local:80
        billing: web-saas-billing.web-saas-sit.svc.cluster.local:80
      routes:
        consoleHost: "console-sit.onwalk.net"
        consoleAliases:
          - "app-sit.onwalk.net"
          - "console.sit.onwalk.net"
          - "app.sit.onwalk.net"
        accountsHost: "accounts-sit.onwalk.net"
        accountsAliases:
          - "accounts.sit.onwalk.net"
        billingHost: "billing-sit.onwalk.net"
        billingAliases:
          - "billing.sit.onwalk.net"
      tls:
        consoleSecret: console-tls
        accountsSecret: accounts-tls
        billingSecret: billing-tls
      service:
        type: ClusterIP
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
    stunnelClient: {enabled: false}
    stunnelServer: {enabled: false}
    global:
      environment: sit
      expectedNamespace: ingress-sit
