apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: caddy-ingress
  namespace: ingress-sit
spec:
  suspend: false
  interval: 5m
  releaseName: caddy-ingress
  targetNamespace: ingress-sit
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: caddy-ingress-caddy-config
            patch: |-
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: caddy-ingress-caddy-config
              data:
                Caddyfile: |
                  {
                    admin off
                    auto_https off
                    http_port 8080
                  }
                  :8080 {
                    handle /healthz {
                      respond "ok" 200
                    }

                    @grafana host grafana.172.237.9.58.nip.io
                    handle @grafana {
                      reverse_proxy observability-observability-stack.observability-sit.svc.cluster.local:3000
                    }

                    @mcp host mcp.172.237.9.58.nip.io
                    handle @mcp {
                      reverse_proxy infrastructure-mcp-server.platform-mcp-sit.svc.cluster.local:8080
                    }

                    @app host app.172.237.9.58.nip.io
                    handle @app {
                      @api path /api /api/*
                      handle @api {
                        reverse_proxy web-saas-accounts.web-saas-sit.svc.cluster.local:80
                      }
                      handle {
                        reverse_proxy web-saas-console.web-saas-sit.svc.cluster.local:80
                      }
                    }

                    handle {
                      respond "SIT Platform Gateway Ready" 200
                    }
                  }
  values:
    console: {enabled: false}
    accounts: {enabled: false}
    billing: {enabled: false}
    content: {enabled: false}
    edgeGateway: {enabled: false}
    postgresql: {enabled: false}
    caddy:
      enabled: true
      routes:
        consoleHost: "app.172.237.9.58.nip.io"
        accountsHost: "accounts.172.237.9.58.nip.io"
        billingHost: "billing.172.237.9.58.nip.io"
      tls:
        consoleSecret: caddy-tls
        accountsSecret: caddy-tls
        billingSecret: caddy-tls
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 200m, memory: 128Mi}
    stunnelClient: {enabled: false}
    stunnelServer: {enabled: false}
    global:
      environment: sit
      expectedNamespace: ingress-sit
