apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-ingress
  namespace: ingress-sit
spec:
  suspend: false
  interval: 5m
  releaseName: traefik-ingress
  targetNamespace: ingress-sit
  chart:
    spec:
      chart: traefik
      version: "42.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: ingress-sit
  install:
    crds: CreateReplace
    remediation:
      retries: 2
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 2
  values:
    commonLabels:
      platform.svc.plus/cluster: sit-k3s-v6
      platform.svc.plus/environment: sit
    deployment:
      enabled: true
      kind: Deployment
      replicas: 1
      podLabels:
        platform.svc.plus/cluster: sit-k3s-v6
        platform.svc.plus/environment: sit
    service:
      enabled: true
      single: true
      spec:
        type: LoadBalancer
    ports:
      web:
        port: 8000
        exposedPort: 80
      websecure:
        port: 8443
        exposedPort: 443
      metrics:
        port: 9100
        expose:
          default: false
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: false
    metrics:
      prometheus:
        entryPoint: metrics
        addRoutersLabels: true
        service:
          enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
