apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-ingress
  namespace: ingress-sit
spec:
  suspend: false
  interval: 5m
  releaseName: traefik-ingress
  targetNamespace: ingress-sit
  dependsOn:
    - name: traefik-crds
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  values:
    global:
      environment: sit
      expectedNamespace: ingress-sit
    console: {enabled: false}
    accounts: {enabled: false}
    billing: {enabled: false}
    content: {enabled: false}
    edgeGateway: {enabled: false}
    postgresql: {enabled: false}
    caddy: {enabled: false}
    stunnelClient: {enabled: false}
    stunnelServer: {enabled: false}
    flagger: {enabled: false}
    traefik:
      enabled: true
      deployment:
        replicas: 1
      service:
        enabled: true
        single: true
        spec:
          type: ClusterIP
      ports:
        web:
          port: 8000
          exposedPort: 80
        websecure:
          port: 8443
          exposedPort: 443
      providers:
        kubernetesCRD:
          enabled: true
          allowCrossNamespace: true
        kubernetesIngress:
          enabled: true
          publishedService:
            enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
