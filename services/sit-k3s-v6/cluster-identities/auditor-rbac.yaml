# Explicit read-only allowlist from the cluster API discovery snapshot.
# Refresh this list when installing or removing API groups/CRDs. No wildcard resources:
# proxy, exec, attach, port-forward, token issuance, and authorization review APIs stay excluded.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k3s-auditor-read-only
rules:
  - apiGroups: [""]
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - podtemplates
      - replicationcontrollers
      - resourcequotas
      - secrets
      - serviceaccounts
      - services
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources:
      - mutatingadmissionpolicies
      - mutatingadmissionpolicybindings
      - mutatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
      - validatingwebhookconfigurations
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources:
      - customresourcedefinitions
    verbs: [get, list, watch]
  - apiGroups: [apiregistration.k8s.io]
    resources:
      - apiservices
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources:
      - controllerrevisions
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources:
      - horizontalpodautoscalers
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources:
      - cronjobs
      - jobs
    verbs: [get, list, watch]
  - apiGroups: [certificates.k8s.io]
    resources:
      - certificatesigningrequests
      - clustertrustbundles
      - podcertificaterequests
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources:
      - leases
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources:
      - endpointslices
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources:
      - events
    verbs: [get, list, watch]
  - apiGroups: [external-secrets.io]
    resources:
      - clusterexternalsecrets
      - clusterpushsecrets
      - clustersecretstores
      - externalsecrets
      - pushsecrets
      - secretstores
    verbs: [get, list, watch]
  - apiGroups: [flowcontrol.apiserver.k8s.io]
    resources:
      - flowschemas
      - prioritylevelconfigurations
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources:
      - backendtlspolicies
      - gatewayclasses
      - gateways
      - grpcroutes
      - httproutes
      - listenersets
      - referencegrants
      - tcproutes
      - tlsroutes
      - udproutes
    verbs: [get, list, watch]
  - apiGroups: [generators.external-secrets.io]
    resources:
      - acraccesstokens
      - beyondtrustworkloadcredentialsdynamicsecrets
      - cloudsmithaccesstokens
      - clustergenerators
      - ecrauthorizationtokens
      - fakes
      - gcraccesstokens
      - generatorstates
      - githubaccesstokens
      - gitlabdeploytokens
      - grafanas
      - mfas
      - passwords
      - quayaccesstokens
      - sshkeys
      - stssessiontokens
      - uuids
      - vaultdynamicsecrets
      - webhooks
    verbs: [get, list, watch]
  - apiGroups: [helm.cattle.io]
    resources:
      - helmchartconfigs
      - helmcharts
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources:
      - helmreleases
    verbs: [get, list, watch]
  - apiGroups: [k3s.cattle.io]
    resources:
      - addons
      - etcdsnapshotfiles
    verbs: [get, list, watch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources:
      - kustomizations
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources:
      - nodes
      - pods
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources:
      - ingressclasses
      - ingresses
      - ipaddresses
      - networkpolicies
      - servicecidrs
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources:
      - runtimeclasses
    verbs: [get, list, watch]
  - apiGroups: [notification.toolkit.fluxcd.io]
    resources:
      - alerts
      - providers
      - receivers
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources:
      - poddisruptionbudgets
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources:
      - clusterrolebindings
      - clusterroles
      - rolebindings
      - roles
    verbs: [get, list, watch]
  - apiGroups: [resource.k8s.io]
    resources:
      - deviceclasses
      - devicetaintrules
      - resourceclaims
      - resourceclaimtemplates
      - resourceslices
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources:
      - priorityclasses
    verbs: [get, list, watch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources:
      - buckets
      - externalartifacts
      - gitrepositories
      - helmcharts
      - helmrepositories
      - ocirepositories
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources:
      - csidrivers
      - csinodes
      - csistoragecapacities
      - storageclasses
      - volumeattachments
      - volumeattributesclasses
    verbs: [get, list, watch]
  - apiGroups: [storagemigration.k8s.io]
    resources:
      - storageversionmigrations
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3s-auditor-read-only
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k3s-auditor-read-only
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: auditor
