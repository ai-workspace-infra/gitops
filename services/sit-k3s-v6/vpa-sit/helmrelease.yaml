# Vertical Pod Autoscaler for SIT-K3S-V6 (Fairwinds chart 5.1.0 = VPA 1.7.1, Kubernetes >= 1.28).
# InPlaceOrRecreate is beta/default-on in VPA 1.7 and in-place pod resize is GA on Kubernetes 1.37,
# so VPAs can resize running pods without eviction. Updater --min-replicas=1 so single-replica
# Deployments are actually updated (fallback eviction honours each Deployment's RollingUpdate).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: vpa-system
spec:
  suspend: false
  interval: 10m
  releaseName: vpa
  targetNamespace: vpa-system
  chart:
    spec:
      chart: vpa
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: vpa-system
  install:
    crds: CreateReplace
    remediation:
      retries: 2
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 2
  values:
    recommender:
      extraArgs:
        v: "2"
        pod-recommendation-min-cpu-millicores: 10
        pod-recommendation-min-memory-mb: 32
      image:
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 20m
          memory: 96Mi
        limits:
          cpu: 200m
          memory: 384Mi
    updater:
      extraArgs:
        min-replicas: 1
      image:
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    admissionController:
      image:
        pullPolicy: IfNotPresent
      certGen:
        image:
          pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
