apiVersion: v1
kind: Secret
metadata:
  name: accounts-controller-config
  namespace: web-saas-sit
type: Opaque
stringData:
  account.yaml: |
    mode: server-agent
    log:
      level: info
    auth:
      enable: true
      token:
        publicToken: ${AUTH_TOKEN_PUBLIC_TOKEN}
        refreshSecret: ${AUTH_TOKEN_REFRESH_SECRET}
        accessSecret: ${AUTH_TOKEN_ACCESS_SECRET}
        accessExpiry: 1h
        refreshExpiry: 168h
      oauth:
        frontendUrl: https://console-sit.onwalk.net
        github:
          clientId: ${GITHUB_CLIENT_ID}
          clientSecret: ${GITHUB_CLIENT_SECRET}
          redirectUrl: https://accounts-sit.onwalk.net/api/auth/github/callback
        google:
          clientId: ${GOOGLE_CLIENT_ID}
          clientSecret: ${GOOGLE_CLIENT_SECRET}
          redirectUrl: https://accounts-sit.onwalk.net/api/auth/google/callback
    server:
      addr: :8080
      readTimeout: 15s
      writeTimeout: 15s
      publicUrl: https://accounts-sit.onwalk.net
      allowedOrigins:
      - https://console-sit.onwalk.net
      - https://accounts-sit.onwalk.net
      - https://billing-sit.onwalk.net
      - https://app-sit.onwalk.net
      - http://console-sit.onwalk.net
      - http://accounts-sit.onwalk.net
      - http://billing-sit.onwalk.net
      - http://app-sit.onwalk.net
      - http://app.sit.onwalk.net
      - http://accounts.sit.onwalk.net
      - http://billing.sit.onwalk.net
      tls:
        enabled: false
    store:
      driver: postgres
      dsn: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable
      maxOpenConns: 10
      maxIdleConns: 2
    session:
      ttl: 24h
      cache: memory
    reviewAccount:
      enabled: false
    xray:
      sync:
        enabled: false
    agent:
      id: accounts-sit
      controllerUrl: http://web-saas-accounts.web-saas-sit.svc.cluster.local
      apiToken: ${AGENT_API_TOKEN}
      httpTimeout: 15s
---
apiVersion: v1
kind: Secret
metadata:
  name: accounts-bootstrap
  namespace: web-saas-sit
type: Opaque
stringData:
  ROOT_BOOTSTRAP_EMAIL: admin@sit.onwalk.net
  ROOT_BOOTSTRAP_PASSWORD: SitAdminPassword123!
---
apiVersion: v1
kind: Secret
