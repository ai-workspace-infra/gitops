apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: traefik-error-rate
  namespace: web-saas-sit
spec:
  provider:
    type: prometheus
    address: http://observability-observability-stack-victoria-metrics.observability-sit:8428
  query: |
    100 - (
      sum(rate(traefik_service_requests_total{service=~"{{ target }}.*",code!~"5.*"}[{{ interval }}]))
      /
      sum(rate(traefik_service_requests_total{service=~"{{ target }}.*"}[{{ interval }}]))
    ) * 100
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: web-saas-accounts
  namespace: web-saas-sit
spec:
  provider: traefik
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-saas-accounts
  progressDeadlineSeconds: 120
  service:
    port: 80
    targetPort: 8080
    gateways:
      - traefik
    hosts:
      - accounts-sit.onwalk.net
      - accounts.sit.onwalk.net
  analysis:
    interval: 15s
    threshold: 3
    maxWeight: 50
    stepWeight: 10
    metrics:
      - name: traefik-error-rate
        templateRef:
          name: traefik-error-rate
          namespace: web-saas-sit
        thresholdRange:
          max: 1
        interval: 1m
