---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-saas-console-nginx-relative-redirects
  namespace: web-saas-sit
data:
  nginx.conf: |
    user www-data;
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log stderr notice;
    include /etc/nginx/modules-enabled/*.conf;

    events {
      worker_connections 768;
    }

    http {
      sendfile on;
      tcp_nopush on;
      types_hash_max_size 2048;

      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
      ssl_prefer_server_ciphers on;

      access_log /dev/stdout;

      client_body_temp_path /tmp/nginx_client_body;
      proxy_temp_path /tmp/nginx_proxy;
      fastcgi_temp_path /tmp/nginx_fastcgi;
      uwsgi_temp_path /tmp/nginx_uwsgi;
      scgi_temp_path /tmp/nginx_scgi;

      gzip on;

      include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }

    upstream frontend_server {
      server 127.0.0.1:3000;
      keepalive 32;
    }

    server {
      listen 8080;
      # Preserve the public HTTPS origin behind TLS termination.
      absolute_redirect off;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location = /healthz {
        proxy_pass http://frontend_server/api/ping;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location /_next/static/ {
        try_files $uri @frontend_server;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
      }

      # API routes must always reach the Next server. If /api is present in the
      # static export, try_files can otherwise serve the static tree and bypass
      # the SSR API route (including /api/auth/oauth/* and /api/ping).
      location ^~ /api/ {
        proxy_pass http://frontend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
      }

      location / {
        try_files $uri $uri/ @frontend_server;
      }

      location @frontend_server {
        proxy_pass http://frontend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
      }
    }
