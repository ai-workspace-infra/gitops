apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web-saas-sit
  namespace: web-saas-sit
spec:
  suspend: false
  interval: 5m
  releaseName: web-saas
  targetNamespace: web-saas-sit
  upgrade:
    crds: Skip
    remediation:
      retries: 0
      remediateLastFailure: true
      strategy: rollback
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: web-saas-accounts
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-accounts
              spec:
                template:
                  spec:
                    volumes:
                      - name: accounts-controller-config
                        secret:
                          secretName: accounts-controller-config
                          defaultMode: 0400
                    containers:
                      - name: accounts
                        env:
                          - name: CONFIG_TEMPLATE
                            value: /var/run/accounts-controller-config/account.yaml
                          - name: CONFIG_PATH
                            value: /tmp/accounts-controller-config.yaml
                        volumeMounts:
                          - name: accounts-controller-config
                            mountPath: /var/run/accounts-controller-config
                            readOnly: true
          - target:
              kind: Deployment
              name: web-saas-console
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-console
              spec:
                template:
                  spec:
                    containers:
                      - name: console
                        env:
                          - name: PORT
                            value: '3000'
                          - name: RUNTIME_ENV
                            value: prod
                          - name: RUNTIME_AUTH_URL
                            value: http://web-saas-accounts.web-saas-sit.svc.cluster.local:80
                          - name: RUNTIME_XCONNECT_ZERO_URL
                            value: http://web-saas-accounts.web-saas-sit.svc.cluster.local:80
                          - name: RUNTIME_DASHBOARD_URL
                            value: https://console.svc.plus
                          - name: FRONTEND_IMAGE
                            value: ghcr.io/ai-workspace-services/console:sha-9933f0a8b0dac81cb008efe3bce6fb4a5122ea56@sha256:04233be73e83ab30f79ce3204d65604f6a416de94aed4d609320f06679132042
                        securityContext:
                          capabilities:
                            add: [CHOWN, SETUID, SETGID]
                        startupProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          periodSeconds: 5
                          timeoutSeconds: 3
                          failureThreshold: 18
                        readinessProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          periodSeconds: 10
                          timeoutSeconds: 3
                          failureThreshold: 3
                        livenessProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          initialDelaySeconds: 20
                          periodSeconds: 10
                          timeoutSeconds: 3
                          failureThreshold: 3
          - target:
              kind: Deployment
              name: web-saas-content
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-content
              spec:
                template:
                  spec:
                    containers:
                      - name: content
                        startupProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          periodSeconds: 10
                          timeoutSeconds: 3
                          failureThreshold: 30
  values:
    global:
      environment: sit
      expectedNamespace: web-saas-sit
    caddy:
      enabled: false
    postgresql:
      enabled: false
    console:
      enabled: true
      deploymentProfile: single-container
      singleContainer:
        image: ghcr.io/ai-workspace-services/console:sha-9933f0a8b0dac81cb008efe3bce6fb4a5122ea56@sha256:04233be73e83ab30f79ce3204d65604f6a416de94aed4d609320f06679132042
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 250m, memory: 256Mi}
        volumes:
          - name: nginx-config
            configMap:
              name: web-saas-console-nginx-relative-redirects
          - name: tmp
            emptyDir: {}
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
          - name: tmp
            mountPath: /tmp
    accounts:
      enabled: true
      workload:
        env:
          IMAGE: ghcr.io/ai-workspace-services/accounts:sha-e5ed8720bfbca2a21e7ebc37b0273a1310f414cc@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          DB_HOST: postgresql-postgresql.postgresql-sit.svc.cluster.local
          DB_PORT: '5432'
          POSTGRES_USER: postgres
          DB_NAME: account
          XWORKMATE_SHARED_TENANT_DOMAIN: svc.plus
          SUBSCRIPTION_GRACE_PERIOD: "72h"
          DUAL_BUCKET_PRO_GATE_ENABLED: "false"
        secretRefs:
        - web-saas-secrets
        - accounts-db-runtime
        - accounts-bootstrap
        - accounts-stripe
        image: ghcr.io/ai-workspace-services/accounts:sha-e5ed8720bfbca2a21e7ebc37b0273a1310f414cc@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        resources:
          requests: {cpu: 25m, memory: 96Mi}
          limits: {cpu: 100m, memory: 128Mi}
    billing:
      enabled: true
      workload:
        env:
          DB_HOST: postgresql-postgresql.postgresql-sit.svc.cluster.local
          DB_PORT: '5432'
          POSTGRES_USER: postgres
          DB_NAME: account
          BILLING_INGEST_MODE: push
          DEFAULT_REGION: jp
          ARREARS_SUSPEND_THRESHOLD: "72h"
          DUAL_BUCKET_QUOTA_ENFORCE: "false"
          IMAGE: ghcr.io/ai-workspace-services/billing-service:sha-ec2c64f08a1cce9a458caf7eee232bd3151da046@sha256:d596b8b00a3dfea27b9a7ea256d7b7f9a753fdd891319cbee99ef1b2206e6a3f
        secretRefs:
        - web-saas-secrets
        - billing-db-runtime
        image: ghcr.io/ai-workspace-services/billing-service:sha-ec2c64f08a1cce9a458caf7eee232bd3151da046@sha256:d596b8b00a3dfea27b9a7ea256d7b7f9a753fdd891319cbee99ef1b2206e6a3f
        probes:
          startupProbe:
            httpGet:
              path: /api/ping
              port: primary
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /readyz
              port: primary
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/ping
              port: primary
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
        resources:
          requests: {cpu: 25m, memory: 96Mi}
          limits: {cpu: 100m, memory: 128Mi}
    content:
      enabled: true
      workload:
        env:
          KNOWLEDGE_REPO_PATH: /tmp/knowledge
          KNOWLEDGE_REPO_URL: https://github.com/ai-workspace-services/knowledge.git
        image: ghcr.io/ai-workspace-services/docs:daily-build-2026.11.18-r1@sha256:5577fbcbe7fe1ddb4dd0cfe90c4caaa0fd0c9299d69f49afbdc819ede577157e
        secretRefs:
        - web-saas-secrets
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
    edgeGateway:
      enabled: false
    stunnelClient:
      enabled: false
    stunnelServer:
      enabled: false
    flagger:
      enabled: true
      meshProvider: traefik
      metricsServer: http://observability-observability-stack-victoria-metrics.observability-sit:8428
      selectorLabels: websaas.io/workload,app.kubernetes.io/name,app
      crd:
        create: true
