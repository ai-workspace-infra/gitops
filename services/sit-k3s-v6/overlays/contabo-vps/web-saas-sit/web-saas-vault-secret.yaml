apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-saas-runtime-reader
  namespace: web-saas-sit
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-saas-runtime-reader
  namespace: web-saas-sit
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [web-saas-runtime-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-saas-runtime-reader
  namespace: web-saas-sit
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-saas-runtime-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: web-saas-runtime-reader
  namespace: web-saas-sit
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-sit-k3s-v6-contabo-vps
          role: sit-k3s-v6-contabo-vps-web-saas-runtime-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: web-saas-runtime-reader
            audiences:
              - vault-sit-k3s-v6-contabo-vps-web-saas-runtime-reader
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-saas-secrets
  namespace: web-saas-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: web-saas-runtime-reader
  target:
    name: web-saas-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: sit/web-saas/runtime
        property: JWT_SECRET
    - secretKey: SESSION_SECRET
      remoteRef:
        key: sit/web-saas/runtime
        property: SESSION_SECRET
