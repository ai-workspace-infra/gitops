apiVersion: v1
kind: ServiceAccount
metadata:
  name: datakit-dataway-reader
  namespace: observability-sit
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: datakit-dataway-reader
  namespace: observability-sit
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [datakit-dataway-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datakit-dataway-reader
  namespace: observability-sit
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: datakit-dataway-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: datakit-dataway-reader
  namespace: observability-sit
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-sit-k3s-v6-contabo-vps
          role: sit-k3s-v6-contabo-vps-datakit-dataway-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: datakit-dataway-reader
            audiences:
              - vault-sit-k3s-v6-contabo-vps-datakit-dataway-reader
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datakit-dataway-secret
  namespace: observability-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: datakit-dataway-reader
  target:
    name: datakit-dataway-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ENV_DATAWAY
      remoteRef:
        key: observability/datakit/hk-commercial
        property: DATAWAY_URL
    - secretKey: OTEL_EXPORTER_OTLP_HEADERS
      remoteRef:
        key: observability/datakit/hk-commercial
        property: OTEL_EXPORTER_OTLP_HEADERS
    - secretKey: OTEL_EXPORTER_OTLP_ENDPOINT
      remoteRef:
        key: observability/datakit/hk-commercial
        property: OTEL_EXPORTER_OTLP_ENDPOINT
