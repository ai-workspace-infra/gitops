apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../observability-sit
  - datakit-vault-secret.yaml
  - grafana-vault-secret.yaml
  - vmagent-vault-secret.yaml
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: datakit
      namespace: observability-sit
    patch: |-
      - op: add
        path: /spec/postRenderers
        value:
          - kustomize:
              patches:
                - target:
                    group: rbac.authorization.k8s.io
                    version: v1
                    kind: ClusterRole
                    name: datakit
                  patch: |-
                    - op: remove
                      path: /rules/1/resources/11
  - target:
      group: external-secrets.io
      version: v1
      kind: SecretStore
      name: observability-ingest-reader
      namespace: observability-sit
    path: identity-patch.yaml
  - target:
      version: v1
      kind: PersistentVolume
      name: pvc-7e530154-f03a-49e9-8aaa-3809f2f70188
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: pvc-7e530154-f03a-49e9-8aaa-3809f2f70188
