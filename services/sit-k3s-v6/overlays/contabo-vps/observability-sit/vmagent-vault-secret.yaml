apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-remote-write
  namespace: observability-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: observability-ingest-reader
  target:
    name: observability-remote-write
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        username: "{{ .user }}"
        password: "{{ .password }}"
  data:
    - secretKey: user
      remoteRef:
        key: CICD/observability
        property: user
    - secretKey: password
      remoteRef:
        key: CICD/observability
        property: password
