apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../external-dns
  - cloudflare-reader-rbac.yaml
  - cloudflare-vault-secret.yaml
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: external-dns
      namespace: external-dns
    patch: |-
      - op: add
        path: /spec/values/domainFilters/-
        value: svc.plus
      - op: add
        path: /spec/values/sources/-
        value: traefik-proxy
      - op: add
        path: /spec/values/extraArgs/-
        value: --label-filter=external-dns=contabo-sit
      - op: add
        path: /spec/values/annotationFilter
        value: platform.svc.plus/external-dns-scope=contabo-sit
      - op: add
        path: /spec/values/excludeDomains
        value:
          - sit.onwalk.net
