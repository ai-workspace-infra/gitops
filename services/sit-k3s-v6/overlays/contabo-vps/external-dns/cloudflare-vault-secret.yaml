apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: external-dns-cloudflare-reader
  namespace: external-dns
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-sit-k3s-v6-contabo-vps
          role: sit-k3s-v6-contabo-vps-external-dns-cloudflare-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: external-dns-cloudflare-reader
            audiences: [vault-sit-k3s-v6-contabo-vps-external-dns-cloudflare-reader]
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
  namespace: external-dns
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: external-dns-cloudflare-reader
  target:
    name: external-dns-cloudflare
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CF_API_TOKEN
      remoteRef:
        key: sit/platform/cloudflare/feature-dns
        property: token
