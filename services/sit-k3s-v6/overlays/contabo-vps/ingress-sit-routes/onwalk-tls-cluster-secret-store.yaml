apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: sit-onwalk-tls-reader
spec:
  conditions:
    - namespaces:
        - ingress-sit
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-sit-k3s-v6-contabo-vps
          role: sit-k3s-v6-contabo-vps-onwalk-tls-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: sit-onwalk-tls-reader
              namespace: external-secrets
            audiences:
              - vault-sit-k3s-v6-contabo-vps-onwalk-tls-reader
            expirationSeconds: 600
