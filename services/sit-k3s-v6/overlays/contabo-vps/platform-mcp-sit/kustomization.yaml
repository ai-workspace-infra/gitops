apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform-mcp-sit
patches:
  - target:
      group: external-secrets.io
      version: v1
      kind: SecretStore
      name: platform-mcp-reader
      namespace: platform-mcp-sit
    patch: |-
      - op: replace
        path: /spec/provider/vault/auth/jwt/path
        value: jwt-sit-k3s-v6-contabo-vps
      - op: replace
        path: /spec/provider/vault/auth/jwt/role
        value: sit-k3s-v6-contabo-vps-platform-mcp-reader
      - op: replace
        path: /spec/provider/vault/auth/jwt/kubernetesServiceAccountToken/audiences/0
        value: vault-sit-k3s-v6-contabo-vps-platform-mcp-reader
