apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql-admin-reader
  namespace: postgresql-sit
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgresql-admin-reader
  namespace: postgresql-sit
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [postgresql-admin-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgresql-admin-reader
  namespace: postgresql-sit
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgresql-admin-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: postgresql-admin-reader
  namespace: postgresql-sit
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-sit-k3s-v6-contabo-vps
          role: sit-k3s-v6-contabo-vps-postgresql-admin-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: postgresql-admin-reader
            audiences: [vault-sit-k3s-v6-contabo-vps-postgresql-admin-reader]
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-admin
  namespace: postgresql-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: postgresql-admin-reader
  target:
    name: postgresql-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: sit/database/postgresql/admin
        property: password
---
