apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrastructure-mcp-server
  namespace: platform-mcp-dev
  labels:
    app.kubernetes.io/name: infrastructure-mcp-server
    app.kubernetes.io/part-of: platform-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: infrastructure-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infrastructure-mcp-server
        app.kubernetes.io/part-of: platform-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: infrastructure-mcp-server
        # IMAGE PLACEHOLDER: the Infrastructure-MCP-Server repo has a Dockerfile but no
        # publish workflow, and ghcr.io/ai-workspace-infra/infrastructure-mcp-server is not
        # anonymously pullable. Pin a real tag/digest via the `images:` block in
        # kustomization.yaml once an image is published (or import a locally built one).
        image: ghcr.io/ai-workspace-infra/infrastructure-mcp-server:latest
        imagePullPolicy: IfNotPresent
        args:
        - "-config"
        - "/etc/infrastructure-mcp-server/config.json"
        - "-listen"
        - ":8080"
        env:
        # Created by the bootstrap playbook (see SECRETS.md). Optional so the pod can
        # start before the Secret exists.
        - name: MCP_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: infra-mcp-auth
              key: mcp-service-token
              optional: true
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config-volume
          mountPath: /etc/infrastructure-mcp-server
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: infrastructure-mcp-config
