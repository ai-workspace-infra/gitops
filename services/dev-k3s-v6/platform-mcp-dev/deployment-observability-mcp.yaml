apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-mcp-gateway
  namespace: platform-mcp-dev
  labels:
    app.kubernetes.io/name: observability-mcp-gateway
    app.kubernetes.io/part-of: platform-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: observability-mcp-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability-mcp-gateway
        app.kubernetes.io/part-of: platform-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mcp-grafana
        image: grafana/mcp-grafana@sha256:71a3f4e6f412d253611314233df709ec2571fb50e39742d23fa2940f670646dc
        imagePullPolicy: IfNotPresent
        args:
        - "--base-path"
        - "/v1/grafana"
        - "--disable-write"
        - "--disable-admin"
        - "--allowed-hosts"
        - "mcp-grafana,mcp-grafana:8000,mcp-grafana.platform-mcp-dev.svc.cluster.local,mcp-grafana.platform-mcp-dev.svc.cluster.local:8000,localhost,127.0.0.1,127.0.0.1:8000"
        env:
        # In-cluster dev Grafana (observability-dev unit); never a production host.
        - name: GRAFANA_URL
          value: "http://observability-observability-stack.observability-dev.svc.cluster.local:3000/"
        # Grafana Viewer service-account token, created by the bootstrap playbook (see SECRETS.md).
        - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
          valueFrom:
            secretKeyRef:
              name: infra-mcp-auth
              key: grafana-service-account-token
              optional: true
        ports:
        - name: grafana-sse
          containerPort: 8000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
            httpHeaders:
            - name: Host
              value: localhost
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
