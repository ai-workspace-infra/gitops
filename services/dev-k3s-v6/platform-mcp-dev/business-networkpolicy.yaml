---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: business-namespaces-ingress
  namespace: platform-mcp-dev
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - web-saas-dev
          - postgresql-dev
          - ingress-dev
          - observability-dev
          - platform-mcp-dev
