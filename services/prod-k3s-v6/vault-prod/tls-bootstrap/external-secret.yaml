apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-server-tls
  namespace: vault-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: shared-vault-tls-bootstrap
  target:
    name: vault-server-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .tls_fullchain }}"
        tls.key: "{{ .tls_key }}"
  data:
    - secretKey: tls_fullchain
      remoteRef:
        key: CICD/domains/svc.plus
        property: tls_fullchain_pem_b64
        decodingStrategy: Base64
    - secretKey: tls_key
      remoteRef:
        key: CICD/domains/svc.plus
        property: tls_key_pem_b64
        decodingStrategy: Base64
