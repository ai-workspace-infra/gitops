apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: shared-vault-tls-bootstrap
  namespace: vault-prod
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-prod-k3s-v6
          role: prod-k3s-v6-vault-tls-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: vault-tls-reader
            audiences:
              - vault-prod-k3s-v6-eso
            expirationSeconds: 600
