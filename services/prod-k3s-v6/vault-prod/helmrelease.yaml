apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault-prod
spec:
  suspend: false
  interval: 5m
  releaseName: vault
  targetNamespace: vault-prod
  chart:
    spec:
      chart: vault
      version: "0.32.0"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: vault-prod
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  values:
    global:
      tlsDisable: false
    injector:
      enabled: false
    server:
      image:
        repository: hashicorp/vault
        tag: "1.21.4@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569"
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 150m
          memory: 384Mi
      authDelegator:
        enabled: true
      dataStorage:
        enabled: true
        size: 10Gi
        storageClass: local-path
      extraVolumes:
        - type: secret
          name: vault-server-tls
          path: vault/tls
      ha:
        enabled: true
        replicas: 1
        raft:
          enabled: true
          setNodeId: true
        config: |
          ui = true
          disable_mlock = true
          storage "raft" {
            path = "/vault/data"
          }
          listener "tcp" {
            address = "0.0.0.0:8200"
            cluster_address = "0.0.0.0:8201"
            tls_disable = false
            tls_cert_file = "/vault/tls/tls.crt"
            tls_key_file = "/vault/tls/tls.key"
          }
          service_registration "kubernetes" {}
      service:
        enabled: true
      standalone:
        enabled: false
    ui:
      enabled: true
