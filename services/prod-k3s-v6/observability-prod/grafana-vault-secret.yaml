apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-admin-reader
  namespace: observability-prod
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-admin-reader
  namespace: observability-prod
rules:
- apiGroups:
  - ''
  resources:
  - serviceaccounts/token
  resourceNames:
  - grafana-admin-reader
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-admin-reader
  namespace: observability-prod
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-admin-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: grafana-admin-reader
  namespace: observability-prod
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-prod-k3s-prod-k3s-v6
          role: prod-k3s-v6-grafana-admin-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: grafana-admin-reader
            audiences:
            - vault-prod-k3s-v6-grafana-admin-reader
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: grafana-admin-reader
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: password
    remoteRef:
      key: CICD/observability/grafana-admin
      property: grafana_password
