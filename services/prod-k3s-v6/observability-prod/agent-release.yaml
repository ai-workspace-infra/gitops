apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: observability-agent-chart
  namespace: observability-prod
spec:
  interval: 5m
  url: oci://ghcr.io/ai-workspace-infra/observability-agent
  ref:
    digest: sha256:5c4fb411cffad6b3ef03f4d899687c271649144f3ff5d311ca027b9121157893
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability-agent
  namespace: observability-prod
spec:
  suspend: false
  interval: 5m
  releaseName: observability-agent
  targetNamespace: observability-prod
  chartRef:
    kind: OCIRepository
    name: observability-agent-chart
  values:
    fullnameOverride: observability-agent
    nodeExporter:
      enabled: true
      hostMetrics: true
      hostNetwork: true
      listenOnNodeIP: true
      image:
        repository: quay.io/prometheus/node-exporter
        tag: v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    kubeStateMetrics:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 25m
          memory: 48Mi
    processExporter:
      enabled: true
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 150m
          memory: 64Mi
    vector:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
    blackboxExporter:
      enabled: true
      modules:
        release_http_ok:
          prober: http
          timeout: 5s
          http:
            preferred_ip_protocol: ip4
            valid_status_codes:
            - 200
            follow_redirects: false
        release_login_redirect:
          prober: http
          timeout: 5s
          http:
            preferred_ip_protocol: ip4
            valid_status_codes:
            - 302
            - 307
            - 308
            follow_redirects: false
            fail_if_header_not_matches:
            - header: Location
              regexp: ^(/login|https?://[^/]+/login)([?].*)?$
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    vmagent:
      enabled: true
      externalLabels:
        cluster: PROD-K3S-V6
        environment: prod
      scrapeInterval: 30s
      scrapeTimeout: 10s
      scrapeConfigs:
      - job_name: progressive-release-probes
        metrics_path: /probe
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
        - targets:
          - https://console.svc.plus/healthz
          labels:
            service: console
            route: /healthz
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - https://console.svc.plus/login
          labels:
            service: console
            route: /login
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - https://console.svc.plus/panel/agent
          labels:
            service: console
            route: /panel/agent
            probe_module: release_login_redirect
            expected_status: '307'
        - targets:
          - https://accounts.svc.plus/healthz
          labels:
            service: accounts
            route: /healthz
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - https://accounts.svc.plus/readyz
          labels:
            service: accounts
            route: /readyz
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - https://accounts.svc.plus/api/ping
          labels:
            service: accounts
            route: /api/ping
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - https://accounts.svc.plus/api/billing/plans
          labels:
            service: accounts
            route: /api/billing/plans
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - https://billing.svc.plus/healthz
          labels:
            service: billing
            route: /healthz
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - https://billing.svc.plus/readyz
          labels:
            service: billing
            route: /readyz
            probe_module: release_http_ok
            expected_status: '200'
        - targets:
          - https://billing.svc.plus/api/ping
          labels:
            service: billing
            route: /api/ping
            probe_module: release_http_ok
            expected_status: '200'
        relabel_configs:
        - source_labels:
          - __address__
          target_label: __param_target
        - source_labels:
          - probe_module
          target_label: __param_module
        - source_labels:
          - __param_target
          target_label: instance
        - target_label: __address__
          replacement: observability-agent-blackbox.observability-prod.svc:9115
      remoteWrite:
        url: https://observability.svc.plus/ingest/metrics/api/v1/write
        secretName: observability-remote-write
        usernameKey: username
        passwordKey: password
        maxDiskUsagePerURL: 256Mi
      bufferSizeLimit: 256Mi
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
