apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: datakit
  namespace: observability-prod
spec:
  suspend: false
  interval: 10m
  releaseName: datakit
  targetNamespace: observability-prod
  timeout: 5m
  chart:
    spec:
      chart: datakit
      version: 2.16.1
      sourceRef:
        kind: HelmRepository
        name: datakit
        namespace: observability-prod
  values:
    workload:
      kind: DaemonSet
    datakit:
      dataway_secret_create: false
      dataway_secret_enabled: true
      dataway_secret_key: ENV_DATAWAY
      dataway_secret_name: datakit-dataway-secret
      global_tags: host=prod-k3s-v6,cluster=PROD-K3S-V6,env=prod
      log: info
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
