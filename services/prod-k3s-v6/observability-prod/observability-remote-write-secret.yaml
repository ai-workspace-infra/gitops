apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-remote-write-reader
  namespace: observability-prod
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observability-remote-write-reader
  namespace: observability-prod
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [observability-remote-write-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-remote-write-reader
  namespace: observability-prod
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observability-remote-write-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: observability-remote-write-reader
  namespace: observability-prod
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-prod-k3s-prod-k3s-v6
          role: prod-k3s-v6-observability-remote-write-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: observability-remote-write-reader
            audiences: [vault-prod-k3s-v6-observability-remote-write-reader]
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-remote-write
  namespace: observability-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: observability-remote-write-reader
  target:
    name: observability-remote-write
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        username: "{{ .user }}"
        password: "{{ .password }}"
  data:
    - secretKey: user
      remoteRef:
        key: CICD/observability
        property: user
    - secretKey: password
      remoteRef:
        key: CICD/observability
        property: password
