apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: traefik-error-rate
  namespace: web-saas-prod
spec:
  provider:
    type: prometheus
    address: https://observability.svc.plus
    insecureSkipVerify: false
    secretRef:
      name: observability-query-auth
  query: |
    (
      100 - (
        sum(rate(traefik_service_requests_total{exported_service=~"web-saas-prod-{{ target }}-canary-80(@kubernetescrd)?",code!~"5.*"}[{{ interval }}]))
        /
        sum(rate(traefik_service_requests_total{exported_service=~"web-saas-prod-{{ target }}-canary-80(@kubernetescrd)?"}[{{ interval }}]))
      ) * 100
    ) or vector(0)
---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: traefik-release-error-rate
  namespace: web-saas-prod
spec:
  provider:
    type: prometheus
    address: https://observability.svc.plus
    insecureSkipVerify: false
    secretRef:
      name: observability-query-auth
  query: |
    100 - (
      (sum(rate(traefik_service_requests_total{exported_service=~"web-saas-prod-{{ target }}-canary-80(@kubernetescrd)?",code!~"5.*"}[{{ interval }}])) or vector(0))
      /
      (sum(rate(traefik_service_requests_total{exported_service=~"web-saas-prod-{{ target }}-canary-80(@kubernetescrd)?"}[{{ interval }}])) > 0)
    ) * 100
---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: web-saas-accounts
  namespace: web-saas-prod
spec:
  provider: traefik
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-saas-accounts
  progressDeadlineSeconds: 120
  service:
    port: 80
    targetPort: 8080
    gateways:
      - traefik
    hosts:
      - accounts-selfhost-prod-v6.svc.plus
      - accounts.svc.plus
  analysis:
    interval: 15s
    threshold: 10
    maxWeight: 50
    stepWeight: 10
    metrics:
      - name: traefik-error-rate
        templateRef:
          name: traefik-release-error-rate
          namespace: web-saas-prod
        thresholdRange:
          max: 1
        interval: 2m
