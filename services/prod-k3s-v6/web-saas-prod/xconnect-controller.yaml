---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xconnect-controller
  namespace: web-saas-prod
  labels:
    app.kubernetes.io/name: xconnect-controller
    app.kubernetes.io/part-of: web-saas
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: xconnect-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xconnect-controller
        app.kubernetes.io/part-of: web-saas
    spec:
      containers:
        - name: xconnect-controller
          image: ghcr.io/ai-workspace-services/xconnect-controller:sha-4d2b91f7b08c5d91d98d203097f2d4c38be504c2@sha256:61593d2558fed73c6f18a917d7429572edfdf12d4f37121ca8f97fcf1db6dc87
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: accounts-db-runtime
            - secretRef:
                name: web-saas-secrets
          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              value: postgresql-postgresql.postgresql-prod.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: postgres
            - name: DB_NAME
              value: account
            - name: GOMEMLIMIT
              value: "200MiB"
            - name: XCONNECT_SCHEMA_MANAGED
              value: "true"
            - name: XCONNECT_OVERLAY_REQUIRE_SIGNING_KEY
              value: "true"
            - name: XCONNECT_OVERLAY_PREVIOUS_SIGNING_KEY_ID
              value: "zero-signing-current"
            - name: XCONNECT_OVERLAY_PREVIOUS_SIGNING_PUBLIC_KEY
              value: "s5yiz7WTECJKgBSapXGM9WOdoud/76xZbmHGbdK4y7o="
            - name: XCONNECT_OVERLAY_PREVIOUS_SIGNING_NOT_AFTER
              value: "2026-12-03T00:00:00Z"
            - name: ACCOUNTS_JWKS_URL
              value: "http://web-saas-accounts.web-saas-prod.svc.cluster.local:80/.well-known/jwks.json"
            - name: DD_TRACE_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: xconnect-controller
  namespace: web-saas-prod
  labels:
    app.kubernetes.io/name: xconnect-controller
    app.kubernetes.io/part-of: web-saas
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: xconnect-controller
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
