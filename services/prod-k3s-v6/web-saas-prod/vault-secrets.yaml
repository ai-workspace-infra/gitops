apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-saas-secrets-reader
  namespace: web-saas-prod
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-saas-secrets-reader
  namespace: web-saas-prod
rules:
- apiGroups:
  - ''
  resources:
  - serviceaccounts/token
  resourceNames:
  - web-saas-secrets-reader
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-saas-secrets-reader
  namespace: web-saas-prod
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-saas-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: web-saas-secrets-reader
  namespace: web-saas-prod
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-prod-k3s-prod-k3s-v6
          role: prod-k3s-v6-web-saas-secrets-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: web-saas-secrets-reader
            audiences:
            - vault-prod-k3s-v6-web-saas-secrets-reader
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-saas-secrets
  namespace: web-saas-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: web-saas-secrets-reader
  target:
    name: web-saas-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      mergePolicy: Merge
      data:
        SMTP_HOST: smtp.gmail.com
        SMTP_PORT: "587"
        SMTP_FROM: 'XWorkmate <{{ .SMTP_USERNAME }}>'
  data:
  - secretKey: INTERNAL_SERVICE_TOKEN
    remoteRef:
      key: prod/accounts/runtime
      property: INTERNAL_SERVICE_TOKEN
  - secretKey: SMTP_USERNAME
    remoteRef:
      key: prod/platform/smtp/google
      property: username
  - secretKey: SMTP_PASSWORD
    remoteRef:
      key: prod/platform/smtp/google
      property: password
  - secretKey: SMTP_USERNAME
    remoteRef:
      key: prod/platform/smtp/google
      property: username
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accounts-stripe
  namespace: web-saas-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: web-saas-secrets-reader
  target:
    name: accounts-stripe
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: STRIPE_MODE
    remoteRef:
      key: prod/accounts/runtime
      property: STRIPE_MODE
  - secretKey: STRIPE_SECRET_KEY
    remoteRef:
      key: prod/accounts/runtime
      property: STRIPE_SECRET_KEY
  - secretKey: STRIPE_WEBHOOK_SECRET
    remoteRef:
      key: prod/accounts/runtime
      property: STRIPE_WEBHOOK_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accounts-controller-config
  namespace: web-saas-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: app-database-reader
  target:
    name: accounts-controller-config
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: account.yaml
    remoteRef:
      key: prod/Accounts-service
      property: ACCOUNTS_CONTROLLER_CONFIG_TEMPLATE
  - secretKey: smtp-username
    remoteRef:
      key: prod/platform/smtp/google
      property: username
  - secretKey: smtp-password
    remoteRef:
      key: prod/platform/smtp/google
      property: password
  target:
    name: accounts-controller-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      mergePolicy: Replace
      data:
        account.yaml: '{{ index . "account.yaml" | replace "smtp.example.com" "smtp.gmail.com" | replace "apikey" .smtp-username | replace "no-reply@example.com" .smtp-username }}'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accounts-bootstrap
  namespace: web-saas-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: app-database-reader
  target:
    name: accounts-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ROOT_BOOTSTRAP_EMAIL
      remoteRef:
        key: prod/Accounts-service
        property: ROOT_BOOTSTRAP_EMAIL
    - secretKey: ROOT_BOOTSTRAP_PASSWORD
      remoteRef:
        key: prod/Accounts-service
        property: ROOT_BOOTSTRAP_PASSWORD
