apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-saas-secrets-reader
  namespace: web-saas-prod
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-saas-secrets-reader
  namespace: web-saas-prod
rules:
- apiGroups:
  - ''
  resources:
  - serviceaccounts/token
  resourceNames:
  - web-saas-secrets-reader
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-saas-secrets-reader
  namespace: web-saas-prod
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-saas-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: web-saas-secrets-reader
  namespace: web-saas-prod
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-prod-k3s-v6
          role: prod-k3s-v6-web-saas-secrets-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: web-saas-secrets-reader
            audiences:
            - vault-prod-k3s-v6-web-saas-secrets-reader
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-saas-secrets
  namespace: web-saas-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: web-saas-secrets-reader
  target:
    name: web-saas-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: INTERNAL_SERVICE_TOKEN
    remoteRef:
      key: prod/accounts/runtime
      property: INTERNAL_SERVICE_TOKEN
