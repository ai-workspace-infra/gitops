# Cloudflare Tunnel (cloudflared) exposing in-cluster PostgreSQL privately to Cloudflare Hyperdrive
# (xconnect-controller-pg) over pg-xconnect-prod.svc.plus, protected by Cloudflare Access Service Token.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-pg-tunnel
  namespace: web-saas-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: web-saas-secrets-reader
  target:
    name: cloudflared-pg-tunnel
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: prod/accounts/runtime
        property: CLOUDFLARED_PG_TUNNEL_TOKEN
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-pg-tunnel
  namespace: web-saas-prod
  labels:
    app.kubernetes.io/name: cloudflared-pg-tunnel
    app.kubernetes.io/part-of: web-saas-prod
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-pg-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared-pg-tunnel
        app.kubernetes.io/part-of: web-saas-prod
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.2.0
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-pg-tunnel
                  key: TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
