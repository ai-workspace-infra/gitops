# Non-breaking template showing how to parameterize HK + US (and future entities)
# via Vault KV v2 -> ExternalSecret -> STRIPE_PROFILES_FILE in accounts.
#
# Live PROD keeps using ExternalSecret/accounts-stripe (kv/prod/accounts/runtime)
# until Vault paths kv/prod/payments/stripe/hk and kv/prod/payments/stripe/us
# are populated and web-saas-secrets-reader allows kv/data/prod/payments/stripe/*.
#
# Step 1: Allow read access in operations/workload-identities/prod-k3s-v6/web-saas-secrets-reader.yaml:
#   - kv/data/prod/payments/stripe/*
#
# Step 2: Populate Vault KV v2 secrets:
#   kv/prod/payments/stripe/hk: account_id, merchant_entity, mode, secret_key, webhook_secret, portal_configuration_id, frontend_url
#   kv/prod/payments/stripe/us: account_id, merchant_entity, mode, secret_key, webhook_secret, portal_configuration_id, frontend_url
#
# Step 3: Add this ExternalSecret to services/prod-k3s-v6/web-saas-prod/vault-secrets.yaml
# and mount secret accounts-stripe-profiles at /var/run/accounts-stripe-profiles
# with env STRIPE_PROFILES_FILE=/var/run/accounts-stripe-profiles/stripe-profiles.json
# and STRIPE_DEFAULT_PROFILE=hk (or switch to us during cutover).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accounts-stripe-profiles
  namespace: web-saas-prod
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-prod-k3s-v6
  target:
    name: accounts-stripe-profiles
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        stripe-profiles.json: |
          {
            "defaultProfile": "hk",
            "profiles": {
              "hk": {
                "accountId": "{{ .hk_account_id }}",
                "merchantEntity": "{{ .hk_merchant_entity }}",
                "mode": "{{ .hk_mode }}",
                "secretKey": "{{ .hk_secret_key }}",
                "webhookSecret": "{{ .hk_webhook_secret }}",
                "portalConfigurationId": "{{ .hk_portal_configuration_id }}",
                "frontendUrl": "{{ .hk_frontend_url }}"
              },
              "us": {
                "accountId": "{{ .us_account_id }}",
                "merchantEntity": "{{ .us_merchant_entity }}",
                "mode": "{{ .us_mode }}",
                "secretKey": "{{ .us_secret_key }}",
                "webhookSecret": "{{ .us_webhook_secret }}",
                "portalConfigurationId": "{{ .us_portal_configuration_id }}",
                "frontendUrl": "{{ .us_frontend_url }}"
              }
            }
          }
  data:
    - secretKey: hk_account_id
      remoteRef:
        key: prod/payments/stripe/hk
        property: account_id
    - secretKey: hk_merchant_entity
      remoteRef:
        key: prod/payments/stripe/hk
        property: merchant_entity
    - secretKey: hk_mode
      remoteRef:
        key: prod/payments/stripe/hk
        property: mode
    - secretKey: hk_secret_key
      remoteRef:
        key: prod/payments/stripe/hk
        property: secret_key
    - secretKey: hk_webhook_secret
      remoteRef:
        key: prod/payments/stripe/hk
        property: webhook_secret
    - secretKey: hk_portal_configuration_id
      remoteRef:
        key: prod/payments/stripe/hk
        property: portal_configuration_id
    - secretKey: hk_frontend_url
      remoteRef:
        key: prod/payments/stripe/hk
        property: frontend_url
    - secretKey: us_account_id
      remoteRef:
        key: prod/payments/stripe/us
        property: account_id
    - secretKey: us_merchant_entity
      remoteRef:
        key: prod/payments/stripe/us
        property: merchant_entity
    - secretKey: us_mode
      remoteRef:
        key: prod/payments/stripe/us
        property: mode
    - secretKey: us_secret_key
      remoteRef:
        key: prod/payments/stripe/us
        property: secret_key
    - secretKey: us_webhook_secret
      remoteRef:
        key: prod/payments/stripe/us
        property: webhook_secret
    - secretKey: us_portal_configuration_id
      remoteRef:
        key: prod/payments/stripe/us
        property: portal_configuration_id
    - secretKey: us_frontend_url
      remoteRef:
        key: prod/payments/stripe/us
        property: frontend_url
