apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web-saas-prod
  namespace: web-saas-prod
spec:
  suspend: false
  interval: 5m
  releaseName: web-saas
  targetNamespace: web-saas-prod
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: web-saas-console
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-console
              spec:
                template:
                  spec:
                    containers:
                      - name: console
                        env:
                          - name: PORT
                            value: '3000'
                        securityContext:
                          capabilities:
                            add: [CHOWN, SETUID, SETGID]
          - target:
              kind: Deployment
              name: web-saas-content
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-content
              spec:
                template:
                  spec:
                    containers:
                      - name: content
                        startupProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          periodSeconds: 10
                          timeoutSeconds: 3
                          failureThreshold: 30
  values:
    global:
      environment: prod
      expectedNamespace: web-saas-prod
    caddy:
      enabled: false
    postgresql:
      enabled: false
    console:
      enabled: true
      deploymentProfile: single-container
      singleContainer:
        image: ghcr.io/ai-workspace-services/console@sha256:06775cfa5582fb83bae336c4c4befe1fbd4f7747d526653b80736e3e4862e666
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 125m, memory: 192Mi}
        volumes:
          - name: nginx-config
            configMap:
              name: web-saas-console-nginx
          - name: tmp
            emptyDir: {}
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
          - name: tmp
            mountPath: /tmp
    accounts:
      enabled: true
      workload:
        env:
          IMAGE: ghcr.io/ai-workspace-services/accounts:sha-a0a867f0c7b9bf9480f5db42a4b7aec316daa9fb@sha256:973fb82cb67d44f845144a84752e17bca0dea0d2c3c509db7541c968d0b07b29
          DB_HOST: postgresql-postgresql.postgresql-prod.svc.cluster.local
          DB_PORT: '5432'
          POSTGRES_USER: postgres
          DB_NAME: account
          XWORKMATE_SHARED_TENANT_DOMAIN: svc.plus
        secretRefs:
        - web-saas-secrets
        - accounts-db-runtime
        - accounts-bootstrap
        image: ghcr.io/ai-workspace-services/accounts:sha-a0a867f0c7b9bf9480f5db42a4b7aec316daa9fb@sha256:973fb82cb67d44f845144a84752e17bca0dea0d2c3c509db7541c968d0b07b29
        resources:
          requests: {cpu: 25m, memory: 96Mi}
          limits: {cpu: 100m, memory: 128Mi}
    billing:
      enabled: true
      workload:
        env:
          DB_HOST: postgresql-postgresql.postgresql-prod.svc.cluster.local
          DB_PORT: '5432'
          POSTGRES_USER: postgres
          DB_NAME: account
          BILLING_INGEST_MODE: push
          DEFAULT_REGION: jp
          IMAGE: ghcr.io/ai-workspace-services/billing-service@sha256:14bbaee5ba37d85ddf243272ee2c3bed25603ee26ffd5c0b8d685cfe0e7a85a0
        secretRefs:
        - web-saas-secrets
        - billing-db-runtime
        image: ghcr.io/ai-workspace-services/billing-service@sha256:14bbaee5ba37d85ddf243272ee2c3bed25603ee26ffd5c0b8d685cfe0e7a85a0
        probes:
          startupProbe:
            httpGet:
              path: /api/ping
              port: primary
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /readyz
              port: primary
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/ping
              port: primary
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
        resources:
          requests: {cpu: 25m, memory: 96Mi}
          limits: {cpu: 100m, memory: 128Mi}
    content:
      enabled: true
      workload:
        env:
          KNOWLEDGE_REPO_PATH: /tmp/knowledge
          KNOWLEDGE_REPO_URL: https://github.com/ai-workspace-services/knowledge.git
        image: ghcr.io/ai-workspace-services/docs@sha256:e6e791437bd3b57a4dec0bc9dc2527b681dd52960b6f692be6ff16322018788e
        secretRefs:
        - web-saas-secrets
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
    edgeGateway:
      enabled: false
    stunnelClient:
      enabled: false
    stunnelServer:
      enabled: false
