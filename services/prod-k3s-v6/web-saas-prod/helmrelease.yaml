# ==============================================================================
# DDTrace 链路追踪快速开关 (GitOps HelmRelease Values):
# - 业务侧快速关闭: 将下方各组件 env 中 DD_TRACE_ENABLED 设为 "false"
#   (升级至 chart >= 0.2.20 后可直接通过 values.global.tracing.ddtrace.enabled: true/false 统一控制)
# - 采集器侧快速关闭: 将 observability-prod/datakit-helmrelease.yaml 的 workload.replicas 设为 0
# ==============================================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web-saas-prod
  namespace: web-saas-prod
spec:
  suspend: false
  interval: 5m
  releaseName: web-saas
  targetNamespace: web-saas-prod
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: web-saas-accounts
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-accounts
              spec:
                template:
                  spec:
                    volumes:
                      - name: accounts-controller-config
                        secret:
                          secretName: accounts-controller-config
                          defaultMode: 0400
                    containers:
                      - name: accounts
                        env:
                          - name: CONFIG_TEMPLATE
                            value: /var/run/accounts-controller-config/account.yaml
                          - name: CONFIG_PATH
                            value: /tmp/accounts-controller-config.yaml
                        volumeMounts:
                          - name: accounts-controller-config
                            mountPath: /var/run/accounts-controller-config
                            readOnly: true
          - target:
              kind: Deployment
              name: web-saas-console
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-console
              spec:
                template:
                  metadata:
                    annotations:
                      delivery.svc.plus/rollout-revision: "v2026.11.28-console-slim-no-telemetry"
                  spec:
                    containers:
                      - name: console
                        env:
                          - name: PORT
                            value: '3000'
                          - name: RUNTIME_ENV
                            value: prod
                          - name: RUNTIME_AUTH_URL
                            value: http://web-saas-accounts.web-saas-prod.svc.cluster.local:80
                          - name: RUNTIME_AGENT_SERVER_URL
                            value: http://web-saas-xconnect-controller.web-saas-prod.svc.cluster.local:80
                          - name: RUNTIME_XCONNECT_ZERO_URL
                            value: http://web-saas-xconnect-controller.web-saas-prod.svc.cluster.local:80
                          - name: RUNTIME_DOCS_SERVICE_URL
                            value: http://web-saas-content.web-saas-prod.svc.cluster.local:80
                          - name: RUNTIME_BILLING_SERVICE_URL
                            value: http://web-saas-billing.web-saas-prod.svc.cluster.local:80
                          - name: CONSOLE_PING_UPSTREAM_PROBE
                            value: "true"
                          - name: RUNTIME_DASHBOARD_URL
                            value: https://console.svc.plus
                          - name: OBSERVABILITY_AUTH_USER
                            value: observability
                          - name: OBSERVABILITY_AUTH_USERNAME
                            value: observability
                          - name: FRONTEND_IMAGE
                            value: ghcr.io/ai-workspace-services/console:sha-09a6fec05d93fe53f133f028221f6fc29f1105b9@sha256:20d5b7d8b5d970ed588f38a207559332e741d33eede3223f20cd85f86ee52eeb
                          - name: NEXT_TELEMETRY_DISABLED
                            value: "1"
                          - name: DD_TRACE_ENABLED
                            value: "false"
                          - name: OTEL_SDK_DISABLED
                            value: "true"
                          - name: TRACING_PROVIDER
                            value: "none"
                          - name: DD_SERVICE
                            value: web-saas-console
                          - name: DD_ENV
                            value: prod
                        securityContext:
                          capabilities:
                            add: [CHOWN, SETUID, SETGID]
                        startupProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          periodSeconds: 5
                          timeoutSeconds: 3
                          failureThreshold: 18
                        readinessProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          periodSeconds: 10
                          timeoutSeconds: 3
                          failureThreshold: 3
                        livenessProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          initialDelaySeconds: 20
                          periodSeconds: 10
                          timeoutSeconds: 3
                          failureThreshold: 3
          - target:
              kind: Deployment
              name: web-saas-content
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-content
              spec:
                template:
                  spec:
                    containers:
                      - name: content
                        startupProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          periodSeconds: 10
                          timeoutSeconds: 3
                          failureThreshold: 30
  values:
    global:
      environment: prod
      expectedNamespace: web-saas-prod
    caddy:
      enabled: false
    postgresql:
      enabled: false
    console:
      enabled: true
      vpa:
        enabled: false
      deploymentProfile: single-container
      singleContainer:
        image: ghcr.io/ai-workspace-services/console:sha-09a6fec05d93fe53f133f028221f6fc29f1105b9@sha256:20d5b7d8b5d970ed588f38a207559332e741d33eede3223f20cd85f86ee52eeb
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 250m, memory: 256Mi}
        volumes:
          - name: nginx-config
            configMap:
              name: web-saas-console-nginx-relative-redirects
          - name: tmp
            emptyDir: {}
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
          - name: tmp
            mountPath: /tmp
    accounts:
      enabled: true
      vpa:
        enabled: false
      workload:
        env:
          IMAGE: ghcr.io/ai-workspace-services/accounts:sha-ce28325c3bb034375165c11f24aad33f3946db89@sha256:acb83ec1c70d5088af04b0e47f977c98b6c19f61e4f25342eaef62d108891a3f
          DB_HOST: postgresql-postgresql.postgresql-prod.svc.cluster.local
          DB_PORT: '5432'
          POSTGRES_USER: postgres
          DB_NAME: account
          XWORKMATE_SHARED_TENANT_DOMAIN: svc.plus
          SUBSCRIPTION_GRACE_PERIOD: "72h"
          ACCOUNTS_ENABLE_LEGACY_AGENT_SERVER_ROUTES: "false"
          ACCOUNTS_ENABLE_LEGACY_MARKETING_EMAIL_ROUTES: "true"
          ACCOUNTS_ENABLE_MARKETING_EMAIL_WORKER: "true"
          ACCOUNTS_AGENT_USERS_CACHE_TTL: "15s"
          ACCOUNTS_MARKETING_EMAIL_POLL_INTERVAL: "60s"
          GOMEMLIMIT: "400MiB"
          DD_TRACE_ENABLED: "true"
          DD_AGENT_HOST: datakit-service.observability-prod.svc
          DD_TRACE_AGENT_PORT: "9529"
          DD_SERVICE: web-saas-accounts
          DD_ENV: prod
          DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext
        secretRefs:
        - web-saas-secrets
        - accounts-db-runtime
        - accounts-bootstrap
        - accounts-stripe
        image: ghcr.io/ai-workspace-services/accounts:sha-ce28325c3bb034375165c11f24aad33f3946db89@sha256:acb83ec1c70d5088af04b0e47f977c98b6c19f61e4f25342eaef62d108891a3f
        probes:
          startupProbe:
            httpGet:
              path: /healthz
              port: primary
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /healthz
              port: primary
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: primary
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
        resources:
          requests: {cpu: 100m, memory: 192Mi}
          limits: {cpu: 500m, memory: 512Mi}
    billing:
      enabled: true
      vpa:
        enabled: false
      workload:
        env:
          DB_HOST: postgresql-postgresql.postgresql-prod.svc.cluster.local
          DB_PORT: '5432'
          POSTGRES_USER: postgres
          DB_NAME: account
          BILLING_INGEST_MODE: push
          DEFAULT_REGION: jp
          ARREARS_SUSPEND_THRESHOLD: "72h"
          IMAGE: ghcr.io/ai-workspace-services/billing-service:sha-3f78d10f1d475976b8af047757307a62800dc13d@sha256:6bea9270368f46a15df1478725a659b3f2c46c1d307816ddaa6fddedee494334
          DD_TRACE_ENABLED: "true"
          DD_AGENT_HOST: datakit-service.observability-prod.svc
          DD_TRACE_AGENT_PORT: "9529"
          DD_SERVICE: web-saas-billing
          DD_ENV: prod
          DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext
        secretRefs:
        - web-saas-secrets
        - billing-db-runtime
        image: ghcr.io/ai-workspace-services/billing-service:sha-3f78d10f1d475976b8af047757307a62800dc13d@sha256:6bea9270368f46a15df1478725a659b3f2c46c1d307816ddaa6fddedee494334
        probes:
          startupProbe:
            httpGet:
              path: /api/ping
              port: primary
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /readyz
              port: primary
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/ping
              port: primary
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
        resources:
          requests: {cpu: 25m, memory: 96Mi}
          limits: {cpu: 100m, memory: 128Mi}
    content:
      enabled: true
      vpa:
        enabled: false
      workload:
        env:
          KNOWLEDGE_REPO_PATH: /tmp/knowledge
          KNOWLEDGE_REPO_URL: https://github.com/ai-workspace-services/knowledge.git
          DD_TRACE_ENABLED: "true"
          DD_AGENT_HOST: datakit-service.observability-prod.svc
          DD_TRACE_AGENT_PORT: "9529"
          DD_SERVICE: web-saas-content
          DD_ENV: prod
          DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext
        image: ghcr.io/ai-workspace-services/docs:sha-0ba1980d2d94de9e3c32b0fff818f8784e096f59@sha256:6e48124aa15242ab3e1690c7273b90af7d965231009289e0c08cafe722d56fed
        secretRefs:
        - web-saas-secrets
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
    xconnectController:
      enabled: true
      vpa:
        enabled: false
      workload:
        image: ghcr.io/ai-workspace-services/xconnect-controller:sha-c43ef49ae620ab71f0e37bac6c3aeb0845590e6b@sha256:be5889830a6332674b9917f2f221de1a7aa4d2769a44e901db9e3e2280980c3e
        port: 8080
        replicas: 1
        env:
          DB_HOST: postgresql-postgresql.postgresql-prod.svc.cluster.local
          DB_PORT: "5432"
          POSTGRES_USER: postgres
          DB_NAME: account
          GOMEMLIMIT: "200MiB"
          XCONNECT_SCHEMA_MANAGED: "true"
          XCONNECT_OVERLAY_REQUIRE_SIGNING_KEY: "true"
          XCONNECT_OVERLAY_PREVIOUS_SIGNING_KEY_ID: "zero-signing-current"
          XCONNECT_OVERLAY_PREVIOUS_SIGNING_PUBLIC_KEY: "s5yiz7WTECJKgBSapXGM9WOdoud/76xZbmHGbdK4y7o="
          XCONNECT_OVERLAY_PREVIOUS_SIGNING_NOT_AFTER: "2026-12-03T00:00:00Z"
          ACCOUNTS_JWKS_URL: "http://web-saas-accounts.web-saas-prod.svc.cluster.local:80/.well-known/jwks.json"
          PUBLIC_URL: "https://accounts.svc.plus"
          XCONNECT_AGENT_USERS_CACHE_TTL: "15s"
          OTEL_SERVICE_NAME: web-saas-xconnect-controller
          OTEL_ENVIRONMENT: prod
          OTEL_EXPORTER_OTLP_PROTOCOL: grpc
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://datakit-service.observability-prod.svc:4317
          OTEL_TRACES_SAMPLER_ARG: "1.0"
          DD_TRACE_ENABLED: "false"
          DD_AGENT_HOST: datakit-service.observability-prod.svc
          DD_TRACE_AGENT_PORT: "9529"
          DD_SERVICE: web-saas-xconnect-controller
          DD_ENV: prod
          DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext
        secretRefs:
          - accounts-db-runtime
          - web-saas-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        probes:
          startupProbe:
            httpGet:
              path: /healthz
              port: primary
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: primary
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: primary
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
    edgeGateway:
      enabled: false
    stunnelClient:
      enabled: false
    stunnelServer:
      enabled: false
    flagger:
      enabled: true
      meshProvider: traefik
      metricsServer: http://observability-observability-stack-victoria-metrics.observability-prod:8428
      selectorLabels: websaas.io/workload,app.kubernetes.io/name,app
      crd:
        create: true
