apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web-saas-prod
  namespace: web-saas-prod
spec:
  suspend: false
  interval: 5m
  releaseName: web-saas
  targetNamespace: web-saas-prod
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: web-saas-accounts
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-accounts
              spec:
                template:
                  spec:
                    volumes:
                      - name: accounts-controller-config
                        secret:
                          secretName: accounts-controller-config
                          defaultMode: 0400
                    containers:
                      - name: accounts
                        env:
                          - name: CONFIG_TEMPLATE
                            value: /var/run/accounts-controller-config/account.yaml
                          - name: CONFIG_PATH
                            value: /tmp/accounts-controller-config.yaml
                        volumeMounts:
                          - name: accounts-controller-config
                            mountPath: /var/run/accounts-controller-config
                            readOnly: true
          - target:
              kind: Deployment
              name: web-saas-console
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-console
              spec:
                template:
                  metadata:
                    annotations:
                      delivery.svc.plus/rollout-revision: "portal-511-prod-retry-1"
                  spec:
                    containers:
                      - name: console
                        env:
                          - name: PORT
                            value: '3000'
                          - name: RUNTIME_ENV
                            value: prod
                          - name: RUNTIME_AUTH_URL
                            value: http://web-saas-accounts.web-saas-prod.svc.cluster.local:80
                          - name: RUNTIME_XCONNECT_ZERO_URL
                            value: http://web-saas-accounts.web-saas-prod.svc.cluster.local:80
                          - name: RUNTIME_DASHBOARD_URL
                            value: https://console.svc.plus
                          - name: FRONTEND_IMAGE
                            value: ghcr.io/ai-workspace-services/console:sha-a70972777cc68c7efe627f9dfe07e3c65764ffa3@sha256:c1be09d661ecfb3adc6d4228240c630af61ba18b1fd66190302be12d154c85cd
                        securityContext:
                          capabilities:
                            add: [CHOWN, SETUID, SETGID]
          - target:
              kind: Deployment
              name: web-saas-content
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-content
              spec:
                template:
                  spec:
                    containers:
                      - name: content
                        startupProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          periodSeconds: 10
                          timeoutSeconds: 3
                          failureThreshold: 30
  values:
    global:
      environment: prod
      expectedNamespace: web-saas-prod
    caddy:
      enabled: false
    postgresql:
      enabled: false
    console:
      enabled: true
      deploymentProfile: single-container
      singleContainer:
        image: ghcr.io/ai-workspace-services/console:sha-a70972777cc68c7efe627f9dfe07e3c65764ffa3@sha256:c1be09d661ecfb3adc6d4228240c630af61ba18b1fd66190302be12d154c85cd
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 125m, memory: 192Mi}
        volumes:
          - name: nginx-config
            configMap:
              name: web-saas-console-nginx-relative-redirects
          - name: tmp
            emptyDir: {}
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
          - name: tmp
            mountPath: /tmp
    accounts:
      enabled: true
      workload:
        env:
          IMAGE: ghcr.io/ai-workspace-services/accounts:sha-84bc14499d9c59810c6aa21687f0271a88cae1f1@sha256:589dca5980f5863c83112b8cc88007d1aa8dfdd9631ef6e98dc0a9c327c77cf0
          DB_HOST: postgresql-postgresql.postgresql-prod.svc.cluster.local
          DB_PORT: '5432'
          POSTGRES_USER: postgres
          DB_NAME: account
          XWORKMATE_SHARED_TENANT_DOMAIN: svc.plus
        secretRefs:
        - web-saas-secrets
        - accounts-db-runtime
        - accounts-bootstrap
        - accounts-stripe
        image: ghcr.io/ai-workspace-services/accounts:sha-84bc14499d9c59810c6aa21687f0271a88cae1f1@sha256:589dca5980f5863c83112b8cc88007d1aa8dfdd9631ef6e98dc0a9c327c77cf0
        resources:
          requests: {cpu: 25m, memory: 96Mi}
          limits: {cpu: 100m, memory: 128Mi}
    billing:
      enabled: true
      workload:
        env:
          DB_HOST: postgresql-postgresql.postgresql-prod.svc.cluster.local
          DB_PORT: '5432'
          POSTGRES_USER: postgres
          DB_NAME: account
          BILLING_INGEST_MODE: push
          DEFAULT_REGION: jp
          IMAGE: ghcr.io/ai-workspace-services/billing-service:v2026.11.03.4@sha256:0dbbe1fc63685ba9f9703114210d7e3e61d962b77f62ad87be145354a7e9bc3d
        secretRefs:
        - web-saas-secrets
        - billing-db-runtime
        image: ghcr.io/ai-workspace-services/billing-service:v2026.11.03.4@sha256:0dbbe1fc63685ba9f9703114210d7e3e61d962b77f62ad87be145354a7e9bc3d
        probes:
          startupProbe:
            httpGet:
              path: /api/ping
              port: primary
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /readyz
              port: primary
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/ping
              port: primary
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
        resources:
          requests: {cpu: 25m, memory: 96Mi}
          limits: {cpu: 100m, memory: 128Mi}
    content:
      enabled: true
      workload:
        env:
          KNOWLEDGE_REPO_PATH: /tmp/knowledge
          KNOWLEDGE_REPO_URL: https://github.com/ai-workspace-services/knowledge.git
        image: ghcr.io/ai-workspace-services/docs@sha256:e6e791437bd3b57a4dec0bc9dc2527b681dd52960b6f692be6ff16322018788e
        secretRefs:
        - web-saas-secrets
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
    edgeGateway:
      enabled: false
    stunnelClient:
      enabled: false
    stunnelServer:
      enabled: false
    flagger:
      enabled: true
      meshProvider: traefik
      metricsServer: http://observability-observability-stack-victoria-metrics.observability-prod:8428
      selectorLabels: websaas.io/workload,app.kubernetes.io/name,app
      crd:
        create: true
