# ==============================================================================
# DDTrace 链路追踪快速开关 (GitOps HelmRelease Values):
# - 业务侧快速关闭: 将下方各组件 env 中 DD_TRACE_ENABLED 设为 "false"
#   (升级至 chart >= 0.2.20 后可直接通过 values.global.tracing.ddtrace.enabled: true/false 统一控制)
# - 采集器侧快速关闭: 将 observability-prod/datakit-helmrelease.yaml 的 workload.replicas 设为 0
# ==============================================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web-saas-prod
  namespace: web-saas-prod
spec:
  suspend: false
  interval: 5m
  releaseName: web-saas
  targetNamespace: web-saas-prod
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: web-saas-accounts
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-accounts
              spec:
                template:
                  spec:
                    volumes:
                      - name: accounts-controller-config
                        secret:
                          secretName: accounts-controller-config
                          defaultMode: 0400
                    containers:
                      - name: accounts
                        env:
                          - name: CONFIG_TEMPLATE
                            value: /var/run/accounts-controller-config/account.yaml
                          - name: CONFIG_PATH
                            value: /tmp/accounts-controller-config.yaml
                        volumeMounts:
                          - name: accounts-controller-config
                            mountPath: /var/run/accounts-controller-config
                            readOnly: true
          - target:
              kind: Deployment
              name: web-saas-console
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-console
              spec:
                template:
                  metadata:
                    annotations:
                      delivery.svc.plus/rollout-revision: "v2026.11.26-ddtrace-on-r4"
                  spec:
                    containers:
                      - name: console
                        env:
                          - name: PORT
                            value: '3000'
                          - name: RUNTIME_ENV
                            value: prod
                          - name: RUNTIME_AUTH_URL
                            value: http://web-saas-accounts.web-saas-prod.svc.cluster.local:80
                          - name: RUNTIME_XCONNECT_ZERO_URL
                            value: http://xconnect-controller.web-saas-prod.svc.cluster.local:80
                          - name: RUNTIME_DOCS_SERVICE_URL
                            value: http://web-saas-content.web-saas-prod.svc.cluster.local:80
                          - name: RUNTIME_BILLING_SERVICE_URL
                            value: http://web-saas-billing.web-saas-prod.svc.cluster.local:80
                          - name: CONSOLE_PING_UPSTREAM_PROBE
                            value: "true"
                          - name: RUNTIME_DASHBOARD_URL
                            value: https://console.svc.plus
                          - name: OBSERVABILITY_AUTH_USER
                            value: observability
                          - name: OBSERVABILITY_AUTH_USERNAME
                            value: observability
                          - name: FRONTEND_IMAGE
                            value: ghcr.io/ai-workspace-services/console:sha-1cbc38d321a07b6f5ea9f6a0f52ac45e559a620c@sha256:2f6c811befbc5b862a0e93695202d9f68ba0a9eee8ccf2d7f3a593f21a6e7ee9
                          - name: DD_TRACE_ENABLED
                            value: "true"
                          - name: DD_AGENT_HOST
                            value: datakit-service.observability-prod.svc
                          - name: DD_TRACE_AGENT_PORT
                            value: "9529"
                          - name: DD_SERVICE
                            value: web-saas-console
                          - name: DD_ENV
                            value: prod
                          - name: DD_TRACE_PROPAGATION_STYLE
                            value: datadog,tracecontext
                        securityContext:
                          capabilities:
                            add: [CHOWN, SETUID, SETGID]
                        startupProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          periodSeconds: 5
                          timeoutSeconds: 3
                          failureThreshold: 18
                        readinessProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          periodSeconds: 10
                          timeoutSeconds: 3
                          failureThreshold: 3
                        livenessProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          initialDelaySeconds: 20
                          periodSeconds: 10
                          timeoutSeconds: 3
                          failureThreshold: 3
          - target:
              kind: Deployment
              name: web-saas-content
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: web-saas-content
              spec:
                template:
                  spec:
                    containers:
                      - name: content
                        startupProbe:
                          httpGet:
                            path: /healthz
                            port: 8080
                          periodSeconds: 10
                          timeoutSeconds: 3
                          failureThreshold: 30
  values:
    global:
      environment: prod
      expectedNamespace: web-saas-prod
    caddy:
      enabled: false
    postgresql:
      enabled: false
    console:
      enabled: true
      vpa:
        enabled: false
      deploymentProfile: single-container
      singleContainer:
        image: ghcr.io/ai-workspace-services/console:sha-1cbc38d321a07b6f5ea9f6a0f52ac45e559a620c@sha256:2f6c811befbc5b862a0e93695202d9f68ba0a9eee8ccf2d7f3a593f21a6e7ee9
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 250m, memory: 256Mi}
        volumes:
          - name: nginx-config
            configMap:
              name: web-saas-console-nginx-relative-redirects
          - name: tmp
            emptyDir: {}
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
            readOnly: true
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
          - name: tmp
            mountPath: /tmp
    accounts:
      enabled: true
      vpa:
        enabled: false
      workload:
        env:
          IMAGE: ghcr.io/ai-workspace-services/accounts:sha-7b5759bf8c3d98a2bde3fa432f29902f8875d3cd@sha256:472a16bc549cce859398e6cf210d030240e53cb8deec46c3f71fb30a78a60bca
          DB_HOST: postgresql-postgresql.postgresql-prod.svc.cluster.local
          DB_PORT: '5432'
          POSTGRES_USER: postgres
          DB_NAME: account
          XWORKMATE_SHARED_TENANT_DOMAIN: svc.plus
          SUBSCRIPTION_GRACE_PERIOD: "72h"
          GOMEMLIMIT: "400MiB"
          DD_TRACE_ENABLED: "true"
          DD_AGENT_HOST: datakit-service.observability-prod.svc
          DD_TRACE_AGENT_PORT: "9529"
          DD_SERVICE: web-saas-accounts
          DD_ENV: prod
          DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext
        secretRefs:
        - web-saas-secrets
        - accounts-db-runtime
        - accounts-bootstrap
        - accounts-stripe
        image: ghcr.io/ai-workspace-services/accounts:sha-7b5759bf8c3d98a2bde3fa432f29902f8875d3cd@sha256:472a16bc549cce859398e6cf210d030240e53cb8deec46c3f71fb30a78a60bca
        probes:
          startupProbe:
            httpGet:
              path: /healthz
              port: primary
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /healthz
              port: primary
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: primary
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
        resources:
          requests: {cpu: 100m, memory: 192Mi}
          limits: {cpu: 500m, memory: 512Mi}
    billing:
      enabled: true
      vpa:
        enabled: false
      workload:
        env:
          DB_HOST: postgresql-postgresql.postgresql-prod.svc.cluster.local
          DB_PORT: '5432'
          POSTGRES_USER: postgres
          DB_NAME: account
          BILLING_INGEST_MODE: push
          DEFAULT_REGION: jp
          ARREARS_SUSPEND_THRESHOLD: "72h"
          IMAGE: ghcr.io/ai-workspace-services/billing-service:sha-3f78d10f1d475976b8af047757307a62800dc13d@sha256:6bea9270368f46a15df1478725a659b3f2c46c1d307816ddaa6fddedee494334
          DD_TRACE_ENABLED: "true"
          DD_AGENT_HOST: datakit-service.observability-prod.svc
          DD_TRACE_AGENT_PORT: "9529"
          DD_SERVICE: web-saas-billing
          DD_ENV: prod
          DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext
        secretRefs:
        - web-saas-secrets
        - billing-db-runtime
        image: ghcr.io/ai-workspace-services/billing-service:sha-3f78d10f1d475976b8af047757307a62800dc13d@sha256:6bea9270368f46a15df1478725a659b3f2c46c1d307816ddaa6fddedee494334
        probes:
          startupProbe:
            httpGet:
              path: /api/ping
              port: primary
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /readyz
              port: primary
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/ping
              port: primary
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
        resources:
          requests: {cpu: 25m, memory: 96Mi}
          limits: {cpu: 100m, memory: 128Mi}
    content:
      enabled: true
      vpa:
        enabled: false
      workload:
        env:
          KNOWLEDGE_REPO_PATH: /tmp/knowledge
          KNOWLEDGE_REPO_URL: https://github.com/ai-workspace-services/knowledge.git
          DD_TRACE_ENABLED: "true"
          DD_AGENT_HOST: datakit-service.observability-prod.svc
          DD_TRACE_AGENT_PORT: "9529"
          DD_SERVICE: web-saas-content
          DD_ENV: prod
          DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext
        image: ghcr.io/ai-workspace-services/docs:sha-0ba1980d2d94de9e3c32b0fff818f8784e096f59@sha256:6e48124aa15242ab3e1690c7273b90af7d965231009289e0c08cafe722d56fed
        secretRefs:
        - web-saas-secrets
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
    edgeGateway:
      enabled: false
    stunnelClient:
      enabled: false
    stunnelServer:
      enabled: false
    flagger:
      enabled: true
      meshProvider: traefik
      metricsServer: http://observability-observability-stack-victoria-metrics.observability-prod:8428
      selectorLabels: websaas.io/workload,app.kubernetes.io/name,app
      crd:
        create: true
