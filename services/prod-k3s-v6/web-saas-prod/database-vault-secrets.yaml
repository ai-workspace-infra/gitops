apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-database-reader
  namespace: web-saas-prod
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-database-reader
  namespace: web-saas-prod
rules:
- apiGroups:
  - ''
  resources:
  - serviceaccounts/token
  resourceNames:
  - app-database-reader
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-database-reader
  namespace: web-saas-prod
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-database-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: app-database-reader
  namespace: web-saas-prod
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-prod-k3s-prod-k3s-v6
          role: prod-k3s-v6-app-database-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: app-database-reader
            audiences:
            - vault-prod-k3s-v6-app-database-reader
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accounts-db-runtime
  namespace: web-saas-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: app-database-reader
  target:
    name: accounts-db-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: prod/Accounts-service
      property: POSTGRES_PASSWORD

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: billing-db-runtime
  namespace: web-saas-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: app-database-reader
  target:
    name: billing-db-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: prod/Accounts-service
      property: DATABASE_URL
