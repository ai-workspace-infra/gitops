---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-database-admin-bootstrap
  namespace: web-saas-prod
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-database-admin-bootstrap
  namespace: web-saas-prod
rules:
- apiGroups:
  - ''
  resources:
  - serviceaccounts/token
  resourceNames:
  - app-database-admin-bootstrap
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-database-admin-bootstrap
  namespace: web-saas-prod
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-database-admin-bootstrap
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: app-database-admin-bootstrap
  namespace: web-saas-prod
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-prod-k3s-prod-k3s-v6
          role: prod-k3s-v6-app-database-admin-bootstrap
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: app-database-admin-bootstrap
            audiences:
            - vault-prod-k3s-v6-app-database-admin-bootstrap
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accounts-db-runtime
  namespace: web-saas-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: app-database-admin-bootstrap
  target:
    name: accounts-db-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .admin_password }}"
        DATABASE_URL: postgresql://root:{{ .admin_password | urlquery | replace "+"
          "%20" }}@postgresql-postgresql.postgresql-prod.svc.cluster.local:5432/account
  data:
  - secretKey: admin_password
    remoteRef:
      key: prod/database/postgresql/admin
      property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: billing-db-runtime
  namespace: web-saas-prod
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: app-database-admin-bootstrap
  target:
    name: billing-db-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        DATABASE_URL: postgresql://root:{{ .admin_password | urlquery | replace "+"
          "%20" }}@postgresql-postgresql.postgresql-prod.svc.cluster.local:5432/account
  data:
  - secretKey: admin_password
    remoteRef:
      key: prod/database/postgresql/admin
      property: password
