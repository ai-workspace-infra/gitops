  name: postgresql-chart
  namespace: platform-postgresql-prod
spec:
  interval: 10m
  url: oci://ghcr.io/x-evor/charts/postgresql
  ref:
    tag: "1.0.0"
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
