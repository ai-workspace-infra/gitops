apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
  namespace: ingress-prod
  labels:
    app.kubernetes.io/name: traefik
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-ingress-ingress-prod
  ports:
  - name: metrics
    port: 9100
    targetPort: 9100
    protocol: TCP
