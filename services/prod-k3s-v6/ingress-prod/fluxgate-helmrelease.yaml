apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluxgate
  namespace: ingress-prod
spec:
  suspend: false
  interval: 5m
  releaseName: fluxgate
  targetNamespace: ingress-prod
  chartRef:
    kind: OCIRepository
    name: fluxgate-chart
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/ai-workspace-xstream/fluxgate
      tag: main
      pullPolicy: Always
    resources:
      requests:
        cpu: 25m
        memory: 24Mi
      limits:
        cpu: 250m
        memory: 64Mi
    # Sensitive credentials only (CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN), synced by fluxgate-vault.yaml
    vault:
      enabled: true
      addr: "https://vault.svc.plus"
      envSecretName: fluxgate-cloudflare-kv
    externalSecret:
      enabled: false
    # Non-sensitive GitOps routing & proportional weights (ConfigMap directory mount -> 5s ArcSwap hot reload)
    config:
      fluxgatefile: |
        {
            http_port 8080
            grace_period 15s
            metrics 0.0.0.0:9102
        }

        accounts.svc.plus {
            @health path /healthz
            handle @health {
                respond "ok" 200
            }

            # 1) Anti-deadlock SSE and stateful agent status/heartbeat ingest stay pinned to in-cluster Go origin
            @agent_origin_only path /api/agent-server/v1/users/events /api/agent-server/v1/status /api/agent-server/v1/nodes/heartbeat /api/internal/nodes/heartbeat
            handle @agent_origin_only {
                reverse_proxy http://web-saas-xconnect-controller.web-saas-prod.svc.cluster.local:80
            }

            # 2) XConnect dual-form hybrid steering: CF Worker Free priority (weight 100, Hyperdrive) + Go warm standby (replicas: 1, weight 0)
            @xconnect_dual path /api/agent-server/v1/* /api/overlay/v1/* /api/auth/sync/*
            handle @xconnect_dual {
                hybrid_proxy {
                    mode weighted_failover
                    sticky_key header(Authorization)
                    retry_safe_methods GET HEAD OPTIONS

                    upstream cf_worker https://xconnect-controller-edge.manbuzhe2008.workers.dev {
                        weight 100
                        rewrite_host xconnect-controller-edge.manbuzhe2008.workers.dev
                        header_up X-Forwarded-By fluxgate-hybrid
                        connect_timeout 1500ms
                        read_timeout 5000ms
                        daily_budget 85000
                        fallback_on_status 429 501 502 503 504 522 524
                        fallback_on_header X-XConnect-Fallback=origin-go
                    }

                    upstream go_origin http://web-saas-xconnect-controller.web-saas-prod.svc.cluster.local:80 {
                        weight 0
                        role fallback
                        connect_timeout 2000ms
                        read_timeout 15000ms
                    }
                }
            }

            # 3) Non-core / edge services: CF Worker Free priority (weight 100) + Go cold-standby fallback (replicas: 0, weight 0)
            @portal_public_config path /api/internal/public-overview /api/internal/sandbox/guest
            handle @portal_public_config {
                hybrid_proxy {
                    mode weighted_failover
                    retry_safe_methods GET HEAD OPTIONS

                    upstream cf_worker https://portal-public-config-edge.manbuzhe2008.workers.dev {
                        weight 100
                        rewrite_host portal-public-config-edge.manbuzhe2008.workers.dev
                        header_up X-Forwarded-By fluxgate-hybrid
                        connect_timeout 1500ms
                        read_timeout 3000ms
                        daily_budget 85000
                        fallback_on_status 429 501 502 503 504 522 524
                    }

                    upstream go_origin http://web-saas-portal-public-config.web-saas-prod.svc.cluster.local:80 {
                        weight 0
                        role fallback
                        connect_timeout 1500ms
                        read_timeout 5000ms
                    }
                }
            }

            @task_session_orchestrator path /api/task-sessions* /api/v1/namespaces* /api/v1/sessions* /api/internal/task-scheduler/*
            handle @task_session_orchestrator {
                hybrid_proxy {
                    mode weighted_failover
                    sticky_key header(Authorization)
                    retry_safe_methods GET HEAD OPTIONS

                    upstream cf_worker https://task-session-orchestrator-edge.manbuzhe2008.workers.dev {
                        weight 100
                        rewrite_host task-session-orchestrator-edge.manbuzhe2008.workers.dev
                        header_up X-Forwarded-By fluxgate-hybrid
                        connect_timeout 1500ms
                        read_timeout 5000ms
                        daily_budget 85000
                        fallback_on_status 429 501 502 503 504 522 524
                    }

                    upstream go_origin http://web-saas-task-session-orchestrator.web-saas-prod.svc.cluster.local:80 {
                        weight 0
                        role fallback
                        connect_timeout 2000ms
                        read_timeout 10000ms
                    }
                }
            }

            @xworkmate_profile_bridge path /api/auth/xworkmate/* /api/internal/bridge/credentials/introspect
            handle @xworkmate_profile_bridge {
                hybrid_proxy {
                    mode weighted_failover
                    sticky_key header(Authorization)
                    retry_safe_methods GET HEAD OPTIONS

                    upstream cf_worker https://xworkmate-profile-bridge-edge.manbuzhe2008.workers.dev {
                        weight 100
                        rewrite_host xworkmate-profile-bridge-edge.manbuzhe2008.workers.dev
                        header_up X-Forwarded-By fluxgate-hybrid
                        connect_timeout 1500ms
                        read_timeout 5000ms
                        daily_budget 85000
                        fallback_on_status 429 501 502 503 504 522 524
                    }

                    upstream go_origin http://web-saas-xworkmate-profile-bridge.web-saas-prod.svc.cluster.local:80 {
                        weight 0
                        role fallback
                        connect_timeout 2000ms
                        read_timeout 10000ms
                    }
                }
            }
        }

        # Catch-all health endpoint for kubelet probes & Traefik Service healthCheck (Pod IP Host header)
        * {
            @probe_health path /healthz
            handle @probe_health {
                respond "ok" 200
            }
        }
    # Pluggable Traefik extension: enhances accounts.svc.plus (leaving accounts-selfhost-prod-v6.svc.plus
    # direct to Go for gateway anti-deadlock) and falls back directly to web-saas-xconnect-controller:80
    # if Fluxgate is scaled down, uninstalled, or fails healthCheck/returns 502-504.
    traefikExtension:
      enabled: true
      routeName: xconnect-dual-hybrid
      entryPoints:
        - websecure
      match: "Host(`accounts.svc.plus`) && (PathPrefix(`/api/agent-server/v1`) || PathPrefix(`/api/overlay/v1`) || PathPrefix(`/api/auth/sync`))"
      priority: 250
      failoverErrorsStatus:
        - "502-504"
      healthCheck:
        path: /healthz
        interval: 5s
        timeout: 1s
      fallbackService:
        name: web-saas-xconnect-controller
        namespace: web-saas-prod
        port: 80
      tls:
        secretName: accounts-tls
