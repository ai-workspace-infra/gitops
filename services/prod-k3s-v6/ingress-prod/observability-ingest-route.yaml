---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: observability-ingest-prefix
  namespace: ingress-prod
spec:
  stripPrefix:
    prefixes:
      - /ingest/metrics
      - /ingest/logs
      - /ingest/otlp
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prod-observability-ingest
  namespace: ingress-prod
spec:
  entryPoints:
    - websecure
  routes:
    - match: >-
        (Host(`observability.svc.plus`) || Host(`observability-k3s-v6.svc.plus`) || Host(`observability-selfhost-prod-v6.svc.plus`)) &&
        (Path(`/ingest/metrics/api/v1/write`) || PathPrefix(`/ingest/logs/`) || PathPrefix(`/ingest/otlp/`))
      kind: Rule
      priority: 1000
      middlewares:
        - name: observability-ingest-prefix
      services:
        - name: observability-ingest-auth
          namespace: observability-prod
          port: 8427
  tls:
    secretName: console-tls
