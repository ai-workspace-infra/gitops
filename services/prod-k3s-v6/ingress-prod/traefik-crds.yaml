apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: ingress-prod
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-crds
  namespace: ingress-prod
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik-crds
      version: "1.18.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: ingress-prod
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
