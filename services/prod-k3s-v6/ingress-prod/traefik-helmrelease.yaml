apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-ingress
  namespace: ingress-prod
spec:
  suspend: false
  interval: 5m
  releaseName: traefik-ingress
  targetNamespace: ingress-prod
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  values:
    global:
      environment: prod
      expectedNamespace: ingress-prod
    console: {enabled: false}
    accounts: {enabled: false}
    billing: {enabled: false}
    content: {enabled: false}
    edgeGateway: {enabled: false}
    postgresql: {enabled: false}
    caddy: {enabled: false}
    stunnelClient: {enabled: false}
    stunnelServer: {enabled: false}
    flagger: {enabled: false}
    traefik:
      enabled: true
      deployment:
        replicas: 1
      service:
        enabled: true
        single: true
        spec:
          type: LoadBalancer
      ports:
        metrics:
          port: 9100
          exposedPort: 9100
        web:
          port: 8000
          exposedPort: 80
        websecure:
          port: 8443
          exposedPort: 443
      providers:
        kubernetesCRD:
          enabled: true
          allowCrossNamespace: true
        kubernetesIngress:
          enabled: true
          publishedService:
            enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 500m
          memory: 256Mi
      readinessProbe:
        failureThreshold: 3
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
      livenessProbe:
        failureThreshold: 6
        initialDelaySeconds: 15
        periodSeconds: 15
        timeoutSeconds: 5
