apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prod-platform-routes
  namespace: ingress-prod
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Console (Frontend)
    - match: Host(`console-selfhost-prod-v6.svc.plus`) || Host(`console.svc.plus`)
      kind: Rule
      services:
        - kind: TraefikService
          name: web-saas-console
          namespace: web-saas-prod
    # Extra Brand Console
    - match: Host(`xworktech.com`)
      kind: Rule
      services:
        - kind: TraefikService
          name: web-saas-console
          namespace: web-saas-prod
    # XConnect Controller (Autonomous Overlay Device/Gateway Endpoints - Stage 1 Cutover)
    - match: (Host(`accounts-selfhost-prod-v6.svc.plus`) || Host(`accounts.svc.plus`)) && (PathPrefix(`/api/overlay/v1/device/session`) || PathPrefix(`/api/overlay/v1/enrollment/`) || PathPrefix(`/api/overlay/v1/gateway/signed-config`) || PathPrefix(`/api/overlay/v1/join-tokens/exchange`) || PathPrefix(`/api/overlay/v1/registrations`))
      kind: Rule
      priority: 200
      services:
        - name: xconnect-controller
          namespace: web-saas-prod
          port: 80
    # Accounts (Auth / Sessions / API)
    - match: Host(`accounts-selfhost-prod-v6.svc.plus`) || Host(`accounts.svc.plus`)
      kind: Rule
      services:
        - kind: TraefikService
          name: web-saas-accounts
          namespace: web-saas-prod
    # Billing
    - match: Host(`billing-selfhost-prod-v6.svc.plus`) || Host(`billing.svc.plus`)
      kind: Rule
      services:
        - kind: TraefikService
          name: web-saas-billing
          namespace: web-saas-prod
    # Observability (Grafana)
    - match: Host(`observability-k3s-v6.svc.plus`) || Host(`observability-selfhost-prod-v6.svc.plus`) || Host(`observability.svc.plus`)
      kind: Rule
      services:
        - name: observability-observability-stack
          namespace: observability-prod
          port: 3000
    # Vault UI
    - match: Host(`vault-selfhost-prod-v6.svc.plus`) || Host(`vault.svc.plus`)
      kind: Rule
      services:
        - name: vault
          namespace: vault-prod
          port: 8200
          scheme: https
          serversTransport: vault-transport
  tls:
    secretName: console-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prod-brand-console-route
  namespace: ingress-prod
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`xworktech.com`)
      kind: Rule
      services:
        - kind: TraefikService
          name: web-saas-console
          namespace: web-saas-prod
  tls:
    secretName: brand-console-tls
