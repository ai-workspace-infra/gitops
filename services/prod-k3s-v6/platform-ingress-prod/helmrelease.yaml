apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: caddy-ingress
  namespace: platform-ingress-prod
spec:
  suspend: true
  interval: 5m
  releaseName: caddy-ingress
  targetNamespace: platform-ingress-prod
  chart:
    spec:
      chart: caddy-ingress-controller
      version: "1.3.0"
      sourceRef:
        kind: HelmRepository
        name: caddyserver
        namespace: platform-ingress-prod
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    replicaCount: 1
    image:
      repository: caddy/ingress
      tag: v0.2.1
      pullPolicy: IfNotPresent
    ingressController:
      className: caddy-v6
      classNameRequired: true
      config:
        metrics: true
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: caddy-ingress-caddy-ingress-controller
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: caddy-ingress-caddy-ingress-controller
              spec:
                strategy:
                  type: Recreate
                template:
                  spec:
                    nodeSelector:
                      kubernetes.io/hostname: web-saas-k3s-v6
                    containers:
                      - name: caddy-ingress-controller
                        ports:
                          - name: http
                            containerPort: 80
                            hostPort: 80
                            protocol: TCP
                          - name: https
                            containerPort: 443
                            hostPort: 443
                            protocol: TCP
