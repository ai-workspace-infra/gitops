---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: business-namespaces-ingress
  namespace: postgresql-prod
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - web-saas-prod
          - postgresql-prod
          - ingress-prod
          - observability-prod
          - vault-prod
