apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: postgresql-prod
spec:
  suspend: true
  interval: 5m
  releaseName: postgresql
  targetNamespace: postgresql-prod
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  values:
    console:
      enabled: false
    accounts:
      enabled: false
    billing:
      enabled: false
    content:
      enabled: false
    edgeGateway:
      enabled: false
    postgresql:
      enabled: true
      image: ghcr.io/ai-workspace-services/postgresql@sha256:56f4179bafafa52061ac21003dc80c1a0b7ceb63fffb2c7bd05f29237b62b85e
      username: postgres
      database: account
      existingSecret: postgresql-superuser
      secretKey: POSTGRES_PASSWORD
      storage:
        className: local-path
        size: 20Gi
      metrics:
        enabled: true
    caddy:
      enabled: false
    stunnelClient:
      enabled: false
    stunnelServer:
      enabled: false
    global:
      environment: prod
      expectedNamespace: postgresql-prod
