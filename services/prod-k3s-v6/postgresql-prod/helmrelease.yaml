apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: postgresql-prod
spec:
  suspend: false
  interval: 5m
  releaseName: postgresql
  targetNamespace: postgresql-prod
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  values:
    console:
      enabled: false
    accounts:
      enabled: false
    billing:
      enabled: false
    content:
      enabled: false
    edgeGateway:
      enabled: false
    postgresql:
      enabled: true
      vpa:
        enabled: false
      image: ghcr.io/ai-workspace-services/postgresql:v2026.11.19-r2@sha256:d523ce772d4e9586afbbdb79090cf5441346c477cf8f8921cf7159cd2577b3af
      username: postgres
      database: account
      existingSecret: postgresql-admin
      secretKey: password
      identityAccounts:
        enabled: true
        root: {username: postgres, existingSecret: postgresql-admin, secretKey: password}
        operator: {username: operator, existingSecret: postgresql-operator, secretKey: password, tables: [], sequences: []}
        auditor: {username: auditor, existingSecret: postgresql-auditor, secretKey: password, views: []}
      storage:
        className: local-path
        size: 20Gi
      metrics:
        enabled: true
        username: auditor
        existingSecret: postgresql-auditor
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 25m, memory: 64Mi}
      resources:
        requests: {cpu: 200m, memory: 384Mi}
        limits: {cpu: 300m, memory: 512Mi}
    caddy:
      enabled: false
    stunnelClient:
      enabled: false
    stunnelServer:
      enabled: false
    global:
      environment: prod
      expectedNamespace: postgresql-prod
      imagePullSecrets:
        - name: postgresql-ghcr-pull
