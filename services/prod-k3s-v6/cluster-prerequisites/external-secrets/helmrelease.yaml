# ESO 2.14.0 is the upstream chart/app release whose support matrix includes Kubernetes 1.37.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  suspend: false
  interval: 5m
  releaseName: external-secrets
  targetNamespace: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.14.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  values:
    installCRDs: true
    serviceAccount:
      create: true
      name: external-secrets
      automount: true
    rbac:
      create: true
      serviceAccountTokenCreate: false
