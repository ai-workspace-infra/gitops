# ESO 2.14.0 is the upstream chart/app release whose support matrix includes Kubernetes 1.37.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  suspend: false
  interval: 5m
  releaseName: external-secrets
  targetNamespace: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.14.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  values:
    installCRDs: true
    image:
      repository: ghcr.io/external-secrets/external-secrets
      tag: "v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc"
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 96Mi
    webhook:
      image:
        repository: ghcr.io/external-secrets/external-secrets
        tag: "v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc"
      resources:
        requests:
          cpu: 15m
          memory: 48Mi
        limits:
          cpu: 30m
          memory: 64Mi
    certController:
      image:
        repository: ghcr.io/external-secrets/external-secrets
        tag: "v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 20m
          memory: 64Mi
    serviceAccount:
      create: true
      name: external-secrets
      automount: true
    rbac:
      create: true
      serviceAccountTokenCreate: false
