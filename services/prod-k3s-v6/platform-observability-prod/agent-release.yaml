apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: observability-agent-chart
  namespace: platform-observability-prod
spec:
  interval: 5m
  url: oci://ghcr.io/ai-workspace-infra/observability-agent
  ref:
    digest: sha256:4095ed924194c7a91aaa2ad00dd21cec3ccfdcd4c342951ac95aec56fe041f12
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform-observability-agent
  namespace: platform-observability-prod
spec:
  suspend: true
  interval: 5m
  releaseName: platform-observability-agent
  targetNamespace: platform-observability-prod
  chartRef:
    kind: OCIRepository
    name: observability-agent-chart
  values:
    fullnameOverride: platform-observability-agent
    nodeExporter:
      enabled: true
      hostMetrics: true
      hostNetwork: true
      listenOnNodeIP: true
      image:
        repository: quay.io/prometheus/node-exporter
        tag: v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    kubeStateMetrics:
      enabled: true
      resources:
        requests: {cpu: 10m, memory: 48Mi}
        limits: {cpu: 50m, memory: 128Mi}
    processExporter:
      enabled: true
      resources:
        requests: {cpu: 25m, memory: 48Mi}
        limits: {cpu: 200m, memory: 128Mi}
    vector:
      enabled: false
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 150m, memory: 128Mi}
