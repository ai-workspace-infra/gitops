apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: web-saas-sit
resources:
  - oci-repository.yaml
  - console-nginx-configmap.yaml
  - download-channels-configmap.yaml
  - helmrelease.yaml
  - business-networkpolicy.yaml
  - controller-config.yaml
  - vault-secrets.yaml
labels:
  - pairs:
      platform.svc.plus/environment: sit
      platform.svc.plus/cluster: sit-k3s-v6-replacement
    includeSelectors: false
    includeTemplates: false
