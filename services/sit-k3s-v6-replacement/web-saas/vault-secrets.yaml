apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-saas-runtime-reader
  namespace: web-saas-sit
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-saas-runtime-reader
  namespace: web-saas-sit
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [web-saas-runtime-reader]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-saas-runtime-reader
  namespace: web-saas-sit
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: web-saas-runtime-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: web-saas-runtime-reader
  namespace: web-saas-sit
spec:
  provider:
    vault:
      server: https://vault.svc.plus
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-sit-k3s-v6-replacement
          role: sit-k3s-v6-replacement-web-saas-runtime-reader
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: web-saas-runtime-reader
            audiences:
              - vault-sit-k3s-v6-replacement-web-saas-runtime-reader
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-saas-secrets
  namespace: web-saas-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: web-saas-runtime-reader
  target:
    name: web-saas-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: JWT_SECRET
    - secretKey: SESSION_SECRET
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: SESSION_SECRET
    - secretKey: INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: INTERNAL_SERVICE_TOKEN
    - secretKey: AUTH_TOKEN_PUBLIC_TOKEN
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: AUTH_TOKEN_PUBLIC_TOKEN
    - secretKey: AUTH_TOKEN_REFRESH_SECRET
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: AUTH_TOKEN_REFRESH_SECRET
    - secretKey: AUTH_TOKEN_ACCESS_SECRET
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: AUTH_TOKEN_ACCESS_SECRET
    - secretKey: AGENT_API_TOKEN
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: AGENT_API_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accounts-db-runtime
  namespace: web-saas-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: web-saas-runtime-reader
  target:
    name: accounts-db-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: ACCOUNTS_POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: billing-db-runtime
  namespace: web-saas-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: web-saas-runtime-reader
  target:
    name: billing-db-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: BILLING_POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accounts-bootstrap
  namespace: web-saas-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: web-saas-runtime-reader
  target:
    name: accounts-bootstrap
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ROOT_BOOTSTRAP_EMAIL
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: ROOT_BOOTSTRAP_EMAIL
    - secretKey: ROOT_BOOTSTRAP_PASSWORD
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: ROOT_BOOTSTRAP_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: accounts-stripe
  namespace: web-saas-sit
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: web-saas-runtime-reader
  target:
    name: accounts-stripe
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: STRIPE_MODE
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: STRIPE_MODE
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: STRIPE_SECRET_KEY
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: STRIPE_WEBHOOK_SECRET
    - secretKey: STRIPE_PORTAL_CONFIGURATION_ID
      remoteRef:
        key: sit/k3s-v6-replacement/web-saas/runtime
        property: STRIPE_PORTAL_CONFIGURATION_ID
