apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sit-replacement-onwalk
  namespace: ingress-sit
  labels:
    platform.svc.plus/cluster: sit-k3s-v6-replacement
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`grafana-sit.onwalk.net`)
      services:
        - name: observability-grafana
          namespace: observability-sit
          port: 3000
          nativeLB: true
    - kind: Rule
      match: Host(`mcp-sit.onwalk.net`)
      services:
        - name: infrastructure-mcp-server
          namespace: platform-mcp-sit
          port: 8080
          nativeLB: true
    - kind: Rule
      match: Host(`console-sit.onwalk.net`)
      services:
        - name: web-saas-console
          namespace: web-saas-sit
          port: 80
          nativeLB: true
    - kind: Rule
      match: Host(`accounts-sit.onwalk.net`)
      services:
        - name: web-saas-accounts
          namespace: web-saas-sit
          port: 80
          nativeLB: true
    - kind: Rule
      match: Host(`billing-sit.onwalk.net`)
      services:
        - name: web-saas-billing
          namespace: web-saas-sit
          port: 80
          nativeLB: true
  tls:
    secretName: onwalk-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sit-replacement-mcp-svc-plus
  namespace: ingress-sit
  labels:
    platform.svc.plus/cluster: sit-k3s-v6-replacement
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`mcp-sit.svc.plus`)
      services:
        - name: infrastructure-mcp-server
          namespace: platform-mcp-sit
          port: 8080
          nativeLB: true
  tls:
    secretName: svc-plus-tls
