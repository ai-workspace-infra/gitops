apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../sit-k3s-v6/ingress-sit/controller
labels:
  - pairs:
      platform.svc.plus/cluster: sit-k3s-v6-replacement
    includeSelectors: false
    includeTemplates: false
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: traefik-ingress
      namespace: ingress-sit
    patch: |-
      - op: replace
        path: /spec/values/service/spec/type
        value: ClusterIP
      - op: add
        path: /spec/values/service/spec/externalIPs
        value: ["${REPLACEMENT_OVERLAY_IP}"]
      - op: replace
        path: /spec/values/commonLabels/platform.svc.plus~1cluster
        value: sit-k3s-v6-replacement
      - op: replace
        path: /spec/values/deployment/podLabels/platform.svc.plus~1cluster
        value: sit-k3s-v6-replacement
