apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sit-platform-routes
  namespace: ingress-sit
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`console-sit.onwalk.net`) || Host(`app-sit.onwalk.net`)
    kind: Rule
    services:
    - name: web-saas-console
      namespace: web-saas-sit
      port: 80
  - match: Host(`accounts-sit.onwalk.net`)
    kind: Rule
    services:
    - name: web-saas-accounts
      namespace: web-saas-sit
      port: 80
  - match: Host(`billing-sit.onwalk.net`)
    kind: Rule
    services:
    - name: web-saas-billing
      namespace: web-saas-sit
      port: 80
  - match: Host(`grafana-sit.onwalk.net`)
    kind: Rule
    services:
    - name: observability-grafana
      namespace: observability-sit
      port: 3000
  - match: Host(`mcp-sit.onwalk.net`)
    kind: Rule
    services:
    - name: infrastructure-mcp-server
      namespace: platform-mcp-sit
      port: 8080
  tls:
    secretName: console-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sit-mcp-svc-plus-routes
  namespace: ingress-sit
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`mcp-sit.svc.plus`)
    kind: Rule
    services:
    - name: infrastructure-mcp-server
      namespace: platform-mcp-sit
      port: 8080
  tls:
    secretName: shared-observability-tls
