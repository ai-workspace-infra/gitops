apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: platform-mcp-chart
  namespace: platform-mcp-sit
spec:
  interval: 10m
  url: oci://ghcr.io/ai-workspace-infra/platform-mcp
  ref:
    digest: sha256:0d58064a655ffdf739cfb6af1b4f195274f12b0ce93c4f8021fdff0d29848e5f
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform-mcp
  namespace: platform-mcp-sit
spec:
  interval: 5m
  releaseName: platform-mcp
  suspend: true
  chartRef:
    kind: OCIRepository
    name: platform-mcp-chart
  values:
    sshMcpServer:
      enabled: false
