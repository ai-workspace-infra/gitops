apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: vpa-system
spec:
  interval: 10m
  releaseName: vpa
  targetNamespace: vpa-system
  chart:
    spec:
      chart: vpa
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: vpa-system
      version: 5.1.0
  suspend: false
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fairwinds-stable
  namespace: vpa-system
spec:
  interval: 1h
  url: https://charts.fairwinds.com/stable
