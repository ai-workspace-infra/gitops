apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sit-replacement-routes
  namespace: flux-system
spec:
  interval: 5m
  prune: true
  wait: false
  timeout: 2m
  dependsOn:
    - name: sit-replacement-bootstrap
  sourceRef:
    kind: GitRepository
    name: sit-replacement-config
  path: ./services/sit-k3s-v6-replacement/routes
