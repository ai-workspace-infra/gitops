apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: postgresql-sit
spec:
  interval: 5m
  releaseName: postgresql
  targetNamespace: postgresql-sit
  chartRef:
    kind: OCIRepository
    name: web-saas-fullstack-chart
  suspend: false
  values:
    global:
      environment: sit
      expectedNamespace: postgresql-sit
    postgresql:
      enabled: true
      image: ghcr.io/ai-workspace-services/postgresql:daily-build-2026.11.18-r1@sha256:e2ebf33a90fc495c87c9ee3e9ff8d54110535ae6ac2c205f717fcfc220283129
      database: account
      podSecurityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      identityAccounts:
        enabled: true
        root: {username: postgres, existingSecret: postgresql-admin, secretKey: password}
        operator: {username: operator, existingSecret: postgresql-operator, secretKey: password, tables: [], sequences: []}
        auditor: {username: auditor, existingSecret: postgresql-auditor, secretKey: password, views: []}
      storage:
        className: local-path
        size: 5Gi
      metrics:
        enabled: false
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: 300m, memory: 512Mi}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: web-saas-fullstack-chart
  namespace: postgresql-sit
spec:
  interval: 10m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    digest: sha256:8f8db066583002eb8146b2103ab02cbbe1f2a5b786605d66542dc51ab60a010f
  url: oci://ghcr.io/ai-workspace-infra/web-saas-fullstack
