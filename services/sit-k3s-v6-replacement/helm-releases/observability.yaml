apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability
  namespace: observability-sit
spec:
  interval: 5m
  releaseName: observability
  targetNamespace: observability-sit
  chartRef:
    kind: OCIRepository
    name: observability-stack-chart
  suspend: false
  values:
    otelCollector:
      image:
        repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    victoriaMetrics:
      image:
        repository: quay.io/victoriametrics/victoria-metrics
    victoriaLogs:
      image:
        repository: quay.io/victoriametrics/victoria-logs
    victoriaTraces:
      image:
        repository: quay.io/victoriametrics/victoria-traces
    grafana:
      enabled: false
    telemetry:
      cluster: sit-k3s-v6-replacement
      environment: sit
    persistence:
      enabled: true
      size: 20Gi
      storageClass: local-path
    traefik:
      ingressRoute:
        enabled: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability-grafana
  namespace: observability-sit
spec:
  interval: 5m
  releaseName: observability-grafana
  targetNamespace: observability-sit
  chartRef:
    kind: OCIRepository
    name: grafana-chart
  dependsOn:
  - name: observability
  suspend: false
  values:
    existingSecret: grafana-admin
    adminPasswordKey: password
    bundleChecksum: ee2a6472c61550a6568ea2f78afc85c2b9f2c800a1b4de2518188d8fef9e0253
    datasourcesConfigMap: sit-replacement-grafana-datasources
    appsConfigMap: ''
    plugins:
    - victoriametrics-logs-datasource@0.33.1
    - marcusolsson-treemap-panel@2.1.1
    # Progressive Release Matrix panel (unsigned, built from artifacts main; checksum-verified
    # by the chart's plugin installer). Release: artifacts progressive-release-matrix-panel-v1.0.6.
    unsignedPlugins:
    - progressive-release-matrix-panel
    - xconnect-topology-roi-panel
    pluginArchives:
    - id: progressive-release-matrix-panel
      version: 1.0.6
      url: https://github.com/ai-workspace-infra/artifacts/releases/download/progressive-release-matrix-panel-v1.0.6/progressive-release-matrix-panel-1.0.6.zip
      sha256: f2e5288c40429abf6160ba55723f47d8de647c6de853026b5907f6e438a6c0ef
    - id: xconnect-topology-roi-panel
      version: 1.1.1
      url: https://github.com/ai-workspace-infra/artifacts/releases/download/xconnect-topology-roi-panel-v1.1.1/xconnect-topology-roi-panel-1.1.1.zip
      sha256: 61553889f82f9e7b15eef55520dddc2991e6765afbaf9360827411dc8eee0c26
    dashboardProviders:
    - name: import-general
      folder: ''
      folderUid: ''
      path: general
      configMaps:
      - progressive-release-dashboard
      - xconnect-topology-roi-dashboard
      - source-grafana-general-0
      - starsl-k8s-dashboard
      - caddy-dashboard
      - postgres-unified-dashboard
      - grafana-restored-postgres
    - name: import-alerts
      folder: Observability Alerts
      folderUid: dfzrqnab9cpa8e
      path: alerts
      configMaps:
      - grafana-empty-folder
    - name: import-platform
      folder: Platform
      folderUid: bg27c6c3dih34a
      path: platform
      configMaps:
      - grafana-restored-platform
    - name: import-acceptance
      folder: Controlled acceptance
      folderUid: k3s-acceptance
      path: acceptance
      configMaps:
      - grafana-empty-folder
    backendFullname: observability-observability-stack
    persistence:
      enabled: true
      size: 2Gi
      storageClass: local-path
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana-chart
  namespace: observability-sit
spec:
  interval: 10m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    digest: sha256:da43e6c43dd0b874289d5a308f3839e83a47aaf463ae205b87258b46c3442169
  url: oci://ghcr.io/ai-workspace-infra/grafana
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: observability-stack-chart
  namespace: observability-sit
spec:
  interval: 10m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    digest: sha256:5773f62a8c0df0235891a2c778cffcd535e29534c254caaf72d573406dce60cf
  url: oci://ghcr.io/ai-workspace-infra/observability-stack
