apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sit-replacement-bootstrap
  namespace: flux-system
spec:
  interval: 5m
  prune: false
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: sit-replacement-config
  path: ./environments/clusters/sit-k3s-v6-replacement
