apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../sit-k3s-v6/postgresql-sit
  - vault-secrets.yaml
labels:
  - pairs:
      platform.svc.plus/cluster: sit-k3s-v6-replacement
    includeSelectors: false
    includeTemplates: false
patches:
  - target:
      version: v1
      kind: PersistentVolume
      name: pvc-6f08080a-7e6c-4554-8bbf-9487d81388b0
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: pvc-6f08080a-7e6c-4554-8bbf-9487d81388b0
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: postgresql
      namespace: postgresql-sit
    patch: |-
      - op: replace
        path: /spec/values/postgresql/storage/className
        value: replacement-local-path
