apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: flux-system
spec:
  interval: 5m
  releaseName: nginx-ingress
  targetNamespace: ingress-nginx
  install:
    createNamespace: true
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  chart:
    spec:
      chart: nginx-ingress
      version: "2.2.2"
      sourceRef:
        kind: HelmRepository
        name: addon-nginx-ingress
        namespace: flux-system
