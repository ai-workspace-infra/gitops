apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 5m
  releaseName: cert-manager
  targetNamespace: cert-manager
  install:
    createNamespace: true
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  chart:
    spec:
      chart: cert-manager
      version: "v1.20.0"
      sourceRef:
        kind: HelmRepository
        name: addon-cert-manager
        namespace: flux-system
  values:
    crds:
      enabled: true
