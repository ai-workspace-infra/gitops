apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apisix
  namespace: flux-system
spec:
  interval: 5m
  releaseName: apisix
  targetNamespace: apisix
  install:
    createNamespace: true
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  chart:
    spec:
      chart: apisix
      version: "2.13.0"
      sourceRef:
        kind: HelmRepository
        name: addon-apisix
        namespace: flux-system
