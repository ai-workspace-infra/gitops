apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-raft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-web-saas-k3s-v5-token-review
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-web-saas-k3s-v5-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-web-saas-k3s-v5-token-review
subjects:
  - kind: ServiceAccount
    name: vault-raft
    namespace: platform-vault
